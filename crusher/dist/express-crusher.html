<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="كسارة اكسبريس — تطبيق إدارة نقلات الكسارة: العملاء، المواد والأسعار، الذمم، المصروفات، سندات التسليم والتقارير. يعمل بدون إنترنت.">
  <meta name="theme-color" content="#0b0e14">
  <title>كسارة اكسبريس</title>
  <style>
/* ============================================================
   كسارة اكسبريس — نظام التصميم
   داكن افتراضيًا، فاتح اختياري، RTL أولًا، مناسب للجوال.
   ============================================================ */

:root {
  color-scheme: dark;

  --page: #0b0e14;
  --surface-1: #141922;
  --surface-2: #1a212c;
  --surface-3: #222b38;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text-primary: #f2f5f9;
  --text-secondary: #a9b4c4;
  --text-muted: #74808f;
  --grid: #232b36;
  --axis: #38424f;

  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;

  --good: #0ca30c;
  --good-text: #35c435;
  --warning: #fab219;
  --warning-text: #e8a100;
  --critical: #d03b3b;
  --critical-text: #ef6a6a;

  --accent: #c98500;
  --accent-ink: #1a1205;
  --accent-soft: rgba(201, 133, 0, 0.16);
  --good-soft: rgba(12, 163, 12, 0.14);
  --critical-soft: rgba(208, 59, 59, 0.14);
  --warning-soft: rgba(250, 178, 25, 0.14);

  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.22);
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", "Tahoma", sans-serif;
  --maxw: 1280px;
}

html[data-theme="light"] {
  color-scheme: light;
  --page: #f5f6f8;
  --surface-1: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef1f5;
  --border: rgba(11, 15, 22, 0.10);
  --border-strong: rgba(11, 15, 22, 0.18);
  --text-primary: #0b0f16;
  --text-secondary: #4a5768;
  --text-muted: #78828f;
  --grid: #e6e9ee;
  --axis: #c8cdd6;

  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;

  --good-text: #006300;
  --warning-text: #8a6400;
  --critical-text: #b32626;
  --accent: #a86f00;
  --accent-ink: #ffffff;
  --accent-soft: rgba(168, 111, 0, 0.10);
  --shadow: 0 1px 2px rgba(11, 15, 22, 0.06), 0 8px 24px rgba(11, 15, 22, 0.06);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--page);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
body { padding-bottom: 78px; }
@media (min-width: 900px) { body { padding-bottom: 0; } }

button { font-family: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.big { font-size: 1.15em; font-weight: 650; }
.pos, .good-text { color: var(--good-text); }
.neg { color: var(--critical-text); }
.warn { color: var(--warning-text); }
.flat { color: var(--text-secondary); }
.spacer { flex: 1 1 auto; }
.ta-end { text-align: end; }
.ta-center { text-align: center; }

/* ---------------- الهيكل ---------------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 14px; }

.appbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--page);
  border-bottom: 1px solid var(--border);
}
.appbar-in { display: flex; align-items: center; gap: 8px; min-height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 38px; height: 38px; flex: 0 0 38px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 20px;
}
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11.5px; color: var(--text-muted); }

.tabs { position: sticky; top: 58px; z-index: 35; background: var(--page); border-bottom: 1px solid var(--border); }
.tabs-in { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 6px 14px; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px;
  background: transparent; border: 1px solid transparent;
  color: var(--text-secondary); font-size: 13.5px; font-weight: 600;
  white-space: nowrap; cursor: pointer;
}
.tab i { font-style: normal; opacity: 0.8; }
.tab:hover { background: var(--surface-2); color: var(--text-primary); }
.tab.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
@media (max-width: 899px) { .tab span { display: none; } .tab { padding: 7px 11px; font-size: 15px; } }

.view { padding: 14px 14px 28px; display: flex; flex-direction: column; gap: 14px; }

.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 45;
  display: flex; justify-content: space-around;
  background: var(--surface-1); border-top: 1px solid var(--border);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media (min-width: 900px) { .bottom-nav { display: none; } }
.nav-btn {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: 0; color: var(--text-muted); font-size: 10.5px; cursor: pointer; padding: 4px 2px;
}
.nav-btn i { font-style: normal; font-size: 17px; }
.nav-btn.active { color: var(--accent); }

/* ---------------- أزرار ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 14px; border-radius: var(--radius-sm);
  background: var(--surface-3); color: var(--text-primary);
  border: 1px solid var(--border-strong);
  font-size: 13.5px; font-weight: 600; cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
.btn.ghost:hover { color: var(--text-primary); }
.btn.danger { color: var(--critical-text); border-color: var(--critical); }
.btn.primary.danger { background: var(--critical); color: #fff; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.divider-v { width: 1px; height: 22px; background: var(--border-strong); }

.icon-btn {
  width: 34px; height: 34px; flex: 0 0 34px;
  display: grid; place-items: center;
  border-radius: 10px; background: var(--surface-2);
  border: 1px solid var(--border); color: var(--text-secondary);
  font-size: 14px; cursor: pointer;
}
.icon-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }

.mini-btn {
  padding: 4px 8px; border-radius: 7px;
  background: var(--surface-3); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 11.5px; cursor: pointer; white-space: nowrap;
}
.mini-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }
.mini-btn.danger:hover { color: var(--critical-text); border-color: var(--critical); }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.back-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------------- بطاقات ---------------- */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title { font-weight: 680; font-size: 15px; }
.card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.sub-head { margin: 14px 0 8px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi-grid.tight { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-bottom: 12px; }
.kpi {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 12px;
}
.kpi-label { font-size: 11.5px; color: var(--text-muted); }
.kpi-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid-2-tight { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
@media (min-width: 900px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-2-tight { grid-template-columns: minmax(240px, 0.8fr) 1.2fr; }
}

.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 14px; }

.chart { width: 100%; min-height: 70px; }
.chart-empty { padding: 26px 10px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }
.legend-item i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------------- جداول ---------------- */
.table-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: start; font-weight: 600; font-size: 11.5px; color: var(--text-muted);
  padding: 7px 8px; border-bottom: 1px solid var(--border-strong); white-space: nowrap;
}
.table td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr.clickable { cursor: pointer; }
.table tfoot td {
  padding: 9px 8px; font-weight: 650; font-size: 12.5px;
  border-top: 1px solid var(--border-strong); color: var(--text-secondary);
}
@media (max-width: 720px) {
  .hide-sm { display: none !important; }
  .table { font-size: 12.5px; }
  .table td, .table th { padding: 7px 6px; }
}

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-3); border: 1px solid var(--border);
  font-size: 11px; color: var(--text-secondary); white-space: nowrap;
}
.badge.good { background: var(--good-soft); color: var(--good-text); border-color: transparent; }
.badge.warn { background: var(--warning-soft); color: var(--warning-text); border-color: transparent; }
.badge.bad { background: var(--critical-soft); color: var(--critical-text); border-color: transparent; }

.empty { padding: 28px 14px; text-align: center; }
.empty-title { font-weight: 650; color: var(--text-secondary); }
.empty-hint { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }

.notice {
  background: var(--surface-2); border: 1px solid var(--border);
  border-inline-start: 3px solid var(--accent);
  border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--text-secondary);
}
.notice.warn { border-inline-start-color: var(--warning); }
.notice.bad { border-inline-start-color: var(--critical); color: var(--critical-text); }
.footer-note { text-align: center; color: var(--text-muted); font-size: 12px; padding: 10px 0 4px; }

/* ---------------- فلاتر ونماذج ---------------- */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 9px 10px;
}
.filter-field { display: flex; align-items: center; gap: 6px; }
.filter-field.grow { flex: 1 1 180px; }
.filter-label { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }

input, select, textarea {
  width: 100%;
  background: var(--surface-2);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  padding: 8px 10px;
  font-family: inherit; font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
input[type="date"], input[type="search"], input[type="number"] { min-width: 0; }
.filter-field input, .filter-field select { width: auto; min-width: 120px; padding: 6px 9px; font-size: 12.5px; }
.filter-field.grow input { width: 100%; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 720px) { .form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.span-2 { grid-column: 1 / -1; }
.field-label { font-size: 11.5px; color: var(--text-muted); display: flex; gap: 3px; }
.field-label.inline { font-size: 13px; color: var(--text-primary); }
.field-label .req { color: var(--critical-text); }
.field-hint { font-size: 11px; color: var(--text-muted); }
.field.check { flex-direction: row; align-items: center; gap: 8px; }
.field.check input { width: 17px; height: 17px; flex: 0 0 17px; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--critical); }

.total-line {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px; align-items: baseline;
}

/* ---------------- نوافذ وإشعارات ---------------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0, 0, 0, 0.55);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 18px 12px; overflow-y: auto;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--shadow);
  width: 100%; max-width: 440px; padding: 14px; margin: auto;
}
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.modal-body { max-height: 70vh; overflow-y: auto; }
.modal-actions { display: flex; gap: 8px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }

.toasts { position: fixed; inset-inline: 0; bottom: 92px; z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
@media (min-width: 900px) { .toasts { bottom: 24px; } }
.toast {
  background: var(--surface-3); color: var(--text-primary);
  border: 1px solid var(--border-strong); border-radius: 999px;
  padding: 8px 16px; font-size: 13px; box-shadow: var(--shadow);
  transition: opacity 0.25s ease; max-width: 90vw;
}
.toast.good { border-color: var(--good); color: var(--good-text); }
.toast.bad { border-color: var(--critical); color: var(--critical-text); }

/* ---------------- المستندات والطباعة ---------------- */
.modal.doc-modal { max-width: 900px; }
.doc-modal .modal-head { gap: 8px; }
.doc-sheet { background: #fff; border-radius: 8px; overflow-x: auto; }

.doc { color: #000; background: #fff; font-size: 12pt; padding: 10mm; min-width: 640px; }
.doc-head { display: flex; justify-content: space-between; gap: 12mm; border-bottom: 2px solid #000; padding-bottom: 4mm; }
.doc-name { font-size: 18pt; font-weight: 800; }
.doc-name-en { font-size: 10pt; letter-spacing: 0.04em; }
.doc-meta { display: flex; flex-direction: column; font-size: 9pt; margin-top: 1mm; }
.doc-title-box { text-align: end; }
.doc-title { font-size: 14pt; font-weight: 700; border: 1px solid #000; padding: 1mm 4mm; display: inline-block; }
.doc-no { font-size: 10pt; margin-top: 1mm; }
.doc-party { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm 6mm; margin: 5mm 0; }
.doc-kv .k { font-size: 9pt; color: #444; display: block; }
.doc-kv .v { font-size: 11pt; font-weight: 600; }
.doc-sub { font-weight: 700; font-size: 12pt; margin: 6mm 0 2mm; border-bottom: 1px solid #000; }
.doc-table { width: 100%; border-collapse: collapse; margin-top: 2mm; }
.doc-table th, .doc-table td { border: 1px solid #000; padding: 1.6mm 2mm; font-size: 10.5pt; }
.doc-table th { background: #eee; font-weight: 700; }
.doc-table tfoot td { font-weight: 600; background: #f6f6f6; }
.doc-table .strong { font-weight: 800; }
.doc-amount { display: flex; justify-content: space-between; align-items: baseline; border: 1px solid #000; padding: 3mm; margin-top: 4mm; }
.doc-amount .k { font-size: 10pt; }
.doc-amount .big { font-size: 16pt; font-weight: 800; }
.doc-words { margin-top: 3mm; font-size: 10.5pt; font-style: italic; }
.doc-notes { margin-top: 3mm; font-size: 10pt; }
.doc-signs { display: flex; justify-content: space-between; gap: 20mm; margin-top: 14mm; }
.doc-signs > div { flex: 1 1 0; text-align: center; }
.sign-line { border-top: 1px solid #000; margin-bottom: 1.5mm; }
.sign-label { font-size: 9.5pt; }
.doc-foot { margin-top: 8mm; text-align: center; font-size: 9.5pt; color: #333; }

@media print {
  /* تُطبع ورقة المستند وحدها: يختفي التطبيق وإطار النافذة وأزرارها */
  body > #app, .toasts { display: none !important; }
  html, body { background: #fff; }
  .modal-backdrop { position: static; background: none; padding: 0; overflow: visible; backdrop-filter: none; }
  .modal.doc-modal {
    max-width: none; width: 100%; margin: 0; padding: 0;
    background: #fff; border: 0; border-radius: 0; box-shadow: none;
  }
  .doc-modal .modal-head, .doc-modal .modal-actions { display: none !important; }
  .doc-modal .modal-body { max-height: none; overflow: visible; }
  .doc-sheet { overflow: visible; border-radius: 0; }
  .doc { padding: 2mm; min-width: 0; }
  @page { size: A4; margin: 10mm; }
}

  <noscript>
    <div style="padding:24px;text-align:center;color:#f2f5f9;font-family:system-ui">

  <script>
/* ===== assets/js/util.js ===== */
/* كسارة اكسبريس — أدوات عامة */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});

  const U = {
    /* ---------- DOM ---------- */
    $(sel, ctx) { return (ctx || document).querySelector(sel); },

    el(tag, attrs, children) {
      const n = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          const v = attrs[k];
          if (v === null || v === undefined || v === false) return;
          if (k === 'class') n.className = v;
          else if (k === 'html') n.innerHTML = v;
          else if (k === 'text') n.textContent = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
          else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
          else n.setAttribute(k, v);
        });
      }
      (Array.isArray(children) ? children : children ? [children] : []).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      });
      return n;
    },
    esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },
    clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; },

    /* ---------- أرقام ----------
       الريال العماني يُكتب بثلاث خانات عشرية (1 ر.ع = 1000 بيسة). */
    num(v, d) { const n = Number(v); return isFinite(n) ? n : (d === undefined ? 0 : d); },
    round(v, p) { const f = Math.pow(10, p === undefined ? 3 : p); return Math.round(U.num(v) * f) / f; },
    clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, U.num(v))); },

    // عزل ثنائي الاتجاه حتى تبقى الإشارة والعملة في مكانها الصحيح داخل نص عربي
    iso(s) { return '⁦' + s + '⁩'; },

    money(v, opts) {
      opts = opts || {};
      const d = opts.decimals === undefined ? 3 : opts.decimals;
      const n = U.num(v);
      const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
      const body = (n < 0 ? '-' : '') + s + (opts.bare ? '' : ' ' + (opts.symbol || 'ر.ع'));
      return U.iso(body);
    },
    money0(v) {
      const n = U.num(v);
      return U.iso((n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' ر.ع');
    },
    qty(v, unitLabel) {
      const n = U.num(v);
      const s = n.toLocaleString('en-US', { maximumFractionDigits: 2 });
      return U.iso(s + (unitLabel ? ' ' + unitLabel : ''));
    },
    pct(v, p) { return U.iso(U.num(v).toFixed(p === undefined ? 1 : p) + '%'); },
    sign(v) { return U.num(v) > 0 ? 'pos' : U.num(v) < 0 ? 'neg' : 'flat'; },

    /* ---------- تواريخ ---------- */
    today() { return U.dateKey(new Date()); },
    dateKey(d) {
      const x = d instanceof Date ? d : new Date(d);
      const m = String(x.getMonth() + 1).padStart(2, '0');
      const day = String(x.getDate()).padStart(2, '0');
      return x.getFullYear() + '-' + m + '-' + day;
    },
    monthKey(dateStr) { return String(dateStr || '').slice(0, 7); },
    addDays(dateStr, n) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + n);
      return U.dateKey(d);
    },
    daysBetween(a, b) {
      const x = new Date(a + 'T00:00:00').getTime();
      const y = new Date(b + 'T00:00:00').getTime();
      return Math.round((y - x) / 86400000);
    },
    startOfMonth(dateStr) { return U.monthKey(dateStr) + '-01'; },
    monthLabel(mk, lang) {
      const names = lang === 'en'
        ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
        : ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
      const p = String(mk).split('-');
      const i = U.num(p[1], 1) - 1;
      return (names[i] || p[1]) + ' ' + p[0];
    },
    fmtDate(dateStr) { return U.iso(String(dateStr || '')); },
    fmtTime(ts) {
      const d = new Date(ts);
      return U.iso(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
    },

    /* ---------- متنوعة ---------- */
    uid(prefix) {
      return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    },
    deepClone(o) { return JSON.parse(JSON.stringify(o)); },
    sum(arr, fn) {
      return arr.reduce(function (a, x) { return a + U.num(fn ? fn(x) : x); }, 0);
    },
    groupBy(arr, fn) {
      const out = {};
      arr.forEach(function (x) {
        const k = fn(x);
        (out[k] = out[k] || []).push(x);
      });
      return out;
    },
    sortBy(arr, fn, desc) {
      return arr.slice().sort(function (a, b) {
        const x = fn(a), y = fn(b);
        if (x === y) return 0;
        return (x > y ? 1 : -1) * (desc ? -1 : 1);
      });
    },
    debounce(fn, ms) {
      let t = null;
      return function () {
        const args = arguments, self = this;
        clearTimeout(t);
        t = setTimeout(function () { fn.apply(self, args); }, ms || 200);
      };
    },
    normalizeAr(s) {
      return String(s || '').trim().toLowerCase()
        .replace(/[أإآ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[ً-ْ]/g, '');
    },
    match(haystack, needle) {
      if (!needle) return true;
      return U.normalizeAr(haystack).indexOf(U.normalizeAr(needle)) !== -1;
    },

    /* ---------- تصدير ---------- */
    csv(rows) {
      return '﻿' + rows.map(function (r) {
        return r.map(function (c) {
          const s = String(c === null || c === undefined ? '' : c);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',');
      }).join('\r\n');
    },
    download(filename, text, mime) {
      try {
        const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = U.el('a', { href: url, download: filename });
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 600);
        return true;
      } catch (e) {
        return false;
      }
    }
  };

  EX.util = U;
})(window);

/* كسارة اكسبريس — الحالة والتخزين المحلي */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;

  const KEY = 'express_crusher_v1';

  const DEFAULT_MATERIALS = [
    { name: 'بحص 3/4', nameEn: 'Aggregate 3/4"', unit: 'ton', price: 2.5 },
    { name: 'بحص 3/8', nameEn: 'Aggregate 3/8"', unit: 'ton', price: 2.8 },
    { name: 'صبة (خرسانة ناشفة)', nameEn: 'Crusher run', unit: 'ton', price: 2.0 },
    { name: 'بيس كورس', nameEn: 'Base course', unit: 'ton', price: 2.2 },
    { name: 'سب بيس', nameEn: 'Sub-base', unit: 'ton', price: 1.8 },
    { name: 'رمل مغسول', nameEn: 'Washed sand', unit: 'ton', price: 3.0 },
    { name: 'غبار كسارة', nameEn: 'Crusher dust', unit: 'ton', price: 1.5 },
    { name: 'دفان', nameEn: 'Backfill', unit: 'load', price: 15.0 },
    { name: 'بلوك حجري', nameEn: 'Rock boulders', unit: 'ton', price: 2.0 }
  ];

  const EXPENSE_CATEGORIES = ['diesel', 'maintenance', 'parts', 'salaries', 'rent', 'explosives', 'electric', 'other'];

  function defaultState() {
    return {
      version: 1,
      createdAt: Date.now(),
      settings: {
        lang: 'ar',
        theme: 'dark',
        company: {
          name: 'كسارة اكسبريس',
          nameEn: 'Express Crusher',
          phone: '',
          address: '',
          crNo: '',
          vatNo: ''
        },
        vatEnabled: false,
        vatRate: 5,
        decimals: 3,
        loadSeq: 1,
        docSeq: 1
      },
      materials: DEFAULT_MATERIALS.map(function (m) {
        return Object.assign({ id: U.uid('mat'), active: true }, m);
      }),
      customers: [],
      trucks: [],
      loads: [],
      payments: [],
      expenses: []
    };
  }

  const Store = {
    s: null,
    listeners: [],

    load() {
      let raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          Store.s = Store.migrate(parsed);
        } catch (e) {
          console.warn('state unreadable, starting fresh', e);
          Store.s = defaultState();
        }
      } else {
        Store.s = defaultState();
      }
      return Store.s;
    },

    /* نضمن وجود كل الحقول حتى لو جاءت النسخة من إصدار أقدم */
    migrate(st) {
      const base = defaultState();
      const out = Object.assign({}, base, st || {});
      out.settings = Object.assign({}, base.settings, st && st.settings);
      out.settings.company = Object.assign({}, base.settings.company, st && st.settings && st.settings.company);
      ['materials', 'customers', 'trucks', 'loads', 'payments', 'expenses'].forEach(function (k) {
        if (!Array.isArray(out[k])) out[k] = base[k];
      });
      if (!out.materials.length) out.materials = base.materials;
      return out;
    },

    save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(Store.s));
      } catch (e) {
        console.warn('save failed', e);
        if (EX.ui) EX.ui.toast('تعذّر الحفظ — مساحة التخزين ممتلئة؟', 'bad');
      }
      Store.listeners.forEach(function (fn) { try { fn(); } catch (e) { /* listener owns its errors */ } });
      return Store.s;
    },

    onChange(fn) { Store.listeners.push(fn); },
    settings() { return Store.s.settings; },

    /* ---------- أدوات بحث ---------- */
    customer(id) { return Store.s.customers.filter(function (c) { return c.id === id; })[0] || null; },
    material(id) { return Store.s.materials.filter(function (m) { return m.id === id; })[0] || null; },
    truck(id) { return Store.s.trucks.filter(function (t) { return t.id === id; })[0] || null; },

    customerName(id) {
      const c = Store.customer(id);
      return c ? c.name : '—';
    },
    materialName(id) {
      const m = Store.material(id);
      if (!m) return '—';
      return EX.i18n.lang === 'en' ? (m.nameEn || m.name) : m.name;
    },
    truckLabel(id) {
      const t = Store.truck(id);
      if (!t) return '—';
      return t.plate + (t.driver ? ' · ' + t.driver : '');
    },

    /* السعر المعتمد لعميل ومادة: سعر خاص إن وُجد، وإلا سعر القائمة */
    priceFor(customerId, materialId) {
      const c = Store.customer(customerId);
      const m = Store.material(materialId);
      if (c && c.priceOverrides && c.priceOverrides[materialId] !== undefined && c.priceOverrides[materialId] !== '') {
        return U.num(c.priceOverrides[materialId]);
      }
      return m ? U.num(m.price) : 0;
    },

    /* ---------- النقلات ---------- */
    nextLoadNo() {
      const n = U.num(Store.s.settings.loadSeq, 1);
      Store.s.settings.loadSeq = n + 1;
      return n;
    },
    nextDocNo() {
      const n = U.num(Store.s.settings.docSeq, 1);
      Store.s.settings.docSeq = n + 1;
      return n;
    },

    addLoad(data) {
      const rec = Object.assign({
        id: U.uid('ld'),
        no: Store.nextLoadNo(),
        createdAt: Date.now()
      }, data);
      rec.total = EX.calc.loadTotal(rec);
      Store.s.loads.push(rec);
      Store.save();
      return rec;
    },
    updateLoad(id, data) {
      const rec = Store.s.loads.filter(function (l) { return l.id === id; })[0];
      if (!rec) return null;
      Object.assign(rec, data);
      rec.total = EX.calc.loadTotal(rec);
      Store.save();
      return rec;
    },
    removeLoad(id) {
      Store.s.loads = Store.s.loads.filter(function (l) { return l.id !== id; });
      Store.save();
    },

    /* ---------- سجلات عامة ---------- */
    upsert(collection, data, prefix) {
      const arr = Store.s[collection];
      if (data.id) {
        const rec = arr.filter(function (x) { return x.id === data.id; })[0];
        if (rec) { Object.assign(rec, data); Store.save(); return rec; }
      }
      const rec = Object.assign({ id: U.uid(prefix || collection.slice(0, 3)), createdAt: Date.now() }, data);
      arr.push(rec);
      Store.save();
      return rec;
    },
    remove(collection, id) {
      Store.s[collection] = Store.s[collection].filter(function (x) { return x.id !== id; });
      Store.save();
    },

    /* ---------- النسخ الاحتياطي ---------- */
    exportJSON() { return JSON.stringify(Store.s, null, 2); },
    importJSON(text) {
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== 'object' || !parsed.settings) throw new Error('bad backup');
      Store.s = Store.migrate(parsed);
      Store.save();
      return Store.s;
    },
    reset() {
      const lang = Store.s.settings.lang, theme = Store.s.settings.theme;
      const company = U.deepClone(Store.s.settings.company);
      Store.s = defaultState();
      Store.s.settings.lang = lang;
      Store.s.settings.theme = theme;
      Store.s.settings.company = company;
      Store.save();
    },

    /* بيانات تجريبية لتجربة التطبيق فورًا */
    loadSample() {
      const st = Store.s;
      const today = U.today();
      const custs = [
        { name: 'مؤسسة الظاهرة للمقاولات', phone: '99112233', area: 'عبري', type: 'credit' },
        { name: 'شركة البركة للإنشاءات', phone: '97445566', area: 'ينقل', type: 'credit' },
        { name: 'سالم بن محمد العبري', phone: '92778899', area: 'عبري', type: 'cash' },
        { name: 'مشروع طريق ضنك', phone: '95001122', area: 'ضنك', type: 'credit' },
        { name: 'بلدية عبري', phone: '25690000', area: 'عبري', type: 'credit', slow: true }
      ].map(function (c) {
        return Store.upsert('customers', Object.assign({ openingBalance: 0, priceOverrides: {}, notes: '', active: true }, c), 'cus');
      });
      const trucks = [
        { plate: '1 ظ 4521', driver: 'خالد', phone: '91234567', capacity: 30 },
        { plate: '2 ظ 7788', driver: 'يوسف', phone: '91234568', capacity: 30 },
        { plate: '3 ظ 1199', driver: 'عبدالله', phone: '91234569', capacity: 25 }
      ].map(function (t) {
        return Store.upsert('trucks', Object.assign({ active: true, notes: '' }, t), 'trk');
      });

      // نقلات موزّعة على آخر 45 يومًا بنمط عمل واقعي
      let seed = 7;
      const rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      for (let d = 44; d >= 0; d--) {
        const date = U.addDays(today, -d);
        const dow = new Date(date + 'T00:00:00').getDay();
        if (dow === 5) continue;                      // الجمعة إجازة
        const n = 3 + Math.floor(rnd() * 6);
        for (let i = 0; i < n; i++) {
          const cust = custs[Math.floor(rnd() * custs.length)];
          const mat = st.materials[Math.floor(rnd() * Math.min(7, st.materials.length))];
          const trk = trucks[Math.floor(rnd() * trucks.length)];
          const qty = mat.unit === 'load' ? 1 : U.round(22 + rnd() * 10, 1);
          Store.addLoad({
            date: date,
            customerId: cust.id,
            materialId: mat.id,
            truckId: trk.id,
            qty: qty,
            unit: mat.unit,
            price: Store.priceFor(cust.id, mat.id),
            discount: 0,
            payment: cust.type === 'cash' ? 'cash' : (rnd() < 0.25 ? 'cash' : 'credit'),
            site: '',
            notes: ''
          });
        }
        if (rnd() < 0.5) {
          const cats = ['diesel', 'maintenance', 'parts', 'salaries', 'electric'];
          Store.upsert('expenses', {
            date: date,
            category: cats[Math.floor(rnd() * cats.length)],
            amount: U.round(80 + rnd() * 500, 3),
            truckId: rnd() < 0.4 ? trucks[Math.floor(rnd() * trucks.length)].id : '',
            notes: ''
          }, 'exp');
        }
      }

      // دفعات واقعية: يسدّد كل عميل جزءًا من آجله على دفعتين أو ثلاث،
      // فيبقى رصيد مستحق موجب بدل أرصدة سالبة عشوائية
      custs.forEach(function (cust) {
        const due = U.sum(st.loads.filter(function (l) {
          return l.customerId === cust.id && l.payment === 'credit';
        }), function (l) { return l.total; });
        if (due <= 0) return;
        // عميل بطيء السداد يترك ذممًا متقادمة تُظهر جدول أعمار الذمم على حقيقته
        const share = cust.slow ? 0 : cust.type === 'cash' ? 0.9 : 0.45 + rnd() * 0.4;
        if (share === 0) return;
        let left = U.round(due * share, 3);
        const installments = 1 + Math.floor(rnd() * 3);
        for (let k = 0; k < installments && left > 1; k++) {
          const amount = k === installments - 1 ? left : U.round(left / (installments - k), 3);
          left = U.round(left - amount, 3);
          Store.upsert('payments', {
            date: U.addDays(today, -Math.floor(rnd() * 40)),
            customerId: cust.id,
            amount: amount,
            method: rnd() < 0.5 ? 'bank' : 'cash',
            ref: '',
            notes: ''
          }, 'pay');
        }
      });

      Store.save();
    },

    EXPENSE_CATEGORIES: EXPENSE_CATEGORIES
  };

  EX.store = Store;
})(window);

</script>
  <script>
/* ===== assets/js/calc.js ===== */
/* كسارة اكسبريس — محرّك الحسابات والتقارير
   قاعدة الحساب:
     النقلة النقدية  = إيراد + تحصيل فوري (لا تدخل الذمم)
     النقلة الآجلة   = إيراد + مدين على العميل (تدخل الذمم)
     الدفعة          = تحصيل يسدّد أقدم نقلة آجلة أولًا (FIFO)
*/
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;

  const C = {
    loadTotal(l) {
      const gross = U.num(l.qty) * U.num(l.price);
      return U.round(Math.max(0, gross - U.num(l.discount)), 3);
    },

    /* ---------- فلترة ---------- */
    inRange(dateStr, from, to) {
      if (from && dateStr < from) return false;
      if (to && dateStr > to) return false;
      return true;
    },
    loads(filter) {
      filter = filter || {};
      return EX.store.s.loads.filter(function (l) {
        if (!C.inRange(l.date, filter.from, filter.to)) return false;
        if (filter.customerId && l.customerId !== filter.customerId) return false;
        if (filter.materialId && l.materialId !== filter.materialId) return false;
        if (filter.truckId && l.truckId !== filter.truckId) return false;
        if (filter.payment && l.payment !== filter.payment) return false;
        if (filter.q) {
          const hay = [EX.store.customerName(l.customerId), EX.store.materialName(l.materialId),
            EX.store.truckLabel(l.truckId), l.site, l.notes, 'ن' + l.no, String(l.no)].join(' ');
          if (!U.match(hay, filter.q)) return false;
        }
        return true;
      });
    },
    payments(filter) {
      filter = filter || {};
      return EX.store.s.payments.filter(function (p) {
        if (!C.inRange(p.date, filter.from, filter.to)) return false;
        if (filter.customerId && p.customerId !== filter.customerId) return false;
        if (filter.q && !U.match([EX.store.customerName(p.customerId), p.ref, p.notes].join(' '), filter.q)) return false;
        return true;
      });
    },
    expenses(filter) {
      filter = filter || {};
      return EX.store.s.expenses.filter(function (e) {
        if (!C.inRange(e.date, filter.from, filter.to)) return false;
        if (filter.category && e.category !== filter.category) return false;
        if (filter.q && !U.match([EX.t('cat_' + e.category), e.notes, EX.store.truckLabel(e.truckId)].join(' '), filter.q)) return false;
        return true;
      });
    },

    /* ---------- أرصدة العملاء ---------- */
    // الرصيد = الافتتاحي + مجموع النقلات الآجلة − مجموع الدفعات
    customerBalance(customerId) {
      const c = EX.store.customer(customerId);
      const opening = c ? U.num(c.openingBalance) : 0;
      const credit = U.sum(EX.store.s.loads.filter(function (l) {
        return l.customerId === customerId && l.payment === 'credit';
      }), function (l) { return l.total; });
      const paid = U.sum(EX.store.s.payments.filter(function (p) {
        return p.customerId === customerId;
      }), function (p) { return p.amount; });
      return U.round(opening + credit - paid, 3);
    },

    totalReceivables() {
      return U.round(U.sum(EX.store.s.customers, function (c) {
        return Math.max(0, C.customerBalance(c.id));
      }), 3);
    },

    /* كشف حساب: سطر لكل نقلة آجلة ودفعة، مرتبًا بالتاريخ مع رصيد متحرك */
    statement(customerId, from, to) {
      const c = EX.store.customer(customerId);
      const opening = c ? U.num(c.openingBalance) : 0;
      const rows = [];
      EX.store.s.loads.forEach(function (l) {
        if (l.customerId !== customerId || l.payment !== 'credit') return;
        rows.push({
          date: l.date, kind: 'load', ref: 'ن' + l.no,
          desc: EX.store.materialName(l.materialId) + ' · ' + U.qty(l.qty, EX.t('unit_' + (l.unit === 'm3' ? 'm3' : l.unit))),
          debit: U.num(l.total), credit: 0, id: l.id
        });
      });
      EX.store.s.payments.forEach(function (p) {
        if (p.customerId !== customerId) return;
        rows.push({
          date: p.date, kind: 'payment', ref: p.ref || '',
          desc: EX.t('receipt') + ' · ' + EX.t('m_' + p.method),
          debit: 0, credit: U.num(p.amount), id: p.id
        });
      });
      rows.sort(function (a, b) {
        if (a.date === b.date) return a.kind === 'load' ? -1 : 1;
        return a.date < b.date ? -1 : 1;
      });
      let bal = opening;
      let openingForPeriod = opening;
      const out = [];
      rows.forEach(function (r) {
        const before = bal;
        bal = U.round(bal + r.debit - r.credit, 3);
        if (!C.inRange(r.date, from, to)) {
          openingForPeriod = bal;
          return;
        }
        out.push(Object.assign({}, r, { balance: bal, balanceBefore: before }));
      });
      return { opening: openingForPeriod, rows: out, closing: bal };
    },

    /* أعمار الذمم: تُسدَّد الدفعات على أقدم نقلة آجلة أولًا */
    aging(asOf) {
      asOf = asOf || U.today();
      const buckets = { b0: 0, b31: 0, b61: 0, b90: 0, total: 0 };
      const perCustomer = {};
      EX.store.s.customers.forEach(function (c) {
        let pool = U.sum(EX.store.s.payments.filter(function (p) { return p.customerId === c.id; }),
          function (p) { return p.amount; });
        // الرصيد الافتتاحي أقدم بند، فيُسدَّد أولًا
        let opening = U.num(c.openingBalance);
        const applied = Math.min(pool, opening);
        opening -= applied;
        pool -= applied;
        const open = U.sortBy(EX.store.s.loads.filter(function (l) {
          return l.customerId === c.id && l.payment === 'credit';
        }), function (l) { return l.date; });
        const row = { b0: 0, b31: 0, b61: 0, b90: 0, total: 0 };
        if (opening > 0) { row.b90 += opening; }
        open.forEach(function (l) {
          let due = U.num(l.total);
          const take = Math.min(pool, due);
          due -= take;
          pool -= take;
          if (due <= 0.0005) return;
          const age = U.daysBetween(l.date, asOf);
          if (age <= 30) row.b0 += due;
          else if (age <= 60) row.b31 += due;
          else if (age <= 90) row.b61 += due;
          else row.b90 += due;
        });
        row.total = U.round(row.b0 + row.b31 + row.b61 + row.b90, 3);
        if (row.total > 0.0005) {
          perCustomer[c.id] = row;
          buckets.b0 += row.b0; buckets.b31 += row.b31; buckets.b61 += row.b61; buckets.b90 += row.b90;
        }
      });
      ['b0', 'b31', 'b61', 'b90'].forEach(function (k) { buckets[k] = U.round(buckets[k], 3); });
      buckets.total = U.round(buckets.b0 + buckets.b31 + buckets.b61 + buckets.b90, 3);
      return { buckets: buckets, perCustomer: perCustomer };
    },

    /* ---------- ملخصات ---------- */
    // الكميات: الطن والمتر المكعب يُجمعان كوحدات، والنقلات تُعدّ بعدد النقلات
    qtySummary(loads) {
      const out = { ton: 0, m3: 0, load: 0, trips: loads.length };
      loads.forEach(function (l) {
        const u = l.unit === 'm3' ? 'm3' : l.unit === 'load' ? 'load' : 'ton';
        out[u] += U.num(l.qty);
      });
      ['ton', 'm3', 'load'].forEach(function (k) { out[k] = U.round(out[k], 2); });
      return out;
    },
    qtyLabel(sum) {
      const parts = [];
      if (sum.ton) parts.push(U.qty(sum.ton, EX.t('unit_ton')));
      if (sum.m3) parts.push(U.qty(sum.m3, EX.t('unit_m3')));
      if (sum.load) parts.push(U.qty(sum.load, EX.t('unit_load')));
      return parts.length ? parts.join(' · ') : U.qty(0, EX.t('unit_ton'));
    },

    summary(from, to) {
      const loads = C.loads({ from: from, to: to });
      const pays = C.payments({ from: from, to: to });
      const exps = C.expenses({ from: from, to: to });
      const revenue = U.round(U.sum(loads, function (l) { return l.total; }), 3);
      const cashLoads = U.round(U.sum(loads.filter(function (l) { return l.payment === 'cash'; }),
        function (l) { return l.total; }), 3);
      const creditLoads = U.round(revenue - cashLoads, 3);
      const paid = U.round(U.sum(pays, function (p) { return p.amount; }), 3);
      const expenses = U.round(U.sum(exps, function (e) { return e.amount; }), 3);
      const q = C.qtySummary(loads);
      const tons = q.ton;
      return {
        from: from, to: to,
        loads: loads, payments: pays, expenses: exps,
        trips: loads.length,
        qty: q,
        revenue: revenue,
        cashLoads: cashLoads,
        creditLoads: creditLoads,
        paymentsTotal: paid,
        collected: U.round(cashLoads + paid, 3),
        expensesTotal: expenses,
        net: U.round(revenue - expenses, 3),
        margin: revenue > 0 ? U.round((revenue - expenses) / revenue * 100, 1) : 0,
        avgLoad: loads.length ? U.round(revenue / loads.length, 3) : 0,
        avgPricePerTon: tons > 0 ? U.round(U.sum(loads.filter(function (l) {
          return (l.unit || 'ton') === 'ton';
        }), function (l) { return l.total; }) / tons, 3) : 0
      };
    },

    /* سلسلة يومية للرسم: الإيراد والمصروف لكل يوم في المدى */
    dailySeries(days) {
      days = days || 30;
      const to = U.today();
      const from = U.addDays(to, -(days - 1));
      const rev = {}, exp = {};
      C.loads({ from: from, to: to }).forEach(function (l) {
        rev[l.date] = U.num(rev[l.date]) + U.num(l.total);
      });
      C.expenses({ from: from, to: to }).forEach(function (e) {
        exp[e.date] = U.num(exp[e.date]) + U.num(e.amount);
      });
      const out = [];
      for (let i = 0; i < days; i++) {
        const d = U.addDays(from, i);
        out.push({ date: d, revenue: U.round(rev[d] || 0, 3), expense: U.round(exp[d] || 0, 3) });
      }
      return out;
    },

    monthlySeries(months) {
      months = months || 12;
      const now = new Date();
      const out = [];
      for (let i = months - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const mk = U.dateKey(d).slice(0, 7);
        const from = mk + '-01';
        const to = U.dateKey(new Date(d.getFullYear(), d.getMonth() + 1, 0));
        const loads = C.loads({ from: from, to: to });
        out.push({
          month: mk,
          revenue: U.round(U.sum(loads, function (l) { return l.total; }), 3),
          expense: U.round(U.sum(C.expenses({ from: from, to: to }), function (e) { return e.amount; }), 3),
          trips: loads.length,
          tons: C.qtySummary(loads).ton
        });
      }
      return out;
    },

    /* تجميع عام: by = 'materialId' | 'customerId' | 'truckId' */
    breakdown(loads, by) {
      const groups = U.groupBy(loads, function (l) { return l[by] || ''; });
      const rows = Object.keys(groups).map(function (k) {
        const g = groups[k];
        const q = C.qtySummary(g);
        return {
          key: k,
          label: by === 'materialId' ? EX.store.materialName(k)
            : by === 'customerId' ? EX.store.customerName(k)
              : EX.store.truckLabel(k),
          trips: g.length,
          qty: q,
          tons: q.ton,
          revenue: U.round(U.sum(g, function (l) { return l.total; }), 3)
        };
      });
      const total = U.sum(rows, function (r) { return r.revenue; });
      rows.forEach(function (r) { r.share = total > 0 ? U.round(r.revenue / total * 100, 1) : 0; });
      return U.sortBy(rows, function (r) { return r.revenue; }, true);
    },

    expenseBreakdown(exps) {
      const groups = U.groupBy(exps, function (e) { return e.category || 'other'; });
      const rows = Object.keys(groups).map(function (k) {
        return {
          key: k,
          label: EX.t('cat_' + k),
          amount: U.round(U.sum(groups[k], function (e) { return e.amount; }), 3),
          count: groups[k].length
        };
      });
      const total = U.sum(rows, function (r) { return r.amount; });
      rows.forEach(function (r) { r.share = total > 0 ? U.round(r.amount / total * 100, 1) : 0; });
      return U.sortBy(rows, function (r) { return r.amount; }, true);
    },

    /* ---------- ضريبة ---------- */
    vat(amount) {
      const st = EX.store.settings();
      if (!st.vatEnabled) return { base: U.round(amount, 3), vat: 0, total: U.round(amount, 3), rate: 0 };
      const rate = U.num(st.vatRate);
      const vat = U.round(amount * rate / 100, 3);
      return { base: U.round(amount, 3), vat: vat, total: U.round(amount + vat, 3), rate: rate };
    }
  };

  EX.calc = C;
})(window);

</script>

/* ===== assets/js/charts.js ===== */
/* كسارة اكسبريس — رسوم بيانية على canvas بدون مكتبات خارجية */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;

  function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  function palette() {
    return {
      ink: cssVar('--text-primary', '#f2f5f9'),
      muted: cssVar('--text-muted', '#74808f'),
      grid: cssVar('--grid', '#232b36'),
      axis: cssVar('--axis', '#38424f'),
      series: [1, 2, 3, 4, 5, 6, 7].map(function (i) { return cssVar('--series-' + i, '#3987e5'); }),
      good: cssVar('--good', '#0ca30c'),
      critical: cssVar('--critical', '#d03b3b'),
      surface: cssVar('--surface-1', '#141922')
    };
  }

  /* يهيّئ canvas بدقة الشاشة ويعيد السياق والأبعاد المنطقية */
  function setup(host, height) {
    const dpr = root.devicePixelRatio || 1;
    const w = Math.max(240, host.clientWidth || 320);
    const h = height || 200;
    const cv = U.el('canvas', { style: { width: '100%', height: h + 'px', display: 'block' } });
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    U.clear(host).appendChild(cv);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.font = '11px ' + cssVar('--font', 'system-ui');
    ctx.textBaseline = 'middle';
    return { ctx: ctx, w: w, h: h, p: palette() };
  }

  function niceMax(v) {
    if (v <= 0) return 10;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / mag;
    const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return step * mag;
  }

  function shortNum(v) {
    const n = U.num(v);
    const a = Math.abs(n);
    if (a >= 1000000) return (n / 1000000).toFixed(a >= 10000000 ? 0 : 1) + 'M';
    if (a >= 1000) return (n / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
    if (a >= 100) return n.toFixed(0);
    return n.toFixed(a >= 10 ? 0 : 1);
  }

  const Charts = {
    empty(host, msg) {
      U.clear(host).appendChild(U.el('div', { class: 'chart-empty', text: msg || EX.t('no_data') }));
    },

    /* خط/مساحة: data = [{label, value}] مع سلسلة ثانية اختيارية value2 */
    line(host, data, opts) {
      opts = opts || {};
      if (!data || !data.length) return Charts.empty(host, opts.emptyMsg);
      const s = setup(host, opts.height || 190);
      const ctx = s.ctx, p = s.p;
      const padL = 44, padR = 10, padT = 12, padB = 22;
      const plotW = s.w - padL - padR, plotH = s.h - padT - padB;
      const vals = data.map(function (d) { return U.num(d.value); })
        .concat(opts.second ? data.map(function (d) { return U.num(d.value2); }) : []);
      const max = niceMax(Math.max.apply(null, vals.concat([0])));

      // شبكة أفقية + محور القيم
      ctx.strokeStyle = p.grid; ctx.lineWidth = 1; ctx.fillStyle = p.muted;
      ctx.textAlign = 'right';
      for (let i = 0; i <= 4; i++) {
        const y = padT + plotH - (plotH * i / 4);
        ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(padL + plotW, y + 0.5); ctx.stroke();
        ctx.fillText(shortNum(max * i / 4), padL - 6, y);
      }

      const x = function (i) { return padL + (data.length === 1 ? plotW / 2 : plotW * i / (data.length - 1)); };
      const y = function (v) { return padT + plotH - plotH * (U.num(v) / (max || 1)); };

      const drawSeries = function (key, color, fill) {
        ctx.beginPath();
        data.forEach(function (d, i) {
          const px = x(i), py = y(d[key]);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
        if (fill) {
          ctx.lineTo(x(data.length - 1), padT + plotH);
          ctx.lineTo(x(0), padT + plotH);
          ctx.closePath();
          const g = ctx.createLinearGradient(0, padT, 0, padT + plotH);
          g.addColorStop(0, color + '33');
          g.addColorStop(1, color + '00');
          ctx.fillStyle = g; ctx.fill();
        }
      };
      drawSeries('value', opts.color || p.series[0], opts.fill !== false);
      if (opts.second) drawSeries('value2', opts.color2 || p.series[1], false);

      // تسميات المحور الأفقي: أول ومنتصف وآخر نقطة فقط لتبقى مقروءة
      ctx.fillStyle = p.muted; ctx.textAlign = 'center';
      [0, Math.floor((data.length - 1) / 2), data.length - 1].forEach(function (i, k, arr) {
        if (arr.indexOf(i) !== k) return;
        const d = data[i];
        if (!d) return;
        ctx.fillText(d.label, U.clamp(x(i), padL + 18, padL + plotW - 18), s.h - padB / 2 - 1);
      });
    },

    /* أعمدة رأسية مجمّعة: data = [{label, value, value2}] */
    bars(host, data, opts) {
      opts = opts || {};
      if (!data || !data.length) return Charts.empty(host, opts.emptyMsg);
      const s = setup(host, opts.height || 190);
      const ctx = s.ctx, p = s.p;
      const padL = 44, padR = 10, padT = 12, padB = 26;
      const plotW = s.w - padL - padR, plotH = s.h - padT - padB;
      const two = !!opts.second;
      const vals = data.map(function (d) { return U.num(d.value); })
        .concat(two ? data.map(function (d) { return U.num(d.value2); }) : []);
      const max = niceMax(Math.max.apply(null, vals.concat([0])));

      ctx.strokeStyle = p.grid; ctx.fillStyle = p.muted; ctx.textAlign = 'right';
      for (let i = 0; i <= 4; i++) {
        const y = padT + plotH - (plotH * i / 4);
        ctx.beginPath(); ctx.moveTo(padL, y + 0.5); ctx.lineTo(padL + plotW, y + 0.5); ctx.stroke();
        ctx.fillText(shortNum(max * i / 4), padL - 6, y);
      }

      const slot = plotW / data.length;
      const bw = Math.max(4, Math.min(28, slot * (two ? 0.34 : 0.6)));
      data.forEach(function (d, i) {
        const cx = padL + slot * (i + 0.5);
        const draw = function (v, color, off) {
          const hh = plotH * (U.num(v) / (max || 1));
          ctx.fillStyle = color;
          ctx.fillRect(cx + off - bw / 2, padT + plotH - hh, bw, Math.max(hh, v > 0 ? 1.5 : 0));
        };
        if (two) {
          draw(d.value, opts.color || p.series[0], -bw / 2 - 1);
          draw(d.value2, opts.color2 || p.series[1], bw / 2 + 1);
        } else {
          draw(d.value, d.color || opts.color || p.series[0], 0);
        }
        if (slot > 26 || data.length <= 12) {
          ctx.fillStyle = p.muted; ctx.textAlign = 'center';
          ctx.fillText(d.label, cx, s.h - padB / 2);
        }
      });
    },

    /* أعمدة أفقية — الأفضل للأسماء العربية الطويلة (عملاء / مواد) */
    hbars(host, data, opts) {
      opts = opts || {};
      if (!data || !data.length) return Charts.empty(host, opts.emptyMsg);
      const rowH = opts.rowH || 26;
      const s = setup(host, Math.max(70, data.length * rowH + 10));
      const ctx = s.ctx, p = s.p;
      const max = Math.max.apply(null, data.map(function (d) { return U.num(d.value); }).concat([0.0001]));
      const labelW = Math.min(150, Math.max(70, s.w * 0.34));
      const valueW = 62;
      const barW = Math.max(30, s.w - labelW - valueW - 12);
      const rtl = document.documentElement.getAttribute('dir') !== 'ltr';

      data.forEach(function (d, i) {
        const y = 6 + i * rowH + rowH / 2 - 3;
        const w = Math.max(2, barW * (U.num(d.value) / max));
        const color = d.color || (opts.colors ? p.series[i % p.series.length] : (opts.color || p.series[0]));
        if (rtl) {
          ctx.textAlign = 'right';
          ctx.fillStyle = p.ink;
          ctx.fillText(String(d.label).slice(0, 26), s.w - 2, y);
          ctx.fillStyle = color;
          ctx.fillRect(s.w - labelW - w, y - 7, w, 14);
          ctx.textAlign = 'left';
          ctx.fillStyle = p.muted;
          ctx.fillText(d.text || shortNum(d.value), 2, y);
        } else {
          ctx.textAlign = 'left';
          ctx.fillStyle = p.ink;
          ctx.fillText(String(d.label).slice(0, 26), 2, y);
          ctx.fillStyle = color;
          ctx.fillRect(labelW, y - 7, w, 14);
          ctx.textAlign = 'right';
          ctx.fillStyle = p.muted;
          ctx.fillText(d.text || shortNum(d.value), s.w - 2, y);
        }
      });
    },

    /* حلقة: data = [{label, value}] */
    donut(host, data, opts) {
      opts = opts || {};
      const items = (data || []).filter(function (d) { return U.num(d.value) > 0; });
      if (!items.length) return Charts.empty(host, opts.emptyMsg);
      const s = setup(host, opts.height || 190);
      const ctx = s.ctx, p = s.p;
      const total = U.sum(items, function (d) { return d.value; });
      const cx = s.w / 2, cy = s.h / 2, r = Math.min(s.w, s.h) / 2 - 8, r2 = r * 0.6;
      let a0 = -Math.PI / 2;
      items.forEach(function (d, i) {
        const a1 = a0 + Math.PI * 2 * (U.num(d.value) / total);
        ctx.beginPath();
        ctx.arc(cx, cy, r, a0, a1);
        ctx.arc(cx, cy, r2, a1, a0, true);
        ctx.closePath();
        ctx.fillStyle = d.color || p.series[i % p.series.length];
        ctx.fill();
        a0 = a1;
      });
      ctx.fillStyle = p.ink; ctx.textAlign = 'center';
      ctx.font = '600 14px ' + cssVar('--font', 'system-ui');
      ctx.fillText(shortNum(total), cx, cy - 6);
      ctx.font = '10px ' + cssVar('--font', 'system-ui');
      ctx.fillStyle = p.muted;
      ctx.fillText(opts.centerLabel || 'ر.ع', cx, cy + 9);
    },

    legend(items) {
      const p = palette();
      return U.el('div', { class: 'legend' }, items.map(function (it, i) {
        return U.el('span', { class: 'legend-item' }, [
          U.el('i', { style: { background: it.color || p.series[i % p.series.length] } }),
          U.el('span', { text: it.label })
        ]);
      }));
    }
  };

  EX.charts = Charts;
})(window);

</script>
  <script>
/* ===== assets/js/print.js ===== */
/* كسارة اكسبريس — المستندات القابلة للطباعة (سند تسليم، سند قبض، كشف حساب، تقرير) */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;
  const t = function (k, p) { return EX.t(k, p); };

  /* ---------- تفقيط المبلغ بالعربية ---------- */
  const ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة',
    'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  const TENS = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const HUNDREDS = ['', 'مئة', 'مئتان', 'ثلاثمئة', 'أربعمئة', 'خمسمئة', 'ستمئة', 'سبعمئة', 'ثمانمئة', 'تسعمئة'];

  function under1000(n) {
    const parts = [];
    const h = Math.floor(n / 100), r = n % 100;
    if (h) parts.push(HUNDREDS[h]);
    if (r) {
      if (r < 20) parts.push(ONES[r]);
      else {
        const o = r % 10, tn = Math.floor(r / 10);
        parts.push(o ? ONES[o] + ' و' + TENS[tn] : TENS[tn]);
      }
    }
    return parts.join(' و');
  }

  function words(n) {
    n = Math.floor(Math.abs(U.num(n)));
    if (n === 0) return 'صفر';
    const groups = [
      { div: 1000000000, one: 'مليار', two: 'ملياران', many: 'مليارات' },
      { div: 1000000, one: 'مليون', two: 'مليونان', many: 'ملايين' },
      { div: 1000, one: 'ألف', two: 'ألفان', many: 'آلاف' }
    ];
    const parts = [];
    let rest = n;
    groups.forEach(function (g) {
      const c = Math.floor(rest / g.div);
      rest = rest % g.div;
      if (!c) return;
      if (c === 1) parts.push(g.one);
      else if (c === 2) parts.push(g.two);
      else if (c <= 10) parts.push(under1000(c) + ' ' + g.many);
      else parts.push(under1000(c) + ' ' + g.one);
    });
    if (rest) parts.push(under1000(rest));
    return parts.join(' و');
  }

  function amountWords(v) {
    const n = U.round(Math.abs(U.num(v)), 3);
    const rial = Math.floor(n);
    const baisa = Math.round((n - rial) * 1000);
    let s = words(rial) + ' ريال عماني';
    if (baisa) s += ' و' + words(baisa) + ' بيسة';
    return s + ' فقط';
  }

  /* ---------- عرض المستند ثم طباعته ----------
     يُعرض المستند أولًا على الشاشة: بعض البيئات (مثل الإطارات المحمية)
     لا تفتح نافذة الطباعة إطلاقًا، فتبقى المعاينة هي المخرج المضمون. */
  function render(node) {
    const m = EX.ui.modal({
      title: '',
      wide: true,
      actions: false,
      body: U.el('div', { class: 'doc-sheet' }, node)
    });
    m.body.parentNode.classList.add('doc-modal');
    const head = m.body.parentNode.querySelector('.modal-head');
    head.insertBefore(U.el('button', {
      class: 'btn primary sm', text: t('print'),
      onclick: function () {
        try { root.print(); } catch (e) { EX.ui.toast('المتصفح لم يسمح بفتح نافذة الطباعة', 'bad'); }
      }
    }), head.firstChild);
    return m;
  }

  function header(docTitle, docNo, date) {
    const c = EX.store.settings().company;
    return U.el('div', { class: 'doc-head' }, [
      U.el('div', { class: 'doc-company' }, [
        U.el('div', { class: 'doc-name', text: c.name || t('app_name') }),
        c.nameEn ? U.el('div', { class: 'doc-name-en', text: c.nameEn }) : null,
        U.el('div', { class: 'doc-meta' }, [
          c.phone ? U.el('span', { text: 'هاتف: ' + U.iso(c.phone) }) : null,
          c.address ? U.el('span', { text: c.address }) : null,
          c.crNo ? U.el('span', { text: 'س.ت: ' + U.iso(c.crNo) }) : null,
          c.vatNo ? U.el('span', { text: 'الرقم الضريبي: ' + U.iso(c.vatNo) }) : null
        ])
      ]),
      U.el('div', { class: 'doc-title-box' }, [
        U.el('div', { class: 'doc-title', text: docTitle }),
        docNo ? U.el('div', { class: 'doc-no', text: t('doc_no') + ': ' + U.iso(String(docNo)) }) : null,
        U.el('div', { class: 'doc-no', text: t('date') + ': ' + U.fmtDate(date) })
      ])
    ]);
  }

  function kv(label, value) {
    return U.el('div', { class: 'doc-kv' }, [
      U.el('span', { class: 'k', text: label }),
      U.el('span', { class: 'v', text: value })
    ]);
  }

  function signatures() {
    return U.el('div', { class: 'doc-signs' }, [
      U.el('div', {}, [U.el('div', { class: 'sign-line' }), U.el('div', { class: 'sign-label', text: t('doc_sig_customer') })]),
      U.el('div', {}, [U.el('div', { class: 'sign-line' }), U.el('div', { class: 'sign-label', text: t('doc_sig_company') })])
    ]);
  }

  function docTable(headers, rows, footRows) {
    return U.el('table', { class: 'doc-table' }, [
      U.el('thead', {}, U.el('tr', {}, headers.map(function (h) {
        return U.el('th', { class: h.align === 'end' ? 'ta-end' : '', text: h.label });
      }))),
      U.el('tbody', {}, rows.map(function (r) {
        return U.el('tr', {}, r.map(function (cell, i) {
          return U.el('td', { class: headers[i] && headers[i].align === 'end' ? 'ta-end tnum' : '', text: String(cell) });
        }));
      })),
      footRows ? U.el('tfoot', {}, footRows.map(function (r) {
        return U.el('tr', {}, r.map(function (cell, i) {
          return U.el('td', {
            class: (headers[i] && headers[i].align === 'end' ? 'ta-end tnum' : '') + (cell && cell.strong ? ' strong' : ''),
            colspan: cell && cell.colspan ? cell.colspan : null,
            text: cell && cell.text !== undefined ? cell.text : String(cell === null || cell === undefined ? '' : cell)
          });
        }));
      })) : null
    ]);
  }

  const P = {
    amountWords: amountWords,

    /* سند تسليم مواد لنقلة واحدة */
    ticket(l) {
      const c = EX.store.customer(l.customerId);
      const trk = EX.store.truck(l.truckId);
      const v = EX.calc.vat(l.total);
      const unit = EX.views.unitLabel(l.unit);

      const foot = [[{ text: t('total'), colspan: 3 }, U.money(l.total)]];
      if (v.vat) {
        foot.length = 0;
        foot.push([{ text: t('doc_subtotal'), colspan: 3 }, U.money(v.base)]);
        foot.push([{ text: t('doc_vat') + ' ' + U.pct(v.rate, 0), colspan: 3 }, U.money(v.vat)]);
        foot.push([{ text: t('doc_grand'), colspan: 3, strong: true }, { text: U.money(v.total), strong: true }]);
      }

      render(U.el('div', { class: 'doc' }, [
        header(t('doc_ticket_title'), 'ن-' + l.no, l.date),
        U.el('div', { class: 'doc-party' }, [
          kv(t('customer'), c ? c.name : '—'),
          kv(t('phone'), c && c.phone ? U.iso(c.phone) : '—'),
          kv(t('site'), l.site || '—'),
          kv(t('truck'), trk ? U.iso(trk.plate) : '—'),
          kv(t('driver'), trk && trk.driver ? trk.driver : '—'),
          kv(t('payment_type'), t(l.payment === 'cash' ? 'pay_cash' : 'pay_credit'))
        ]),
        docTable([
          { label: t('material') }, { label: t('qty'), align: 'end' },
          { label: t('unit_price'), align: 'end' }, { label: t('total'), align: 'end' }
        ], [[
          EX.store.materialName(l.materialId),
          U.qty(l.qty, unit),
          U.money(l.price),
          U.money(U.num(l.qty) * U.num(l.price))
        ]].concat(U.num(l.discount) ? [[t('discount'), '', '', '-' + U.money(l.discount, { bare: true })]] : []), foot),
        U.el('div', { class: 'doc-words', text: t('doc_amount_words') + ': ' + amountWords(v.total) }),
        l.notes ? U.el('div', { class: 'doc-notes', text: t('notes') + ': ' + l.notes }) : null,
        signatures(),
        U.el('div', { class: 'doc-foot', text: t('doc_thanks') })
      ]));
    },

    /* سند قبض */
    receipt(p) {
      const c = EX.store.customer(p.customerId);
      const bal = EX.calc.customerBalance(p.customerId);
      render(U.el('div', { class: 'doc' }, [
        header(t('doc_receipt_title'), 'ق-' + String(p.id).slice(-5).toUpperCase(), p.date),
        U.el('div', { class: 'doc-party' }, [
          kv(t('doc_received_from'), c ? c.name : '—'),
          kv(t('phone'), c && c.phone ? U.iso(c.phone) : '—'),
          kv(t('method'), t('m_' + p.method)),
          kv(t('ref'), p.ref ? U.iso(p.ref) : '—')
        ]),
        U.el('div', { class: 'doc-amount' }, [
          U.el('span', { class: 'k', text: t('amount') }),
          U.el('span', { class: 'big tnum', text: U.money(p.amount) })
        ]),
        U.el('div', { class: 'doc-words', text: amountWords(p.amount) }),
        U.el('div', { class: 'doc-party' }, [kv(t('balance') + ' بعد الدفعة', U.money(bal))]),
        p.notes ? U.el('div', { class: 'doc-notes', text: t('notes') + ': ' + p.notes }) : null,
        signatures(),
        U.el('div', { class: 'doc-foot', text: t('doc_thanks') })
      ]));
    },

    /* كشف حساب عميل */
    statement(c, st, range) {
      const rows = st.rows.map(function (r) {
        return [U.fmtDate(r.date), r.ref || '—', r.desc,
          r.debit ? U.money(r.debit, { bare: true }) : '—',
          r.credit ? U.money(r.credit, { bare: true }) : '—',
          U.money(r.balance, { bare: true })];
      });
      render(U.el('div', { class: 'doc' }, [
        header(t('doc_statement_title'), null, U.today()),
        U.el('div', { class: 'doc-party' }, [
          kv(t('customer'), c.name),
          kv(t('phone'), c.phone ? U.iso(c.phone) : '—'),
          kv(t('area'), c.area || '—'),
          kv(t('period'), (range && range.from ? U.fmtDate(range.from) : '—') + ' → ' + U.fmtDate((range && range.to) || U.today()))
        ]),
        docTable([
          { label: t('date') }, { label: t('ref') }, { label: t('notes') },
          { label: t('debit'), align: 'end' }, { label: t('credit_col'), align: 'end' }, { label: t('running'), align: 'end' }
        ], [[U.fmtDate((range && range.from) || ''), '—', t('doc_prev_balance'), '—', '—', U.money(st.opening, { bare: true })]].concat(rows), [
          [{ text: t('doc_closing'), colspan: 3, strong: true },
            { text: U.money(U.sum(st.rows, function (r) { return r.debit; }), { bare: true }) },
            { text: U.money(U.sum(st.rows, function (r) { return r.credit; }), { bare: true }) },
            { text: U.money(st.closing, { bare: true }), strong: true }]
        ]),
        U.el('div', { class: 'doc-words', text: t('doc_grand') + ': ' + amountWords(st.closing) }),
        signatures(),
        U.el('div', { class: 'doc-foot', text: t('doc_thanks') })
      ]));
    },

    /* تقرير الفترة */
    report(from, to) {
      const s = EX.calc.summary(from, to);
      const byMat = EX.calc.breakdown(s.loads, 'materialId');
      const byCust = EX.calc.breakdown(s.loads, 'customerId').slice(0, 15);
      const exps = EX.calc.expenseBreakdown(s.expenses);
      const aging = EX.calc.aging();

      render(U.el('div', { class: 'doc' }, [

        docTable([

        ], byCust.map(function (r) {

        })),

        U.el('div', { class: 'doc-sub', text: t('expenses_breakdown') }),
        docTable([{ label: t('category') }, { label: t('amount'), align: 'end' }, { label: t('share'), align: 'end' }],
          exps.map(function (r) { return [r.label, U.money(r.amount, { bare: true }), U.pct(r.share)]; })),

        U.el('div', { class: 'doc-sub', text: t('aging') }),
        docTable([
          { label: t('aging_0'), align: 'end' }, { label: t('aging_31'), align: 'end' },
          { label: t('aging_61'), align: 'end' }, { label: t('aging_90'), align: 'end' }, { label: t('total'), align: 'end' }
        ], [[
          U.money(aging.buckets.b0, { bare: true }), U.money(aging.buckets.b31, { bare: true }),
          U.money(aging.buckets.b61, { bare: true }), U.money(aging.buckets.b90, { bare: true }),
          U.money(aging.buckets.total, { bare: true })
        ]]),
        U.el('div', { class: 'doc-foot', text: t('app_name') + ' — ' + U.fmtDate(U.today()) })
