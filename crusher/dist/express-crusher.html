  <script>
/* ===== assets/js/ui.js ===== */
/* كسارة اكسبريس — الهيكل العام وعناصر الواجهة المشتركة */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;
  const t = function (k, p) { return EX.t(k, p); };

  const ROUTES = [
    { id: 'dashboard', key: 'nav_dashboard', icon: '◎', primary: true },
    { id: 'loads', key: 'nav_loads', icon: '▤', primary: true },
    { id: 'customers', key: 'nav_customers', icon: '◍', primary: true },
    { id: 'reports', key: 'nav_reports', icon: '◫', primary: true },
    { id: 'payments', key: 'nav_payments', icon: '◉' },
    { id: 'expenses', key: 'nav_expenses', icon: '◆' },
    { id: 'materials', key: 'nav_materials', icon: '▰' },
    { id: 'trucks', key: 'nav_trucks', icon: '▭' },
    { id: 'settings', key: 'nav_settings', icon: '⚙', primary: true }
  ];

  const UI = {
    route: 'dashboard',
    ctx: {},   // حالة الشاشة الحالية (فلاتر، عميل مفتوح…)

    /* ---------- إشعارات ---------- */
    toast(msg, kind) {
      let host = U.$('.toasts');
      if (!host) {
        host = U.el('div', { class: 'toasts' });
        document.body.appendChild(host);
      }
      const el = U.el('div', { class: 'toast ' + (kind || ''), text: msg });
      host.appendChild(el);
      setTimeout(function () {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 250);
      }, 2600);
    },

    /* ---------- نافذة ---------- */
    modal(opts) {
      const backdrop = U.el('div', { class: 'modal-backdrop' });
      const box = U.el('div', { class: 'modal' + (opts.wide ? ' wide' : '') });
      box.appendChild(U.el('div', { class: 'modal-head' }, [
        U.el('div', { class: 'card-title', text: opts.title || '' }),
        U.el('div', { class: 'spacer' }),
        U.el('button', { class: 'icon-btn', text: '✕', onclick: close, 'aria-label': t('close') })
      ]));
      const body = U.el('div', { class: 'modal-body' });
      if (typeof opts.body === 'string') body.innerHTML = opts.body;
      else if (opts.body) body.appendChild(opts.body);
      box.appendChild(body);

      if (opts.actions !== false) {
        const actions = U.el('div', { class: 'modal-actions' });
        if (opts.extra) actions.appendChild(opts.extra);
        actions.appendChild(U.el('div', { class: 'spacer' }));
        actions.appendChild(U.el('button', { class: 'btn ghost', text: opts.cancelText || t('cancel'), onclick: close }));
        if (opts.onConfirm) {
          actions.appendChild(U.el('button', {
            class: 'btn primary' + (opts.danger ? ' danger' : ''),
            text: opts.confirmText || t('save'),
            onclick: function () { if (opts.onConfirm(body) !== false) close(); }
          }));
        }
        box.appendChild(actions);
      }
      backdrop.appendChild(box);
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
      document.body.appendChild(backdrop);
      const first = body.querySelector('input,select,textarea');
      if (first) setTimeout(function () { first.focus(); }, 40);
      function close() { backdrop.remove(); if (opts.onClose) opts.onClose(); }
      return { close: close, body: body };
    },

    confirm(message, onYes, opts) {
      opts = opts || {};
      UI.modal({
        title: opts.title || t('confirm'),
        body: U.el('div', { class: 'small', text: message }),
        confirmText: opts.confirmText || t('confirm'),
        danger: opts.danger !== false,
        onConfirm: function () { onYes(); }
      });
    },

    /* ---------- نماذج ----------
       fields: [{name,label,type,value,options,required,step,min,hint,span,placeholder,onInput}]
       تعيد get() القيم، و errors() التحقق من الحقول المطلوبة. */
    form(fields, opts) {
      opts = opts || {};
      const grid = U.el('div', { class: 'form-grid' + (opts.cols ? ' cols-' + opts.cols : '') });
      const inputs = {};
      fields.forEach(function (f) {
        if (!f) return;
        const id = 'f_' + f.name + '_' + Math.random().toString(36).slice(2, 6);
        const wrap = U.el('label', { class: 'field' + (f.span ? ' span-' + f.span : ''), for: id });
        if (f.type !== 'checkbox') {
          wrap.appendChild(U.el('span', { class: 'field-label' }, [
            U.el('span', { text: f.label }),
            f.required ? U.el('b', { class: 'req', text: '*' }) : null
          ]));
        }
        let input;
        if (f.type === 'select') {
          input = U.el('select', { id: id });
          (f.options || []).forEach(function (o) {
            input.appendChild(U.el('option', { value: o.value, text: o.label, selected: String(o.value) === String(f.value) ? 'selected' : null }));
          });
          input.value = f.value === undefined || f.value === null ? '' : String(f.value);
        } else if (f.type === 'textarea') {
          input = U.el('textarea', { id: id, rows: f.rows || 2, placeholder: f.placeholder || '' });
          input.value = f.value === undefined || f.value === null ? '' : String(f.value);
        } else if (f.type === 'checkbox') {
          input = U.el('input', { id: id, type: 'checkbox' });
          input.checked = !!f.value;
          wrap.classList.add('check');
          wrap.appendChild(input);
          wrap.appendChild(U.el('span', { class: 'field-label inline', text: f.label }));
        } else {
          input = U.el('input', {
            id: id,
            type: f.type || 'text',
            placeholder: f.placeholder || '',
            step: f.step || (f.type === 'number' ? 'any' : null),
            min: f.min === undefined ? null : f.min,
            inputmode: f.type === 'number' ? 'decimal' : null
          });
          input.value = f.value === undefined || f.value === null ? '' : String(f.value);
        }
        if (f.onInput) input.addEventListener(f.type === 'select' || f.type === 'checkbox' ? 'change' : 'input', function () { f.onInput(input, inputs); });
        if (f.type !== 'checkbox') wrap.appendChild(input);
        if (f.hint) wrap.appendChild(U.el('span', { class: 'field-hint', text: f.hint }));
        inputs[f.name] = { input: input, spec: f, wrap: wrap };
        grid.appendChild(wrap);
      });

      const api = {
        node: grid,
        inputs: inputs,
        get() {
          const out = {};
          Object.keys(inputs).forEach(function (k) {
            const it = inputs[k];
            if (it.spec.type === 'checkbox') out[k] = it.input.checked;
            else if (it.spec.type === 'number') out[k] = it.input.value === '' ? '' : U.num(it.input.value);
            else out[k] = it.input.value.trim ? it.input.value.trim() : it.input.value;
          });
          return out;
        },
        set(name, value) {
          const it = inputs[name];
          if (!it) return;
          if (it.spec.type === 'checkbox') it.input.checked = !!value;
          else it.input.value = value === undefined || value === null ? '' : String(value);
        },
        valid() {
          let ok = true;
          Object.keys(inputs).forEach(function (k) {
            const it = inputs[k];
            if (!it.spec.required) return;
            const v = it.spec.type === 'checkbox' ? it.input.checked : String(it.input.value).trim();
            const bad = it.spec.type === 'number' ? (v === '' || !isFinite(Number(v))) : !v;
            it.wrap.classList.toggle('invalid', bad);
            if (bad) ok = false;
          });
          if (!ok) UI.toast(t('required'), 'bad');
          return ok;
        }
      };
      return api;
    },

    /* ---------- بطاقات ---------- */
    card(title, content, opts) {
      opts = opts || {};
      const head = title || opts.actions
        ? U.el('div', { class: 'card-head' }, [
          U.el('div', {}, [
            U.el('div', { class: 'card-title', text: title || '' }),
            opts.subtitle ? U.el('div', { class: 'card-sub', text: opts.subtitle }) : null
          ]),
          U.el('div', { class: 'spacer' }),
          opts.actions || null
        ])
        : null;
      return U.el('div', { class: 'card' + (opts.class ? ' ' + opts.class : '') }, [
        head,
        content
      ]);
    },

    kpi(label, value, opts) {
      opts = opts || {};
      return U.el('div', { class: 'kpi' + (opts.class ? ' ' + opts.class : '') }, [
        U.el('div', { class: 'kpi-label', text: label }),
        U.el('div', { class: 'kpi-value tnum ' + (opts.tone || ''), text: value }),
        opts.sub ? U.el('div', { class: 'kpi-sub', text: opts.sub }) : null
      ]);
    },

    /* ---------- جداول ----------
       cols: [{key,label,cell(row),align,width,tnum,hideSm}] */
    table(cols, rows, opts) {
      opts = opts || {};
      if (!rows.length) {
        return U.el('div', { class: 'empty' }, [
          U.el('div', { class: 'empty-title', text: opts.emptyTitle || t('no_data') }),
          U.el('div', { class: 'empty-hint', text: opts.emptyHint || t('empty_hint') })
        ]);
      }
      const thead = U.el('thead', {}, U.el('tr', {}, cols.map(function (c) {
        return U.el('th', {
          class: (c.align === 'end' ? 'ta-end' : c.align === 'center' ? 'ta-center' : '') + (c.hideSm ? ' hide-sm' : ''),
          style: c.width ? { width: c.width } : null,
          text: c.label
        });
      })));
      const tbody = U.el('tbody', {}, rows.map(function (r, i) {
        const tr = U.el('tr', opts.onRowClick ? { class: 'clickable', onclick: function () { opts.onRowClick(r); } } : {});
        cols.forEach(function (c) {
          const v = c.cell ? c.cell(r, i) : r[c.key];
          const td = U.el('td', {
            class: (c.align === 'end' ? 'ta-end' : c.align === 'center' ? 'ta-center' : '') +
              (c.tnum ? ' tnum' : '') + (c.hideSm ? ' hide-sm' : ''),
            'data-label': c.label
          });
          if (v === null || v === undefined) td.textContent = '—';
          else if (typeof v === 'object' && v.nodeType) td.appendChild(v);
          else td.textContent = String(v);
          tr.appendChild(td);
        });
        return tr;
      }));
      const foot = opts.footer
        ? U.el('tfoot', {}, U.el('tr', {}, opts.footer.map(function (f) {
          return U.el('td', { class: (f.align === 'end' ? 'ta-end' : '') + (f.tnum ? ' tnum' : ''), text: f.text || '' });
        })))
        : null;
      return U.el('div', { class: 'table-wrap' }, U.el('table', { class: 'table' }, [thead, tbody, foot]));
    },

    badge(text, kind) { return U.el('span', { class: 'badge ' + (kind || ''), text: text }); },

    rowActions(items) {
      return U.el('div', { class: 'row-actions' }, items.map(function (it) {
        return U.el('button', {
          class: 'mini-btn' + (it.danger ? ' danger' : ''),
          text: it.label,
          title: it.title || it.label,
          onclick: function (e) { e.stopPropagation(); it.onClick(); }
        });
      }));
    },

    /* شريط فلترة قياسي: بحث + مدى تاريخ + قوائم */
    filterBar(spec, onChange) {
      const bar = U.el('div', { class: 'filter-bar' });
      (spec || []).forEach(function (f) {
        if (f.type === 'search') {
          const input = U.el('input', {
            type: 'search', placeholder: t('search'), value: f.value || '',
            oninput: U.debounce(function (e) { onChange(f.name, e.target.value); }, 250)
          });
          bar.appendChild(U.el('div', { class: 'filter-field grow' }, input));
        } else if (f.type === 'date') {
          bar.appendChild(U.el('div', { class: 'filter-field' }, [
            U.el('span', { class: 'filter-label', text: f.label }),
            U.el('input', {
              type: 'date', value: f.value || '',
              onchange: function (e) { onChange(f.name, e.target.value); }
            })
          ]));
        } else if (f.type === 'select') {
          const sel = U.el('select', { onchange: function (e) { onChange(f.name, e.target.value); } });
          (f.options || []).forEach(function (o) {
            sel.appendChild(U.el('option', { value: o.value, text: o.label, selected: String(o.value) === String(f.value || '') ? 'selected' : null }));
          });
          sel.value = f.value || '';
          bar.appendChild(U.el('div', { class: 'filter-field' }, [
            f.label ? U.el('span', { class: 'filter-label', text: f.label }) : null, sel
          ]));
        } else if (f.type === 'button') {
          bar.appendChild(U.el('button', { class: 'btn ghost sm', text: f.label, onclick: f.onClick }));
        }
      });
      return bar;
    },

    /* عند تعذّر التنزيل: نعرض النص لينسخه المستخدم */
    exportFallback(filename, text) {
      const area = U.el('textarea', { rows: '10', readonly: 'readonly' });
      area.value = text;
      UI.modal({
        title: filename,
        actions: false,
        body: U.el('div', {}, [
          U.el('div', { class: 'notice warn', text: t('export_copy_hint') }),
          area,
          U.el('button', {
            class: 'btn primary', style: { marginTop: '10px' }, text: t('copy'),
            onclick: function () {
              area.select();
              const done = function () { UI.toast(t('copied'), 'good'); };
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, function () {
                  try { document.execCommand('copy'); done(); } catch (e) { /* يبقى النص محددًا */ }
                });
              } else {
                try { document.execCommand('copy'); done(); } catch (e) { /* يبقى النص محددًا */ }
              }
            }
          })
        ])
      });
    },

    saveFile(filename, text, mime) {
      // داخل إطار محمي (معاينة أو استضافة مدمجة) لا يبدأ التنزيل ولا يُطلق خطأ،
      // فنعرض النص للنسخ مباشرة بدل نقرة لا تفعل شيئًا
      let framed = false;
      try { framed = root.self !== root.top; } catch (e) { framed = true; }
      if (framed || !U.download(filename, text, mime)) UI.exportFallback(filename, text);
      else UI.toast(filename, 'good');
    },

    /* ---------- الهيكل ---------- */
    renderShell() {
      const app = U.$('#app');
      U.clear(app);

      const company = EX.store.settings().company;
      const title = EX.i18n.lang === 'en' ? (company.nameEn || company.name) : company.name;

      const bar = U.el('div', { class: 'appbar' }, U.el('div', { class: 'wrap appbar-in' }, [
        U.el('div', { class: 'brand' }, [
          U.el('div', { class: 'logo', text: '⛰' }),
          U.el('div', {}, [
            U.el('div', { class: 'brand-name', text: title || t('app_name') }),
            U.el('div', { class: 'brand-sub', text: t('app_tagline') })
          ])
        ]),
        U.el('div', { class: 'spacer' }),
        U.el('button', { class: 'btn primary sm', text: '+ ' + t('new_load'), onclick: function () { EX.views.loadForm(); } }),
        U.el('button', {
          class: 'icon-btn', text: EX.i18n.lang === 'ar' ? 'EN' : 'ع', title: t('language'),
          onclick: function () { EX.app.toggleLang(); }
        }),
        U.el('button', {
          class: 'icon-btn', text: EX.store.settings().theme === 'dark' ? '☀' : '☾', title: t('theme'),
          onclick: function () { EX.app.toggleTheme(); }
        })
      ]));

      const tabs = U.el('div', { class: 'tabs' }, U.el('div', { class: 'wrap tabs-in' }, ROUTES.map(function (r) {
        return U.el('button', {
          class: 'tab' + (UI.route === r.id ? ' active' : ''),
          onclick: function () { UI.go(r.id); }
        }, [U.el('i', { text: r.icon }), U.el('span', { text: t(r.key) })]);
      })));

      const main = U.el('main', { class: 'wrap view', id: 'view' });

      const nav = U.el('nav', { class: 'bottom-nav' }, ROUTES.filter(function (r) { return r.primary; }).map(function (r) {
        return U.el('button', {
          class: 'nav-btn' + (UI.route === r.id ? ' active' : ''),
          onclick: function () { UI.go(r.id); }
        }, [U.el('i', { text: r.icon }), U.el('span', { text: t(r.key) })]);
      }));

      app.appendChild(bar);
      app.appendChild(tabs);
      app.appendChild(main);
      app.appendChild(nav);
      UI.renderView();
    },

    renderView() {
      const host = U.$('#view');
      if (!host) return;
      U.clear(host);
      const fn = EX.views[UI.route] || EX.views.dashboard;
      try {
        fn(host);
      } catch (e) {
        console.error(e);
        host.appendChild(U.el('div', { class: 'notice bad', text: 'خطأ في العرض: ' + e.message }));
      }
      const active = U.$('.tabs-in .tab.active');
      if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
    },

    go(route, ctx) {
      UI.route = route;
      UI.ctx = ctx || {};
      if (location.hash !== '#' + route) {
        try { history.replaceState(null, '', '#' + route); } catch (e) { location.hash = route; }
      }
      UI.renderShell();
      root.scrollTo({ top: 0, behavior: 'auto' });
    },

    refresh() { UI.renderView(); },
    ROUTES: ROUTES
  };

  EX.ui = UI;
})(window);

</script>

/* ===== assets/js/views1.js ===== */
/* كسارة اكسبريس — لوحة اليوم وسجل النقلات */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;
  const t = function (k, p) { return EX.t(k, p); };
  const V = (EX.views = EX.views || {});

  function unitLabel(u) { return t('unit_' + (u === 'm3' ? 'm3' : u === 'load' ? 'load' : 'ton')); }
  V.unitLabel = unitLabel;

  function needSetup() {
    const s = EX.store.s;
    if (s.customers.length) return null;
    return U.el('div', { class: 'notice' }, [
      U.el('b', { text: 'ابدأ هنا: ' }),
      U.el('span', { text: 'أضف أول عميل من شاشة «العملاء»، أو حمّل بيانات تجريبية من «الإعدادات» لتجربة التطبيق بسرعة.' })
    ]);
  }

  /* ======================= لوحة اليوم ======================= */
  V.dashboard = function (host) {
    const today = U.today();
    const mStart = U.startOfMonth(today);
    const day = EX.calc.summary(today, today);
    const month = EX.calc.summary(mStart, today);
    const receivables = EX.calc.totalReceivables();

    const setup = needSetup();
    if (setup) host.appendChild(setup);

    host.appendChild(U.el('div', { class: 'kpi-grid' }, [
      EX.ui.kpi(t('kpi_loads_today'), U.iso(String(day.trips)), { sub: EX.calc.qtyLabel(day.qty) }),
      EX.ui.kpi(t('kpi_revenue_today'), U.money(day.revenue), { tone: day.revenue > 0 ? 'pos' : '' }),
      EX.ui.kpi(t('kpi_cash_today'), U.money(day.collected), { sub: t('pay_cash') + ' + ' + t('payments_title') }),
      EX.ui.kpi(t('kpi_receivables'), U.money(receivables), { tone: receivables > 0 ? 'warn' : '', sub: t('aging') })
    ]));

    host.appendChild(U.el('div', { class: 'kpi-grid' }, [
      EX.ui.kpi(t('kpi_month_revenue'), U.money(month.revenue), { sub: U.monthLabel(U.monthKey(today), EX.i18n.lang) }),
      EX.ui.kpi(t('kpi_month_expenses'), U.money(month.expensesTotal)),
      EX.ui.kpi(t('kpi_month_profit'), U.money(month.net), { tone: U.sign(month.net) }),
      EX.ui.kpi(t('margin'), U.pct(month.margin), { tone: U.sign(month.margin), sub: t('loads_count') + ': ' + U.iso(String(month.trips)) })
    ]));

    /* إجراءات سريعة */
    host.appendChild(EX.ui.card(t('quick_actions'), U.el('div', { class: 'btn-row' }, [
      U.el('button', { class: 'btn primary', text: '+ ' + t('new_load'), onclick: function () { V.loadForm(); } }),
      U.el('button', { class: 'btn', text: t('new_payment'), onclick: function () { V.paymentForm(); } }),
      U.el('button', { class: 'btn', text: t('new_expense'), onclick: function () { V.expenseForm(); } }),
      U.el('button', { class: 'btn ghost', text: t('add_customer'), onclick: function () { V.customerForm(); } })
    ])));

    /* الحركة اليومية */
    const series = EX.calc.dailySeries(30);
    const chartHost = U.el('div', { class: 'chart' });
    host.appendChild(EX.ui.card(t('revenue_30'), U.el('div', {}, [
      chartHost,
      EX.charts.legend([{ label: t('revenue') }, { label: t('total_expenses') }])
    ])));
    EX.charts.line(chartHost, series.map(function (d) {
      return { label: U.iso(d.date.slice(5)), value: d.revenue, value2: d.expense };
    }), { second: true, height: 190 });

    /* توزيع الكميات على المواد + أعلى العملاء */
    const grid = U.el('div', { class: 'grid-2' });
    const matHost = U.el('div', { class: 'chart' });
    const custHost = U.el('div', { class: 'chart' });
    grid.appendChild(EX.ui.card(t('mix_month'), matHost));
    grid.appendChild(EX.ui.card(t('top_customers'), custHost));
    host.appendChild(grid);

    const byMat = EX.calc.breakdown(month.loads, 'materialId').slice(0, 7);
    EX.charts.hbars(matHost, byMat.map(function (r) {
      return { label: r.label, value: r.revenue, text: U.money(r.revenue, { bare: true, decimals: 0 }) };
    }), { colors: true });

    const byCust = EX.calc.breakdown(month.loads, 'customerId').slice(0, 7);
    EX.charts.hbars(custHost, byCust.map(function (r) {
      return { label: r.label, value: r.revenue, text: U.money(r.revenue, { bare: true, decimals: 0 }) };
    }), { colors: true });

    /* نقلات اليوم */
    const todayLoads = U.sortBy(day.loads, function (l) { return l.createdAt || 0; }, true);
    host.appendChild(EX.ui.card(t('today_loads'), V.loadsTable(todayLoads, { compact: true }), {
      subtitle: EX.calc.qtyLabel(day.qty) + ' · ' + U.money(day.revenue),
      actions: U.el('button', { class: 'btn ghost sm', text: t('nav_loads'), onclick: function () { EX.ui.go('loads'); } })
    }));

    /* أعلى المديونيات */
    const debtors = U.sortBy(EX.store.s.customers.map(function (c) {
      return { c: c, bal: EX.calc.customerBalance(c.id) };
    }).filter(function (r) { return r.bal > 0.0005; }), function (r) { return r.bal; }, true).slice(0, 8);
    if (debtors.length) {
      host.appendChild(EX.ui.card(t('top_debtors'), EX.ui.table([
        { label: t('customer'), cell: function (r) { return r.c.name; } },
        { label: t('area'), cell: function (r) { return r.c.area || '—'; }, hideSm: true },
        { label: t('balance'), align: 'end', tnum: true, cell: function (r) { return U.money(r.bal); } }
      ], debtors, {
        onRowClick: function (r) { EX.ui.go('customers', { customerId: r.c.id }); }
      })));
    }
  };

  /* ======================= جدول النقلات ======================= */
  V.loadsTable = function (loads, opts) {
    opts = opts || {};
    const cols = [
      { label: t('load_no'), width: '74px', tnum: true, cell: function (l) { return U.iso('#' + l.no); } },
      { label: t('date'), width: '104px', tnum: true, hideSm: opts.compact, cell: function (l) { return U.fmtDate(l.date); } },
      { label: t('customer'), cell: function (l) { return EX.store.customerName(l.customerId); } },
      { label: t('material'), cell: function (l) { return EX.store.materialName(l.materialId); } },
      { label: t('qty'), align: 'end', tnum: true, cell: function (l) { return U.qty(l.qty, unitLabel(l.unit)); } },
      { label: t('unit_price'), align: 'end', tnum: true, hideSm: true, cell: function (l) { return U.money(l.price); } },
      { label: t('total'), align: 'end', tnum: true, cell: function (l) { return U.money(l.total); } },
      {
        label: t('payment_type'), align: 'center', cell: function (l) {
          return EX.ui.badge(t(l.payment === 'cash' ? 'pay_cash' : 'pay_credit'), l.payment === 'cash' ? 'good' : 'warn');
        }
      },
      { label: t('truck'), hideSm: true, cell: function (l) { return EX.store.truckLabel(l.truckId); } },
      {
        label: t('actions'), align: 'end', cell: function (l) {
          return EX.ui.rowActions([
            { label: t('ticket'), onClick: function () { EX.print.ticket(l); } },
            { label: t('edit'), onClick: function () { V.loadForm(l); } },
            {
              label: t('delete'), danger: true, onClick: function () {
                EX.ui.confirm(t('delete_confirm'), function () {
                  EX.store.removeLoad(l.id);
                  EX.ui.toast(t('deleted'));
                  EX.ui.refresh();
                });
              }
            }
          ]);
        }
      }
    ].filter(function (c) { return !(opts.compact && c.label === t('truck')); });

    /* يُبنى التذييل من قائمة الأعمدة نفسها حتى يبقى كل مجموع تحت عموده */
    const totals = {};
    totals[t('load_no')] = t('total') + ' · ' + loads.length;
    totals[t('qty')] = EX.calc.qtyLabel(EX.calc.qtySummary(loads));
    totals[t('total')] = U.money(U.sum(loads, function (l) { return l.total; }));
    const footer = loads.length ? cols.map(function (c) {
      return { text: totals[c.label] || '', align: c.align, tnum: !!totals[c.label] && c.label !== t('load_no') };
    }) : null;

    return EX.ui.table(cols, loads, {
      footer: footer,
      emptyTitle: t('no_data'),
      emptyHint: opts.compact ? 'لا توجد نقلات مسجلة لهذا اليوم.' : t('empty_hint')
    });
  };

  /* ======================= شاشة النقلات ======================= */
  V.loads = function (host) {
    const f = EX.ui.ctx.loadFilter = EX.ui.ctx.loadFilter || {
      from: U.addDays(U.today(), -30), to: U.today(), q: '', customerId: '', materialId: '', payment: ''
    };
    const onChange = function (name, value) {
      f[name] = value;
      EX.ui.refresh();
    };

    host.appendChild(EX.ui.filterBar([
      { type: 'search', name: 'q', value: f.q },
      { type: 'date', name: 'from', label: t('from'), value: f.from },
      { type: 'date', name: 'to', label: t('to'), value: f.to },
      {
        type: 'select', name: 'customerId', value: f.customerId,
        options: [{ value: '', label: t('customer') + ': ' + t('all') }].concat(
          U.sortBy(EX.store.s.customers, function (c) { return c.name; }).map(function (c) {
            return { value: c.id, label: c.name };
          }))
      },
      {
        type: 'select', name: 'materialId', value: f.materialId,
        options: [{ value: '', label: t('material') + ': ' + t('all') }].concat(
          EX.store.s.materials.map(function (m) { return { value: m.id, label: EX.store.materialName(m.id) }; }))
      },
      {
        type: 'select', name: 'payment', value: f.payment,
        options: [
          { value: '', label: t('payment_type') + ': ' + t('all') },
          { value: 'cash', label: t('pay_cash') },
          { value: 'credit', label: t('pay_credit') }
        ]
      },
      { type: 'button', label: t('last_30'), onClick: function () { f.from = U.addDays(U.today(), -30); f.to = U.today(); EX.ui.refresh(); } },
      { type: 'button', label: t('this_month'), onClick: function () { f.from = U.startOfMonth(U.today()); f.to = U.today(); EX.ui.refresh(); } }
    ], onChange));

    const loads = U.sortBy(EX.calc.loads(f), function (l) { return l.date + '_' + String(l.no).padStart(6, '0'); }, true);
    const sum = EX.calc.summary(f.from, f.to);
    const filteredRevenue = U.sum(loads, function (l) { return l.total; });

    host.appendChild(U.el('div', { class: 'kpi-grid' }, [
      EX.ui.kpi(t('loads_count'), U.iso(String(loads.length))),
      EX.ui.kpi(t('qty'), EX.calc.qtyLabel(EX.calc.qtySummary(loads))),
      EX.ui.kpi(t('gross_revenue'), U.money(filteredRevenue)),
      EX.ui.kpi(t('avg_load'), U.money(loads.length ? filteredRevenue / loads.length : 0))
    ]));

    host.appendChild(EX.ui.card(t('loads_title'), V.loadsTable(loads), {
      subtitle: U.fmtDate(f.from) + ' → ' + U.fmtDate(f.to),
      actions: U.el('div', { class: 'btn-row' }, [
        U.el('button', { class: 'btn ghost sm', text: t('export_csv'), onclick: function () { V.exportLoads(loads); } }),
        U.el('button', { class: 'btn primary sm', text: '+ ' + t('add_load'), onclick: function () { V.loadForm(); } })
      ])
    }));
    void sum;
  };

  V.exportLoads = function (loads) {
    const rows = [[t('load_no'), t('date'), t('customer'), t('material'), t('qty'), t('unit'),
      t('unit_price'), t('discount'), t('total'), t('payment_type'), t('truck'), t('driver'), t('site'), t('notes')]];
    loads.forEach(function (l) {
      const trk = EX.store.truck(l.truckId);
      rows.push([l.no, l.date, EX.store.customerName(l.customerId), EX.store.materialName(l.materialId),
        l.qty, unitLabel(l.unit), l.price, l.discount || 0, l.total,
        t(l.payment === 'cash' ? 'pay_cash' : 'pay_credit'),
        trk ? trk.plate : '', trk ? trk.driver || '' : '', l.site || '', l.notes || '']);
    });
    EX.ui.saveFile('loads_' + U.today() + '.csv', U.csv(rows), 'text/csv');
  };

  /* ======================= نموذج النقلة ======================= */
  V.loadForm = function (existing) {
    const st = EX.store.s;
    if (!st.customers.length) {
      EX.ui.toast('أضف عميلًا أولًا', 'bad');
      return V.customerForm();
    }
    const l = existing || {};
    const mats = st.materials.filter(function (m) { return m.active !== false || m.id === l.materialId; });
    const defMat = l.materialId || (mats[0] && mats[0].id) || '';
    const defCust = l.customerId || st.customers[0].id;

    const totalLine = U.el('div', { class: 'total-line' });
    const recalc = function () {
      const v = form.get();
      const total = EX.calc.loadTotal({ qty: v.qty, price: v.price, discount: v.discount });
      U.clear(totalLine).appendChild(U.el('div', {}, [
        U.el('span', { class: 'muted small', text: t('total') + ': ' }),
        U.el('b', { class: 'tnum big', text: U.money(total) })
      ]));
    };
    const syncPrice = function () {
      const v = form.get();
      const m = EX.store.material(v.materialId);
      form.set('price', EX.store.priceFor(v.customerId, v.materialId));
      if (m) {
        form.set('unit', m.unit);
        if (m.unit === 'load' && (!v.qty || U.num(v.qty) === 0)) form.set('qty', 1);
      }
      recalc();
    };

    const form = EX.ui.form([
      { name: 'date', label: t('date'), type: 'date', value: l.date || U.today(), required: true },
      {
        name: 'customerId', label: t('customer'), type: 'select', required: true, value: defCust,
        options: U.sortBy(st.customers, function (c) { return c.name; }).map(function (c) {
          return { value: c.id, label: c.name + (c.area ? ' — ' + c.area : '') };
        }),
        onInput: syncPrice
      },
      {
        name: 'materialId', label: t('material'), type: 'select', required: true, value: defMat,
        options: mats.map(function (m) { return { value: m.id, label: EX.store.materialName(m.id) }; }),
        onInput: syncPrice
      },
      {
        name: 'qty', label: t('qty'), type: 'number', required: true, step: '0.01', min: 0,
        value: l.qty === undefined ? '' : l.qty, onInput: recalc
      },
      {
        name: 'unit', label: t('unit'), type: 'select',
        value: l.unit || (EX.store.material(defMat) || {}).unit || 'ton',
        options: ['ton', 'load', 'm3'].map(function (u) { return { value: u, label: unitLabel(u) }; })
      },
      {
        name: 'price', label: t('unit_price') + ' (ر.ع)', type: 'number', required: true, step: '0.001', min: 0,
        value: l.price === undefined ? EX.store.priceFor(defCust, defMat) : l.price, onInput: recalc
      },
      {
        name: 'discount', label: t('discount') + ' (ر.ع)', type: 'number', step: '0.001', min: 0,
        value: l.discount || '', onInput: recalc
      },
      {
        name: 'payment', label: t('payment_type'), type: 'select',
        value: l.payment || ((EX.store.customer(defCust) || {}).type === 'cash' ? 'cash' : 'credit'),
        options: [{ value: 'cash', label: t('pay_cash') }, { value: 'credit', label: t('pay_credit') }]
      },
      {
        name: 'truckId', label: t('truck'), type: 'select', value: l.truckId || '',
        options: [{ value: '', label: '—' }].concat(st.trucks.map(function (tr) {
          return { value: tr.id, label: tr.plate + (tr.driver ? ' · ' + tr.driver : '') };
        }))
      },
      { name: 'site', label: t('site'), type: 'text', value: l.site || '', placeholder: t('optional') },
      { name: 'notes', label: t('notes'), type: 'textarea', value: l.notes || '', span: 2 }
    ]);

    const body = U.el('div', {}, [form.node, totalLine]);
    recalc();

    EX.ui.modal({
      title: existing ? t('edit_load') + ' #' + existing.no : t('add_load'),
      body: body,
      wide: true,
      confirmText: t('save'),
      extra: existing ? U.el('button', {
        class: 'btn ghost sm', text: t('ticket'),
        onclick: function () { EX.print.ticket(existing); }
      }) : null,
      onConfirm: function () {
        if (!form.valid()) return false;
        const v = form.get();
        v.qty = U.num(v.qty);
        v.price = U.num(v.price);
        v.discount = U.num(v.discount);
        if (v.qty <= 0) { EX.ui.toast(t('qty') + ' > 0', 'bad'); return false; }
        if (existing) EX.store.updateLoad(existing.id, v);
        else EX.store.addLoad(v);
        EX.ui.toast(t('saved'), 'good');
        EX.ui.refresh();
      }
    });
  };
})(window);

</script>
  <script>
/* ===== assets/js/views2.js ===== */
/* كسارة اكسبريس — العملاء والذمم والمدفوعات والمواد والشاحنات والمصروفات */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;
  const t = function (k, p) { return EX.t(k, p); };
  const V = EX.views;

  /* ======================= العملاء ======================= */
  V.customers = function (host) {
    if (EX.ui.ctx.customerId && EX.store.customer(EX.ui.ctx.customerId)) {
      return V.customerDetail(host, EX.store.customer(EX.ui.ctx.customerId));
    }
    const f = EX.ui.ctx.custFilter = EX.ui.ctx.custFilter || { q: '', only: '' };

    host.appendChild(EX.ui.filterBar([
      { type: 'search', name: 'q', value: f.q },
      {
        type: 'select', name: 'only', value: f.only,
        options: [
          { value: '', label: t('all') },
          { value: 'debt', label: t('balance') + ' > 0' },
          { value: 'credit', label: t('pay_credit') },
          { value: 'cash', label: t('pay_cash') }
        ]
      },
      { type: 'button', label: '+ ' + t('add_customer'), onClick: function () { V.customerForm(); } }
    ], function (name, value) { f[name] = value; EX.ui.refresh(); }));

    const aging = EX.calc.aging();
    host.appendChild(U.el('div', { class: 'kpi-grid' }, [
      EX.ui.kpi(t('aging_0'), U.money(aging.buckets.b0)),
      EX.ui.kpi(t('aging_31'), U.money(aging.buckets.b31), { tone: aging.buckets.b31 > 0 ? 'warn' : '' }),
      EX.ui.kpi(t('aging_61'), U.money(aging.buckets.b61), { tone: aging.buckets.b61 > 0 ? 'warn' : '' }),
      EX.ui.kpi(t('aging_90'), U.money(aging.buckets.b90), { tone: aging.buckets.b90 > 0 ? 'neg' : '' })
    ]));

    const rows = EX.store.s.customers.map(function (c) {
      const loads = EX.store.s.loads.filter(function (l) { return l.customerId === c.id; });
      const last = loads.length ? U.sortBy(loads, function (l) { return l.date; }, true)[0].date : '';
      return {
        c: c,
        balance: EX.calc.customerBalance(c.id),
        trips: loads.length,
        revenue: U.sum(loads, function (l) { return l.total; }),
        last: last,
        ageRow: aging.perCustomer[c.id] || null
      };
    }).filter(function (r) {
      if (f.q && !U.match([r.c.name, r.c.phone, r.c.area, r.c.notes].join(' '), f.q)) return false;
      if (f.only === 'debt' && r.balance <= 0.0005) return false;
      if (f.only === 'credit' && r.c.type !== 'credit') return false;
      if (f.only === 'cash' && r.c.type !== 'cash') return false;
      return true;
    });

    const sorted = U.sortBy(rows, function (r) { return r.balance; }, true);

    host.appendChild(EX.ui.card(t('customers_title'), EX.ui.table([
      { label: t('name'), cell: function (r) { return r.c.name; } },
      { label: t('phone'), tnum: true, hideSm: true, cell: function (r) { return r.c.phone ? U.iso(r.c.phone) : '—'; } },
      { label: t('area'), hideSm: true, cell: function (r) { return r.c.area || '—'; } },
      {
        label: t('customer_type'), align: 'center', cell: function (r) {
          return EX.ui.badge(t(r.c.type === 'cash' ? 'pay_cash' : 'pay_credit'), r.c.type === 'cash' ? 'good' : '');
        }
      },
      { label: t('loads_count'), align: 'end', tnum: true, hideSm: true, cell: function (r) { return U.iso(String(r.trips)); } },
      { label: t('revenue'), align: 'end', tnum: true, hideSm: true, cell: function (r) { return U.money(r.revenue); } },
      { label: t('last_load'), tnum: true, hideSm: true, cell: function (r) { return r.last ? U.fmtDate(r.last) : '—'; } },
      {
        label: t('balance'), align: 'end', tnum: true, cell: function (r) {
          return U.el('b', { class: r.balance > 0.0005 ? 'warn' : 'muted', text: U.money(r.balance) });
        }
      },
      {
        label: t('actions'), align: 'end', cell: function (r) {
          return EX.ui.rowActions([
            { label: t('statement'), onClick: function () { EX.ui.go('customers', { customerId: r.c.id }); } },
            { label: t('new_payment'), onClick: function () { V.paymentForm({ customerId: r.c.id }); } },
            { label: t('edit'), onClick: function () { V.customerForm(r.c); } }
          ]);
        }
      }
    ], sorted, {
      onRowClick: function (r) { EX.ui.go('customers', { customerId: r.c.id }); },
      footer: sorted.length ? [
        { text: t('total') + ' · ' + sorted.length }, { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' }, { text: '' },
        { text: U.money(U.sum(sorted, function (r) { return Math.max(0, r.balance); })), align: 'end', tnum: true },
        { text: '' }
      ] : null
    }), {
      actions: U.el('button', { class: 'btn primary sm', text: '+ ' + t('add_customer'), onclick: function () { V.customerForm(); } })
    }));
  };

  /* ---------- كشف حساب عميل ---------- */
  V.customerDetail = function (host, c) {
    const f = EX.ui.ctx.stFilter = EX.ui.ctx.stFilter || { from: '', to: U.today() };
    host.appendChild(U.el('div', { class: 'back-row' }, [
      U.el('button', { class: 'btn ghost sm', text: '← ' + t('nav_customers'), onclick: function () { EX.ui.go('customers'); } }),
      U.el('div', { class: 'spacer' }),
      U.el('button', { class: 'btn ghost sm', text: t('edit'), onclick: function () { V.customerForm(c); } }),
      U.el('button', { class: 'btn sm', text: t('new_payment'), onclick: function () { V.paymentForm({ customerId: c.id }); } }),
      U.el('button', { class: 'btn primary sm', text: '+ ' + t('add_load'), onclick: function () { V.loadForm({ customerId: c.id }); } })
    ]));

    const st = EX.calc.statement(c.id, f.from, f.to);
    const loads = EX.store.s.loads.filter(function (l) { return l.customerId === c.id; });
    const age = EX.calc.aging().perCustomer[c.id];

    host.appendChild(EX.ui.card(c.name, U.el('div', { class: 'meta-grid' }, [
      U.el('div', {}, [U.el('span', { class: 'muted small', text: t('phone') }), U.el('div', { class: 'tnum', text: c.phone ? U.iso(c.phone) : '—' })]),
      U.el('div', {}, [U.el('span', { class: 'muted small', text: t('area') }), U.el('div', { text: c.area || '—' })]),
      U.el('div', {}, [U.el('span', { class: 'muted small', text: t('customer_type') }), U.el('div', { text: t(c.type === 'cash' ? 'pay_cash' : 'pay_credit') })]),
      U.el('div', {}, [U.el('span', { class: 'muted small', text: t('loads_count') }), U.el('div', { class: 'tnum', text: U.iso(String(loads.length)) })]),
      U.el('div', {}, [U.el('span', { class: 'muted small', text: t('revenue') }), U.el('div', { class: 'tnum', text: U.money(U.sum(loads, function (l) { return l.total; })) })]),
      U.el('div', {}, [U.el('span', { class: 'muted small', text: t('balance') }), U.el('div', { class: 'tnum big ' + (st.closing > 0.0005 ? 'warn' : ''), text: U.money(st.closing) })])
    ]), { subtitle: c.notes || '' }));

    if (age) {
      host.appendChild(EX.ui.card(t('aging'), U.el('div', { class: 'kpi-grid tight' }, [
        EX.ui.kpi(t('aging_0'), U.money(age.b0)),

        EX.ui.toast(t('saved'), 'good');
        EX.ui.refresh();
      }
    });
  };
})(window);

/* ===== assets/js/views3.js ===== */

  <script>
/* ===== assets/js/app.js ===== */
/* كسارة اكسبريس — الإقلاع */
(function (root) {
  'use strict';
  const EX = (root.EX = root.EX || {});
  const U = EX.util;

  const App = {
    boot() {
      EX.store.load();
      const st = EX.store.settings();
      EX.i18n.setLang(st.lang);
      App.applyLang();
      App.applyTheme();

      const hash = (location.hash || '').replace('#', '');
      if (hash && EX.views[hash]) EX.ui.route = hash;

      EX.ui.renderShell();

      root.addEventListener('hashchange', function () {
        const h = (location.hash || '').replace('#', '');
        if (h && EX.views[h] && h !== EX.ui.route) {
          EX.ui.route = h;
          EX.ui.ctx = {};
          EX.ui.renderShell();
        }
      });
      // الرسوم مرسومة على canvas بعرض ثابت، فتُعاد عند تغيّر المقاس
      root.addEventListener('resize', U.debounce(function () { EX.ui.renderView(); }, 250));
    },

    applyTheme() {
      document.documentElement.setAttribute('data-theme', EX.store.settings().theme === 'light' ? 'light' : 'dark');
    },
    setTheme(theme) {
      EX.store.settings().theme = theme === 'light' ? 'light' : 'dark';
      EX.store.save();
      App.applyTheme();
      EX.ui.renderShell();
    },
    toggleTheme() { App.setTheme(EX.store.settings().theme === 'dark' ? 'light' : 'dark'); },

    applyLang() {
      const lang = EX.i18n.lang;
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      const c = EX.store.settings().company;
      document.title = (lang === 'en' ? (c.nameEn || c.name) : c.name) || EX.t('app_name');
    },
    setLang(lang) {
      EX.i18n.setLang(lang);
      EX.store.settings().lang = EX.i18n.lang;
      EX.store.save();
      App.applyLang();
      EX.ui.renderShell();
    },
    toggleLang() { App.setLang(EX.i18n.lang === 'ar' ? 'en' : 'ar'); }
  };

  EX.app = App;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { App.boot(); });
  } else {
    App.boot();
  }
})(window);

</script>
