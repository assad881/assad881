<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Asaad Paper Invest — مختبر استثمار وتداول افتراضي لمدة 90 يومًا. محاكاة فقط بدون أموال حقيقية.">
  <meta name="theme-color" content="#0b0e14">
  <title>Asaad Paper Invest</title>
  <style>
/* ============================================================
   Asaad Paper Invest — design system
   Dark by default, light optional, RTL-first, mobile-friendly.
   ============================================================ */

:root {
  color-scheme: dark;

  /* surfaces & ink (dark is the default theme) */
  --page: #0b0e14;
  --surface-1: #141922;
  --surface-2: #1a212c;
  --surface-3: #222b38;
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text-primary: #f2f5f9;
  --text-secondary: #a9b4c4;
  --text-muted: #74808f;
  --grid: #232b36;
  --axis: #38424f;

  /* categorical series (validated for the dark surface) */
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;

  /* status (fixed, never themed) */
  --good: #0ca30c;
  --good-text: #35c435;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --critical-text: #ef6a6a;

  --accent: #3987e5;
  --accent-soft: rgba(57, 135, 229, 0.14);
  --good-soft: rgba(12, 163, 12, 0.14);
  --critical-soft: rgba(208, 59, 59, 0.14);
  --warning-soft: rgba(250, 178, 25, 0.14);

  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.22);
  --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", "Tahoma", sans-serif;
  --maxw: 1240px;
}

html[data-theme="light"] {
  color-scheme: light;
  --page: #f5f6f8;
  --surface-1: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef1f5;
  --border: rgba(11, 15, 22, 0.10);
  --border-strong: rgba(11, 15, 22, 0.18);
  --text-primary: #0b0f16;
  --text-secondary: #4a5768;
  --text-muted: #78828f;
  --grid: #e6e9ee;
  --axis: #c8cdd6;

  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;

  --good-text: #006300;
  --critical-text: #b32626;
  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.10);
  --shadow: 0 1px 2px rgba(11, 15, 22, 0.06), 0 8px 24px rgba(11, 15, 22, 0.06);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--page);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

body { padding-bottom: 76px; }
@media (min-width: 860px) { body { padding-bottom: 0; } }

a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 10px; }

/* ---------------- layout ---------------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }

.appbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.appbar-inner {
  max-width: var(--maxw); margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
.brand > div { min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--accent), #7d5cf0);
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px;
}
.brand-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-actions { flex: 0 0 auto; }
@media (max-width: 420px) { .brand-name { font-size: 13.5px; } .icon-btn { width: 32px; height: 32px; } }
.brand-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }

.icon-btn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-secondary);
  cursor: pointer; font-size: 14px; position: relative;
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text-primary); }
.icon-btn .dot {
  position: absolute; top: 5px; inset-inline-end: 5px;
  min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
  background: var(--critical); color: #fff; font-size: 9px; font-weight: 700;
  display: grid; place-items: center; line-height: 1;
}

.paper-strip {
  background: var(--warning-soft);
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 11.5px; text-align: center; padding: 5px 12px;
}

/* ---------------- KPI strip ---------------- */
.kpis {
  display: grid; gap: 10px; margin: 14px 0;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@media (min-width: 620px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .kpis { grid-template-columns: repeat(7, minmax(0, 1fr)); } }

.kpi {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 12px; min-width: 0;
}
.kpi-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-value { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.kpi-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.kpi.hero { background: linear-gradient(160deg, var(--accent-soft), transparent 70%); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }

/* ---------------- nav ---------------- */
.tabs {
  display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 10px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 1px solid transparent; background: transparent; color: var(--text-secondary);
  padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 550;
  cursor: pointer; white-space: nowrap; transition: all .15s;
}
.tab:hover { background: var(--surface-2); color: var(--text-primary); }
.tab.active { background: var(--surface-1); border-color: var(--border-strong); color: var(--text-primary); }

.bottomnav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 50;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface-1) 94%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
@media (min-width: 860px) { .bottomnav { display: none; } }
.bnav {
  background: none; border: 0; color: var(--text-muted); cursor: pointer;
  padding: 8px 2px 10px; font-size: 10px; display: grid; gap: 2px; justify-items: center;
}
.bnav span.ico { font-size: 17px; line-height: 1; }
.bnav.active { color: var(--accent); }

/* ---------------- cards ---------------- */
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title { font-size: 15.5px; font-weight: 650; }
.card-sub { font-size: 12px; color: var(--text-muted); }
.card-head .spacer { margin-inline-start: auto; }

.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid3 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }

/* ---------------- badges & chips ---------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
  white-space: nowrap;
}
.badge.good { background: var(--good-soft); color: var(--good-text); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.badge.bad { background: var(--critical-soft); color: var(--critical-text); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.badge.warn { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
.badge.info { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }

.band-strong { background: var(--good-soft); color: var(--good-text); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.band-gradual { background: rgba(25, 158, 112, .14); color: var(--series-3); border-color: color-mix(in srgb, var(--series-3) 40%, transparent); }
.band-watch { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 40%, transparent); }
.band-nobuy { background: rgba(236, 131, 90, .14); color: var(--serious); border-color: color-mix(in srgb, var(--serious) 40%, transparent); }
.band-avoid { background: var(--critical-soft); color: var(--critical-text); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }

.pos { color: var(--good-text); }
.neg { color: var(--critical-text); }
.flat { color: var(--text-secondary); }
.mono { font-variant-numeric: tabular-nums; }

/* Formatted numbers already carry bidi isolates (see util.js); tabular figures
   keep columns aligned. */
.tnum, .kpi-value, .plan-value, .pick-price, .legend-val,
.meter-val, .check-v, .tip-val { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 15px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--critical-soft); border-color: color-mix(in srgb, var(--critical) 40%, transparent); color: var(--critical-text); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------------- forms ---------------- */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: 9px 11px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
  font-family: inherit; font-size: 14px; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

/* ---------------- tables ---------------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
table.tbl th {
  text-align: start; font-weight: 600; font-size: 11.5px; color: var(--text-muted);
  padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.tbl td { padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl tr:last-child td { border-bottom: 0; }
.sym { font-weight: 700; letter-spacing: .02em; }
.sym-name { font-size: 11px; color: var(--text-muted); font-weight: 400; }

/* ---------------- charts ---------------- */
.chart-host { position: relative; width: 100%; }
.chart-canvas { display: block; width: 100%; }
.chart-overlay { position: absolute; inset-inline-start: 0; top: 0; width: 100%; pointer-events: none; }
.chart-tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s;
  background: var(--surface-3); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow);
  min-width: 130px; z-index: 5;
}
.chart-tip.show { opacity: 1; }
.tip-date { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 6px; }
.tip-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.tip-label { color: var(--text-secondary); }
.tip-val { margin-inline-start: auto; font-weight: 650; font-variant-numeric: tabular-nums; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.legend-val { font-weight: 650; color: var(--text-primary); font-variant-numeric: tabular-nums; }

.meter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.meter-label { font-size: 12px; color: var(--text-secondary); width: 110px; flex: 0 0 auto; }
.meter-track { flex: 1; height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 4px; }
.meter-val { font-size: 11.5px; color: var(--text-muted); width: 58px; text-align: end; font-variant-numeric: tabular-nums; }

/* ---------------- today view ---------------- */
.today-hero {
  background:
    radial-gradient(1200px 240px at 50% -60px, var(--accent-soft), transparent 70%),
    var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
}
.regime-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.regime-dot { width: 10px; height: 10px; border-radius: 50%; }
.pick-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.pick-main { flex: 1 1 240px; min-width: 0; }
.pick-symbol { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.pick-price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.reason-list { margin: 10px 0 0; padding-inline-start: 18px; }
.reason-list li { margin-bottom: 5px; font-size: 13.5px; color: var(--text-secondary); }

.planbox { display: grid; gap: 8px; grid-template-columns: repeat(2, 1fr); margin-top: 12px; }
@media (min-width: 700px) { .planbox { grid-template-columns: repeat(4, 1fr); } }
.plan-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; }
.plan-label { font-size: 11px; color: var(--text-muted); }
.plan-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

.check-list { display: grid; gap: 6px; }
.check-item { display: flex; align-items: center; gap: 9px; font-size: 13px; padding: 7px 10px; background: var(--surface-2); border-radius: 9px; }
.check-mark { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; flex: 0 0 auto; color: #fff; }
.check-mark.ok { background: var(--good); }
.check-mark.no { background: var(--critical); }
.check-q { flex: 1; color: var(--text-secondary); }
.check-v { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.empty {
  text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 13.5px;
  border: 1px dashed var(--border-strong); border-radius: var(--radius);
}

.notice {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px; border-radius: var(--radius-sm); font-size: 12.5px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-secondary);
  margin-bottom: 12px;
}
.notice.warn { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
.notice.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

/* ---------------- alerts list ---------------- */
.alert-item { display: flex; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--border); align-items: flex-start; }
.alert-item:last-child { border-bottom: 0; }
.alert-item.unread { background: var(--surface-2); }
.alert-icon { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto; font-size: 13px; }
.alert-icon.good { background: var(--good-soft); color: var(--good-text); }
.alert-icon.bad { background: var(--critical-soft); color: var(--critical-text); }
.alert-icon.warn { background: var(--warning-soft); color: var(--warning); }
.alert-icon.info { background: var(--accent-soft); color: var(--accent); }
.alert-body { flex: 1; min-width: 0; }
.alert-time { font-size: 11px; color: var(--text-muted); }

/* ---------------- modal ---------------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 100;
  display: grid; place-items: center; padding: 16px; backdrop-filter: blur(3px);
}
.modal {
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: var(--radius); width: min(520px, 100%); max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow); padding: 18px;
}
.modal-head { display: flex; align-items: center; margin-bottom: 14px; }
.modal-head .spacer { margin-inline-start: auto; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ---------------- toast ---------------- */
.toasts { position: fixed; bottom: 86px; inset-inline: 0; z-index: 200; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
@media (min-width: 860px) { .toasts { bottom: 20px; } }
.toast {
  background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text-primary);
  padding: 10px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow);
  animation: toastIn .2s ease-out;
}
.toast.good { border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.toast.bad { border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------------- progress / countdown ---------------- */
.progress-track { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--series-7)); }

/* ---------------- report ---------------- */
.report-section { margin-bottom: 18px; }
.report-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) { .report-grid { grid-template-columns: repeat(4, 1fr); } }
.verdict {
  padding: 16px; border-radius: var(--radius); text-align: center; margin: 14px 0;
  border: 1px solid var(--border-strong); background: var(--surface-2);
}
.verdict-value { font-size: 22px; font-weight: 800; margin-top: 4px; }

@media print {
  .appbar, .bottomnav, .tabs, .paper-strip, .btn, .toasts { display: none !important; }
  body { background: #fff; color: #000; padding: 0; }
  .card { break-inside: avoid; border-color: #ccc; }
}

/* utility */
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: grid; gap: 10px; }
.sep { height: 1px; background: var(--border); margin: 12px 0; }
.nowrap { white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.hide { display: none !important; }
.scroll-x { overflow-x: auto; }
.center { text-align: center; }
.end { text-align: end; }

  </style>

    <div style="padding:24px;text-align:center;color:#f2f5f9;font-family:system-ui">
      هذه المنصة تحتاج إلى تفعيل JavaScript في المتصفح.

    </div>
  </noscript>

  <script>
/* ===== assets/js/util.js ===== */
/* Asaad Paper Invest — utilities */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});

  const U = {
    /* ---------- DOM ---------- */
    $(sel, ctx) { return (ctx || document).querySelector(sel); },
    $$(sel, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); },
    el(tag, attrs, children) {
      const n = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          const v = attrs[k];
          if (v === null || v === undefined || v === false) return;
          if (k === 'class') n.className = v;
          else if (k === 'html') n.innerHTML = v;
          else if (k === 'text') n.textContent = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
          else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
          else n.setAttribute(k, v);
        });
      }
      (Array.isArray(children) ? children : children ? [children] : []).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      });
      return n;
    },
    esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },

    /* ---------- numbers ---------- */
    num(v, d) {
      const n = Number(v);
      return isFinite(n) ? n : (d === undefined ? 0 : d);
    },
    round(v, p) { const f = Math.pow(10, p || 0); return Math.round(U.num(v) * f) / f; },
    clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, U.num(v))); },

    // Wrap a formatted number in a bidi isolate so signs and currency symbols
    // stay on the correct side inside Arabic (RTL) text.
    iso(s) { return '⁦' + s + '⁩'; },

    money(v, cur) {
      const n = U.num(v);
      const sign = n < 0 ? '-' : '';
      const a = Math.abs(n);
      const s = a.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return U.iso(sign + (cur === 'OMR' ? 'ر.ع ' : '$') + s);
    },
    money0(v) {
      const n = U.num(v);
      return U.iso((n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 0 }));
    },
    pct(v, p) {
      const n = U.num(v);
      return U.iso((n > 0 ? '+' : '') + n.toFixed(p === undefined ? 2 : p) + '%');
    },
    pctPlain(v, p) { return U.iso(U.num(v).toFixed(p === undefined ? 2 : p) + '%'); },
    qty(v) {
      const n = U.num(v);
      return U.iso(n.toLocaleString('en-US', { maximumFractionDigits: 4 }));
    },
    sign(v) { return U.num(v) > 0 ? 'pos' : U.num(v) < 0 ? 'neg' : 'flat'; },

    /* ---------- dates ----------
       AP.asOf lets the replay engine move the whole app to a past date:
       every "today" in the system flows through here. */
    today() { return root.AP.asOf || U.dateKey(new Date()); },
    realToday() { return U.dateKey(new Date()); },
    dateKey(d) {
      const x = d instanceof Date ? d : new Date(d);
      const m = String(x.getMonth() + 1).padStart(2, '0');
      const day = String(x.getDate()).padStart(2, '0');
      return x.getFullYear() + '-' + m + '-' + day;
    },
    parseDate(s) {
      if (s instanceof Date) return s;
      const p = String(s).split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2] || 1));
    },
    addDays(dateStr, n) {
      const d = U.parseDate(dateStr);
      d.setDate(d.getDate() + n);
      return U.dateKey(d);
    },
    daysBetween(a, b) {
      const d1 = U.parseDate(a), d2 = U.parseDate(b);
      return Math.round((d2 - d1) / 86400000);
    },
    isWeekend(dateStr) {
      const d = U.parseDate(dateStr).getDay();
      return d === 0 || d === 6;
    },
    fmtDate(dateStr, lang) {
      if (!dateStr) return '—';
      const d = U.parseDate(dateStr);
      try {
        return d.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB',
          { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) { return dateStr; }
    },
    fmtTime(ts, lang) {
      try {
        return new Date(ts).toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-GB',
          { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (e) { return String(ts); }
    },

    /* ---------- misc ---------- */
    uid(prefix) {
      return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    },
    deepClone(o) { return JSON.parse(JSON.stringify(o)); },
    debounce(fn, ms) {
      let t;
      return function () {
        const a = arguments, c = this;
        clearTimeout(t);
        t = setTimeout(function () { fn.apply(c, a); }, ms || 200);
      };
    },
    // deterministic pseudo-random generator (used only for offline demo series)
    rng(seed) {
      let s = 0;
      const str = String(seed);
      for (let i = 0; i < str.length; i++) s = (s * 31 + str.charCodeAt(i)) >>> 0;
      return function () {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    },
    sum(arr) { return arr.reduce(function (a, b) { return a + U.num(b); }, 0); },
    mean(arr) { return arr.length ? U.sum(arr) / arr.length : 0; },
    stdev(arr) {
      if (arr.length < 2) return 0;
      const m = U.mean(arr);
      return Math.sqrt(U.sum(arr.map(function (x) { return (x - m) * (x - m); })) / (arr.length - 1));
    },
    last(arr, n) { return arr && arr.length ? arr[arr.length - 1 - (n || 0)] : undefined; },
    anchorDownload(filename, text, mime) {
      const blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 100);
    },

    /* Saving a backup has to work in three places: a normal page (anchor),
       a hosted viewer that mediates saves through a capability, and a hosted
       viewer where saving is unavailable (fall back to copyable text). */
    download(filename, text, mime) {
      const host = root.claude;
      if (!host || typeof host.use !== 'function') {
        U.anchorDownload(filename, text, mime);
        return;
      }
      Promise.resolve(host.use('downloads')).then(function (dl) {
        if (!dl) return Promise.reject({ code: 'unavailable' });
        return dl.save({ filename: filename, data: text });
      }).then(function () {
        if (AP.ui) AP.ui.toast(AP.t('export') + ' ✓', 'good');
      }, function (err) {
        if (err && err.code === 'declined') return;
        if (AP.ui && AP.ui.exportFallback) AP.ui.exportFallback(filename, text);
        else U.anchorDownload(filename, text, mime);
      });
    }
  };

  AP.util = U;
})(window);

/* ===== assets/js/store.js ===== */
/* Asaad Paper Invest — persistent state store (localStorage) */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const KEY = 'asaad_paper_invest_v1';
  const CACHE_KEY = 'asaad_paper_invest_cache_v1';

  const DEFAULT_WATCHLIST = [
    { symbol: 'SPUS', name: 'SP Funds S&P 500 Sharia ETF', nameAr: 'صندوق SP Funds المتوافق', type: 'etf', sector: 'Broad Market' },
    { symbol: 'VOO', name: 'Vanguard S&P 500 ETF', nameAr: 'فانغارد S&P 500', type: 'etf', sector: 'Broad Market' },
    { symbol: 'QQQ', name: 'Invesco QQQ Trust', nameAr: 'إنفيسكو ناسداك 100', type: 'etf', sector: 'Technology' },
    { symbol: 'AAPL', name: 'Apple Inc.', nameAr: 'أبل', type: 'stock', sector: 'Technology' },
    { symbol: 'MSFT', name: 'Microsoft Corp.', nameAr: 'مايكروسوفت', type: 'stock', sector: 'Technology' },
    { symbol: 'NVDA', name: 'NVIDIA Corp.', nameAr: 'إنفيديا', type: 'stock', sector: 'Semiconductors' },
    { symbol: 'GOOGL', name: 'Alphabet Inc.', nameAr: 'ألفابت (جوجل)', type: 'stock', sector: 'Communication' },
    { symbol: 'AMZN', name: 'Amazon.com Inc.', nameAr: 'أمازون', type: 'stock', sector: 'Consumer Discretionary' },
    { symbol: 'META', name: 'Meta Platforms Inc.', nameAr: 'ميتا', type: 'stock', sector: 'Communication' },
    { symbol: 'TSLA', name: 'Tesla Inc.', nameAr: 'تسلا', type: 'stock', sector: 'Consumer Discretionary' }
  ];

  function defaultState() {
    const today = U.today();
    return {
      version: 1,
      createdAt: Date.now(),
      settings: {
        lang: 'ar',
        theme: 'dark',
        initialCapital: 10000,
        startDate: today,
        experimentDays: 90,
        fxOmrUsd: 2.6,
        monthlyOmr: 507,
        provider: 'auto',
        proxyUrl: '',
        commission: 0,
        risk: {
          maxSingle: 10,     // % of portfolio for one stock
          maxEtf: 25,        // % of portfolio for a diversified ETF
          minCash: 10,       // % minimum cash buffer
          riskPerTrade: 1    // % of equity risked per trade (entry -> stop)
        },
        benchmarkSymbol: 'VOO',
        marketProxy: 'VOO'
      },
      watchlist: U.deepClone(DEFAULT_WATCHLIST),
      cash: 10000,
      positions: {},           // symbol -> { symbol, qty, avgCost, realized, openedAt, lots:[{qty,price,date}] }
      transactions: [],
      journal: [],
      snapshots: [],           // { date, equity, cash, invested, prices:{}, positions:{}, regime, scores:{} }
      alerts: [],
      news: [],
      manualPrices: {},        // symbol -> { date: close }
      earnings: {},            // symbol -> 'YYYY-MM-DD'
      s507: { lastRun: null, strategies: null, contributions: [] },
      meta: { lastRefresh: null, lastSnapshot: null, dataMode: 'unknown' }
    };
  }

  const Store = {
    state: null,
    cache: { series: {} },
    listeners: [],

    load() {
      let raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          Store.state = Store.migrate(parsed);
        } catch (e) {
          console.warn('State parse failed, starting fresh', e);
          Store.state = defaultState();
        }
      } else {
        Store.state = defaultState();
      }
      try {
        const c = localStorage.getItem(CACHE_KEY);
        if (c) Store.cache = JSON.parse(c);
      } catch (e) { Store.cache = { series: {} }; }
      if (!Store.cache || typeof Store.cache !== 'object') Store.cache = { series: {} };
      if (!Store.cache.series) Store.cache.series = {};
      return Store.state;
    },

    migrate(s) {
      const d = defaultState();
      const out = Object.assign({}, d, s || {});
      out.settings = Object.assign({}, d.settings, s.settings || {});
      out.settings.risk = Object.assign({}, d.settings.risk, (s.settings && s.settings.risk) || {});
      ['watchlist', 'transactions', 'journal', 'snapshots', 'alerts', 'news'].forEach(function (k) {
        if (!Array.isArray(out[k])) out[k] = d[k];
      });
      ['positions', 'manualPrices', 'earnings'].forEach(function (k) {
        if (!out[k] || typeof out[k] !== 'object') out[k] = {};
      });
      out.s507 = Object.assign({}, d.s507, s.s507 || {});
      out.meta = Object.assign({}, d.meta, s.meta || {});
      if (typeof out.cash !== 'number') out.cash = out.settings.initialCapital;
      return out;
    },

    save() {
      // during a replay the state changes on every simulated day; persisting
      // each one would serialise the whole store dozens of times
      if (AP.backtest && AP.backtest.running) { Store.emit(); return; }
      try {
        localStorage.setItem(KEY, JSON.stringify(Store.state));
      } catch (e) {
        console.warn('Save failed (storage full?)', e);
        // try to shed snapshots history to make room
        if (Store.state.snapshots.length > 200) {
          Store.state.snapshots = Store.state.snapshots.slice(-200);
          try { localStorage.setItem(KEY, JSON.stringify(Store.state)); } catch (e2) { /* give up */ }
        }
      }
      Store.emit();
    },

    saveCache: U.debounce(function () {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(Store.cache));
      } catch (e) {
        // Cache is expendable: drop it rather than blocking the app.
        try { localStorage.removeItem(CACHE_KEY); } catch (e2) { /* noop */ }
      }
    }, 600),

    on(fn) { Store.listeners.push(fn); },
    emit() { Store.listeners.forEach(function (f) { try { f(Store.state); } catch (e) { console.error(e); } }); },

    /* ---------- accessors ---------- */
    get s() { return Store.state; },
    settings() { return Store.state.settings; },
    watchlist() { return Store.state.watchlist; },
    symbols() { return Store.state.watchlist.map(function (w) { return w.symbol; }); },
    meta(sym) {
      return Store.state.watchlist.find(function (w) { return w.symbol === sym; }) ||
        { symbol: sym, name: sym, nameAr: sym, type: 'stock', sector: '—' };
    },
    assetName(sym) {
      const m = Store.meta(sym);
      return AP.i18n.lang === 'ar' ? (m.nameAr || m.name || sym) : (m.name || sym);
    },
    isEtf(sym) { return Store.meta(sym).type === 'etf'; },

    addSymbol(sym, info) {
      const s = String(sym || '').trim().toUpperCase();
      if (!s) return { ok: false, err: 'err_invalid' };
      if (Store.symbols().indexOf(s) >= 0) return { ok: false, err: 'symbol_exists' };
      Store.state.watchlist.push(Object.assign({
        symbol: s, name: s, nameAr: s, type: 'stock', sector: '—'
      }, info || {}));
      Store.save();
      return { ok: true };
    },
    removeSymbol(sym) {
      Store.state.watchlist = Store.state.watchlist.filter(function (w) { return w.symbol !== sym; });
      Store.save();
    },

    /* ---------- prices ---------- */
    series(sym) {
      const c = Store.cache.series[sym];
      return c && Array.isArray(c.bars) ? c.bars : null;
    },
    setSeries(sym, bars, source) {
      Store.cache.series[sym] = { bars: bars, source: source, ts: Date.now() };
      Store.saveCache();
    },
    lastPrice(sym) {
      const bars = AP.market ? AP.market.seriesWithManual(sym) : Store.series(sym);
      const barLast = bars && bars.length ? bars[bars.length - 1] : null;
      return barLast ? U.num(barLast.c) : 0;
    },
    prevClose(sym) {
      const bars = AP.market ? AP.market.seriesWithManual(sym) : Store.series(sym);
      if (!bars || bars.length < 2) return Store.lastPrice(sym);
      return U.num(bars[bars.length - 2].c);
    },
    priceOn(sym, dateKey) {
      const bars = AP.market ? AP.market.seriesWithManual(sym) : Store.series(sym);
      if (!bars || !bars.length) return null;
      let best = null;
      for (let i = 0; i < bars.length; i++) {
        if (bars[i].d <= dateKey) best = bars[i]; else break;
      }
      return best ? U.num(best.c) : null;
    },
    /* First close at or after a date — used for signal follow-ups so a target
       landing on a weekend waits for the next real session instead of reusing
       the signal day's own price. */
    priceOnOrAfter(sym, dateKey) {
      const bars = AP.market ? AP.market.seriesWithManual(sym) : Store.series(sym);
      if (!bars || !bars.length) return null;
      for (let i = 0; i < bars.length; i++) {
        if (bars[i].d >= dateKey) return { date: bars[i].d, price: U.num(bars[i].c) };
      }
      return null;
    },

    /* ---------- experiment clock ---------- */
    dayNumber() {
      const st = Store.settings();
      const n = U.daysBetween(st.startDate, U.today()) + 1;
      return U.clamp(n, 1, st.experimentDays);
    },
    dayNumberRaw() {
      return U.daysBetween(Store.settings().startDate, U.today()) + 1;
    },
    daysRemaining() {
      return Math.max(0, Store.settings().experimentDays - Store.dayNumberRaw());
    },
    // day 90 of 90 is the final day, so the experiment counts as complete then
    isComplete() { return Store.dayNumberRaw() >= Store.settings().experimentDays; },

    /* ---------- alerts ---------- */
    pushAlert(type, severity, key, params, symbol) {
      const dedupe = type + '|' + (symbol || '') + '|' + U.today();
      if (Store.state.alerts.some(function (a) { return a.dedupe === dedupe; })) return;
      Store.state.alerts.unshift({
        id: U.uid('al'), ts: Date.now(), date: U.today(),
        type: type, severity: severity, key: key, params: params || {},
        symbol: symbol || null, read: false, dedupe: dedupe
      });
      if (Store.state.alerts.length > 300) Store.state.alerts.length = 300;
    },
    unreadAlerts() {
      return Store.state.alerts.filter(function (a) { return !a.read; }).length;
    },

    /* ---------- snapshots ---------- */
    saveSnapshot(extra) {
      const date = U.today();
      const pf = AP.portfolio.summary();
      const prices = {};
      Store.symbols().forEach(function (s) { prices[s] = Store.lastPrice(s); });
      const snap = Object.assign({
        date: date,
        equity: U.round(pf.equity, 2),
        cash: U.round(pf.cash, 2),
        invested: U.round(pf.invested, 2),
        realized: U.round(pf.realized, 2),
        unrealized: U.round(pf.unrealized, 2),
        prices: prices,
        positions: Object.keys(Store.state.positions).reduce(function (acc, k) {
          const p = Store.state.positions[k];
          acc[k] = { qty: p.qty, avgCost: p.avgCost };
          return acc;
        }, {})
      }, extra || {});
      const idx = Store.state.snapshots.findIndex(function (x) { return x.date === date; });
      if (idx >= 0) Store.state.snapshots[idx] = snap;
      else Store.state.snapshots.push(snap);
      Store.state.snapshots.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      Store.state.meta.lastSnapshot = date;
      Store.save();
      return snap;
    },
    snapshotOn(date) {
      return Store.state.snapshots.find(function (s) { return s.date === date; }) || null;
    },

    /* ---------- data management ---------- */
    exportJSON() {
      return JSON.stringify({ state: Store.state, cache: Store.cache, exportedAt: new Date().toISOString() }, null, 2);
    },
    importJSON(text) {
      const parsed = JSON.parse(text);
      const st = parsed.state || parsed;
      Store.state = Store.migrate(st);
      if (parsed.cache) Store.cache = parsed.cache;
      Store.save();
      Store.saveCache();
      return true;
    },
    resetAll() {
      Store.state = defaultState();
      Store.cache = { series: {} };
      try { localStorage.removeItem(CACHE_KEY); } catch (e) { /* noop */ }
      Store.save();
    },
    resetCapital(amount) {
      const st = Store.settings();
      st.initialCapital = U.num(amount, 10000);
      Store.state.cash = st.initialCapital;
      Store.state.positions = {};
      Store.state.transactions = [];
      Store.state.snapshots = [];
      Store.state.s507 = { lastRun: null, strategies: null, contributions: [] };
      Store.save();
    },
    storageSize() {
      try {
        const a = localStorage.getItem(KEY) || '';
        const b = localStorage.getItem(CACHE_KEY) || '';
        return Math.round((a.length + b.length) / 1024) + ' KB';
      } catch (e) { return '—'; }
    }
  };

  AP.store = Store;
  AP.DEFAULT_WATCHLIST = DEFAULT_WATCHLIST;
})(window);

/* ===== assets/js/indicators.js ===== */
/* Asaad Paper Invest — technical indicators
   Bars are objects: { d:'YYYY-MM-DD', o, h, l, c, v } sorted ascending by date. */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  function closes(bars) { return bars.map(function (b) { return U.num(b.c); }); }

  const IND = {
    sma(values, period) {
      if (!values || values.length < period) return null;
      let s = 0;
      for (let i = values.length - period; i < values.length; i++) s += values[i];
      return s / period;
    },

    smaSeries(values, period) {
      const out = new Array(values.length).fill(null);
      if (values.length < period) return out;
      let s = 0;
      for (let i = 0; i < values.length; i++) {
        s += values[i];
        if (i >= period) s -= values[i - period];
        if (i >= period - 1) out[i] = s / period;
      }
      return out;
    },

    emaSeries(values, period) {
      const out = new Array(values.length).fill(null);
      if (!values.length) return out;
      const k = 2 / (period + 1);
      let prev = null;
      for (let i = 0; i < values.length; i++) {
        if (i === period - 1) {
          let s = 0;
          for (let j = 0; j < period; j++) s += values[j];
          prev = s / period;
          out[i] = prev;
        } else if (i >= period) {
          prev = values[i] * k + prev * (1 - k);
          out[i] = prev;
        }
      }
      return out;
    },

    ema(values, period) {
      const s = IND.emaSeries(values, period);
      return U.last(s) === undefined ? null : U.last(s);
    },

    /* Wilder's RSI */
    rsiSeries(values, period) {
      const n = values.length;
      const out = new Array(n).fill(null);
      if (n <= period) return out;
      let gain = 0, loss = 0;
      for (let i = 1; i <= period; i++) {
        const ch = values[i] - values[i - 1];
        if (ch >= 0) gain += ch; else loss -= ch;
      }
      let ag = gain / period, al = loss / period;
      out[period] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
      for (let i = period + 1; i < n; i++) {
        const ch = values[i] - values[i - 1];
        const g = ch > 0 ? ch : 0;
        const l = ch < 0 ? -ch : 0;
        ag = (ag * (period - 1) + g) / period;
        al = (al * (period - 1) + l) / period;
        out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
      }
      return out;
    },

    rsi(values, period) {
      const s = IND.rsiSeries(values, period || 14);
      return U.last(s);
    },

    macd(values, fast, slow, signal) {
      fast = fast || 12; slow = slow || 26; signal = signal || 9;
      if (values.length < slow + signal) return null;
      const ef = IND.emaSeries(values, fast);
      const es = IND.emaSeries(values, slow);
      const line = values.map(function (_, i) {
        return (ef[i] === null || es[i] === null) ? null : ef[i] - es[i];
      });
      const compact = line.filter(function (x) { return x !== null; });
      const sig = IND.emaSeries(compact, signal);
      const macdV = U.last(compact);
      const sigV = U.last(sig);
      if (macdV === undefined || sigV === undefined || sigV === null) return null;
      const prevMacd = compact[compact.length - 2];
      const prevSig = sig[sig.length - 2];
      return {
        macd: macdV,
        signal: sigV,
        hist: macdV - sigV,
        prevHist: (prevMacd !== undefined && prevSig !== null && prevSig !== undefined) ? prevMacd - prevSig : null,
        line: line,
        sigSeries: sig
      };
    },

    bollinger(values, period, mult) {
      period = period || 20; mult = mult || 2;
      if (values.length < period) return null;
      const slice = values.slice(-period);
      const mid = U.mean(slice);
      const sd = Math.sqrt(U.mean(slice.map(function (x) { return (x - mid) * (x - mid); })));
      const upper = mid + mult * sd;
      const lower = mid - mult * sd;
      const price = U.last(values);
      const width = upper - lower;
      return {
        mid: mid, upper: upper, lower: lower,
        width: width,
        widthPct: mid ? (width / mid) * 100 : 0,
        pctB: width ? (price - lower) / width : 0.5
      };
    },

    atr(bars, period) {
      period = period || 14;
      if (!bars || bars.length < period + 1) return null;
      const trs = [];
      for (let i = 1; i < bars.length; i++) {
        const h = U.num(bars[i].h, bars[i].c);
        const l = U.num(bars[i].l, bars[i].c);
        const pc = U.num(bars[i - 1].c);
        trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
      }
      // Wilder smoothing
      let a = U.mean(trs.slice(0, period));
      for (let i = period; i < trs.length; i++) a = (a * (period - 1) + trs[i]) / period;
      return a;
    },

    /* annualised volatility from daily log returns */
    volatility(values, lookback) {
      lookback = lookback || 60;
      if (values.length < 20) return null;
      const slice = values.slice(-Math.min(lookback, values.length));
      const rets = [];
      for (let i = 1; i < slice.length; i++) {
        if (slice[i - 1] > 0) rets.push(Math.log(slice[i] / slice[i - 1]));
      }
      if (rets.length < 5) return null;
      return U.stdev(rets) * Math.sqrt(252) * 100;
    },

    changePct(values, back) {
      if (!values || values.length < back + 1) return null;
      const a = values[values.length - 1 - back];
      const b = U.last(values);
      if (!a) return null;
      return ((b - a) / a) * 100;
    },

    high52(bars) {
      const slice = bars.slice(-252);
      return slice.reduce(function (m, b) { return Math.max(m, U.num(b.h, b.c)); }, -Infinity);
    },
    low52(bars) {
      const slice = bars.slice(-252);
      return slice.reduce(function (m, b) { return Math.min(m, U.num(b.l, b.c)); }, Infinity);
    },

    /* Swing-based support & resistance from recent pivots */
    supportResistance(bars, lookback) {
      lookback = lookback || 90;
      const slice = bars.slice(-Math.min(lookback, bars.length));
      if (slice.length < 10) return { support: null, resistance: null };
      const price = U.num(U.last(slice).c);
      const pivotsHigh = [], pivotsLow = [];
      const w = 3;
      for (let i = w; i < slice.length - w; i++) {
        const h = U.num(slice[i].h, slice[i].c);
        const l = U.num(slice[i].l, slice[i].c);
        let isH = true, isL = true;
        for (let j = i - w; j <= i + w; j++) {
          if (j === i) continue;
          if (U.num(slice[j].h, slice[j].c) >= h) isH = false;
          if (U.num(slice[j].l, slice[j].c) <= l) isL = false;
        }
        if (isH) pivotsHigh.push(h);
        if (isL) pivotsLow.push(l);
      }
      const below = pivotsLow.filter(function (p) { return p < price * 0.995; });
      const above = pivotsHigh.filter(function (p) { return p > price * 1.005; });
      const support = below.length ? Math.max.apply(null, below)
        : Math.min.apply(null, slice.map(function (b) { return U.num(b.l, b.c); }));
      const resistance = above.length ? Math.min.apply(null, above)
        : Math.max.apply(null, slice.map(function (b) { return U.num(b.h, b.c); }));
      return { support: support, resistance: resistance };
    },

    avgVolume(bars, period) {
      period = period || 20;
      const slice = bars.slice(-period).map(function (b) { return U.num(b.v); });
      return slice.length ? U.mean(slice) : 0;
    },

    /* max drawdown of an equity array -> percentage (positive number) */
    maxDrawdown(values) {
      let peak = -Infinity, mdd = 0;
      for (let i = 0; i < values.length; i++) {
        peak = Math.max(peak, values[i]);
        if (peak > 0) mdd = Math.max(mdd, (peak - values[i]) / peak);
      }
      return mdd * 100;
    },

    drawdownSeries(values) {
      let peak = -Infinity;
      return values.map(function (v) {
        peak = Math.max(peak, v);
        return peak > 0 ? ((v - peak) / peak) * 100 : 0;
      });
    },

    sharpe(equity, riskFreeAnnual) {
      if (!equity || equity.length < 5) return null;
      const rets = [];
      for (let i = 1; i < equity.length; i++) {
        if (equity[i - 1] > 0) rets.push(equity[i] / equity[i - 1] - 1);
      }
      if (rets.length < 5) return null;
      const sd = U.stdev(rets);
      if (!sd) return null;
      const rf = (riskFreeAnnual === undefined ? 0.04 : riskFreeAnnual) / 252;
      return ((U.mean(rets) - rf) / sd) * Math.sqrt(252);
    },

    /* Full snapshot of indicators for one symbol */
    analyze(bars) {
      if (!bars || bars.length < 3) return null;
      const c = closes(bars);
      const price = U.last(c);
      const sma20 = IND.sma(c, 20), sma50 = IND.sma(c, 50), sma200 = IND.sma(c, 200);
      const ema20 = c.length >= 20 ? IND.ema(c, 20) : null;
      const rsi = c.length > 15 ? IND.rsi(c, 14) : null;
      const macd = IND.macd(c);
      const bb = IND.bollinger(c, 20, 2);
      const atr = IND.atr(bars, 14);
      const sr = IND.supportResistance(bars);
      const hi52 = bars.length >= 20 ? IND.high52(bars) : null;
      const lo52 = bars.length >= 20 ? IND.low52(bars) : null;
      const prev = c.length > 1 ? c[c.length - 2] : price;

      return {
        bars: bars.length,
        date: U.last(bars).d,
        price: price,
        prevClose: prev,
        chg1d: prev ? ((price - prev) / prev) * 100 : 0,
        chg5d: IND.changePct(c, 5),
        chg1m: IND.changePct(c, 21),
        chg3m: IND.changePct(c, 63),
        chg6m: IND.changePct(c, 126),
        volume: U.num(U.last(bars).v),
        avgVolume: IND.avgVolume(bars, 20),
        sma20: sma20, sma50: sma50, sma200: sma200, ema20: ema20,
        sma20Slope: (function () {
          const s = IND.smaSeries(c, 20);
          const a = s[s.length - 6], b = U.last(s);
          return (a && b) ? ((b - a) / a) * 100 : null;
        })(),
        sma200Slope: (function () {
          const s = IND.smaSeries(c, 200);
          const a = s[s.length - 21], b = U.last(s);
          return (a && b) ? ((b - a) / a) * 100 : null;
        })(),
        rsi: rsi,
        macd: macd,
        bb: bb,
        atr: atr,
        atrPct: (atr && price) ? (atr / price) * 100 : null,
        volatility: IND.volatility(c),
        support: sr.support,
        resistance: sr.resistance,
        high52: isFinite(hi52) ? hi52 : null,
        low52: isFinite(lo52) ? lo52 : null,
        fromHigh: (hi52 && isFinite(hi52) && hi52 > 0) ? ((price - hi52) / hi52) * 100 : null,
        fromLow: (lo52 && isFinite(lo52) && lo52 > 0) ? ((price - lo52) / lo52) * 100 : null,
        extAboveSma200: sma200 ? ((price - sma200) / sma200) * 100 : null,
        closes: c
      };
    }
  };

  AP.ind = IND;
})(window);

/* ===== assets/js/market.js ===== */
/* Asaad Paper Invest — market data layer.
   Tries real providers first; falls back to cache, then to a clearly-labelled
   internal simulator so the platform stays usable with no network. */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  // Reference levels used only to seed the offline simulator so that the
  // demo series stay in a plausible range per symbol.
  const SEEDS = {
    SPUS: { base: 47, drift: 0.00035, vol: 0.0092 },
    VOO: { base: 560, drift: 0.00036, vol: 0.0090 },
    QQQ: { base: 505, drift: 0.00045, vol: 0.0118 },
    AAPL: { base: 228, drift: 0.00038, vol: 0.0135 },
    MSFT: { base: 430, drift: 0.00040, vol: 0.0130 },
    NVDA: { base: 128, drift: 0.00075, vol: 0.0260 },
    GOOGL: { base: 175, drift: 0.00040, vol: 0.0150 },
    AMZN: { base: 185, drift: 0.00042, vol: 0.0160 },
    META: { base: 520, drift: 0.00048, vol: 0.0175 },
    TSLA: { base: 235, drift: 0.00030, vol: 0.0300 },
    SPY: { base: 610, drift: 0.00036, vol: 0.0090 }
  };

  function proxied(url) {
    const p = (AP.store.settings().proxyUrl || '').trim();
    if (!p) return url;
    if (p.indexOf('{url}') >= 0) return p.replace('{url}', encodeURIComponent(url));
    return p + encodeURIComponent(url);
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      const t = setTimeout(function () { reject(new Error('timeout')); }, ms || 12000);
      promise.then(function (v) { clearTimeout(t); resolve(v); },
        function (e) { clearTimeout(t); reject(e); });
    });
  }

  /* ---------------- providers ---------------- */

  function parseStooqCsv(text) {
    const lines = String(text).trim().split(/\r?\n/);
    if (lines.length < 3) throw new Error('bad csv');
    const head = lines[0].toLowerCase();
    if (head.indexOf('date') !== 0) throw new Error('bad csv header');
    const out = [];
    for (let i = 1; i < lines.length; i++) {
      const p = lines[i].split(',');
      if (p.length < 5) continue;
      const c = Number(p[4]);
      if (!isFinite(c) || c <= 0) continue;
      out.push({
        d: p[0],
        o: Number(p[1]) || c, h: Number(p[2]) || c, l: Number(p[3]) || c,
        c: c, v: Number(p[5]) || 0
      });
    }
    if (out.length < 30) throw new Error('too few rows');
    return out;
  }

  const providers = {
    stooq(symbol) {
      const url = 'https://stooq.com/q/d/l/?s=' + encodeURIComponent(symbol.toLowerCase()) + '.us&i=d';
      return withTimeout(fetch(proxied(url), { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('http ' + r.status);
          return r.text();
        })
        .then(function (t) { return { bars: parseStooqCsv(t), source: 'stooq' }; }));
    },

    yahoo(symbol) {
      const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' +
        encodeURIComponent(symbol) + '?range=2y&interval=1d&includePrePost=false';
      return withTimeout(fetch(proxied(url), { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('http ' + r.status);
          return r.json();
        })
        .then(function (j) {
          const res = j && j.chart && j.chart.result && j.chart.result[0];
          if (!res || !res.timestamp) throw new Error('no chart data');
          const q = res.indicators.quote[0];
          const adj = res.indicators.adjclose && res.indicators.adjclose[0]
            ? res.indicators.adjclose[0].adjclose : null;
          const bars = [];
          for (let i = 0; i < res.timestamp.length; i++) {
            const c = adj && isFinite(adj[i]) ? adj[i] : q.close[i];
            if (!isFinite(c) || c === null) continue;
            bars.push({
              d: U.dateKey(new Date(res.timestamp[i] * 1000)),
              o: isFinite(q.open[i]) ? q.open[i] : c,
              h: isFinite(q.high[i]) ? q.high[i] : c,
              l: isFinite(q.low[i]) ? q.low[i] : c,
              c: c,
              v: isFinite(q.volume[i]) ? q.volume[i] : 0
            });
          }
          if (bars.length < 30) throw new Error('too few rows');
          return { bars: bars, source: 'yahoo' };
        }));
    },

    /* Deterministic offline series — clearly labelled as simulated in the UI. */
    demo(symbol) {
      const seed = SEEDS[symbol] || { base: 60 + (symbol.charCodeAt(0) % 90), drift: 0.0003, vol: 0.016 };
      const rand = U.rng('asaad|' + symbol);
      const days = 420;
      const bars = [];
      // walk forward to today so the last simulated bar is always current
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const cursor = new Date(today);
      cursor.setDate(cursor.getDate() - Math.ceil(days * 1.45));
      let price = seed.base * (0.72 + rand() * 0.12);
      let regime = 0;
      while (cursor <= today) {
        const dow = cursor.getDay();
        if (dow !== 0 && dow !== 6) {
          // slowly switching drift regimes -> produces trends, pullbacks, ranges
          if (rand() < 0.012) regime = (rand() - 0.45) * 2.2;
          const shock = (rand() + rand() + rand() + rand() - 2) * seed.vol;
          const ret = seed.drift * (1 + regime) + shock;
          const open = price;
          price = Math.max(1, price * (1 + ret));
          const hi = Math.max(open, price) * (1 + rand() * seed.vol * 0.6);
          const lo = Math.min(open, price) * (1 - rand() * seed.vol * 0.6);
          bars.push({
            d: U.dateKey(cursor),
            o: U.round(open, 2), h: U.round(hi, 2), l: U.round(lo, 2), c: U.round(price, 2),
            v: Math.round((3e6 + rand() * 4e7) * (1 + Math.abs(ret) * 12))
          });
        }
        cursor.setDate(cursor.getDate() + 1);
      }
      return Promise.resolve({ bars: bars.slice(-days), source: 'demo' });
    }
  };

  function chainFor(mode) {
    if (mode === 'demo') return ['demo'];
    if (mode === 'stooq') return ['stooq', 'demo'];
    if (mode === 'yahoo') return ['yahoo', 'demo'];
    if (mode === 'manual') return [];
    return ['stooq', 'yahoo', 'demo'];
  }

  const Market = {
    lastMode: 'unknown',
    failures: [],

    isFresh(symbol) {
      const c = AP.store.cache.series[symbol];
      if (!c || !c.bars || !c.bars.length) return false;
      if (c.source === 'demo') return false;
      const ageH = (Date.now() - U.num(c.ts)) / 3600000;
      if (ageH > 6) return false;
      const lastBar = c.bars[c.bars.length - 1].d;
      // fresh if last bar is today or the most recent weekday
      let ref = new Date();
      let guard = 0;
      while ((ref.getDay() === 0 || ref.getDay() === 6) && guard++ < 5) ref.setDate(ref.getDate() - 1);
      return lastBar >= U.dateKey(ref) || ageH < 2;
    },

    fetchSymbol(symbol) {
      const mode = AP.store.settings().provider || 'auto';
      const chain = chainFor(mode);
      let i = 0;
      function next() {
        if (i >= chain.length) return Promise.reject(new Error('no provider'));
        const name = chain[i++];
        return providers[name](symbol).catch(function (err) {
          Market.failures.push(symbol + ':' + name + ':' + (err && err.message));
          return next();
        });
      }
      return next();
    },

    /* Refresh every watchlist symbol + the market proxy. */
    refreshAll(onProgress) {
      const syms = AP.store.symbols().slice();
      const proxySym = AP.store.settings().marketProxy || 'VOO';
      if (syms.indexOf(proxySym) < 0) syms.push(proxySym);
      Market.failures = [];
      let done = 0;
      let live = 0, demo = 0, cached = 0;

      const jobs = syms.map(function (sym) {
        if (Market.isFresh(sym)) {
          cached++;
          done++;
          if (onProgress) onProgress(done, syms.length, sym);
          return Promise.resolve();
        }
        return Market.fetchSymbol(sym).then(function (res) {
          AP.store.setSeries(sym, res.bars, res.source);
          if (res.source === 'demo') demo++; else live++;
        }).catch(function () {
          // keep whatever is cached
          if (AP.store.series(sym)) cached++;
        }).then(function () {
          done++;
          if (onProgress) onProgress(done, syms.length, sym);
        });
      });

      return Promise.all(jobs).then(function () {
        Market.lastMode = live > 0 ? (demo > 0 ? 'mixed' : 'live') : (demo > 0 ? 'demo' : 'cached');
        AP.store.s.meta.lastRefresh = Date.now();
        AP.store.s.meta.dataMode = Market.lastMode;
        AP.store.save();
        return { live: live, demo: demo, cached: cached, mode: Market.lastMode };
      });
    },

    sourceOf(symbol) {
      const c = AP.store.cache.series[symbol];
      return c ? c.source : null;
    },

    /* Series with manual price overrides merged in.
       While replaying (AP.asOf) the series is truncated to that date so no
       indicator can see the future. */
    seriesWithManual(symbol) {
      const asOf = AP.asOf;
      let bars = (AP.store.series(symbol) || []).slice();
      if (asOf) bars = bars.filter(function (b) { return b.d <= asOf; });
      const manual = AP.store.s.manualPrices[symbol];
      if (!manual) return bars;
      Object.keys(manual).sort().forEach(function (d) {
        const c = U.num(manual[d]);
        if (!c) return;
        const idx = bars.findIndex(function (b) { return b.d === d; });
        const bar = { d: d, o: c, h: c, l: c, c: c, v: 0, manual: true };
        if (idx >= 0) bars[idx] = Object.assign({}, bars[idx], { c: c, manual: true });
        else bars.push(bar);
      });
      bars.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
      return bars;
    },

    setManualPrice(symbol, date, price) {
      const mp = AP.store.s.manualPrices;
      if (!mp[symbol]) mp[symbol] = {};
      mp[symbol][date || U.today()] = U.num(price);
      AP.store.save();
    },

    clearManual(symbol) {
      delete AP.store.s.manualPrices[symbol];
      AP.store.save();
    }
  };

  AP.market = Market;
  AP.marketSeeds = SEEDS;
})(window);

/* ===== assets/js/news.js ===== */
/* Asaad Paper Invest — Market Intelligence.
   Headlines alone are never trusted: each item is classified and paired with a
   short, probabilistic impact note. */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const LEX = [
    { re: /(beats?|beat expectations|tops estimates|record (revenue|profit)|raises guidance|upgrade[sd]?|outperform|strong demand|buyback|dividend (hike|increase)|approval|wins? contract|expands?)/i, w: 1, cat: 'positive_fundamental' },
    { re: /(misses?|missed estimates|cuts? guidance|downgrade[sd]?|underperform|weak demand|slowdown|layoffs?|recall|investigation|lawsuit|probe|fine[ds]?|antitrust|delays?|halts?|resigns?)/i, w: -1, cat: 'negative_fundamental' },
    { re: /(surges?|soars?|jumps?|rallies|rally|climbs?|gains?)/i, w: 0.45, cat: 'price_action' },
    { re: /(plunges?|tumbles?|slumps?|sinks?|drops?|falls?|slides?)/i, w: -0.45, cat: 'price_action' },
    { re: /(inflation cools?|rate cut|dovish|soft landing|stimulus)/i, w: 0.5, cat: 'macro' },
    { re: /(inflation (rises?|hot)|rate hike|hawkish|recession|tariffs?|shutdown|conflict|war)/i, w: -0.5, cat: 'macro' },
    { re: /(launch(es|ed)?|unveils?|new (chip|model|product)|partnership|ai deal|expansion)/i, w: 0.4, cat: 'product' },
    { re: /(earnings|results|quarterly report|guidance)/i, w: 0, cat: 'earnings' }
  ];

  const IMPACT = {
    ar: {
      positive_fundamental: 'خبر يتعلق بأساسيات الشركة قد يدعم التقييم على المدى المتوسط. الاحتمالية إيجابية لكن التأثير قد يكون مُسعَّرًا مسبقًا.',
      negative_fundamental: 'خبر قد يضغط على الأرباح أو التقييم. يُفضّل رفع مستوى الحذر وعدم زيادة المركز حتى تتضح الصورة.',
      price_action: 'حركة سعرية حادة دون تغيّر جوهري مؤكد في الأساسيات — التقلب أعلى من المعتاد ولا يوجد تأكيد كافٍ للاتجاه.',
      macro: 'عامل اقتصادي عام يؤثر على السوق ككل وليس على هذا الأصل وحده. قد ينعكس على شهية المخاطرة.',
      product: 'تطور تشغيلي قد يدعم النمو مستقبلًا. الأثر الفعلي يحتاج وقتًا للظهور في النتائج المالية.',
      earnings: 'حدث مرتبط بنتائج الأرباح — التقلب عادةً يرتفع حول هذه الفترة، ويفضّل تقليل حجم المخاطرة قبلها.',
      neutral: 'خبر معلوماتي دون أثر جوهري واضح على قرار الاستثمار في الوقت الحالي.'
    },
    en: {
      positive_fundamental: 'A fundamentals-related item that may support valuation over the medium term. Probability leans positive, though the impact may already be priced in.',
      negative_fundamental: 'An item that could pressure earnings or valuation. Higher caution is warranted; adding to the position is not advisable until this clears.',
      price_action: 'A sharp price move without confirmed fundamental change — volatility is above normal and there is no sufficient confirmation of direction.',
      macro: 'A macro factor affecting the whole market rather than this asset alone. It may shift overall risk appetite.',
      product: 'An operational development that may support future growth. The real effect needs time to appear in financial results.',
      earnings: 'An earnings-related event — volatility usually rises around these dates, so reducing risk size beforehand is reasonable.',
      neutral: 'Informational item with no clear material effect on the investment decision right now.'
    }
  };

  function classify(text) {
    let score = 0, cat = 'neutral', best = 0;
    LEX.forEach(function (l) {
      if (l.re.test(text)) {
        score += l.w;
        if (Math.abs(l.w) >= Math.abs(best)) { best = l.w; cat = l.cat; }
        else if (best === 0 && l.cat === 'earnings') cat = 'earnings';
      }
    });
    score = U.clamp(score, -1, 1);
    const sentiment = score > 0.25 ? 'positive' : score < -0.25 ? 'negative' : 'neutral';
    if (sentiment === 'neutral' && cat === 'price_action') cat = 'neutral';
    return { score: score, sentiment: sentiment, cat: cat };
  }

  const News = {
    all() {
      return AP.store.s.news.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    },

    forSymbol(sym) {
      return News.all().filter(function (n) { return n.symbol === sym; });
    },

    add(item) {
      const text = (item.title || '') + ' ' + (item.summary || '');
      const c = item.sentiment ? { sentiment: item.sentiment, score: item.sentiment === 'positive' ? 0.6 : item.sentiment === 'negative' ? -0.6 : 0, cat: 'neutral' } : classify(text);
      const n = {
        id: U.uid('nw'),
        date: item.date || U.today(),
        symbol: (item.symbol || 'MARKET').toUpperCase(),
        title: item.title || '',
        summary: item.summary || IMPACT[AP.i18n.lang][c.cat] || IMPACT.ar.neutral,
        impactKey: c.cat,
        sentiment: c.sentiment,
        score: c.score,
        source: item.source || 'manual',
        url: item.url || null,
        manual: item.manual !== false
      };
      if (AP.store.s.news.some(function (x) { return x.title === n.title && x.symbol === n.symbol && x.date === n.date; })) {
        return null;
      }
      AP.store.s.news.unshift(n);
      if (AP.store.s.news.length > 400) AP.store.s.news.length = 400;
      AP.store.save();
      return n;
    },

    remove(id) {
      AP.store.s.news = AP.store.s.news.filter(function (n) { return n.id !== id; });
      AP.store.save();
    },

    impactText(item) {
      const table = IMPACT[AP.i18n.lang] || IMPACT.ar;
      if (item.manual && item.summary && item.summary !== table[item.impactKey]) return item.summary;
      return table[item.impactKey] || table.neutral;
    },

    /* Recency-weighted sentiment for the signal engine (-1..1). */
    sentimentFor(sym) {
      const today = U.today();
      const items = AP.store.s.news.filter(function (n) {
        return (n.symbol === sym || n.symbol === 'MARKET') && U.daysBetween(n.date, today) <= 14;
      });
      if (!items.length) return { score: 0, count: 0 };
      let num = 0, den = 0;
      items.forEach(function (n) {
        const age = Math.max(0, U.daysBetween(n.date, today));
        const w = (n.symbol === sym ? 1 : 0.4) * Math.exp(-age / 7);
        num += U.num(n.score) * w;
        den += w;
      });
      return { score: den ? U.clamp(num / den, -1, 1) : 0, count: items.length };
    },

    /* Best-effort fetch of headlines; silently degrades when blocked. */
    fetchFor(symbols) {
      const proxy = (AP.store.settings().proxyUrl || '').trim();
      if (!proxy) return Promise.resolve({ fetched: 0, blocked: true });
      const list = (symbols || AP.store.symbols()).slice(0, 12);
      let fetched = 0;
      const jobs = list.map(function (sym) {
        const url = 'https://feeds.finance.yahoo.com/rss/2.0/headline?s=' + encodeURIComponent(sym) + '&region=US&lang=en-US';
        const full = proxy.indexOf('{url}') >= 0 ? proxy.replace('{url}', encodeURIComponent(url)) : proxy + encodeURIComponent(url);
        return fetch(full, { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error('http ' + r.status)); })
          .then(function (xml) {
            const doc = new DOMParser().parseFromString(xml, 'text/xml');
            const items = Array.prototype.slice.call(doc.querySelectorAll('item')).slice(0, 5);
            items.forEach(function (it) {
              const title = (it.querySelector('title') || {}).textContent || '';
              const pub = (it.querySelector('pubDate') || {}).textContent || '';
              const link = (it.querySelector('link') || {}).textContent || '';
              if (!title) return;
              const date = pub ? U.dateKey(new Date(pub)) : U.today();
              const added = News.add({
                symbol: sym, title: title, date: date, source: 'Yahoo Finance',
                url: link, manual: false, summary: ''
              });
              if (added) fetched++;
            });
          })
          .catch(function () { /* blocked or offline — stay silent */ });
      });
      return Promise.all(jobs).then(function () { return { fetched: fetched, blocked: false }; });
    },

    classify: classify
  };

  AP.news = News;
})(window);

/* Asaad Paper Invest — paper portfolio engine (FIFO lots, no leverage, no shorts) */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const Portfolio = {
    /* ---------- valuation ---------- */
    summary() {
      const st = AP.store.s;
      const settings = st.settings;
      const out = {
        cash: U.num(st.cash),
        positions: {},
        invested: 0,
        cost: 0,
        unrealized: 0,
        dayPl: 0,
        realized: 0
      };
      Object.keys(st.positions).forEach(function (sym) {
        const p = st.positions[sym];
        if (!p || p.qty <= 0) return;
        const price = AP.store.lastPrice(sym) || p.avgCost;
        const prev = AP.store.prevClose(sym) || price;
        const value = p.qty * price;
        const cost = p.qty * p.avgCost;
        out.positions[sym] = {
          symbol: sym,
          qty: p.qty,
          avgCost: p.avgCost,
          price: price,
          prevClose: prev,
          value: value,
          cost: cost,
          pl: value - cost,
          plPct: cost ? ((value - cost) / cost) * 100 : 0,
          dayPl: (price - prev) * p.qty,
          dayPlPct: prev ? ((price - prev) / prev) * 100 : 0,
          openedAt: p.openedAt,
          isEtf: AP.store.isEtf(sym)
        };
        out.invested += value;
        out.cost += cost;
        out.unrealized += value - cost;
        out.dayPl += (price - prev) * p.qty;
      });
      out.realized = st.transactions.reduce(function (a, t) { return a + U.num(t.realized); }, 0);
      out.equity = out.cash + out.invested;
      const base = U.num(settings.initialCapital, 10000);
      out.totalPl = out.equity - base;
      out.totalPlPct = base ? (out.totalPl / base) * 100 : 0;
      out.cashWeight = out.equity ? (out.cash / out.equity) * 100 : 100;
      Object.keys(out.positions).forEach(function (s) {
        out.positions[s].weight = out.equity ? (out.positions[s].value / out.equity) * 100 : 0;
      });
      // yesterday's equity for a day P/L percentage
      const prevEquity = out.equity - out.dayPl;
      out.dayPlPct = prevEquity ? (out.dayPl / prevEquity) * 100 : 0;
      return out;
    },

    positionOf(sym) {
      const p = AP.store.s.positions[sym];
      return p && p.qty > 0 ? p : null;
    },

    /* ---------- risk checks ---------- */
    checkRisk(sym, qty, price) {
      const st = AP.store.settings();
      const pf = Portfolio.summary();
      const warnings = [];
      const equity = pf.equity || st.initialCapital;
      const held = pf.positions[sym] ? pf.positions[sym].value : 0;
      const after = held + qty * price;
      const pctAfter = equity ? (after / equity) * 100 : 0;
      const isEtf = AP.store.isEtf(sym);
      const cap = isEtf ? st.risk.maxEtf : st.risk.maxSingle;
      if (pctAfter > cap + 0.01) {
        warnings.push({ key: isEtf ? 'warn_cap_etf' : 'warn_cap_single', params: { a: cap } });
      }
      const cashAfter = pf.cash - qty * price;
      if (equity && (cashAfter / equity) * 100 < st.risk.minCash - 0.01) {
        warnings.push({ key: 'warn_cash_buffer', params: { a: st.risk.minCash } });
      }
      return { warnings: warnings, weightAfter: pctAfter, cap: cap };
    },

    /* ---------- trading ---------- */
    buy(sym, qty, price, opts) {
      opts = opts || {};
      qty = U.num(qty); price = U.num(price);
      const st = AP.store.s;
      if (!sym || qty <= 0 || price <= 0) return { ok: false, err: 'err_invalid' };
      const commission = U.num(st.settings.commission);
      const cost = qty * price + commission;
      if (cost > st.cash + 1e-9) return { ok: false, err: 'err_insufficient_cash' };

      const p = st.positions[sym] || {
        symbol: sym, qty: 0, avgCost: 0, realized: 0,
        openedAt: opts.date || U.today(), lots: []
      };
      const newQty = p.qty + qty;
      p.avgCost = (p.qty * p.avgCost + qty * price) / newQty;
      p.qty = newQty;
      p.lots.push({ qty: qty, price: price, date: opts.date || U.today() });
      st.positions[sym] = p;
      st.cash -= cost;

      st.transactions.unshift({
        id: U.uid('tx'), date: opts.date || U.today(), ts: Date.now(),
        type: 'BUY', symbol: sym, qty: qty, price: price,
        amount: qty * price, fees: commission, realized: 0,
        cashAfter: st.cash, note: opts.note || '',
        score: opts.score === undefined ? null : opts.score,
        decision: opts.decision || null,
        plan: opts.plan || null
      });
      AP.store.save();
      return { ok: true };
    },

    sell(sym, qty, price, opts) {
      opts = opts || {};
      qty = U.num(qty); price = U.num(price);
      const st = AP.store.s;
      const p = st.positions[sym];
      if (!p || p.qty <= 0) return { ok: false, err: 'err_insufficient_shares' };
      if (qty <= 0 || price <= 0) return { ok: false, err: 'err_invalid' };
      if (qty > p.qty + 1e-9) return { ok: false, err: 'err_insufficient_shares' };

      // FIFO realisation
      let remaining = qty, realized = 0;
      const consumed = [];
      while (remaining > 1e-9 && p.lots.length) {
        const lot = p.lots[0];
        const take = Math.min(lot.qty, remaining);
        realized += take * (price - lot.price);
        consumed.push({ qty: take, price: lot.price, date: lot.date });
        lot.qty -= take;
        remaining -= take;
        if (lot.qty <= 1e-9) p.lots.shift();
      }
      const commission = U.num(st.settings.commission);
      realized -= commission;
      p.qty = U.round(p.qty - qty, 8);
      p.realized = U.num(p.realized) + realized;
      if (p.qty <= 1e-8) {
        p.qty = 0;
        p.lots = [];
      }
      st.cash += qty * price - commission;
      if (p.qty === 0) delete st.positions[sym];
      else st.positions[sym] = p;

      st.transactions.unshift({
        id: U.uid('tx'), date: opts.date || U.today(), ts: Date.now(),
        type: 'SELL', symbol: sym, qty: qty, price: price,
        amount: qty * price, fees: commission, realized: realized,
        cashAfter: st.cash, note: opts.note || '',
        score: opts.score === undefined ? null : opts.score,
        decision: opts.decision || null,
        lots: consumed
      });
      AP.store.save();
      return { ok: true, realized: realized };
    },

    /* ---------- closed trades (FIFO matched) ---------- */
    closedTrades() {
      // Newest transactions sit at index 0, so a same-millisecond tie is broken
      // by array position (higher index = earlier) rather than left unordered.
      const txs = AP.store.s.transactions
        .map(function (t, i) { return { t: t, i: i }; })
        .sort(function (a, b) {
          if (a.t.date !== b.t.date) return a.t.date < b.t.date ? -1 : 1;
          const dt = U.num(a.t.ts) - U.num(b.t.ts);
          if (dt) return dt;
          return b.i - a.i;
        })
        .map(function (x) { return x.t; });
      const open = {};      // sym -> [{qty,price,date,score,decision}]
      const closed = [];
      txs.forEach(function (t) {
        if (t.type === 'BUY') {
          if (!open[t.symbol]) open[t.symbol] = [];
          open[t.symbol].push({ qty: t.qty, price: t.price, date: t.date, score: t.score, decision: t.decision });
        } else if (t.type === 'SELL') {
          let remaining = t.qty;
          const lots = open[t.symbol] || [];
          while (remaining > 1e-9 && lots.length) {
            const lot = lots[0];
            const take = Math.min(lot.qty, remaining);
            const pl = take * (t.price - lot.price);
            closed.push({
              symbol: t.symbol,
              qty: take,
              entryDate: lot.date,
              exitDate: t.date,
              entryPrice: lot.price,
              exitPrice: t.price,
              pl: pl,
              plPct: lot.price ? ((t.price - lot.price) / lot.price) * 100 : 0,
              holdDays: Math.max(0, U.daysBetween(lot.date, t.date)),
              score: lot.score,
              decision: lot.decision,
              exitDecision: t.decision
            });
            lot.qty -= take;
            remaining -= take;
            if (lot.qty <= 1e-9) lots.shift();
          }
        }
      });
      return closed;
    },

    /* ---------- equity history (from snapshots, plus today) ---------- */
    equitySeries() {
      const snaps = AP.store.s.snapshots.slice();
      const pf = Portfolio.summary();
      const today = U.today();
      const rows = snaps.map(function (s) { return { d: s.date, v: U.num(s.equity) }; });
      if (!rows.length || rows[rows.length - 1].d !== today) rows.push({ d: today, v: pf.equity });
      else rows[rows.length - 1].v = pf.equity;
      const start = AP.store.settings().startDate;
      if (rows.length === 1 && rows[0].d !== start) {
        rows.unshift({ d: start, v: AP.store.settings().initialCapital });
      }
      return rows;
    },

    /* Partial sells can leave a sliver worth a few cents; round those up to a
       full exit so the portfolio does not fill with dust positions. */
    dustAdjustedQty(sym, qty, price) {
      const pos = Portfolio.positionOf(sym);
      if (!pos) return qty;
      const capped = Math.min(U.num(qty), pos.qty);
      const remaining = pos.qty - capped;
      if (remaining > 0 && remaining * U.num(price) < 1) return pos.qty;
      return capped;
    },

    /* Suggested quantity honouring caps and the cash buffer. */
    maxAffordable(sym, price) {
      const st = AP.store.settings();
      const pf = Portfolio.summary();
      const cap = AP.store.isEtf(sym) ? st.risk.maxEtf : st.risk.maxSingle;
      const equity = pf.equity || st.initialCapital;
      const held = pf.positions[sym] ? pf.positions[sym].value : 0;
      const byCap = Math.max(0, equity * (cap / 100) - held);
      const byCash = Math.max(0, pf.cash - equity * (st.risk.minCash / 100));
      const dollars = Math.min(byCap, byCash);
      return {
        dollars: dollars,
        shares: price > 0 ? Math.floor((dollars / price) * 10000) / 10000 : 0,
        hardMaxShares: price > 0 ? Math.floor((pf.cash / price) * 10000) / 10000 : 0
      };
    }
  };

  AP.portfolio = Portfolio;
})(window);
