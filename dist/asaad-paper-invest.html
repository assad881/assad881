  <script>
/* ===== assets/js/ui.js ===== */
/* Asaad Paper Invest — application shell & shared UI pieces */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;
  const t = function (k, p) { return AP.t(k, p); };

  const ROUTES = [
    { id: 'today', key: 'nav_today', icon: '◎', primary: true },
    { id: 'portfolio', key: 'nav_portfolio', icon: '▦', primary: true },
    { id: 'opportunities', key: 'nav_opportunities', icon: '↗', primary: true },
    { id: 'analytics', key: 'nav_analytics', icon: '◫', primary: true },
    { id: 'journal', key: 'nav_journal', icon: '☰' },
    { id: 's507', key: 'nav_507', icon: '⬢' },
    { id: 'news', key: 'nav_news', icon: '⚑' },
    { id: 'alerts', key: 'nav_alerts', icon: '◔' },
    { id: 'report', key: 'nav_report', icon: '★' },
    { id: 'settings', key: 'nav_settings', icon: '⚙', primary: true }
  ];

  const UI = {
    route: 'today',
    busy: false,

    /* ---------- toasts ---------- */
    toast(msg, kind) {
      let host = U.$('.toasts');
      if (!host) {
        host = U.el('div', { class: 'toasts' });
        document.body.appendChild(host);
      }
      const el = U.el('div', { class: 'toast ' + (kind || ''), text: msg });
      host.appendChild(el);
      setTimeout(function () {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 250);
      }, 2600);
    },

    /* ---------- modal ---------- */
    modal(opts) {
      const backdrop = U.el('div', { class: 'modal-backdrop' });
      const box = U.el('div', { class: 'modal' });
      const head = U.el('div', { class: 'modal-head' }, [
        U.el('div', { class: 'card-title', text: opts.title || '' }),
        U.el('div', { class: 'spacer' }),
        U.el('button', { class: 'icon-btn', text: '✕', onclick: close, 'aria-label': t('close') })
      ]);
      box.appendChild(head);
      const body = U.el('div', {});
      if (typeof opts.body === 'string') body.innerHTML = opts.body;
      else if (opts.body) body.appendChild(opts.body);
      box.appendChild(body);

      if (opts.actions !== false) {
        const actions = U.el('div', { class: 'modal-actions' });
        actions.appendChild(U.el('button', { class: 'btn ghost', text: opts.cancelText || t('cancel'), onclick: close }));
        if (opts.onConfirm) {
          actions.appendChild(U.el('button', {
            class: 'btn primary', text: opts.confirmText || t('confirm'),
            onclick: function () {
              const r = opts.onConfirm(body);
              if (r !== false) close();
            }
          }));
        }
        box.appendChild(actions);
      }
      backdrop.appendChild(box);
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
      document.body.appendChild(backdrop);
      function close() { backdrop.remove(); if (opts.onClose) opts.onClose(); }
      return { close: close, body: body };
    },

    /* Last-resort backup path when the host blocks file saves: show the JSON
       so it can be copied out and pasted back in through Import. */
    exportFallback(filename, text) {
      const area = U.el('textarea', { rows: '10', readonly: 'readonly' });
      area.value = text;
      const body = U.el('div', {}, [
        U.el('div', { class: 'notice warn', text: t('export_copy_hint') }),
        area,
        U.el('div', { class: 'row', style: { marginTop: '10px' } }, [
          U.el('button', {
            class: 'btn primary', text: t('export_copy'),
            onclick: function () {
              area.select();
              const done = function () { UI.toast(t('export_copied'), 'good'); };
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, function () {
                  try { document.execCommand('copy'); done(); } catch (e) { /* selection stays */ }
                });
              } else {
                try { document.execCommand('copy'); done(); } catch (e) { /* selection stays */ }
              }
            }
          }),
          U.el('span', { class: 'tiny muted', text: filename })
        ])
      ]);
      UI.modal({ title: t('export_data'), body: body, actions: false });
    },

    confirm(message, onYes) {
      UI.modal({
        title: t('confirm'),
        body: U.el('div', { class: 'small', text: message }),
        confirmText: t('confirm'),
        onConfirm: function () { onYes(); }
      });
    },

    /* ---------- shared cells ---------- */
    pl(value, pct, opts) {
      opts = opts || {};
      const cls = U.sign(value);
      const txt = (opts.moneyOnly ? '' : '') + U.money(value) +
        (pct !== null && pct !== undefined ? ' (' + U.pct(pct) + ')' : '');
      return U.el('span', { class: cls + ' tnum', text: txt });
    },

    symbolCell(sym) {
      return U.el('div', {}, [
        U.el('div', { class: 'sym', text: sym }),
        U.el('div', { class: 'sym-name', text: AP.store.assetName(sym) })
      ]);
    },

    bandBadge(ev) {
      const b = ev.band || AP.signals.bandOf(ev.score || 0);
      return U.el('span', { class: 'badge ' + b.cls, text: t(b.key) });
    },

    decisionBadge(decision) {
      const map = {
        dec_buy: 'good', dec_scale_in: 'info', dec_wait: '', dec_none: '',
        dec_take_profit: 'warn', dec_trim: 'warn', dec_exit: 'bad'
      };
      return U.el('span', { class: 'badge ' + (map[decision] || ''), text: t(decision) });
    },

    dataBadge() {
      const mode = AP.store.s.meta.dataMode;
      if (mode === 'demo') return U.el('span', { class: 'badge warn', text: t('demo_data_badge') });
      if (mode === 'live' || mode === 'mixed') return U.el('span', { class: 'badge good', text: t('live_data_badge') });
      if (mode === 'cached') return U.el('span', { class: 'badge', text: t('cached_data_badge') });
      return U.el('span', { class: 'badge', text: t('no_data') });
    },

    card(titleKey, subKey, node, headExtra) {
      const c = U.el('div', { class: 'card' });
      if (titleKey) {
        const head = U.el('div', { class: 'card-head' }, [
          U.el('div', {}, [
            U.el('div', { class: 'card-title', text: typeof titleKey === 'string' ? t(titleKey) : titleKey }),
            subKey ? U.el('div', { class: 'card-sub', text: typeof subKey === 'string' ? t(subKey) : subKey }) : null
          ])
        ]);
        if (headExtra) {
          head.appendChild(U.el('div', { class: 'spacer' }));
          head.appendChild(headExtra);
        }
        c.appendChild(head);
      }
      if (node) c.appendChild(node);
      return c;
    },

    table(headers, rows) {
      const wrap = U.el('div', { class: 'table-wrap' });
      const tbl = U.el('table', { class: 'tbl' });
      const thead = U.el('thead');
      const tr = U.el('tr');
      headers.forEach(function (h) { tr.appendChild(U.el('th', { text: h })); });
      thead.appendChild(tr);
      tbl.appendChild(thead);
      const tbody = U.el('tbody');
      rows.forEach(function (r) {
        const row = U.el('tr');
        r.forEach(function (cell) {
          const td = U.el('td');
          if (cell === null || cell === undefined) td.textContent = '—';
          else if (typeof cell === 'object' && cell.nodeType) td.appendChild(cell);
          else td.textContent = String(cell);
          row.appendChild(td);
        });
        tbody.appendChild(row);
      });
      tbl.appendChild(tbody);
      wrap.appendChild(tbl);
      return wrap;
    },

    empty(msgKey) {
      return U.el('div', { class: 'empty', text: typeof msgKey === 'string' ? t(msgKey) : msgKey });
    },

    /* ---------- app shell ---------- */
    renderShell() {
      const app = U.$('#app');
      app.innerHTML = '';

      const bar = U.el('header', { class: 'appbar' }, [
        U.el('div', { class: 'appbar-inner' }, [
          U.el('div', { class: 'brand' }, [
            U.el('div', { class: 'brand-mark', text: 'A' }),
            U.el('div', {}, [
              U.el('div', { class: 'brand-name', text: t('app_name') }),
              U.el('div', { class: 'brand-sub', text: t('day_of', { a: AP.store.dayNumber(), b: AP.store.settings().experimentDays }) })
            ])
          ]),
          U.el('div', { class: 'appbar-actions' }, [
            U.el('button', {
              class: 'icon-btn', title: t('refresh'), text: UI.busy ? '⏳' : '⟳',
              onclick: function () { AP.app.refresh(true); }
            }),
            (function () {
              const b = U.el('button', {
                class: 'icon-btn', title: t('alerts_title'), text: '◔',
                onclick: function () { UI.go('alerts'); }
              });
              const n = AP.store.unreadAlerts();
              if (n) b.appendChild(U.el('span', { class: 'dot', text: n > 99 ? '99' : String(n) }));
              return b;
            })(),
            U.el('button', {
              class: 'icon-btn', title: t('theme_dark'), text: AP.store.settings().theme === 'dark' ? '☀' : '☾',
              onclick: function () { AP.app.toggleTheme(); }
            }),
            U.el('button', {
              class: 'icon-btn', title: t('language'), text: AP.i18n.lang === 'ar' ? 'EN' : 'ع',
              onclick: function () { AP.app.toggleLang(); }
            })
          ])
        ])
      ]);
      app.appendChild(bar);
      app.appendChild(U.el('div', { class: 'paper-strip', text: '⚠ ' + t('paper_only') }));

      const wrap = U.el('div', { class: 'wrap' });
      wrap.appendChild(UI.kpiStrip());

      const tabs = U.el('nav', { class: 'tabs' });
      ROUTES.forEach(function (r) {
        tabs.appendChild(U.el('button', {
          class: 'tab' + (UI.route === r.id ? ' active' : ''),
          text: t(r.key),
          onclick: function () { UI.go(r.id); }
        }));
      });
      wrap.appendChild(tabs);

      const content = U.el('main', { id: 'view' });
      wrap.appendChild(content);
      app.appendChild(wrap);

      const bn = U.el('nav', { class: 'bottomnav' });
      ROUTES.filter(function (r) { return r.primary; }).forEach(function (r) {
        bn.appendChild(U.el('button', {
          class: 'bnav' + (UI.route === r.id ? ' active' : ''),
          onclick: function () { UI.go(r.id); }
        }, [
          U.el('span', { class: 'ico', text: r.icon }),
          U.el('span', { text: t(r.key) })
        ]));
      });
      app.appendChild(bn);

      UI.renderView();
    },

    kpiStrip() {
      const pf = AP.portfolio.summary();
      const st = AP.store.settings();
      const day = AP.store.dayNumber();
      const remaining = AP.store.daysRemaining();

      function kpi(labelKey, valueText, sub, cls, hero) {
        return U.el('div', { class: 'kpi' + (hero ? ' hero' : '') }, [
          U.el('div', { class: 'kpi-label', text: t(labelKey) }),
          U.el('div', { class: 'kpi-value tnum ' + (cls || ''), text: valueText }),
          sub ? U.el('div', { class: 'kpi-sub', text: sub }) : null
        ]);
      }

      const strip = U.el('section', { class: 'kpis' }, [
        kpi('kpi_portfolio_value', U.money(pf.equity), null, '', true),
        kpi('kpi_today_pl', U.money(pf.dayPl), U.pct(pf.dayPlPct), U.sign(pf.dayPl)),
        kpi('kpi_total_pl', U.money(pf.totalPl), U.pct(pf.totalPlPct), U.sign(pf.totalPl)),
        kpi('kpi_cash', U.money(pf.cash), U.pctPlain(pf.cashWeight) + ' ' + t('cash_weight')),
        kpi('kpi_invested', U.money(pf.invested), Object.keys(pf.positions).length + ' ' + t('positions')),
        kpi('kpi_return', U.pct(pf.totalPlPct), t('initial_capital') + ' ' + U.money0(st.initialCapital), U.sign(pf.totalPl)),
        (function () {
          const box = kpi('kpi_days', U.iso(day + ' / ' + st.experimentDays), t('days_remaining') + ': ' + remaining);
          const track = U.el('div', { class: 'progress-track' });
          const fill = U.el('div', { class: 'progress-fill' });
          fill.style.width = U.clamp((day / st.experimentDays) * 100, 2, 100) + '%';
          track.appendChild(fill);
          box.appendChild(track);
          return box;
        })()
      ]);
      return strip;
    },

    go(route) {
      UI.route = route;
      try { location.hash = '#' + route; } catch (e) { /* noop */ }
      UI.renderShell();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    renderView() {
      const host = U.$('#view');
      if (!host) return;
      host.innerHTML = '';
      const view = AP.views[UI.route];
      if (!view) {
        host.appendChild(UI.empty('no_data'));
        return;
      }
      try {
        view(host);
      } catch (e) {
        console.error('View error', e);
        host.appendChild(UI.empty(String(e && e.message ? e.message : e)));
      }
    },

    refresh() { UI.renderShell(); },

    /* ---------- paper trade dialog ---------- */
    tradeModal(symbol, side, prefill) {
      prefill = prefill || {};
      const price = prefill.price || AP.store.lastPrice(symbol) || 0;
      const pf = AP.portfolio.summary();
      const pos = pf.positions[symbol];
      const maxInfo = AP.portfolio.maxAffordable(symbol, price);

      const body = U.el('div', {});
      body.appendChild(U.el('div', { class: 'row', style: { marginBottom: '10px' } }, [
        UI.symbolCell(symbol),
        U.el('div', { class: 'spacer', style: { marginInlineStart: 'auto' } }),
        U.el('div', { class: 'pick-price tnum', text: U.money(price) })
      ]));

      const sideSel = U.el('select', {}, [
        U.el('option', { value: 'BUY', text: t('tx_buy'), selected: side !== 'SELL' }),
        U.el('option', { value: 'SELL', text: t('tx_sell'), selected: side === 'SELL' })
      ]);
      sideSel.value = side === 'SELL' ? 'SELL' : 'BUY';

      const qtyIn = U.el('input', { type: 'number', step: '0.0001', min: '0', value: prefill.qty || '' });
      const amtIn = U.el('input', { type: 'number', step: '0.01', min: '0', value: prefill.amount ? U.round(prefill.amount, 2) : '' });
      const priceIn = U.el('input', { type: 'number', step: '0.01', min: '0', value: U.round(price, 2) });
      const dateIn = U.el('input', { type: 'date', value: U.today() });
      const noteIn = U.el('input', { type: 'text', value: prefill.note || '' });
      const info = U.el('div', { class: 'hint' });

      function currentPrice() { return U.num(priceIn.value) || price; }
      function syncFromQty() {
        const q = U.num(qtyIn.value);
        amtIn.value = q > 0 ? U.round(q * currentPrice(), 2) : '';
        update();
      }
      function syncFromAmt() {
        const a = U.num(amtIn.value);
        const p = currentPrice();
        qtyIn.value = (a > 0 && p > 0) ? U.round(a / p, 4) : '';
        update();
      }
      function update() {
        const q = U.num(qtyIn.value), p = currentPrice();
        const cost = q * p;
        const isBuy = sideSel.value === 'BUY';
        const lines = [];
        lines.push(t('trade_estimated') + ': ' + U.money(cost));
        if (isBuy) {
          lines.push(t('trade_available_cash') + ': ' + U.money(pf.cash));
          lines.push(t('trade_max_shares') + ': ' + U.qty(maxInfo.shares) + ' (' + U.money(maxInfo.dollars) + ')');
          if (q > 0) {
            const risk = AP.portfolio.checkRisk(symbol, q, p);
            risk.warnings.forEach(function (w) { lines.push('⚠ ' + t(w.key, w.params)); });
          }
        } else if (pos) {
          lines.push(t('shares') + ': ' + U.qty(pos.qty) + ' · ' + t('avg_cost') + ' ' + U.money(pos.avgCost));
          if (q > 0) {
            const pl = (p - pos.avgCost) * q;
            lines.push(t('pl') + ': ' + U.money(pl));
          }
        }
        info.innerHTML = lines.map(function (l) { return U.esc(l); }).join('<br>');
      }
      qtyIn.addEventListener('input', syncFromQty);
      amtIn.addEventListener('input', syncFromAmt);
      priceIn.addEventListener('input', syncFromQty);
      sideSel.addEventListener('change', update);

      function field(labelKey, node) {
        return U.el('div', { class: 'field' }, [U.el('label', { text: t(labelKey) }), node]);
      }
      body.appendChild(field('trade_side', sideSel));
      body.appendChild(U.el('div', { class: 'form-row' }, [
        field('trade_qty', qtyIn),
        field('trade_amount_usd', amtIn)
      ]));
      body.appendChild(U.el('div', { class: 'form-row' }, [
        field('trade_price', priceIn),
        field('trade_date', dateIn)
      ]));
      if (sideSel.value === 'BUY') {
        body.appendChild(U.el('div', { class: 'row', style: { marginBottom: '10px' } }, [
          U.el('button', {
            class: 'btn sm', text: '25%',
            onclick: function () { amtIn.value = U.round(maxInfo.dollars * 0.25, 2); syncFromAmt(); }
          }),
          U.el('button', {
            class: 'btn sm', text: '50%',
            onclick: function () { amtIn.value = U.round(maxInfo.dollars * 0.5, 2); syncFromAmt(); }
          }),
          U.el('button', {
            class: 'btn sm', text: '100%',
            onclick: function () { amtIn.value = U.round(maxInfo.dollars, 2); syncFromAmt(); }
          })
        ]));
      } else if (pos) {
        body.appendChild(U.el('div', { class: 'row', style: { marginBottom: '10px' } }, [
          U.el('button', {
            class: 'btn sm', text: '25%',
            onclick: function () {
              qtyIn.value = AP.portfolio.dustAdjustedQty(symbol, U.round(pos.qty * 0.25, 4), currentPrice());
              syncFromQty();
            }
          }),
          U.el('button', {
            class: 'btn sm', text: '50%',
            onclick: function () {
              qtyIn.value = AP.portfolio.dustAdjustedQty(symbol, U.round(pos.qty * 0.5, 4), currentPrice());
              syncFromQty();
            }
          }),
          U.el('button', { class: 'btn sm', text: '100%', onclick: function () { qtyIn.value = U.round(pos.qty, 4); syncFromQty(); } })
        ]));
      }
      body.appendChild(field('trade_note', noteIn));
      body.appendChild(info);
      update();

      UI.modal({
        title: t('trade_paper_title') + ' · ' + symbol,
        body: body,
        confirmText: t('trade_confirm'),
        onConfirm: function () {
          const q = U.num(qtyIn.value), p = currentPrice();
          if (q <= 0 || p <= 0) { UI.toast(t('err_invalid'), 'bad'); return false; }
          const opts = {
            date: dateIn.value || U.today(),
            note: noteIn.value,
            score: prefill.score === undefined ? null : prefill.score,
            decision: prefill.decision || null,
            plan: prefill.plan || null
          };
          const res = sideSel.value === 'BUY'
            ? AP.portfolio.buy(symbol, q, p, opts)
            : AP.portfolio.sell(symbol, q, p, opts);
          if (!res.ok) { UI.toast(t(res.err), 'bad'); return false; }
          if (prefill.journalId) AP.journal.markExecuted(prefill.journalId, null);
          AP.store.saveSnapshot({ scores: AP.app.lastScores() });
          UI.toast(sideSel.value === 'BUY' ? t('tx_buy') + ' ✓' : t('tx_sell') + ' ✓', 'good');
          UI.renderShell();
        }
      });
    },

    ROUTES: ROUTES
  };

  AP.ui = UI;
  AP.views = AP.views || {};
})(window);

</script>
  <script>
/* ===== assets/js/views1.js ===== */
/* Asaad Paper Invest — views: Today & Opportunities */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;
  const UI = AP.ui;
  const t = function (k, p) { return AP.t(k, p); };

  function regimeColor(label) {
    return label === 'positive' ? 'var(--good)' : label === 'negative' ? 'var(--critical)' : 'var(--warning)';
  }

  function reasonsList(ev, limit) {
    const seen = {};
    const items = [];
    (ev.reasons || []).forEach(function (r) {
      const txt = AP.signals.reasonText(r);
      if (!txt || seen[txt]) return;
      seen[txt] = 1;
      items.push(txt);
    });
    const ul = U.el('ul', { class: 'reason-list' });
    items.slice(0, limit || 8).forEach(function (x) { ul.appendChild(U.el('li', { text: x })); });
    return ul;
  }

  function planGrid(ev) {
    if (!ev.plan) return U.el('div', { class: 'hint', text: t('no_data') });
    const p = ev.plan;
    const items = [
      ['entry_price', U.money(p.entry)],
      ['entry_zone', U.iso(U.money(p.zoneLow) + ' – ' + U.money(p.zoneHigh))],
      ['stop_loss', U.money(p.stop)],
      ['target1', U.money(p.t1)],
      ['target2', U.money(p.t2)],
      ['rr', U.iso(U.round(p.rr, 2) + ' : 1')],
      ['suggested_alloc', U.pctPlain(ev.size.pct) + ' (' + U.iso('≤ ' + ev.size.cap + '%') + ')'],
      ['suggested_amount', U.money(ev.size.amount) + ' · ' + U.qty(ev.size.shares) + ' ' + t('shares')]
    ];
    const grid = U.el('div', { class: 'planbox' });
    items.forEach(function (it) {
      grid.appendChild(U.el('div', { class: 'plan-item' }, [
        U.el('div', { class: 'plan-label', text: t(it[0]) }),
        U.el('div', { class: 'plan-value', text: it[1] })
      ]));
    });
    return grid;
  }

  function checklistBlock(ev) {
    if (!ev.checklist || !ev.checklist.length) return null;
    const box = U.el('div', { class: 'check-list' });
    ev.checklist.forEach(function (c) {
      box.appendChild(U.el('div', { class: 'check-item' }, [
        U.el('span', { class: 'check-mark ' + (c.ok ? 'ok' : 'no'), text: c.ok ? '✓' : '✕' }),
        U.el('span', { class: 'check-q', text: t(c.q) }),
        c.noAnswer ? null : U.el('span', {
          class: 'badge ' + (c.ok ? 'good' : 'bad'),
          text: t(c.answer || (c.ok ? 'yes' : 'no'))
        }),
        U.el('span', { class: 'check-v', text: String(c.val) })
      ]));
    });
    return box;
  }

  /* ---------------- asset detail modal ---------------- */
  UI.assetDetail = function (symbol) {
    const scan = AP.app.currentScan();
    const ev = scan.evals.find(function (e) { return e.symbol === symbol; }) ||
      AP.signals.evaluate(symbol, scan.regime);
    const body = U.el('div', {});

    body.appendChild(U.el('div', { class: 'row' }, [
      UI.symbolCell(symbol),
      U.el('div', { style: { marginInlineStart: 'auto' }, class: 'end' }, [
        U.el('div', { class: 'pick-price', text: U.money(ev.ind ? ev.ind.price : AP.store.lastPrice(symbol)) }),
        ev.ind ? U.el('div', { class: 'small ' + U.sign(ev.ind.chg1d), text: U.pct(ev.ind.chg1d) }) : null
      ])
    ]));

    if (!ev.ok) {
      body.appendChild(UI.empty('not_enough_history'));
      UI.modal({ title: symbol, body: body, actions: false });
      return;
    }

    const ringHost = U.el('div', { style: { width: '120px' } });
    body.appendChild(U.el('div', { class: 'row', style: { marginTop: '10px', alignItems: 'center' } }, [
      ringHost,
      U.el('div', { style: { flex: '1', minWidth: '160px' } }, [
        U.el('div', { class: 'row' }, [UI.bandBadge(ev), UI.decisionBadge(ev.decision),
          U.el('span', { class: 'badge', text: t('confidence') + ': ' + t(ev.confidence) })]),
        U.el('div', { class: 'small muted', style: { marginTop: '6px' }, text: t('signal_score') })
      ])
    ]));
    setTimeout(function () { AP.charts.ring(ringHost, ev.score, { size: 116 }); }, 0);

    // price chart
    const chartHost = U.el('div', { style: { marginTop: '12px' } });
    body.appendChild(U.el('div', { class: 'card-sub', text: t('price_chart') }));
    body.appendChild(chartHost);
    setTimeout(function () {
      const bars = AP.market.seriesWithManual(symbol).slice(-180);
      AP.charts.line(chartHost, {
        height: 190,
        series: [{ label: symbol, color: AP.charts.palette().s1, points: bars.map(function (b) { return { d: b.d, v: b.c }; }) }]
      });
    }, 0);

    // score breakdown
    body.appendChild(U.el('div', { class: 'sep' }));
    body.appendChild(U.el('div', { class: 'card-sub', style: { marginBottom: '8px' }, text: t('score_breakdown') }));
    const meterHost = U.el('div', {});
    body.appendChild(meterHost);
    AP.charts.meters(meterHost, [
      { label: t('comp_trend'), value: ev.components.trend, weight: ev.weights.trend },
      { label: t('comp_momentum'), value: ev.components.momentum, weight: ev.weights.momentum },
      { label: t('comp_valuation'), value: ev.components.valuation, weight: ev.weights.valuation },
      { label: t('comp_volatility'), value: ev.components.volatility, weight: ev.weights.volatility },
      { label: t('comp_market'), value: ev.components.market, weight: ev.weights.market },
      { label: t('comp_news'), value: ev.components.news, weight: ev.weights.news },
      { label: t('comp_rr'), value: ev.components.rr, weight: ev.weights.rr }
    ]);

    // indicators table
    const a = ev.ind;
    function row(k, v) { return [t(k), v]; }
    const rows = [
      row('last_price', U.money(a.price)),
      row('change_1d', U.pct(a.chg1d)),
      row('change_5d', a.chg5d === null ? '—' : U.pct(a.chg5d)),
      row('change_1m', a.chg1m === null ? '—' : U.pct(a.chg1m)),
      row('change_3m', a.chg3m === null ? '—' : U.pct(a.chg3m)),
      row('volume', a.volume ? Math.round(a.volume).toLocaleString('en-US') : '—'),
      row('avg_volume', a.avgVolume ? Math.round(a.avgVolume).toLocaleString('en-US') : '—'),
      row('sma20', a.sma20 ? U.money(a.sma20) : '—'),
      row('sma50', a.sma50 ? U.money(a.sma50) : '—'),
      row('sma200', a.sma200 ? U.money(a.sma200) : '—'),
      row('ema20', a.ema20 ? U.money(a.ema20) : '—'),
      row('rsi14', a.rsi === null ? '—' : U.round(a.rsi, 1)),
      row('macd', a.macd ? U.round(a.macd.macd, 3) : '—'),
      row('macd_signal', a.macd ? U.round(a.macd.signal, 3) : '—'),
      row('macd_hist', a.macd ? U.round(a.macd.hist, 3) : '—'),
      row('bb_upper', a.bb ? U.money(a.bb.upper) : '—'),

    const actions = U.el('div', { class: 'row', style: { marginTop: '12px' } }, [

            price: a.price, amount: ev.size.amount, score: ev.score,
            decision: ev.decision, plan: ev.plan
          });
        }
      }),
      AP.portfolio.positionOf(symbol) ? U.el('button', {
        class: 'btn', text: t('sell'),
        onclick: function () { m.close(); UI.tradeModal(symbol, 'SELL', { price: a.price, score: ev.score, decision: ev.decision }); }
      }) : null,
      U.el('button', {
        class: 'btn ghost', text: t('log_only'),
        onclick: function () {
          AP.journal.add(ev, { regime: { label: AP.app.currentScan().regime.label } });
          AP.store.save();
          UI.toast(t('journal_title') + ' ✓', 'good');
        }
      })
    ]);
    body.appendChild(actions);

    const m = UI.modal({ title: symbol + ' · ' + AP.store.assetName(symbol), body: body, actions: false });
  };

  /* ---------------- Today ---------------- */
  AP.views.today = function (host) {
    const scan = AP.app.currentScan();
    const regime = scan.regime;

    // data status

    const statusRow = U.el('div', { class: 'row', style: { marginBottom: '12px' } }, [

    ]);
    host.appendChild(statusRow);

    if (AP.store.s.meta.dataMode === 'demo') {
      host.appendChild(U.el('div', { class: 'notice warn' }, [
        U.el('span', { text: '⚠' }),
        U.el('div', {
          text: AP.i18n.lang === 'ar'
            ? 'تعذّر جلب بيانات السوق الحقيقية، ويعمل النظام الآن على سلسلة أسعار محاكاة داخلية. الأرقام صالحة لاختبار المنصة فقط. اضبط وسيط البيانات من الإعدادات للحصول على أسعار حقيقية.'
            : 'Live market data could not be fetched, so the system is running on an internal simulated price series. Figures are valid for testing the platform only. Configure a data proxy in Settings for real prices.'
        })
      ]));

    // hero

    const dot = U.el('span', { class: 'regime-dot' });
    dot.style.background = regimeColor(regime.label);
    hero.appendChild(U.el('div', { class: 'regime-row', style: { marginTop: '10px' } }, [
      dot,
      U.el('strong', { text: t('market_today') + ': ' + t('market_' + regime.label) }),
      U.el('span', { class: 'badge', text: t('bench_spx') + ' ' + regime.proxy }),
      U.el('span', { class: 'small muted', text: U.pctPlain(regime.breadth, 0) + ' ' + (AP.i18n.lang === 'ar' ? 'من الأصول فوق SMA200' : 'of assets above SMA200') })
    ]));
    hero.appendChild(U.el('div', { class: 'tiny muted', text: t('market_basis') }));
    hero.appendChild(U.el('div', { class: 'sep' }));

    hero.appendChild(U.el('div', { class: 'card-sub', style: { marginBottom: '10px' }, text: t('best_opportunity') }));

        U.el('div', { style: { fontSize: '17px', fontWeight: '700', color: 'var(--text-primary)' }, text: t('no_trade_today') }),
        U.el('div', { style: { marginTop: '6px' }, text: t('no_trade_reason') })
      ]));

      const ev = scan.pick;
      const ringHost = U.el('div', { style: { width: '120px', flex: '0 0 auto' } });
      const head = U.el('div', { class: 'pick-head' }, [
        U.el('div', { class: 'pick-main' }, [
          U.el('div', { class: 'row' }, [
            U.el('span', { class: 'pick-symbol', text: ev.symbol }),
            UI.bandBadge(ev),
            UI.decisionBadge(ev.decision)
          ]),
          U.el('div', { class: 'muted small', text: AP.store.assetName(ev.symbol) + ' · ' + t(AP.store.isEtf(ev.symbol) ? 'type_etf' : 'type_stock') }),

            U.el('span', { class: 'pick-price', text: U.money(ev.ind.price) }),
            U.el('span', { class: U.sign(ev.ind.chg1d) + ' small', text: U.pct(ev.ind.chg1d) }),
            U.el('span', { class: 'badge', text: t('confidence') + ': ' + t(ev.confidence) })
          ])
        ]),
        ringHost
      ]);
      hero.appendChild(head);
      setTimeout(function () { AP.charts.ring(ringHost, ev.score, { size: 116 }); }, 0);

      hero.appendChild(U.el('div', { class: 'card-sub', style: { marginTop: '12px' }, text: t('reasons') }));
      hero.appendChild(reasonsList(ev, 7));

      hero.appendChild(U.el('div', { class: 'card-sub', style: { marginTop: '14px' }, text: t('plan_title') }));
      hero.appendChild(planGrid(ev));

      hero.appendChild(U.el('div', { class: 'row', style: { marginTop: '14px' } }, [
        U.el('button', {
          class: 'btn primary', text: t('execute_paper'),
          onclick: function () {
            const entry = AP.journal.add(ev, { regime: { label: regime.label } });
            AP.store.save();
            UI.tradeModal(ev.symbol, 'BUY', {
              price: ev.ind.price, amount: ev.size.amount, score: ev.score,
              decision: ev.decision, plan: ev.plan, journalId: entry ? entry.id : null
            });
          }

        U.el('button', {
          class: 'btn', text: t('details'),
          onclick: function () { UI.assetDetail(ev.symbol); }
        }),
        U.el('button', {
          class: 'btn ghost', text: t('log_only'),
          onclick: function () {
            AP.journal.add(ev, { regime: { label: regime.label } });
            AP.store.save();
            UI.toast(t('journal_title') + ' ✓', 'good');
          }
        })
      ]));
      hero.appendChild(U.el('div', { class: 'tiny muted', style: { marginTop: '10px' }, text: t('prob_note') }));
    }
    host.appendChild(hero);

    // checklist for the pick (or for the top-ranked asset)
    const clSource = scan.pick || scan.evals.find(function (e) { return e.ok; });
    if (clSource && clSource.checklist && clSource.checklist.length) {
      host.appendChild(UI.card(t('checklist') + ' — ' + clSource.symbol, null, checklistBlock(clSource)));
    }

    // actions on holdings
    const acts = scan.holdingActions;
    const actNode = acts.length ? (function () {
      const rows = acts.map(function (e) {
        const pos = AP.portfolio.summary().positions[e.symbol];
        return [
          UI.symbolCell(e.symbol),
          U.el('span', { class: 'tnum', text: U.money(e.ind.price) }),
          U.el('span', { class: 'tnum ' + (pos ? U.sign(pos.pl) : ''), text: pos ? U.pct(pos.plPct) : '—' }),
          String(e.score),
          UI.decisionBadge(e.decision),
          U.el('div', { class: 'row' }, [
            U.el('button', { class: 'btn sm', text: t('sell'), onclick: function () { UI.tradeModal(e.symbol, 'SELL', { price: e.ind.price, score: e.score, decision: e.decision }); } }),
            U.el('button', { class: 'btn sm ghost', text: t('details'), onclick: function () { UI.assetDetail(e.symbol); } })
          ])
        ];
      });
      return UI.table([t('symbol'), t('last_price'), t('pl_pct'), t('score'), t('decision'), t('actions')], rows);
    })() : UI.empty('no_holdings_actions');
    host.appendChild(UI.card('holdings_actions', null, actNode));

    // other candidates
    const others = scan.evals.filter(function (e) { return e.ok && (!scan.pick || e.symbol !== scan.pick.symbol); }).slice(0, 5);
    if (others.length) {
      const rows = others.map(function (e) {
        return [
          UI.symbolCell(e.symbol),
          U.el('span', { class: 'tnum', text: U.money(e.ind.price) }),
          U.el('span', { class: 'tnum ' + U.sign(e.ind.chg1d), text: U.pct(e.ind.chg1d) }),
          U.el('strong', { class: 'tnum', text: String(e.score) }),
          UI.bandBadge(e),
          UI.decisionBadge(e.decision),
          U.el('button', { class: 'btn sm ghost', text: t('details'), onclick: function () { UI.assetDetail(e.symbol); } })
        ];
      });
      host.appendChild(UI.card('other_candidates', null,
        UI.table([t('symbol'), t('last_price'), t('change_1d'), t('score'), t('signal'), t('decision'), ''], rows)));
    }
  };

  AP.views.opportunities = function (host) {
    const scan = AP.app.currentScan();

    const addBtn = U.el('button', {
      class: 'btn sm', text: '+ ' + t('add_symbol'),
      onclick: function () {
        const symIn = U.el('input', { type: 'text', placeholder: 'VTI' });
        const nameIn = U.el('input', { type: 'text' });
        const typeSel = U.el('select', {}, [
          U.el('option', { value: 'stock', text: t('type_stock') }),
          U.el('option', { value: 'etf', text: t('type_etf') })
        ]);
        const sectorIn = U.el('input', { type: 'text' });
        const body = U.el('div', {}, [
          U.el('div', { class: 'field' }, [U.el('label', { text: t('add_symbol_hint') }), symIn]),
          U.el('div', { class: 'field' }, [U.el('label', { text: t('name') }), nameIn]),
          U.el('div', { class: 'form-row' }, [
            U.el('div', { class: 'field' }, [U.el('label', { text: t('asset_type') }), typeSel]),
            U.el('div', { class: 'field' }, [U.el('label', { text: t('sector') }), sectorIn])
          ])
        ]);
        UI.modal({
          title: t('add_symbol'), body: body, confirmText: t('add'),
          onConfirm: function () {
            const res = AP.store.addSymbol(symIn.value, {
              name: nameIn.value || symIn.value.toUpperCase(),
              nameAr: nameIn.value || symIn.value.toUpperCase(),
              type: typeSel.value,
              sector: sectorIn.value || '—'
            });
            if (!res.ok) { UI.toast(t(res.err), 'bad'); return false; }
            UI.toast(t('add') + ' ✓', 'good');
            AP.app.refresh(true);
          }
        });
      }
    });

    const rows = scan.evals.map(function (e, i) {
      if (!e.ok) {
        return [
          String(i + 1), UI.symbolCell(e.symbol), '—', '—', '—', '—',
          U.el('span', { class: 'badge', text: t('no_data') }),
          U.el('button', {
            class: 'btn sm ghost', text: '✕',
            onclick: function () { removeSym(e.symbol); }
          })
        ];
      }
      const a = e.ind;
      return [
        U.el('strong', { text: String(i + 1) }),
        (function () {
          const cell = UI.symbolCell(e.symbol);
          cell.style.cursor = 'pointer';
          cell.addEventListener('click', function () { UI.assetDetail(e.symbol); });
          return cell;
        })(),
        U.el('div', {}, [
          U.el('div', { class: 'tnum', text: U.money(a.price) }),
          U.el('div', { class: 'tiny ' + U.sign(a.chg1d), text: U.pct(a.chg1d) })
        ]),
        (function () {
          const wrap = U.el('div', { class: 'row', style: { gap: '6px' } });
          wrap.appendChild(U.el('strong', { class: 'tnum', text: String(e.score) }));
          wrap.appendChild(UI.bandBadge(e));
          return wrap;
        })(),
        U.el('span', { class: 'badge ' + (e.trendLabel === 'trend_up' ? 'good' : e.trendLabel === 'trend_down' ? 'bad' : ''), text: t(e.trendLabel) }),
        U.el('span', { class: 'tnum', text: a.rsi === null ? '—' : U.round(a.rsi, 1) }),
        U.el('span', { class: 'badge ' + (e.riskLabel === 'risk_low' ? 'good' : e.riskLabel === 'risk_high' ? 'bad' : 'warn'), text: t(e.riskLabel) }),
        UI.decisionBadge(e.decision),
        U.el('div', { class: 'row' }, [
          U.el('button', { class: 'btn sm', text: t('details'), onclick: function () { UI.assetDetail(e.symbol); } }),
          U.el('button', { class: 'btn sm ghost', text: '✕', title: t('remove'), onclick: function () { removeSym(e.symbol); } })
        ])
      ];
    });

    function removeSym(sym) {
      UI.confirm(t('remove_symbol_confirm', { a: sym }), function () {
        AP.store.removeSymbol(sym);
        AP.app.refresh(false);
        UI.toast(t('remove') + ' ✓');
      });
    }

    host.appendChild(UI.card('opp_title', 'opp_sub',
      UI.table([t('rank'), t('symbol'), t('price'), t('score'), t('trend'), t('rsi14'), t('risk'), t('signal'), t('actions')], rows),
      addBtn));

    // score distribution across the watchlist
    const chartHost = U.el('div', {});
    host.appendChild(UI.card('signal_quality', 'opp_sub', chartHost));
    setTimeout(function () {
      AP.charts.bars(chartHost, scan.evals.filter(function (e) { return e.ok; }).map(function (e) {
        return {
          label: e.symbol, value: e.score,
          color: e.score >= 80 ? AP.charts.palette().good
            : e.score >= 65 ? AP.charts.palette().s3
              : e.score >= 50 ? AP.charts.palette().s4 : AP.charts.palette().s2
        };
      }), { fmt: function (v) { return Math.round(v) + '/100'; } });
    }, 0);
  };
})(window);

  <script>
/* ===== assets/js/views2.js ===== */
/* Asaad Paper Invest — views: Portfolio & Analytics */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;
  const UI = AP.ui;
  const t = function (k, p) { return AP.t(k, p); };

  function benchSeriesConfig() {
    const P = AP.charts.palette();
    const colorBySlot = { accent: P.s1, c2: P.s2, c3: P.s3, c4: P.s4, c5: P.s5 };
    return AP.bench.all().map(function (b) {
      return {
        id: b.id,
        label: t(b.labelKey),
        color: colorBySlot[b.color] || P.s1,
        value: b.value,
        retPct: b.retPct,
        points: b.series.map(function (p) { return { d: p.d, v: p.v }; })
      };
    });
  }

  function legendFor(series) {
    const wrap = U.el('div', { class: 'legend' });
    series.forEach(function (s) {
      const sw = U.el('span', { class: 'legend-swatch' });
      sw.style.background = s.color;
      wrap.appendChild(U.el('span', { class: 'legend-item' }, [
        sw,
        U.el('span', { text: s.label }),
        U.el('span', { class: 'legend-val ' + U.sign(s.retPct), text: U.pct(s.retPct) })
      ]));
    });
    return wrap;
  }

  /* ---------------- Portfolio ---------------- */
  AP.views.portfolio = function (host) {
    const pf = AP.portfolio.summary();
    const syms = Object.keys(pf.positions);

    // positions
    const posNode = syms.length ? (function () {
      const rows = syms.map(function (s) {
        const p = pf.positions[s];
        return [
          (function () {
            const c = UI.symbolCell(s);
            c.style.cursor = 'pointer';
            c.addEventListener('click', function () { UI.assetDetail(s); });
            return c;
          })(),
          U.el('span', { class: 'tnum', text: U.qty(p.qty) }),
          U.el('span', { class: 'tnum', text: U.money(p.avgCost) }),
          U.el('div', {}, [
            U.el('div', { class: 'tnum', text: U.money(p.price) }),
            U.el('div', { class: 'tiny ' + U.sign(p.dayPlPct), text: U.pct(p.dayPlPct) })
          ]),
          U.el('span', { class: 'tnum', text: U.money(p.value) }),
          U.el('span', { class: 'tnum ' + U.sign(p.pl), text: U.money(p.pl) }),
          U.el('span', { class: 'tnum ' + U.sign(p.pl), text: U.pct(p.plPct) }),
          U.el('span', { class: 'tnum', text: U.pctPlain(p.weight, 1) }),
          U.el('div', { class: 'row' }, [
            U.el('button', { class: 'btn sm', text: t('buy'), onclick: function () { UI.tradeModal(s, 'BUY', { price: p.price }); } }),
            U.el('button', { class: 'btn sm ghost', text: t('sell'), onclick: function () { UI.tradeModal(s, 'SELL', { price: p.price }); } })
          ])
        ];
      });
      return UI.table([t('symbol'), t('shares'), t('avg_cost'), t('last_price'), t('market_value'),
        t('pl'), t('pl_pct'), t('weight'), t('actions')], rows);
    })() : UI.empty('no_positions');

    host.appendChild(UI.card('positions', null, posNode,
      U.el('span', { class: 'badge', text: t('cash_weight') + ': ' + U.pctPlain(pf.cashWeight, 1) })));

    // growth + allocation
    const grid = U.el('div', { class: 'grid2' });

    const growthHost = U.el('div', {});
    const growthCard = UI.card('growth_chart', null, growthHost);
    grid.appendChild(growthCard);
    setTimeout(function () {
      AP.charts.line(growthHost, {
        height: 220,
        series: [{
          label: t('bench_portfolio'), color: AP.charts.palette().s1,
          points: AP.portfolio.equitySeries().map(function (r) { return { d: r.d, v: r.v }; })
        }]
      });
    }, 0);

    const allocHost = U.el('div', {});
    const allocLegend = U.el('div', {});
    const allocCard = UI.card('allocation', null, U.el('div', {}, [allocHost, allocLegend]));
    grid.appendChild(allocCard);
    setTimeout(function () {
      const P = AP.charts.palette();
      const slots = [P.s1, P.s2, P.s3, P.s4, P.s5, P.s6, P.s7];
      let slices = syms.map(function (s) {
        return { label: s, value: pf.positions[s].value };
      }).sort(function (a, b) { return b.value - a.value; });
      // cap at six named holdings; anything past that folds into "Other"
      let other = null;
      if (slices.length > 6) {
        const rest = slices.slice(6);
        slices = slices.slice(0, 6);
        other = {
          label: AP.i18n.lang === 'ar' ? 'أخرى' : 'Other',
          value: U.sum(rest.map(function (r) { return r.value; })),
          color: P.muted
        };
      }
      slices.forEach(function (s, i) { s.color = slots[i % slots.length]; });
      if (other) slices.push(other);
      slices.push({ label: t('kpi_cash'), value: pf.cash, color: P.grid });
      AP.charts.donut(allocHost, slices, {
        height: 200,
        centerLabel: U.money0(pf.equity),
        centerSub: t('kpi_portfolio_value')
      });
      allocLegend.innerHTML = '';
      const lg = U.el('div', { class: 'legend' });
      slices.forEach(function (s) {
        const sw = U.el('span', { class: 'legend-swatch' });
        sw.style.background = s.color;
        lg.appendChild(U.el('span', { class: 'legend-item' }, [
          sw, U.el('span', { text: s.label }),
          U.el('span', { class: 'legend-val', text: U.pctPlain(pf.equity ? (s.value / pf.equity) * 100 : 0, 1) })
        ]));
      });
      allocLegend.appendChild(lg);
    }, 0);
    host.appendChild(grid);

    // benchmarks
    const benchHost = U.el('div', {});
    const benchLegend = U.el('div', {});
    const benchTable = U.el('div', {});
    host.appendChild(UI.card('vs_benchmarks', 'benchmark_note',
      U.el('div', {}, [benchHost, benchLegend, U.el('div', { class: 'sep' }), benchTable])));
    setTimeout(function () {
      const series = benchSeriesConfig();
      AP.charts.line(benchHost, { height: 240, mode: 'pct', series: series, area: false });
      benchLegend.innerHTML = '';
      benchLegend.appendChild(legendFor(series));
      benchTable.innerHTML = '';
      benchTable.appendChild(UI.table([t('strategy'), t('value_now'), t('total_return'), t('diff_vs_portfolio')],
        AP.analytics.benchmarkTable().map(function (r) {
          return [

  /* ---------------- Analytics ---------------- */
  AP.views.analytics = function (host) {
    const a = AP.analytics.compute();
    const jstats = AP.journal.stats();

    function stat(labelKey, value, cls, sub) {
      return U.el('div', { class: 'kpi' }, [
        U.el('div', { class: 'kpi-label', text: t(labelKey) }),
        U.el('div', { class: 'kpi-value tnum ' + (cls || ''), text: value }),
        sub ? U.el('div', { class: 'kpi-sub', text: sub }) : null
      ]);
    }

    const grid = U.el('div', { class: 'kpis' }, [
      stat('total_return', U.money(a.totalReturn), U.sign(a.totalReturn), U.pct(a.totalReturnPct)),
      stat('realized_profit', U.money(a.realized), U.sign(a.realized)),
      stat('unrealized_profit', U.money(a.unrealized), U.sign(a.unrealized)),
      stat('win_rate', a.winRate === null ? '—' : U.pctPlain(a.winRate, 1), '', a.winCount + ' / ' + a.tradesCount),
      stat('loss_rate', a.lossRate === null ? '—' : U.pctPlain(a.lossRate, 1), '', a.lossCount + ' / ' + a.tradesCount),
      stat('avg_gain', a.avgGain === null ? '—' : U.pct(a.avgGain), 'pos', a.avgGainUsd === null ? '' : U.money(a.avgGainUsd)),
      stat('avg_loss', a.avgLoss === null ? '—' : U.pct(a.avgLoss), 'neg', a.avgLossUsd === null ? '' : U.money(a.avgLossUsd)),
      stat('profit_factor', a.profitFactor === null ? '—' : (a.profitFactor === Infinity ? '∞' : U.round(a.profitFactor, 2))),
      stat('max_drawdown', U.pctPlain(-Math.abs(a.maxDrawdown), 2), a.maxDrawdown > 0 ? 'neg' : ''),
      stat('sharpe', a.sharpe === null ? '—' : U.round(a.sharpe, 2)),
      stat('trades_count', String(a.tradesCount)),
      stat('avg_hold', a.avgHold === null ? '—' : U.round(a.avgHold, 1) + ' ' + t('days_unit')),
      stat('best_trade', a.bestTrade ? a.bestTrade.symbol + ' ' + U.pct(a.bestTrade.plPct) : '—', a.bestTrade ? 'pos' : ''),
      stat('worst_trade', a.worstTrade ? a.worstTrade.symbol + ' ' + U.pct(a.worstTrade.plPct) : '—', a.worstTrade ? 'neg' : ''),
      stat('cash_weight', U.pctPlain(a.cashWeight, 1)),
      stat('signal_quality', jstats.hitRate === null ? '—' : U.pctPlain(jstats.hitRate, 1), '', jstats.graded + ' / ' + jstats.total)

    const g2 = U.el('div', { class: 'grid2' });

    g2.appendChild(UI.card('drawdown_curve', null, ddHost));

        series: [{ label: t('equity'), color: AP.charts.palette().s1, points: a.equitySeries.map(function (r) { return { d: r.d, v: r.v }; }) }]
      });
      AP.charts.line(ddHost, {
        height: 210, mode: 'value', unit: 'pct', zeroBase: true,
        series: [{ label: t('max_drawdown'), color: AP.charts.palette().critical, points: a.drawdownSeries.map(function (r) { return { d: r.d, v: r.v }; }) }]
      });
    }, 0);

    // benchmarks
    const bTable = AP.analytics.benchmarkTable();
    const timing = AP.analytics.timingVerdict();
    const benchHost = U.el('div', {});
    const benchLegend = U.el('div', {});
    host.appendChild(UI.card('benchmark_title', 'benchmark_note', U.el('div', {}, [
      benchHost, benchLegend,
      U.el('div', { class: 'sep' }),
      UI.table([t('strategy'), t('value_now'), t('total_return'), t('diff_vs_portfolio')],
        bTable.map(function (r) {
          return [
            U.el('span', { text: t(r.labelKey), style: r.isPortfolio ? { fontWeight: '700' } : {} }),
            U.el('span', { class: 'tnum', text: U.money(r.value) }),
            U.el('span', { class: 'tnum ' + U.sign(r.retPct), text: U.pct(r.retPct) }),
            r.isPortfolio ? '—' : U.el('span', { class: 'tnum ' + U.sign(r.diff), text: U.pct(r.diff) })
          ];
        })),
      U.el('div', { class: 'notice info', style: { marginTop: '12px' } }, [
        U.el('div', {}, [
          U.el('strong', { text: t('timing_question') + ' ' }),
          U.el('span', { text: t(timing.key, timing.params) })
        ])
      ])
    ])));
    setTimeout(function () {
      const series = benchSeriesConfig();
      AP.charts.line(benchHost, { height: 240, mode: 'pct', series: series, area: false });
      benchLegend.innerHTML = '';
      benchLegend.appendChild(legendFor(series));
    }, 0);

    // per-asset performance
    const symRows = Object.keys(a.bySymbol).map(function (s) { return a.bySymbol[s]; })
      .sort(function (x, y) { return U.num(y.total) - U.num(x.total); });
    const symChart = U.el('div', {});
    host.appendChild(UI.card('per_symbol', null, U.el('div', {}, [
      symChart,
      U.el('div', { class: 'sep' }),
      UI.table([t('symbol'), t('trades_count'), t('win_rate'), t('realized_profit'), t('unrealized_profit'), t('total_return')],
        symRows.map(function (r) {
          return [
            U.el('span', { class: 'sym', text: r.symbol }),
            String(r.trades),
            r.winRate === null ? '—' : U.pctPlain(r.winRate, 0),
            U.el('span', { class: 'tnum ' + U.sign(r.pl), text: U.money(r.pl) }),
            U.el('span', { class: 'tnum ' + U.sign(r.openPl), text: r.openPl === undefined ? '—' : U.money(r.openPl) }),
            U.el('span', { class: 'tnum ' + U.sign(r.total), text: U.money(r.total) })
          ];
        }))
    ])));
    setTimeout(function () {
      if (!symRows.length) return;
      AP.charts.bars(symChart, symRows.map(function (r) {
        return { label: r.symbol, value: U.num(r.total) };
      }), { fmt: function (v) { return U.money(v); } });
    }, 0);

    // per-signal performance
    const sigRows = Object.keys(a.byDecision).map(function (k) { return a.byDecision[k]; });
    const jbands = jstats.byBand;
    host.appendChild(UI.card('per_signal', null, U.el('div', {}, [
      sigRows.length ? UI.table([t('signal'), t('trades_count'), t('win_rate'), t('pl'), t('avg_gain')],
        sigRows.map(function (r) {
          return [
            t(r.key) || r.key,
            String(r.trades),
            r.winRate === null ? '—' : U.pctPlain(r.winRate, 0),
            U.el('span', { class: 'tnum ' + U.sign(r.pl), text: U.money(r.pl) }),
            r.avgRet === null ? '—' : U.el('span', { class: 'tnum ' + U.sign(r.avgRet), text: U.pct(r.avgRet) })
          ];
        })) : UI.empty('no_closed_trades'),
      U.el('div', { class: 'sep' }),
      U.el('div', { class: 'card-sub', style: { marginBottom: '8px' }, text: t('hit_rate_by_band') }),
      UI.table([t('signal'), t('trades_count'), t('was_successful'), t('avg_gain')],
        Object.keys(jbands).map(function (k) {
          const b = jbands[k];
          return [
            t(k),
            String(b.total),
            b.hitRate === null ? t('pending') : U.pctPlain(b.hitRate, 0) + ' (' + b.success + '/' + b.graded + ')',
            b.avgRet === null ? '—' : U.el('span', { class: 'tnum ' + U.sign(b.avgRet), text: U.pct(b.avgRet) })
          ];
        }))
    ])));

    // closed trades
    const closedNode = a.closed.length ? UI.table(
      [t('symbol'), t('date'), t('shares'), t('entry_price'), t('price'), t('pl'), t('pl_pct'), t('avg_hold'), t('signal')],
      a.closed.slice().reverse().slice(0, 100).map(function (c) {
        return [
          U.el('span', { class: 'sym', text: c.symbol }),
          c.entryDate + ' → ' + c.exitDate,
          U.el('span', { class: 'tnum', text: U.qty(c.qty) }),
          U.el('span', { class: 'tnum', text: U.money(c.entryPrice) }),
          U.el('span', { class: 'tnum', text: U.money(c.exitPrice) }),
          U.el('span', { class: 'tnum ' + U.sign(c.pl), text: U.money(c.pl) }),
          U.el('span', { class: 'tnum ' + U.sign(c.pl), text: U.pct(c.plPct) }),
          c.holdDays + ' ' + t('days_unit'),
          c.score === null || c.score === undefined ? '—' : String(c.score)
        ];
      })
    ) : UI.empty('no_closed_trades');
    host.appendChild(UI.card('closed_trades', null, closedNode));
  };
})(window);

(function (root) {

  function followCell(f) {

    return U.el('div', {}, [
      U.el('div', { class: 'tnum', text: U.money(f.price) }),

  /* ---------------- Journal ---------------- */
  AP.views.journal = function (host) {
    const stats = AP.journal.stats();
    const all = AP.journal.entries();

    const summary = U.el('div', { class: 'kpis' }, [
      U.el('div', { class: 'kpi' }, [
        U.el('div', { class: 'kpi-label', text: t('journal_title') }),
        U.el('div', { class: 'kpi-value tnum', text: String(stats.total) })
      ]),
      U.el('div', { class: 'kpi' }, [
        U.el('div', { class: 'kpi-label', text: t('was_successful') }),
        U.el('div', { class: 'kpi-value tnum', text: stats.hitRate === null ? '—' : U.pctPlain(stats.hitRate, 1) }),

      ]),

        [t('date'), t('symbol'), t('price_at_signal'), t('score'), t('decision'),

        list.map(function (e) {

        ];
      })
    ) : UI.empty('no_data');
    host.appendChild(UI.card('history_title', 'history_sub', archive));

    function dayDetail(s) {

        U.el('strong', { text: s.date }),

(function (root) {

  const t = function (k, p) { return AP.t(k, p); };

  /* ---------- which indicator conditions actually preceded good signals ---------- */
  function indicatorEffectiveness() {
    const entries = AP.journal.entries().filter(function (e) {
      return e.indicators && ['success', 'fail', 'partial'].indexOf(e.outcome) >= 0 &&
        AP.journal.BULLISH.indexOf(e.decision) >= 0;
    });
    const conds = [
      { key: 'r_above_sma200', test: function (i) { return i.sma200 && i.sma200 > 0 ? true : null; }, val: function (e) { return e.price > e.indicators.sma200; } },
      { key: 'r_rsi_healthy', test: function (i) { return i.rsi !== null; }, val: function (e) { return e.indicators.rsi >= 45 && e.indicators.rsi <= 65; } },
      { key: 'r_macd_pos', test: function (i) { return i.macdHist !== null; }, val: function (e) { return e.indicators.macdHist > 0; } },
      { key: 'r_vol_low', test: function (i) { return i.atrPct !== null; }, val: function (e) { return e.indicators.atrPct < 3; } },
      { key: 'r_no_overbought', test: function (i) { return i.chg5d !== null; }, val: function (e) { return e.indicators.chg5d < 8; } },
      { key: 'r_near_high', test: function (i) { return i.fromHigh !== null; }, val: function (e) { return e.indicators.fromHigh > -12; } }
    ];
    return conds.map(function (c) {
      let tN = 0, tS = 0, fN = 0, fS = 0;
      entries.forEach(function (e) {
        if (!c.test(e.indicators)) return;
        const on = c.val(e);
        const ok = e.outcome === 'success' ? 1 : 0;
        if (on) { tN++; tS += ok; } else { fN++; fS += ok; }
      });
      const withRate = tN ? (tS / tN) * 100 : null;
      const withoutRate = fN ? (fS / fN) * 100 : null;
      return {
        key: c.key, n: tN + fN, withRate: withRate, withoutRate: withoutRate,
        lift: (withRate !== null && withoutRate !== null) ? withRate - withoutRate : null
      };
    }).filter(function (r) { return r.n >= 3; })
      .sort(function (a, b) { return (b.lift === null ? -999 : b.lift) - (a.lift === null ? -999 : a.lift); });
  }

  function verdict(a, benchTable, jstats) {
    const dayNo = AP.store.dayNumberRaw();
    const total = AP.store.settings().experimentDays;
    const pfRow = benchTable.find(function (r) { return r.id === 'portfolio'; });
    const rivals = benchTable.filter(function (r) { return !r.isPortfolio; });
    const bestRival = rivals.length ? rivals.slice().sort(function (x, y) { return y.retPct - x.retPct; })[0] : null;
    const beatsBest = bestRival ? pfRow.retPct - bestRival.retPct : 0;
    const reasons = [];

    const thinSample = a.tradesCount < 5 || jstats.graded < 8 || dayNo < Math.min(45, total * 0.5);
    if (thinSample) {
      reasons.push(AP.i18n.lang === 'ar'
        ? 'حجم العينة صغير (' + a.tradesCount + ' صفقة مغلقة، ' + jstats.graded + ' إشارة مُقيَّمة، اليوم ' + Math.min(dayNo, total) + ' من ' + total + ') — لا يكفي لاستنتاج موثوق.'
        : 'Sample is small (' + a.tradesCount + ' closed trades, ' + jstats.graded + ' graded signals, day ' + Math.min(dayNo, total) + ' of ' + total + ') — not enough for a reliable conclusion.');
    }
    if (bestRival) {
      reasons.push((AP.i18n.lang === 'ar' ? 'الفرق مقابل أفضل مرجع (' : 'Gap versus the best benchmark (') +
        t(bestRival.labelKey) + '): ' + U.pct(beatsBest));
    }
    if (a.profitFactor !== null && a.profitFactor !== Infinity) {
      reasons.push('Profit Factor: ' + U.round(a.profitFactor, 2));
    }
    reasons.push(t('max_drawdown') + ': ' + U.pctPlain(-Math.abs(a.maxDrawdown), 2));
    if (jstats.hitRate !== null) reasons.push(t('signal_quality') + ': ' + U.pctPlain(jstats.hitRate, 1));

    let key;
    const pf = a.profitFactor === null ? 0 : (a.profitFactor === Infinity ? 3 : a.profitFactor);
    if (a.totalReturnPct < -10 || (a.maxDrawdown > 25 && a.totalReturnPct < 0)) key = 'verdict_not_ready';
    else if (thinSample) key = 'verdict_needs_more';

    else if (a.totalReturnPct > -5) key = 'verdict_needs_more';
    else key = 'verdict_not_ready';

    return { key: key, reasons: reasons, beatsBest: beatsBest, bestRival: bestRival };

        errors.push((AP.i18n.lang === 'ar'
          ? 'خسارة في ' + c.symbol + ' بنسبة ' + U.pct(c.plPct) + ' خلال ' + c.holdDays + ' يومًا'
          : 'Loss in ' + c.symbol + ' of ' + U.pct(c.plPct) + ' over ' + c.holdDays + ' days') +
          (c.score ? ' — Signal Score ' + c.score : ''));
      }
    });
    if (a.avgLoss !== null && a.avgGain !== null && Math.abs(a.avgLoss) > a.avgGain) {
      errors.push(AP.i18n.lang === 'ar'
        ? 'متوسط الخسارة (' + U.pct(a.avgLoss) + ') أكبر من متوسط الربح (' + U.pct(a.avgGain) + ') — وقف الخسارة أو حجم المركز يحتاج مراجعة.'
        : 'Average loss (' + U.pct(a.avgLoss) + ') exceeds average gain (' + U.pct(a.avgGain) + ') — stop placement or position sizing needs review.');
    }
    if (a.cashWeight > 60 && a.totalReturnPct < 2) {
      errors.push(AP.i18n.lang === 'ar'
        ? 'نسبة السيولة مرتفعة (' + U.pctPlain(a.cashWeight, 0) + ') — الانتظار الطويل قلّل من العائد مقابل الاستثمار المنتظم.'
        : 'Cash weight is high (' + U.pctPlain(a.cashWeight, 0) + ') — extended waiting reduced return versus regular investing.');
    }
    if (a.maxDrawdown > 15) {
      errors.push(AP.i18n.lang === 'ar'
        ? 'أقصى تراجع بلغ ' + U.pctPlain(a.maxDrawdown, 1) + ' — تركيز المحفظة أو التوقيت زاد من التقلب.'
        : 'Maximum drawdown reached ' + U.pctPlain(a.maxDrawdown, 1) + ' — concentration or timing increased volatility.');
    }
    if (!errors.length) {
      errors.push(AP.i18n.lang === 'ar'
        ? 'لا توجد أخطاء جوهرية واضحة في البيانات المتاحة حتى الآن.'
        : 'No clear material errors in the data collected so far.');
    }
    host.appendChild(UI.card('error_analysis', null,
      U.el('ul', { class: 'reason-list' }, errors.map(function (e) { return U.el('li', { text: e }); }))));

    // indicator usefulness
    const eff = indicatorEffectiveness();
    host.appendChild(UI.card('useful_indicators', null, eff.length
      ? UI.table([t('indicators'), t('trades_count'), t('was_successful'), t('signal_quality')],
        eff.map(function (r) {
          return [
            t(r.key),
            String(r.n),
            r.withRate === null ? '—' : U.pctPlain(r.withRate, 0),
            r.lift === null ? '—' : U.el('span', { class: U.sign(r.lift), text: U.pct(r.lift, 0) })
          ];
        }))
      : UI.empty('journal_empty')));

    // weak signals
    const weak = Object.keys(jstats.byBand).map(function (k) {
      return Object.assign({ key: k }, jstats.byBand[k]);
    }).filter(function (b) { return b.graded >= 2 && b.hitRate !== null && b.hitRate < 50; })
      .sort(function (x, y) { return x.hitRate - y.hitRate; });
    host.appendChild(UI.card('weak_signals', null, weak.length
      ? UI.table([t('signal'), t('trades_count'), t('was_successful'), t('avg_gain')],
        weak.map(function (b) {
          return [t(b.key), String(b.total), U.pctPlain(b.hitRate, 0),
          b.avgRet === null ? '—' : U.el('span', { class: U.sign(b.avgRet), text: U.pct(b.avgRet) })];
        }))
      : UI.empty(AP.i18n.lang === 'ar' ? 'لا توجد فئة إشارات بأداء ضعيف واضح حتى الآن.' : 'No clearly weak signal band so far.')));

    // verdict
    const vbox = U.el('div', { class: 'verdict' }, [
      U.el('div', { class: 'card-sub', text: t('final_verdict') }),
      U.el('div', { class: 'verdict-value', text: t(v.key) })
    ]);
    host.appendChild(UI.card('final_verdict', null, U.el('div', {}, [
      vbox,
      U.el('div', { class: 'card-sub', style: { marginBottom: '6px' }, text: t('verdict_basis') }),
      U.el('ul', { class: 'reason-list' }, v.reasons.map(function (r) { return U.el('li', { text: r }); })),
      U.el('div', { class: 'notice info', style: { marginTop: '10px' }, text: t('prob_note') })
    ])));
  };

  /* ---------------- Settings ---------------- */
  AP.views.settings = function (host) {
    const st = AP.store.settings();

    function field(labelKey, node, hintKey) {
      return U.el('div', { class: 'field' }, [
        U.el('label', { text: t(labelKey) }), node,
        hintKey ? U.el('div', { class: 'hint', text: t(hintKey) }) : null
      ]);
    }
    function numInput(value, step) {
      return U.el('input', { type: 'number', step: step || '1', value: String(value) });
    }

    /* general */
    const langSel = U.el('select', {}, [
      U.el('option', { value: 'ar', text: 'العربية' }),
      U.el('option', { value: 'en', text: 'English' })
    ]);
    langSel.value = AP.i18n.lang;
    langSel.addEventListener('change', function () { AP.app.setLang(langSel.value); });

    const themeSel = U.el('select', {}, [
      U.el('option', { value: 'dark', text: t('theme_dark') }),
      U.el('option', { value: 'light', text: t('theme_light') })
    ]);
    themeSel.value = st.theme;
    themeSel.addEventListener('change', function () { AP.app.setTheme(themeSel.value); });

    host.appendChild(UI.card('general', null, U.el('div', { class: 'form-row' }, [
      field('lang_label', langSel), field('theme_dark', themeSel)
    ])));

    /* capital & experiment */
    const capIn = numInput(st.initialCapital, '100');
    const startIn = U.el('input', { type: 'date', value: st.startDate });
    const daysIn = numInput(st.experimentDays, '1');
    host.appendChild(UI.card('capital_settings', null, U.el('div', {}, [
      U.el('div', { class: 'form-row' }, [field('initial_capital_field', capIn), field('start_date', startIn)]),
      field('experiment_days', daysIn),
      U.el('div', { class: 'notice warn', text: t('apply_capital_warning') }),
      U.el('button', {
        class: 'btn primary', text: t('save'),
        onclick: function () {
          const newCap = U.num(capIn.value, st.initialCapital);
          st.startDate = startIn.value || st.startDate;
          st.experimentDays = U.clamp(U.num(daysIn.value, 90), 1, 3650);
          if (newCap !== st.initialCapital) {
            UI.confirm(t('apply_capital_warning'), function () {
              AP.store.resetCapital(newCap);
              AP.app.refresh(false);
              UI.toast(t('save') + ' ✓', 'good');
            });
          } else {
            AP.store.save();
            AP.app.refresh(false);
            UI.toast(t('save') + ' ✓', 'good');
          }
        }
      })
    ])));

    /* risk */
    const maxSingleIn = numInput(st.risk.maxSingle, '0.5');
    const maxEtfIn = numInput(st.risk.maxEtf, '0.5');
    const minCashIn = numInput(st.risk.minCash, '0.5');
    const riskTradeIn = numInput(st.risk.riskPerTrade, '0.1');
    host.appendChild(UI.card('risk_settings', null, U.el('div', {}, [
      U.el('div', { class: 'form-row' }, [field('max_single', maxSingleIn), field('max_etf', maxEtfIn)]),
      U.el('div', { class: 'form-row' }, [field('min_cash', minCashIn), field('risk_per_trade', riskTradeIn)]),
      U.el('div', { class: 'notice', text: AP.i18n.lang === 'ar'
        ? 'قواعد ثابتة خلال التجربة: بدون Margin، بدون Options، بدون Short Selling، ولا مطاردة للأسعار بعد صعود حاد.'
        : 'Fixed rules for the experiment: no margin, no options, no short selling, and no chasing after sharp run-ups.' }),
      U.el('button', {
        class: 'btn primary', text: t('save'),
        onclick: function () {
          st.risk.maxSingle = U.clamp(U.num(maxSingleIn.value, 10), 1, 100);
          st.risk.maxEtf = U.clamp(U.num(maxEtfIn.value, 25), 1, 100);
          st.risk.minCash = U.clamp(U.num(minCashIn.value, 10), 0, 90);
          st.risk.riskPerTrade = U.clamp(U.num(riskTradeIn.value, 1), 0.1, 10);
          AP.store.save();
          AP.app.rescan();
          UI.renderShell();
          UI.toast(t('save') + ' ✓', 'good');
        }
      })
    ])));

    /* market data */
    const provSel = U.el('select', {}, [
      U.el('option', { value: 'auto', text: t('provider_auto') }),
      U.el('option', { value: 'stooq', text: t('provider_stooq') }),
      U.el('option', { value: 'yahoo', text: t('provider_yahoo') }),
      U.el('option', { value: 'manual', text: t('provider_manual') }),
      U.el('option', { value: 'demo', text: t('provider_demo') })
    ]);
    provSel.value = st.provider;
    const proxyIn = U.el('input', { type: 'text', value: st.proxyUrl, placeholder: 'https://api.allorigins.win/raw?url=' });

    const manualHost = U.el('div', {});
    function renderManual() {
      manualHost.innerHTML = '';
      const rows = AP.store.watchlist().map(function (w) {
        const input = U.el('input', {
          type: 'number', step: '0.01',
          value: AP.store.lastPrice(w.symbol) ? U.round(AP.store.lastPrice(w.symbol), 2) : ''
        });
        input.addEventListener('change', function () {
          const v = U.num(input.value);
          if (v > 0) {
            AP.market.setManualPrice(w.symbol, U.today(), v);
            AP.app.rescan();
            UI.toast(w.symbol + ' ✓', 'good');
          }
        });
        const earn = U.el('input', { type: 'date', value: AP.store.s.earnings[w.symbol] || '' });
        earn.addEventListener('change', function () {
          if (earn.value) AP.store.s.earnings[w.symbol] = earn.value;
          else delete AP.store.s.earnings[w.symbol];
          AP.store.save();
        });
        return [
          U.el('span', { class: 'sym', text: w.symbol }),
          U.el('span', { class: 'tiny muted', text: AP.market.sourceOf(w.symbol) || '—' }),
          input,
          earn
        ];
      });
      manualHost.appendChild(UI.table([t('symbol'), t('data_source'), t('last_price'), t('earnings_next')], rows));
    }
    renderManual();

    host.appendChild(UI.card('data_settings', null, U.el('div', {}, [
      U.el('div', { class: 'form-row' }, [field('provider', provSel), field('proxy_url', proxyIn, 'proxy_hint')]),
      U.el('button', {
        class: 'btn primary', text: t('save'),
        onclick: function () {
          st.provider = provSel.value;
          st.proxyUrl = proxyIn.value.trim();
          AP.store.save();
          AP.app.refresh(true);
          UI.toast(t('save') + ' ✓', 'good');
        }
      }),
      U.el('div', { class: 'sep' }),
      U.el('div', { class: 'card-sub', text: t('manual_prices') }),
      U.el('div', { class: 'hint', style: { marginBottom: '8px' }, text: t('manual_hint') }),
      manualHost
    ])));

    /* data management */
    const importInput = U.el('input', { type: 'file', accept: '.json', style: { display: 'none' } });
    importInput.addEventListener('change', function () {
      const f = importInput.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          AP.store.importJSON(String(reader.result));
          AP.app.boot();
          UI.toast(t('import') + ' ✓', 'good');
        } catch (e) {
          UI.toast(t('err_invalid'), 'bad');
        }
      };
      reader.readAsText(f);
    });

    host.appendChild(UI.card('data_management', null, U.el('div', {}, [
      U.el('div', { class: 'row' }, [
        U.el('button', {
          class: 'btn', text: t('export_data'),
          onclick: function () {
            U.download('asaad-paper-invest-' + U.today() + '.json', AP.store.exportJSON());
          }
        }),
        U.el('button', { class: 'btn', text: t('import_data'), onclick: function () { importInput.click(); } }),
        U.el('button', {
          class: 'btn', text: t('rebuild_snapshots'),
          onclick: function () {
            AP.store.saveSnapshot({ scores: AP.app.lastScores(), regime: AP.app.currentScan().regime.label });
            AP.journal.updateFollowUps();
            UI.toast(t('snapshot_saved') + ' ✓', 'good');
            UI.renderShell();
          }
        }),
        U.el('button', {
          class: 'btn', text: t('seed_demo'),
          onclick: function () {
            UI.confirm(t('replay_confirm'), function () {
              const daysIn2 = 90;
              UI.toast(t('replay_running'));
              AP.backtest.run(daysIn2, function (done, total) {
                if (done === total) UI.toast(t('replay_done', { a: total }), 'good');
              }).then(function (res) {
                if (!res) return;
                AP.app.rescan();
                AP.ui.renderShell();
              }).catch(function (e) {
                UI.toast(String(e.message || e), 'bad');
              });
            });
          }
        }),
        U.el('button', {
          class: 'btn danger', text: t('reset_all'),
          onclick: function () {
            UI.confirm(t('reset_confirm'), function () {
              AP.store.resetAll();
              AP.app.boot();
              UI.toast(t('reset') + ' ✓', 'good');
            });
          }
        }),
        importInput
      ]),
      U.el('div', { class: 'hint', style: { marginTop: '10px' }, text: t('storage_used') + ': ' + AP.store.storageSize() })
    ])));

    host.appendChild(UI.card('about', null, U.el('div', {}, [
      U.el('p', { class: 'small', text: t('about_text') }),
      U.el('p', { class: 'tiny muted', text: t('paper_only') })
    ])));
  };
})(window);

</script>
  <script>
/* ===== assets/js/app.js ===== */
/* Asaad Paper Invest — bootstrap & daily cycle */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const App = {
    booted: false,
    scanCache: null,

    boot() {
      AP.store.load();
      const st = AP.store.settings();
      AP.i18n.setLang(st.lang);
      App.applyLang();
      App.applyTheme();

      const hash = (location.hash || '').replace('#', '');
      if (hash && AP.views[hash]) AP.ui.route = hash;

      App.rescan();
      AP.ui.renderShell();
      App.booted = true;

      // fetch market data in the background, then run the daily cycle
      App.refresh(false);

      window.addEventListener('hashchange', function () {
        const h = (location.hash || '').replace('#', '');
        if (h && AP.views[h] && h !== AP.ui.route) {
          AP.ui.route = h;
          AP.ui.renderShell();
        }
      });
      window.addEventListener('resize', U.debounce(function () { AP.ui.renderView(); }, 250));
    },

    /* Pull prices, re-score everything, snapshot the day, raise alerts. */
    refresh(showToast) {
      if (AP.ui.busy) return Promise.resolve();
      AP.ui.busy = true;
      if (showToast) AP.ui.toast(AP.t('refreshing'));
      const bar = document.querySelector('.appbar .icon-btn');
      if (bar) bar.textContent = '⏳';

      return AP.market.refreshAll()
        .catch(function (e) { console.warn('refresh failed', e); return null; })
        .then(function () {
          return AP.news.fetchFor().catch(function () { return null; });
        })
        .then(function () {
          App.runDailyCycle();
          AP.ui.busy = false;
          AP.ui.renderShell();
          if (showToast) {
            const mode = AP.store.s.meta.dataMode;
            AP.ui.toast(AP.t('last_update') + ': ' + U.fmtTime(Date.now(), AP.i18n.lang) +
              ' · ' + AP.t(mode === 'demo' ? 'demo_data_badge' : mode === 'cached' ? 'cached_data_badge' : 'live_data_badge'),
              mode === 'demo' ? '' : 'good');
          }
        });
    },

    /* Everything that must happen once per day, idempotently. */
    runDailyCycle() {
      App.rescan();
      const scan = App.scanCache;
      AP.journal.updateFollowUps();
      AP.journal.logScan(scan);
      AP.alerts.evaluate(scan);
      AP.store.saveSnapshot({
        scores: App.lastScores(),
        regime: scan.regime.label,
        breadth: U.round(scan.regime.breadth, 1)
      });
      try { AP.s507.ensure(); } catch (e) { console.warn('507 sim failed', e); }
    },

    rescan() {
      App.scanCache = AP.signals.scanAll();
      AP.lastScan = App.scanCache;
      return App.scanCache;
    },

    currentScan() {
      if (!App.scanCache) App.rescan();
      return App.scanCache;
    },

    lastScores() {
      const scan = App.currentScan();
      const out = {};
      scan.evals.forEach(function (e) {
        if (!e.ok) return;
        out[e.symbol] = {
          score: e.score,
          decision: e.decision,
          band: e.band ? e.band.key : null,
          rsi: e.ind.rsi === null ? null : U.round(e.ind.rsi, 1)
        };
      });
      return out;
    },

    /* ---------- theme & language ---------- */
    applyTheme() {
      document.documentElement.setAttribute('data-theme', AP.store.settings().theme === 'light' ? 'light' : 'dark');
    },
    setTheme(theme) {
      AP.store.settings().theme = theme === 'light' ? 'light' : 'dark';
      AP.store.save();
      App.applyTheme();
      AP.ui.renderShell();
    },
    toggleTheme() {
      App.setTheme(AP.store.settings().theme === 'dark' ? 'light' : 'dark');
    },

    applyLang() {
      const lang = AP.i18n.lang;
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      document.title = AP.t('app_name') + ' — ' + AP.t('app_tagline');
    },
    setLang(lang) {
      AP.i18n.setLang(lang);
      AP.store.settings().lang = AP.i18n.lang;
      AP.store.save();
      App.applyLang();
      AP.ui.renderShell();
    },
    toggleLang() {
      App.setLang(AP.i18n.lang === 'ar' ? 'en' : 'ar');
    }
  };

  AP.app = App;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { App.boot(); });
  } else {
    App.boot();
  }
})(window);

</script>
