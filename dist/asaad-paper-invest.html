/* ===== assets/js/journal.js ===== */
/* Asaad Paper Invest — decision log.
   Every recommendation is stored (executed or not) and re-scored later
   at +1 day, +1 week and +1 month so signal quality can be judged. */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const ACTIONABLE = ['dec_buy', 'dec_scale_in', 'dec_take_profit', 'dec_trim', 'dec_exit'];
  const BULLISH = ['dec_buy', 'dec_scale_in'];
  const BEARISH = ['dec_exit', 'dec_trim', 'dec_take_profit'];

  const Journal = {
    entries() { return AP.store.s.journal; },

    exists(date, symbol, decision) {
      return AP.store.s.journal.some(function (e) {
        return e.date === date && e.symbol === symbol && e.decision === decision;
      });
    },

    add(ev, opts) {
      opts = opts || {};
      const date = opts.date || U.today();
      if (Journal.exists(date, ev.symbol, ev.decision)) {
        return AP.store.s.journal.find(function (e) {
          return e.date === date && e.symbol === ev.symbol && e.decision === ev.decision;
        });
      }
      const entry = {
        id: U.uid('jr'),
        date: date,
        ts: Date.now(),
        symbol: ev.symbol,
        price: ev.ind ? ev.ind.price : AP.store.lastPrice(ev.symbol),
        score: ev.score,
        band: ev.band ? ev.band.key : null,
        decision: ev.decision,
        reasons: (ev.reasons || []).map(function (r) {
          return typeof r === 'string' ? { key: r, params: null } : { key: r.key, params: r.params || null };
        }),
        plan: ev.plan ? {
          entry: U.round(ev.plan.entry, 4), zoneLow: U.round(ev.plan.zoneLow, 4),
          zoneHigh: U.round(ev.plan.zoneHigh, 4), stop: U.round(ev.plan.stop, 4),
          t1: U.round(ev.plan.t1, 4), t2: U.round(ev.plan.t2, 4), rr: U.round(ev.plan.rr, 2)
        } : null,
        size: ev.size ? { pct: ev.size.pct, amount: U.round(ev.size.amount, 2) } : null,
        indicators: ev.ind ? {
          rsi: ev.ind.rsi === null ? null : U.round(ev.ind.rsi, 1),
          sma20: U.round(ev.ind.sma20, 2), sma50: U.round(ev.ind.sma50, 2), sma200: U.round(ev.ind.sma200, 2),
          macdHist: ev.ind.macd ? U.round(ev.ind.macd.hist, 4) : null,
          atrPct: ev.ind.atrPct === null ? null : U.round(ev.ind.atrPct, 2),
          chg5d: ev.ind.chg5d === null ? null : U.round(ev.ind.chg5d, 2),
          fromHigh: ev.ind.fromHigh === null ? null : U.round(ev.ind.fromHigh, 2)
        } : null,
        components: ev.components || null,
        regime: opts.regime || null,
        confidence: ev.confidence || null,
        executed: false,
        txId: null,
        followUp: { d1: null, w1: null, m1: null },
        outcome: 'pending',
        outcomePct: null,
        source: ev.source || null
      };
      AP.store.s.journal.unshift(entry);
      if (AP.store.s.journal.length > 2000) AP.store.s.journal.length = 2000;
      return entry;
    },

    /* Log the whole daily scan: the headline pick plus every actionable call. */
    logScan(scan) {
      const date = scan.date || U.today();
      const regimeInfo = { label: scan.regime.label, breadth: U.round(scan.regime.breadth, 1) };
      let logged = 0;
      scan.evals.forEach(function (ev) {
        if (!ev.ok) return;
        if (ACTIONABLE.indexOf(ev.decision) < 0) return;
        // only log entries the system would actually act on
        if (BULLISH.indexOf(ev.decision) >= 0 && ev.score < 65) return;
        const before = AP.store.s.journal.length;
        Journal.add(ev, { date: date, regime: regimeInfo });
        if (AP.store.s.journal.length > before) logged++;

      if (!scan.pick && !Journal.exists(date, '—', 'dec_none')) {
        AP.store.s.journal.unshift({
          id: U.uid('jr'), date: date, ts: Date.now(), symbol: '—',
          price: null, score: null, band: null, decision: 'dec_none',
          reasons: [{ key: 'no_trade_reason', params: null }],
          plan: null, size: null, indicators: null, components: null,
          regime: regimeInfo, confidence: null, executed: false, txId: null,
          followUp: { d1: null, w1: null, m1: null }, outcome: 'n/a', outcomePct: null
        });
        logged++;
      }
      if (logged) AP.store.save();
      return logged;
    },

    markExecuted(entryId, txId) {
      const e = AP.store.s.journal.find(function (x) { return x.id === entryId; });
      if (e) { e.executed = true; e.txId = txId || null; AP.store.save(); }
    },

    latestPlanFor(symbol) {
      const e = AP.store.s.journal.find(function (x) {
        return x.symbol === symbol && x.plan && BULLISH.indexOf(x.decision) >= 0;
      });
      return e ? e.plan : null;
    },

    /* Fill in +1d / +1w / +1m prices and grade each signal. */
    updateFollowUps() {
      let changed = 0;
      const today = U.today();
      AP.store.s.journal.forEach(function (e) {
        if (!e.symbol || e.symbol === '—' || !e.price) return;
        const horizons = [['d1', 1], ['w1', 7], ['m1', 30]];
        horizons.forEach(function (h) {
          const key = h[0], days = h[1];
          if (e.followUp[key] !== null && e.followUp[key] !== undefined) return;
          const target = U.addDays(e.date, days);
          if (target > today) return;
          const hit = AP.store.priceOnOrAfter(e.symbol, target);
          if (!hit || hit.date <= e.date) return;   // no session after the signal yet
          e.followUp[key] = {
            date: hit.date,
            price: U.round(hit.price, 4),
            ret: U.round(((hit.price - e.price) / e.price) * 100, 2)
          };
          changed++;
        });
        const graded = Journal.grade(e);
        if (graded.outcome !== e.outcome || graded.outcomePct !== e.outcomePct) {
          e.outcome = graded.outcome;
          e.outcomePct = graded.outcomePct;
          changed++;
        }
      });
      if (changed) AP.store.save();
      return changed;
    },

    grade(e) {
      if (!e.price || e.decision === 'dec_none' || e.decision === 'dec_wait') {
        return { outcome: e.decision === 'dec_none' ? 'n/a' : 'pending', outcomePct: null };
      }
      const fu = e.followUp || {};
      const best = fu.m1 || fu.w1 || fu.d1;
      if (!best) return { outcome: 'pending', outcomePct: null };
      const ret = U.num(best.ret);
      const isBull = BULLISH.indexOf(e.decision) >= 0;
      // for defensive calls, a falling price means the call was right
      const effective = isBull ? ret : -ret;
      const threshold = fu.m1 ? 1.5 : fu.w1 ? 1.0 : 0.5;
      let outcome;
      if (effective > threshold) outcome = 'success';
      else if (effective < -threshold) outcome = 'fail';
      else outcome = 'partial';
      return { outcome: outcome, outcomePct: U.round(ret, 2) };
    },

    /* ---------- quality statistics ---------- */
    stats() {
      const list = AP.store.s.journal.filter(function (e) {
        return e.symbol !== '—' && ACTIONABLE.indexOf(e.decision) >= 0;
      });
      const graded = list.filter(function (e) { return ['success', 'fail', 'partial'].indexOf(e.outcome) >= 0; });
      const byBand = {}, byDecision = {}, bySymbol = {};

      function bucket(map, key, e) {
        if (!map[key]) map[key] = { total: 0, success: 0, fail: 0, partial: 0, retSum: 0, graded: 0 };
        const b = map[key];
        b.total++;
        if (['success', 'fail', 'partial'].indexOf(e.outcome) >= 0) {
          b[e.outcome]++;
          b.graded++;
          b.retSum += U.num(e.outcomePct);
        }
      }
      list.forEach(function (e) {
        bucket(byBand, e.band || 'unknown', e);
        bucket(byDecision, e.decision, e);
        bucket(bySymbol, e.symbol, e);
      });
      function rate(b) { return b.graded ? (b.success / b.graded) * 100 : null; }
      Object.keys(byBand).forEach(function (k) { byBand[k].hitRate = rate(byBand[k]); byBand[k].avgRet = byBand[k].graded ? byBand[k].retSum / byBand[k].graded : null; });
      Object.keys(byDecision).forEach(function (k) { byDecision[k].hitRate = rate(byDecision[k]); byDecision[k].avgRet = byDecision[k].graded ? byDecision[k].retSum / byDecision[k].graded : null; });
      Object.keys(bySymbol).forEach(function (k) { bySymbol[k].hitRate = rate(bySymbol[k]); bySymbol[k].avgRet = bySymbol[k].graded ? bySymbol[k].retSum / bySymbol[k].graded : null; });

      const successCount = graded.filter(function (e) { return e.outcome === 'success'; }).length;
      return {
        total: list.length,
        graded: graded.length,
        pending: list.length - graded.length,

  <script>
/* ===== assets/js/signals.js ===== */
/* Asaad Paper Invest — Asaad Signal Score engine.
   Never claims to know future prices: every output is a probabilistic reading
   of the data available today. */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const WEIGHTS = { trend: 28, momentum: 20, valuation: 12, volatility: 12, market: 14, news: 8, rr: 6 };

  const BANDS = [
    { min: 80, key: 'band_strong', cls: 'band-strong' },
    { min: 65, key: 'band_gradual', cls: 'band-gradual' },
    { min: 50, key: 'band_watch', cls: 'band-watch' },
    { min: 35, key: 'band_nobuy', cls: 'band-nobuy' },
    { min: 0, key: 'band_avoid', cls: 'band-avoid' }
  ];

  function bandOf(score) {
    for (let i = 0; i < BANDS.length; i++) if (score >= BANDS[i].min) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  /* ---------- market regime ---------- */
  function marketRegime() {
    const proxy = AP.store.settings().marketProxy || 'VOO';
    const bars = AP.market.seriesWithManual(proxy);
    const ind = bars && bars.length > 3 ? AP.ind.analyze(bars) : null;

    // breadth: share of watchlist trading above its own SMA200 (or SMA50 fallback)
    let above = 0, counted = 0;
    AP.store.symbols().forEach(function (s) {
      const b = AP.market.seriesWithManual(s);
      if (!b || b.length < 60) return;
      const a = AP.ind.analyze(b);
      if (!a) return;
      const ref = a.sma200 || a.sma50;
      if (!ref) return;
      counted++;
      if (a.price > ref) above++;
    });
    const breadth = counted ? above / counted : 0.5;

    let sc = 0;
    if (ind) {
      if (ind.sma200 && ind.price > ind.sma200) sc += 0.35; else sc -= 0.35;
      if (ind.sma50 && ind.sma200 && ind.sma50 > ind.sma200) sc += 0.2; else sc -= 0.15;
      if (ind.sma20 && ind.price > ind.sma20) sc += 0.15; else sc -= 0.1;
      if (ind.chg1m !== null) sc += U.clamp(ind.chg1m / 12, -0.2, 0.2);
      if (ind.atrPct !== null && ind.atrPct > 2.2) sc -= 0.12;
    }
    sc += (breadth - 0.5) * 0.6;
    sc = U.clamp(sc, -1, 1);

    const label = sc > 0.2 ? 'positive' : sc < -0.2 ? 'negative' : 'neutral';
    return {
      score: sc,
      label: label,
      breadth: breadth * 100,
      proxy: proxy,
      ind: ind,
      norm: (sc + 1) / 2
    };
  }

  /* ---------- component scores (each 0..1) ---------- */
  function trendScore(a, R) {
    if (!a) return { v: 0.5, notes: [] };
    const notes = [];
    let v = 0, w = 0;
    const longRef = a.sma200 || a.sma50;
    if (longRef) {
      w += 0.34;
      if (a.price > longRef) { v += 0.34; notes.push(a.sma200 ? 'r_above_sma200' : null); }
      else notes.push(a.sma200 ? 'r_below_sma200' : null);
    }
    if (a.sma50 && a.sma200) {
      w += 0.22;
      if (a.sma50 > a.sma200) { v += 0.22; notes.push('r_golden'); }
      else notes.push('r_death');
    }
    if (a.sma20) {
      w += 0.16;
      if (a.price > a.sma20) v += 0.16;
    }
    if (a.ema20) {
      w += 0.12;
      if (a.price > a.ema20) v += 0.12;
    }
    if (a.sma20Slope !== null) {
      w += 0.09;
      if (a.sma20Slope > 0) v += 0.09;
    }
    if (a.sma200Slope !== null) {
      w += 0.07;
      if (a.sma200Slope > 0) v += 0.07;
    }
    const val = w ? v / w : 0.5;
    if (val >= 0.75) notes.push('r_trend_ok');
    else if (val > 0.35) notes.push('r_trend_mixed');
    return { v: val, notes: notes.filter(Boolean) };
  }

  function rsiQuality(rsi) {
    if (rsi === null || rsi === undefined) return 0.5;
    if (rsi >= 50 && rsi <= 65) return 1;
    if (rsi > 65 && rsi <= 70) return 0.72;
    if (rsi > 70 && rsi <= 78) return 0.38;
    if (rsi > 78) return 0.18;
    if (rsi >= 45) return 0.82;
    if (rsi >= 40) return 0.62;
    if (rsi >= 32) return 0.42;
    return 0.3;
  }

  function momentumScore(a) {
    if (!a) return { v: 0.5, notes: [] };
    const notes = [];
    const rq = rsiQuality(a.rsi);
    if (a.rsi !== null && a.rsi !== undefined) {
      notes.push({ key: 'r_rsi', params: { a: U.round(a.rsi, 1) } });
      if (a.rsi > 70) notes.push('r_rsi_over');
      else if (a.rsi < 30) notes.push('r_rsi_under');
      else notes.push('r_rsi_healthy');
    }
    let mq = 0.5;
    if (a.macd) {
      mq = a.macd.hist > 0 ? 0.8 : 0.25;
      if (a.macd.prevHist !== null) {
        if (a.macd.hist > a.macd.prevHist) mq += 0.2; else mq -= 0.1;
      }
      mq = U.clamp(mq, 0, 1);
      notes.push(a.macd.hist > 0 ? 'r_macd_pos' : 'r_macd_neg');
    }
    let roc = 0.5;
    if (a.chg1m !== null) roc = U.clamp(0.5 + a.chg1m / 20, 0, 1);
    if (a.chg5d !== null) roc = U.clamp(roc * 0.75 + (0.5 + a.chg5d / 14) * 0.25, 0, 1);
    return { v: rq * 0.42 + mq * 0.33 + roc * 0.25, notes: notes };
  }

  function valuationScore(a) {
    if (!a) return { v: 0.5, notes: [] };
    const notes = [];
    let ext = 0.6;
    if (a.extAboveSma200 !== null) {
      const e = a.extAboveSma200;
      if (e < -15) ext = 0.35;
      else if (e < 0) ext = 0.6;
      else if (e <= 12) ext = 1;
      else if (e <= 22) ext = 0.65;
      else if (e <= 35) ext = 0.35;
      else { ext = 0.15; notes.push({ key: 'r_extended', params: { a: U.round(e, 1) } }); }
    }
    let pos = 0.6;
    if (a.fromHigh !== null) {
      const fh = a.fromHigh; // negative or 0
      if (fh > -3) { pos = 0.8; notes.push('r_near_high'); }
      else if (fh > -12) pos = 1;
      else if (fh > -25) { pos = 0.6; notes.push({ key: 'r_deep_drawdown', params: { a: U.round(Math.abs(fh), 1) } }); }
      else { pos = 0.35; notes.push({ key: 'r_deep_drawdown', params: { a: U.round(Math.abs(fh), 1) } }); }
    }
    let bbq = 0.6;
    if (a.bb) {
      const p = a.bb.pctB;
      if (p > 1) bbq = 0.2;
      else if (p > 0.85) bbq = 0.45;
      else if (p >= 0.3) bbq = 1;
      else if (p >= 0) bbq = 0.55;
      else bbq = 0.35;
    }
    return { v: ext * 0.45 + pos * 0.3 + bbq * 0.25, notes: notes };
  }

  function volatilityScore(a, isEtf) {
    if (!a) return { v: 0.5, notes: [] };
    const notes = [];
    let v = 0.5;
    if (a.atrPct !== null) {
      const x = a.atrPct;
      if (x < 1.2) v = 1;
      else if (x < 2) v = 0.85;
      else if (x < 3) v = 0.62;
      else if (x < 4.5) v = 0.38;
      else v = 0.15;
      if (x >= 3) notes.push({ key: 'r_vol_high', params: { a: U.round(x, 2) } });
      else notes.push('r_vol_low');
    }
    if (isEtf) v = U.clamp(v + 0.08, 0, 1);
    return { v: v, notes: notes };
  }

  function newsScore(symbol) {
    const s = (AP.news && AP.news.sentimentFor) ? AP.news.sentimentFor(symbol) : { score: 0, count: 0 };
    const notes = [];
    if (!s.count) notes.push('r_news_none');
    else if (s.score < -0.2) notes.push('r_news_neg');
    else if (s.score > 0.2) notes.push('r_news_pos');
    else notes.push('r_news_none');
    return { v: U.clamp(0.5 + s.score * 0.5, 0, 1), notes: notes, raw: s };
  }

  /* ---------- trade plan ---------- */
  function buildPlan(a, symbol) {
    if (!a || !a.price) return null;
    const price = a.price;
    const atr = a.atr || price * 0.02;
    let stop = price - 2 * atr;
    if (a.support && a.support < price * 0.995) {
      stop = Math.max(Math.min(a.support * 0.99, price - 1.2 * atr), price - 3 * atr);
    }
    stop = Math.min(stop, price * 0.98);
    const risk = Math.max(price - stop, price * 0.005);
    let t1 = price + 1.5 * risk;
    let t2 = price + 3 * risk;
    if (a.resistance && a.resistance > price * 1.005) {
      if (a.resistance < t1) { t1 = a.resistance; t2 = Math.max(price + 2.2 * risk, a.resistance * 1.06); }
      else if (a.resistance < t2) { t2 = Math.max(a.resistance, price + 2.4 * risk); }
    }
    const rr = (t1 - price) / risk;
    return {
      entry: price,
      zoneLow: price - 0.6 * atr,
      zoneHigh: price + 0.3 * atr,
      stop: stop,
      t1: t1,
      t2: t2,
      risk: risk,
      riskPct: (risk / price) * 100,
      rr: rr,
      rr2: (t2 - price) / risk
    };
  }

  function sizing(symbol, plan, score, regime) {
    const st = AP.store.settings();
    const pf = AP.portfolio.summary();
    const equity = pf.equity || st.initialCapital;
    const isEtf = AP.store.isEtf(symbol);
    const cap = isEtf ? st.risk.maxEtf : st.risk.maxSingle;

    let pct = cap;
    if (plan && plan.riskPct > 0) {
      const riskBudget = equity * (st.risk.riskPerTrade / 100);
      const dollars = riskBudget / (plan.riskPct / 100);
      pct = Math.min(pct, (dollars / equity) * 100);
    }
    if (score < 80) pct *= 0.6;          // gradual entries are half-sized
    if (score < 65) pct *= 0.5;
    if (regime && regime.label === 'negative') pct *= 0.6;
    if (regime && regime.label === 'neutral') pct *= 0.85;

    // respect the existing weight in this asset
    const held = pf.positions[symbol];
    const heldPct = held ? (held.value / equity) * 100 : 0;
    pct = Math.max(0, Math.min(pct, cap - heldPct));

    // respect the minimum cash buffer
    const investable = Math.max(0, pf.cash - equity * (st.risk.minCash / 100));
    const byCash = equity ? (investable / equity) * 100 : 0;
    pct = Math.min(pct, byCash);

    const amount = equity * (pct / 100);
    return {
      pct: U.round(pct, 2),
      cap: cap,
      amount: amount,
      shares: plan && plan.entry ? Math.floor((amount / plan.entry) * 10000) / 10000 : 0,
      heldPct: U.round(heldPct, 2),
      cashLimited: byCash < cap
    };
  }

  /* ---------- checklist ---------- */
  function checklist(a, plan, regime, betterAlt, newsRaw) {
    const rows = [];
    // `ok` means "this is favourable for entry"; for inverted questions
    // ("has it risen excessively?") the literal answer is the opposite,
    // so each row also carries the plain yes/no the question asked for.
    const longRef = a && (a.sma200 || a.sma50);
    rows.push({
      q: 'q1',
      ok: !!(a && longRef && a.price > longRef && (!a.sma200Slope || a.sma200Slope >= -0.5)),
      val: a && a.sma200 ? 'SMA200 ' + U.round(a.sma200, 2) : (a && a.sma50 ? 'SMA50 ' + U.round(a.sma50, 2) : '—')
    });
    rows.push({
      q: 'q2',
      ok: !!(a && a.sma200 && a.price > a.sma200),
      val: a && a.sma200 ? U.round(a.price, 2) + ' / ' + U.round(a.sma200, 2) : '—'
    });
    rows.push({
      q: 'q3',
      ok: !!(a && a.sma50 && a.sma20 && a.price > a.sma50 && a.sma20 > a.sma50 * 0.98),
      val: a && a.sma50 ? 'SMA50 ' + U.round(a.sma50, 2) : '—'
    });
    rows.push({
      q: 'q4',
      ok: !!(a && a.rsi !== null && a.rsi >= 40 && a.rsi <= 70),
      val: a && a.rsi !== null ? U.round(a.rsi, 1) : '—'
    });
    const overshoot = a && ((a.chg5d !== null && a.chg5d > 12) || (a.extAboveSma200 !== null && a.extAboveSma200 > 28));
    rows.push({
      q: 'q5', ok: !overshoot, invert: true,
      val: a && a.chg5d !== null ? U.pct(a.chg5d, 1) + ' / 5d' : '—'
    });
    const negNews = newsRaw && newsRaw.score < -0.2;
    rows.push({ q: 'q6', ok: !negNews, invert: true, val: negNews ? AP.t('negative') : AP.t('none') });
    rows.push({ q: 'q7', ok: regime.label !== 'negative', val: AP.t('market_' + regime.label) });
    rows.push({
      q: 'q8', ok: !!(plan && plan.rr >= 1.5), noAnswer: true,   // a ratio, not a yes/no
      val: plan ? U.iso(U.round(plan.rr, 2) + ' : 1') : '—'
    });

      q: 'q9', ok: !betterAlt, invert: true,
      val: betterAlt || '—'

    rows.forEach(function (r) {
      r.answer = r.invert ? (r.ok ? 'no' : 'yes') : (r.ok ? 'yes' : 'no');

  }

  /* ---------- main evaluation ---------- */
  function evaluate(symbol, regime, opts) {
    opts = opts || {};
    const bars = AP.market.seriesWithManual(symbol);
    const a = (bars && bars.length > 3) ? AP.ind.analyze(bars) : null;
    if (!a) {
      return {
        symbol: symbol, ok: false, score: null, ind: null,
        band: BANDS[BANDS.length - 1], decision: 'dec_none',
        reasons: ['r_insufficient_history'], confidence: 'conf_low'
      };
    }

    const isEtf = AP.store.isEtf(symbol);
    const t = trendScore(a);
    const m = momentumScore(a);
    const val = valuationScore(a);
    const vol = volatilityScore(a, isEtf);
    const nws = newsScore(symbol);
    const plan = buildPlan(a, symbol);
    const rrq = plan ? U.clamp((plan.rr - 0.8) / 1.7, 0, 1) : 0.4;
    const mkt = regime.norm;

    let raw =
      t.v * WEIGHTS.trend +
      m.v * WEIGHTS.momentum +
      val.v * WEIGHTS.valuation +
      vol.v * WEIGHTS.volatility +
      mkt * WEIGHTS.market +
      nws.v * WEIGHTS.news +
      rrq * WEIGHTS.rr;

    const penalties = [];
    if (a.chg5d !== null && a.chg5d > 12) { raw -= 7; penalties.push('chase'); }
    if (a.rsi !== null && a.rsi > 78) { raw -= 5; penalties.push('overbought'); }
    if (a.sma200 && a.sma50 && a.price < a.sma200 && a.sma50 < a.sma200) raw = Math.min(raw, 46);
    if (nws.raw && nws.raw.score < -0.4) raw = Math.min(raw, 55);

    // low-confidence data is pulled toward neutral rather than trusted
    const src = AP.market.sourceOf(symbol);
    let confidence = 'conf_high';
    if (a.bars < 60 || src === 'demo') confidence = 'conf_low';
    else if (a.bars < 200) confidence = 'conf_med';
    if (a.bars < 60) raw = 50 + (raw - 50) * 0.7;

    const score = U.clamp(Math.round(raw), 0, 100);
    const band = bandOf(score);

    // ---- reasons ----
    const reasons = [];
    function push(list) {
      list.forEach(function (n) {
        if (!n) return;
        reasons.push(typeof n === 'string' ? { key: n, params: null } : n);
      });
    }
    push(t.notes); push(m.notes); push(val.notes); push(vol.notes); push(nws.notes);
    reasons.push({ key: regime.label === 'positive' ? 'r_market_pos' : regime.label === 'negative' ? 'r_market_neg' : 'r_market_neutral', params: null });
    if (plan) reasons.push({ key: plan.rr >= 1.5 ? 'r_rr_good' : 'r_rr_bad', params: { a: U.round(plan.rr, 2) + ':1' } });
    if (a.rsi !== null && a.rsi <= 70 && score >= 60) reasons.push({ key: 'r_no_overbought', params: null });
    if (confidence === 'conf_low') reasons.push({ key: 'r_insufficient_history', params: null });

    const size = sizing(symbol, plan, score, regime);

    const trendLabel = (a.sma50 && a.sma200)
      ? (a.price > a.sma200 && a.sma50 > a.sma200 ? 'trend_up'
        : a.price < a.sma200 && a.sma50 < a.sma200 ? 'trend_down' : 'trend_side')
      : (a.sma20 && a.price > a.sma20 ? 'trend_up' : 'trend_side');

    const riskLabel = a.atrPct === null ? 'risk_med'
      : a.atrPct < 1.8 ? 'risk_low' : a.atrPct < 3.2 ? 'risk_med' : 'risk_high';

    return {
      symbol: symbol,
      ok: true,
      ind: a,
      isEtf: isEtf,
      score: score,
      band: band,
      components: {
        trend: U.round(t.v * 100), momentum: U.round(m.v * 100),
        valuation: U.round(val.v * 100), volatility: U.round(vol.v * 100),
        market: U.round(mkt * 100), news: U.round(nws.v * 100), rr: U.round(rrq * 100)
      },
      weights: WEIGHTS,
      penalties: penalties,
      reasons: reasons,
      plan: plan,
      size: size,
      confidence: confidence,
      trendLabel: trendLabel,
      riskLabel: riskLabel,
      newsRaw: nws.raw,
      source: src
    };
  }

  /* ---------- decision layer ---------- */
  function decideFor(ev, regime, ranked) {
    if (!ev.ok) return { decision: 'dec_none', extra: [] };
    const pf = AP.portfolio.summary();
    const pos = pf.positions[ev.symbol];
    const st = AP.store.settings();
    const extra = [];
    const score = ev.score;

    if (pos && pos.qty > 0) {
      const openPlan = AP.journal.latestPlanFor(ev.symbol);
      const price = ev.ind.price;
      if (openPlan && price <= openPlan.stop) {
        extra.push({ key: 'r_stop_hit', params: null });
        return { decision: 'dec_exit', extra: extra };
      }
      if (score < 35) return { decision: 'dec_exit', extra: extra };
      if (score < 50) return { decision: 'dec_trim', extra: extra };
      if (openPlan && price >= openPlan.t1 && pos.plPct > 0) {
        extra.push({ key: 'r_target_hit', params: null });
        return { decision: 'dec_take_profit', extra: extra };
      }
      if (pos.plPct >= 20 && ev.ind.rsi !== null && ev.ind.rsi > 72) {
        extra.push({ key: 'r_target_hit', params: null });
        return { decision: 'dec_take_profit', extra: extra };
      }
      const cap = ev.isEtf ? st.risk.maxEtf : st.risk.maxSingle;
      if (score >= 65 && ev.size.heldPct < cap - 1 && ev.size.pct > 0.3 && regime.label !== 'negative') {
        return { decision: 'dec_scale_in', extra: extra };
      }
      if (ev.size.heldPct >= cap - 1) extra.push({ key: 'r_cap_reached', params: null });
      return { decision: 'dec_wait', extra: extra };
    }

    // not held
    if (ev.size.pct < 0.25) {
      extra.push({ key: 'r_cap_reached', params: null });
      return { decision: 'dec_wait', extra: extra };
    }
    if (regime.label === 'negative' && score < 80) return { decision: 'dec_wait', extra: extra };
    if (!ev.plan || ev.plan.rr < 1.2) return { decision: 'dec_wait', extra: extra };
    if (score >= 80) return { decision: 'dec_buy', extra: extra };
    if (score >= 65) return { decision: 'dec_scale_in', extra: extra };
    return { decision: 'dec_wait', extra: extra };
  }

  const Signals = {
    WEIGHTS: WEIGHTS,
    BANDS: BANDS,
    bandOf: bandOf,
    marketRegime: marketRegime,
    buildPlan: buildPlan,

    /* Evaluate the whole watchlist and rank it. */
    scanAll() {
      const regime = marketRegime();
      const evals = AP.store.symbols().map(function (s) { return evaluate(s, regime); });
      evals.sort(function (x, y) { return (y.score || 0) - (x.score || 0); });

      const bestSym = evals.length && evals[0].ok ? evals[0].symbol : null;
      evals.forEach(function (ev) {
        const better = (bestSym && ev.symbol !== bestSym && evals[0].score - (ev.score || 0) >= 8) ? bestSym : null;
        const d = decideFor(ev, regime, evals);
        ev.decision = d.decision;
        d.extra.forEach(function (e) { ev.reasons.push(e); });
        if (better) ev.betterAlt = better;
        ev.checklist = ev.ok
          ? checklist(ev.ind, ev.plan, regime, better, ev.newsRaw)
          : [];
      });

      // pick today's headline idea: highest scoring actionable candidate
      let pick = null;
      for (let i = 0; i < evals.length; i++) {
        const e = evals[i];
        if (!e.ok) continue;
        if ((e.decision === 'dec_buy' || e.decision === 'dec_scale_in') && e.score >= 65 && e.size.pct >= 0.25) {
          pick = e; break;
        }
      }
      const holdingActions = evals.filter(function (e) {
        return e.ok && ['dec_exit', 'dec_trim', 'dec_take_profit'].indexOf(e.decision) >= 0;
      });

      return { regime: regime, evals: evals, pick: pick, holdingActions: holdingActions, date: U.today() };
    },

    evaluate: evaluate,
    reasonText(r) {
      if (!r) return '';
      if (typeof r === 'string') return AP.t(r);
      return AP.t(r.key, r.params || undefined);
    }
  };

  AP.signals = Signals;
})(window);

(function (root) {
  'use strict';

/* Asaad Paper Invest — benchmark strategies (buy & hold, DCA, S&P 500) */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  function tradingDates() {
    const st = AP.store.settings();
    const start = st.startDate;
    const today = U.today();
    const dates = {};
    AP.store.s.snapshots.forEach(function (s) { if (s.date >= start) dates[s.date] = 1; });
    // fall back to the benchmark's own bar dates so the curve is not empty
    const bars = AP.market.seriesWithManual(st.benchmarkSymbol || 'VOO') || [];
    bars.forEach(function (b) { if (b.d >= start && b.d <= today) dates[b.d] = 1; });
    dates[start] = 1;
    dates[today] = 1;
    return Object.keys(dates).sort();
  }

  function priceAt(sym, date) {
    const p = AP.store.priceOn(sym, date);
    if (p !== null) return p;
    const bars = AP.market.seriesWithManual(sym);
    return bars && bars.length ? U.num(bars[0].c) : null;
  }

  const Bench = {
    dates: tradingDates,

    /* Invest the full starting capital in one asset on day 1. */
    buyHold(sym, capital) {
      const st = AP.store.settings();
      capital = U.num(capital, st.initialCapital);
      const dates = tradingDates();
      const p0 = priceAt(sym, st.startDate);
      if (!p0) return null;
      const shares = capital / p0;
      const series = dates.map(function (d) {
        const p = priceAt(sym, d) || p0;
        return { d: d, v: shares * p };
      });
      const last = series[series.length - 1];
      return {
        key: sym,
        shares: shares,
        entry: p0,
        series: series,
        value: last ? last.v : capital,
        retPct: capital ? ((last.v - capital) / capital) * 100 : 0
      };
    },

    /* Regular investing: capital split into equal monthly instalments,
       uninvested cash simply waits. */
    dca(sym, capital, instalments) {
      const st = AP.store.settings();
      capital = U.num(capital, st.initialCapital);
      const months = Math.max(1, instalments || Math.max(1, Math.round(st.experimentDays / 30)));
      const per = capital / months;
      const dates = tradingDates();
      if (!dates.length) return null;

      // contribution dates: start, +30d, +60d …
      const contribDates = [];
      for (let i = 0; i < months; i++) contribDates.push(U.addDays(st.startDate, i * 30));

      let shares = 0, cash = capital, ci = 0;
      const series = dates.map(function (d) {
        while (ci < contribDates.length && contribDates[ci] <= d) {
          const p = priceAt(sym, contribDates[ci]);
          if (p) { shares += per / p; cash -= per; }
          ci++;
        }
        const p = priceAt(sym, d) || 0;
        return { d: d, v: shares * p + Math.max(0, cash) };
      });
      const last = series[series.length - 1];
      return {
        key: 'DCA_' + sym,
        shares: shares,
        series: series,
        invested: capital - Math.max(0, cash),
        value: last ? last.v : capital,
        retPct: capital ? ((last.v - capital) / capital) * 100 : 0,
        instalments: months
      };
    },

    /* All benchmarks aligned with the portfolio equity curve. */
    all() {
      const st = AP.store.settings();
      const capital = st.initialCapital;
      const pfSeries = AP.portfolio.equitySeries();
      const pf = AP.portfolio.summary();
      const out = [];

      out.push({
        id: 'portfolio', labelKey: 'bench_portfolio', series: pfSeries,
        value: pf.equity, retPct: pf.totalPlPct, color: 'accent'
      });

      const spus = Bench.buyHold('SPUS', capital);
      if (spus) out.push({ id: 'spus', labelKey: 'bench_spus', series: spus.series, value: spus.value, retPct: spus.retPct, color: 'c2' });

      const voo = Bench.buyHold('VOO', capital);
      if (voo) out.push({ id: 'voo', labelKey: 'bench_voo', series: voo.series, value: voo.value, retPct: voo.retPct, color: 'c3' });

      // S&P 500 proxy — VOO tracks the index; SPY is used if present
      const spxSym = AP.store.series('SPY') ? 'SPY' : 'VOO';
      const spx = Bench.buyHold(spxSym, capital);
      if (spx) out.push({ id: 'spx', labelKey: 'bench_spx', series: spx.series, value: spx.value, retPct: spx.retPct, color: 'c4', note: spxSym });

      const dca = Bench.dca('VOO', capital, Math.max(1, Math.round(st.experimentDays / 30)));
      if (dca) out.push({ id: 'dca', labelKey: 'bench_dca', series: dca.series, value: dca.value, retPct: dca.retPct, color: 'c5' });

      return out;
    },

    priceAt: priceAt
  };

  AP.bench = Bench;
})(window);

/* Asaad Paper Invest — performance analytics */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const Analytics = {
    compute() {
      const st = AP.store.settings();
      const pf = AP.portfolio.summary();
      const closed = AP.portfolio.closedTrades();
      const eq = AP.portfolio.equitySeries();
      const equityValues = eq.map(function (r) { return r.v; });

      const wins = closed.filter(function (t) { return t.pl > 0; });
      const losses = closed.filter(function (t) { return t.pl < 0; });
      const grossWin = U.sum(wins.map(function (t) { return t.pl; }));
      const grossLoss = Math.abs(U.sum(losses.map(function (t) { return t.pl; })));

      const bySymbol = {};
      closed.forEach(function (t) {
        if (!bySymbol[t.symbol]) bySymbol[t.symbol] = { symbol: t.symbol, trades: 0, pl: 0, wins: 0, retSum: 0 };
        const b = bySymbol[t.symbol];
        b.trades++; b.pl += t.pl; b.retSum += t.plPct;
        if (t.pl > 0) b.wins++;
      });
      // include open positions in the per-asset view
      Object.keys(pf.positions).forEach(function (s) {
        if (!bySymbol[s]) bySymbol[s] = { symbol: s, trades: 0, pl: 0, wins: 0, retSum: 0 };
        bySymbol[s].openPl = pf.positions[s].pl;
        bySymbol[s].openPlPct = pf.positions[s].plPct;
      });
      Object.keys(bySymbol).forEach(function (s) {
        const b = bySymbol[s];
        b.winRate = b.trades ? (b.wins / b.trades) * 100 : null;
        b.avgRet = b.trades ? b.retSum / b.trades : null;
        b.total = U.num(b.pl) + U.num(b.openPl);
      });

      const byDecision = {};
      closed.forEach(function (t) {
        const k = t.decision || 'dec_manual';
        if (!byDecision[k]) byDecision[k] = { key: k, trades: 0, pl: 0, wins: 0, retSum: 0 };
        const b = byDecision[k];
        b.trades++; b.pl += t.pl; b.retSum += t.plPct;
        if (t.pl > 0) b.wins++;
      });
      Object.keys(byDecision).forEach(function (k) {
        const b = byDecision[k];
        b.winRate = b.trades ? (b.wins / b.trades) * 100 : null;
        b.avgRet = b.trades ? b.retSum / b.trades : null;
      });

      const best = closed.slice().sort(function (a, b) { return b.plPct - a.plPct; })[0] || null;
      const worst = closed.slice().sort(function (a, b) { return a.plPct - b.plPct; })[0] || null;

      return {
        equity: pf.equity,
        initial: st.initialCapital,
        totalReturn: pf.totalPl,
        totalReturnPct: pf.totalPlPct,
        realized: pf.realized,
        unrealized: pf.unrealized,
        cash: pf.cash,
        cashWeight: pf.cashWeight,
        invested: pf.invested,
        dayPl: pf.dayPl,
        dayPlPct: pf.dayPlPct,
        tradesCount: closed.length,
        winCount: wins.length,
        lossCount: losses.length,
        winRate: closed.length ? (wins.length / closed.length) * 100 : null,
        lossRate: closed.length ? (losses.length / closed.length) * 100 : null,
        avgGain: wins.length ? U.mean(wins.map(function (t) { return t.plPct; })) : null,
        avgLoss: losses.length ? U.mean(losses.map(function (t) { return t.plPct; })) : null,
        avgGainUsd: wins.length ? U.mean(wins.map(function (t) { return t.pl; })) : null,
        avgLossUsd: losses.length ? U.mean(losses.map(function (t) { return t.pl; })) : null,
        profitFactor: grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : null),
        maxDrawdown: equityValues.length > 1 ? AP.ind.maxDrawdown(equityValues) : 0,
        drawdownSeries: eq.map(function (r, i) {
          return { d: r.d, v: AP.ind.drawdownSeries(equityValues)[i] };
        }),
        sharpe: AP.ind.sharpe(equityValues),
        avgHold: closed.length ? U.mean(closed.map(function (t) { return t.holdDays; })) : null,
        bestTrade: best,
        worstTrade: worst,
        bySymbol: bySymbol,
        byDecision: byDecision,
        closed: closed,
        equitySeries: eq,
        positionsCount: Object.keys(pf.positions).length
      };
    },

    /* Compare the active portfolio against every benchmark. */
    benchmarkTable() {
      const rows = AP.bench.all();
      const pfRow = rows.find(function (r) { return r.id === 'portfolio'; });
      return rows.map(function (r) {
        return Object.assign({}, r, {
          diff: pfRow ? r.retPct - pfRow.retPct : 0,
          isPortfolio: r.id === 'portfolio'
        });
      });
    },

    /* Did timing add value versus simply investing regularly? */
    timingVerdict() {
      const rows = AP.analytics.benchmarkTable();
      const pf = rows.find(function (r) { return r.id === 'portfolio'; });
      const dca = rows.find(function (r) { return r.id === 'dca'; });
      if (!pf || !dca) return { key: 'timing_equal', params: { a: '—' }, delta: 0 };
      const delta = pf.retPct - dca.retPct;
      if (Math.abs(delta) < 0.5) return { key: 'timing_equal', params: {}, delta: delta };
      return {
        key: delta > 0 ? 'timing_yes' : 'timing_no',
        params: { a: U.pct(Math.abs(delta)) },
        delta: delta
      };
    }
  };

  AP.analytics = Analytics;
})(window);

/* Asaad Paper Invest — "507 Strategy": three parallel monthly-investing tests */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  const ETF_MIX = { SPUS: 0.40, VOO: 0.30, QQQ: 0.30 };   // the 70% ETF sleeve of Strategy B
  const FALLBACK_GROWTH = ['MSFT', 'NVDA', 'AAPL'];

  function contributionDates() {
    const st = AP.store.settings();
    const start = st.startDate;
    const today = U.today();
    const out = [start];
    const d = U.parseDate(start);
    d.setDate(1);
    for (let i = 0; i < 24; i++) {
      d.setMonth(d.getMonth() + 1);
      const key = U.dateKey(d);
      if (key > today) break;
      if (key > start) out.push(key);
    }
    return out;
  }

  function priceAt(sym, date) { return AP.bench.priceAt(sym, date); }

  function growthBasket() {
    // top 3 non-ETF names by today's score, so the sleeve follows the system
    const scan = AP.lastScan;
    if (scan && scan.evals) {
      const picks = scan.evals
        .filter(function (e) { return e.ok && !e.isEtf; })
        .slice(0, 3)
        .map(function (e) { return e.symbol; });
      if (picks.length === 3) return picks;
    }
    return FALLBACK_GROWTH.filter(function (s) { return AP.store.series(s); }).slice(0, 3);
  }

  function valueOf(holdings, date) {
    return Object.keys(holdings).reduce(function (a, sym) {
      const p = priceAt(sym, date);
      return a + holdings[sym] * (p || 0);
    }, 0);
  }

  const S507 = {
    monthlyUsd() {
      const st = AP.store.settings();
      return U.num(st.monthlyOmr) * U.num(st.fxOmrUsd);
    },

    run() {
      const st = AP.store.settings();
      const monthly = S507.monthlyUsd();
      const dates = contributionDates();
      const axis = AP.bench.dates();
      const growth = growthBasket();

      const A = { id: 'A', holdings: {}, cash: 0, contributed: 0, log: [] };
      const B = { id: 'B', holdings: {}, cash: 0, contributed: 0, log: [] };
      const C = { id: 'C', holdings: {}, cash: 0, contributed: 0, log: [], deployments: [] };

      // pre-index historical scores captured in daily snapshots
      const scoreHistory = {};
      AP.store.s.snapshots.forEach(function (s) {
        if (s.scores) scoreHistory[s.date] = s.scores;
      });

      let ci = 0;
      const seriesA = [], seriesB = [], seriesC = [];

      axis.forEach(function (d) {
        // apply contributions due on or before this date
        while (ci < dates.length && dates[ci] <= d) {
          const cd = dates[ci];
          A.contributed += monthly; B.contributed += monthly; C.contributed += monthly;

          const pA = priceAt('SPUS', cd);
          if (pA) {
            const sh = monthly / pA;
            A.holdings.SPUS = (A.holdings.SPUS || 0) + sh;
            A.log.push({ date: cd, symbol: 'SPUS', price: pA, shares: sh, amount: monthly });
          } else { A.cash += monthly; }

          Object.keys(ETF_MIX).forEach(function (sym) {
            const amt = monthly * 0.7 * ETF_MIX[sym];
            const p = priceAt(sym, cd);
            if (p) {
              const sh = amt / p;
              B.holdings[sym] = (B.holdings[sym] || 0) + sh;
              B.log.push({ date: cd, symbol: sym, price: p, shares: sh, amount: amt });
            } else B.cash += amt;
          });
          growth.forEach(function (sym) {
            const amt = monthly * 0.3 / Math.max(1, growth.length);
            const p = priceAt(sym, cd);
            if (p) {
              const sh = amt / p;
              B.holdings[sym] = (B.holdings[sym] || 0) + sh;
              B.log.push({ date: cd, symbol: sym, price: p, shares: sh, amount: amt });
            } else B.cash += amt;
          });

          C.cash += monthly;
          C.log.push({ date: cd, symbol: '—', price: null, shares: 0, amount: monthly });
          ci++;
        }

        // Strategy C deploys only when the system produced a score >= 70 that day
        const scores = scoreHistory[d];
        if (scores && C.cash > 0) {
          let bestSym = null, bestScore = 0;
          Object.keys(scores).forEach(function (sym) {
            const sc = U.num(scores[sym] && scores[sym].score !== undefined ? scores[sym].score : scores[sym]);
            if (sc >= 70 && sc > bestScore) { bestScore = sc; bestSym = sym; }
          });
          if (bestSym) {
            const p = priceAt(bestSym, d);
            if (p) {
              const sh = C.cash / p;
              C.holdings[bestSym] = (C.holdings[bestSym] || 0) + sh;
              C.deployments.push({ date: d, symbol: bestSym, price: p, shares: sh, amount: C.cash, score: bestScore });
              C.cash = 0;
            }
          }
        }

        seriesA.push({ d: d, v: valueOf(A.holdings, d) + A.cash });
        seriesB.push({ d: d, v: valueOf(B.holdings, d) + B.cash });
        seriesC.push({ d: d, v: valueOf(C.holdings, d) + C.cash });
      });

      function pack(s, series, nameKey, descKey) {
        const value = series.length ? series[series.length - 1].v : s.contributed;
        return {
          id: s.id,
          nameKey: nameKey,
          descKey: descKey,
          contributed: s.contributed,
          value: value,
          cash: s.cash,
          gain: value - s.contributed,
          gainPct: s.contributed ? ((value - s.contributed) / s.contributed) * 100 : 0,
          holdings: s.holdings,
          log: s.log,
          deployments: s.deployments || [],
          series: series
        };
      }

      const result = {
        monthlyOmr: st.monthlyOmr,
        fx: st.fxOmrUsd,
        monthlyUsd: monthly,
        contributions: dates,
        growthBasket: growth,
        etfMix: ETF_MIX,
        A: pack(A, seriesA, 'strat_a', 'strat_a_desc'),
        B: pack(B, seriesB, 'strat_b', 'strat_b_desc'),
        C: pack(C, seriesC, 'strat_c', 'strat_c_desc'),
        ranAt: Date.now()
      };
      const ranked = ['A', 'B', 'C'].sort(function (x, y) { return result[y].gainPct - result[x].gainPct; });
      result.best = ranked[0];
      result.worst = ranked[ranked.length - 1];

      AP.store.s.s507 = { lastRun: Date.now(), strategies: result, contributions: dates };
      AP.store.save();
      return result;
    },

    latest() {
      const s = AP.store.s.s507;
      return s && s.strategies ? s.strategies : null;
    },

    ensure() {
      const cur = S507.latest();
      if (!cur) return S507.run();
      const age = Date.now() - U.num(AP.store.s.s507.lastRun);
      if (age > 6 * 3600 * 1000) return S507.run();
      return cur;
    }
  };

  AP.s507 = S507;
})(window);

/* ===== assets/js/backtest.js ===== */
/* Asaad Paper Invest — replay engine.
   Moves the whole app back in time (AP.asOf) and lets the same signal engine
   walk forward day by day, so the past N trading days can be replayed exactly
   as the system would have decided them. Indicators only ever see bars up to
   the simulated day — there is no look-ahead. */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  function tradingDays(fromDate, toDate) {
    const ref = AP.store.settings().marketProxy || 'VOO';
    const bars = AP.store.series(ref) || AP.store.series(AP.store.symbols()[0]) || [];
    return bars.map(function (b) { return b.d; })
      .filter(function (d) { return d >= fromDate && d <= toDate; });
  }

  const Backtest = {
    running: false,

    /* Replay the last `days` calendar days. Resets cash, positions, journal,
       snapshots and alerts; keeps the watchlist, settings and news. */
    run(days, onProgress) {
      if (Backtest.running) return Promise.resolve(null);
      const st = AP.store.settings();
      const realToday = U.realToday();
      const start = U.addDays(realToday, -Math.abs(days) + 1);

      const dates = tradingDays(start, realToday);
      if (dates.length < 5) {
        return Promise.reject(new Error('not enough price history to replay'));
      }

      // fresh experiment starting at the first replayed trading day
      st.startDate = dates[0];
      AP.store.s.cash = st.initialCapital;
      AP.store.s.positions = {};
      AP.store.s.transactions = [];
      AP.store.s.journal = [];
      AP.store.s.snapshots = [];
      AP.store.s.alerts = [];
      AP.store.s.s507 = { lastRun: null, strategies: null, contributions: [] };

      Backtest.running = true;
      let i = 0;
      const CHUNK = 6;

      return new Promise(function (resolve, reject) {
        function step() {
          try {
            const end = Math.min(i + CHUNK, dates.length);
            for (; i < end; i++) {
              Backtest.simulateDay(dates[i]);
            }
            if (onProgress) onProgress(i, dates.length, dates[Math.min(i, dates.length - 1)]);
            if (i < dates.length) {
              setTimeout(step, 0);
            } else {
              AP.asOf = null;
              Backtest.running = false;   // re-enables persistence
              AP.journal.updateFollowUps();
              try { AP.s507.run(); } catch (e) { console.warn('507 replay failed', e); }
              AP.store.save();
              resolve({ days: dates.length, from: dates[0], to: dates[dates.length - 1] });
            }
          } catch (e) {
            AP.asOf = null;
            Backtest.running = false;
            reject(e);
          }
        }
        setTimeout(step, 0);
      });
    },

    /* One simulated trading day, using only data available on that day. */
    simulateDay(date) {
      AP.asOf = date;
      const scan = AP.signals.scanAll();
      AP.lastScan = scan;

      // alerts are a live-monitoring feature; replaying them would just
      // backfill hundreds of stale notifications
      AP.journal.logScan(scan);

      // 1) act on existing positions first so cash is freed before buying
      scan.holdingActions.forEach(function (ev) {
        const pos = AP.portfolio.positionOf(ev.symbol);
        if (!pos) return;
        const price = ev.ind.price;
        let qty = 0;
        if (ev.decision === 'dec_exit') qty = pos.qty;
        else if (ev.decision === 'dec_take_profit') qty = pos.qty * 0.5;
        else if (ev.decision === 'dec_trim') qty = pos.qty / 3;
        qty = AP.portfolio.dustAdjustedQty(ev.symbol, Math.floor(qty * 10000) / 10000, price);
        if (qty > 0) {
          AP.portfolio.sell(ev.symbol, qty, price, {
            date: date, decision: ev.decision, score: ev.score,
            note: 'replay'
          });
        }
      });

      // 2) at most one new entry per day — the system's single best idea
      const pick = scan.pick;
      if (pick && pick.size && pick.size.pct >= 0.25) {
        const price = pick.ind.price;
        const qty = Math.floor((pick.size.amount / price) * 10000) / 10000;
        if (qty > 0) {
          const res = AP.portfolio.buy(pick.symbol, qty, price, {
            date: date, decision: pick.decision, score: pick.score,
            plan: pick.plan, note: 'replay'
          });
          if (res.ok) {
            const entry = AP.store.s.journal.find(function (e) {
              return e.date === date && e.symbol === pick.symbol;
            });
            if (entry) entry.executed = true;
          }
        }
      }

      AP.journal.updateFollowUps();
      AP.store.saveSnapshot({
        scores: (function () {
          const out = {};
          scan.evals.forEach(function (e) {
            if (e.ok) out[e.symbol] = { score: e.score, decision: e.decision, band: e.band.key };
          });
          return out;
        })(),
        regime: scan.regime.label,
        breadth: U.round(scan.regime.breadth, 1),
        replay: true
      });
    }
  };

  AP.backtest = Backtest;
})(window);

  <script>
/* ===== assets/js/charts.js ===== */
/* Asaad Paper Invest — dependency-free canvas charts.
   Palette slots come from CSS custom properties so light/dark swap in one place. */
(function (root) {
  'use strict';
  const AP = (root.AP = root.AP || {});
  const U = AP.util;

  function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v && v.trim()) || fallback;
  }

  function palette() {
    return {
      s1: cssVar('--series-1', '#3987e5'),
      s2: cssVar('--series-2', '#d95926'),
      s3: cssVar('--series-3', '#199e70'),
      s4: cssVar('--series-4', '#c98500'),
      s5: cssVar('--series-5', '#d55181'),
      s6: cssVar('--series-6', '#008300'),
      s7: cssVar('--series-7', '#9085e9'),
      good: cssVar('--good', '#0ca30c'),
      critical: cssVar('--critical', '#d03b3b'),
      grid: cssVar('--grid', '#2c2c2a'),
      axis: cssVar('--axis', '#383835'),
      muted: cssVar('--text-muted', '#898781'),
      ink: cssVar('--text-primary', '#fff'),
      surface: cssVar('--surface-1', '#14181f')
    };
  }

  function setupCanvas(host, height) {
    host.innerHTML = '';
    host.classList.add('chart-host');
    const cv = document.createElement('canvas');
    cv.className = 'chart-canvas';
    host.appendChild(cv);
    const tip = document.createElement('div');
    tip.className = 'chart-tip';
    tip.setAttribute('role', 'status');
    host.appendChild(tip);
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(240, host.clientWidth || 320);
    const h = height || 220;
    cv.width = w * dpr;
    cv.height = h * dpr;
    cv.style.width = '100%';
    cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.textBaseline = 'middle';
    try { ctx.direction = 'ltr'; } catch (e) { /* older engines ignore this */ }
    return { cv: cv, ctx: ctx, w: w, h: h, tip: tip };
  }

  function fmtY(v, kind) {
    if (kind === 'pct') return U.round(v, 1) + '%';
    if (Math.abs(v) >= 1000) return '$' + Math.round(v).toLocaleString('en-US');
    return '$' + U.round(v, 2);
  }

  function niceTicks(min, max, count) {
    if (!isFinite(min) || !isFinite(max)) return [];
    if (min === max) { min -= 1; max += 1; }
    const span = max - min;
    const step0 = span / (count || 4);
    if (!isFinite(step0) || step0 <= 0) return [min, max];
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const norm = step0 / mag;
    const step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
    if (!isFinite(step) || step <= 0) return [min, max];
    const out = [];
    for (let v = Math.ceil(min / step) * step; v <= max + step * 0.001 && out.length < 12; v += step) {
      out.push(v);
    }
    return out;
  }

  const Charts = {
    palette: palette,

    /* ---------- multi-series line / area ---------- */
    line(host, cfg) {
      if (!host) return;
      const c = setupCanvas(host, cfg.height);
      const P = palette();
      const ctx = c.ctx;
      const series = (cfg.series || []).map(function (s) {
        return Object.assign({}, s, {
          points: (s.points || []).filter(function (p) { return p && p.d && isFinite(U.num(p.v)); })
        });
      }).filter(function (s) { return s.points.length; });
      if (!series.length) {
        ctx.fillStyle = P.muted;
        ctx.font = '13px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(AP.t('no_data'), c.w / 2, c.h / 2);
        return;
      }

      const mode = cfg.mode || 'value';
      // `mode` rebases the data; `unit` only controls how axis/tooltip read
      const unit = cfg.unit || (mode === 'pct' ? 'pct' : 'value');
      const norm = series.map(function (s) {
        const base = U.num(s.points[0].v) || 1;
        return {
          label: s.label, color: s.color || P.s1, dashed: s.dashed,
          pts: s.points.map(function (p) {
            return { d: p.d, raw: U.num(p.v), v: mode === 'pct' ? ((U.num(p.v) - base) / base) * 100 : U.num(p.v) };
          })
        };
      });

      // shared date axis
      const dateSet = {};
      norm.forEach(function (s) { s.pts.forEach(function (p) { dateSet[p.d] = 1; }); });
      const dates = Object.keys(dateSet).sort();
      const xOf = {};
      const padL = cfg.padL === undefined ? 54 : cfg.padL;
      const padR = 12, padT = 12, padB = 26;
      const plotW = c.w - padL - padR;
      const plotH = c.h - padT - padB;
      dates.forEach(function (d, i) {
        xOf[d] = padL + (dates.length === 1 ? plotW / 2 : (i / (dates.length - 1)) * plotW);
      });

      let min = Infinity, max = -Infinity;
      norm.forEach(function (s) {
        s.pts.forEach(function (p) { min = Math.min(min, p.v); max = Math.max(max, p.v); });
      });
      if (cfg.zeroBase) min = Math.min(min, 0);
      const pad = (max - min) * 0.12 || Math.abs(max) * 0.05 || 1;
      min -= pad; max += pad;
      const yOf = function (v) { return padT + plotH - ((v - min) / (max - min)) * plotH; };

      // grid + y labels (recessive)
      ctx.font = '11px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = AP.i18n.isRTL() ? 'left' : 'right';
      const ticks = niceTicks(min, max, 4);
      ticks.forEach(function (t) {
        const y = yOf(t);
        ctx.strokeStyle = P.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padL, Math.round(y) + 0.5);
        ctx.lineTo(c.w - padR, Math.round(y) + 0.5);
        ctx.stroke();
        ctx.fillStyle = P.muted;
        ctx.fillText(fmtY(t, unit), AP.i18n.isRTL() ? 4 : padL - 8, y);
      });

      // x labels: first / middle / last only
      ctx.textAlign = 'center';
      [0, Math.floor(dates.length / 2), dates.length - 1].forEach(function (i, k) {
        if (i < 0 || i >= dates.length) return;
        if (k === 1 && dates.length < 4) return;
        ctx.fillStyle = P.muted;
        ctx.fillText(dates[i].slice(5), xOf[dates[i]], c.h - padB / 2 + 2);
      });

      // single-series area fill (a lone data point gets a marker instead)
      if (norm.length === 1 && cfg.area !== false && dates.length > 1) {
        const s = norm[0];
        const g = ctx.createLinearGradient(0, padT, 0, padT + plotH);
        g.addColorStop(0, s.color + '40');
        g.addColorStop(1, s.color + '00');
        ctx.beginPath();
        s.pts.forEach(function (p, i) {
          const x = xOf[p.d], y = yOf(p.v);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.lineTo(xOf[s.pts[s.pts.length - 1].d], padT + plotH);
        ctx.lineTo(xOf[s.pts[0].d], padT + plotH);
        ctx.closePath();
        ctx.fillStyle = g;
        ctx.fill();
      }

      // lines — thin, 2px
      norm.forEach(function (s) {
        if (dates.length === 1) {
          const p = s.pts[0];
          ctx.beginPath();
          ctx.arc(xOf[p.d], yOf(p.v), 5, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = P.surface;
          ctx.stroke();
          return;
        }
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = s.color;
        ctx.setLineDash(s.dashed ? [5, 4] : []);
        s.pts.forEach(function (p, i) {
          const x = xOf[p.d], y = yOf(p.v);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      });

      /* hover layer: crosshair + tooltip */
      const tip = c.tip;
      function nearestIndex(mx) {
        let bi = 0, bd = Infinity;
        dates.forEach(function (d, i) {
          const dist = Math.abs(xOf[d] - mx);
          if (dist < bd) { bd = dist; bi = i; }
        });
        return bi;
      }
      let overlay = null;
      function redrawOverlay(idx) {
        if (!overlay) {
          overlay = document.createElement('canvas');
          overlay.className = 'chart-overlay';
          const dpr = window.devicePixelRatio || 1;
          overlay.width = c.cv.width; overlay.height = c.cv.height;
          overlay.style.width = '100%'; overlay.style.height = c.h + 'px';
          host.appendChild(overlay);
          overlay.getContext('2d').scale(dpr, dpr);
        }
        const octx = overlay.getContext('2d');
        octx.clearRect(0, 0, c.w, c.h);
        if (idx === null) return;
        const d = dates[idx];
        const x = xOf[d];
        octx.strokeStyle = P.axis;
        octx.lineWidth = 1;
        octx.beginPath();
        octx.moveTo(Math.round(x) + 0.5, padT);
        octx.lineTo(Math.round(x) + 0.5, padT + plotH);
        octx.stroke();
        norm.forEach(function (s) {
          const p = s.pts.find(function (q) { return q.d === d; });
          if (!p) return;
          const y = yOf(p.v);
          octx.beginPath();
          octx.arc(x, y, 4.5, 0, Math.PI * 2);
          octx.fillStyle = s.color;
          octx.fill();
          octx.lineWidth = 2;
          octx.strokeStyle = P.surface;
          octx.stroke();
        });
      }
      function showTip(idx, mx) {
        const d = dates[idx];
        let html = '<div class="tip-date">' + U.esc(d) + '</div>';
        norm.forEach(function (s) {
          const p = s.pts.find(function (q) { return q.d === d; });
          if (!p) return;
          html += '<div class="tip-row"><span class="tip-dot" style="background:' + s.color + '"></span>' +
            '<span class="tip-label">' + U.esc(s.label) + '</span>' +
            '<span class="tip-val">' + U.esc(unit === 'pct' ? U.pct(p.v) : fmtY(p.raw, 'value')) + '</span></div>';
        });
        tip.innerHTML = html;
        tip.classList.add('show');
        const tw = tip.offsetWidth || 140;
        let left = xOf[d] - tw / 2;
        left = Math.max(4, Math.min(c.w - tw - 4, left));
        tip.style.left = left + 'px';
        tip.style.top = '6px';
      }
      function onMove(e) {
        const rect = c.cv.getBoundingClientRect();
        const mx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const idx = nearestIndex(mx);
        redrawOverlay(idx);
        showTip(idx, mx);
      }
      function onLeave() {
        redrawOverlay(null);
        tip.classList.remove('show');
      }
      host.addEventListener('mousemove', onMove);
      host.addEventListener('mouseleave', onLeave);
      host.addEventListener('touchstart', onMove, { passive: true });
      host.addEventListener('touchmove', onMove, { passive: true });
      host.addEventListener('touchend', onLeave);
    },

    /* ---------- horizontal bars (per-asset performance) ---------- */
    bars(host, rows, cfg) {
      cfg = cfg || {};
      if (!host) return;
      const P = palette();
      const h = Math.max(80, rows.length * 30 + 16);
      const c = setupCanvas(host, h);
      const ctx = c.ctx;
      if (!rows.length) return;
      const labelW = cfg.labelW || 62;
      const valW = 66;
      const plotW = c.w - labelW - valW - 12;
      const maxAbs = Math.max.apply(null, rows.map(function (r) { return Math.abs(U.num(r.value)); })) || 1;
      const hasNeg = rows.some(function (r) { return r.value < 0; });
      const zeroX = hasNeg ? labelW + plotW / 2 : labelW;
      const scale = hasNeg ? (plotW / 2) / maxAbs : plotW / maxAbs;

      ctx.font = '12px system-ui, -apple-system, "Segoe UI", sans-serif';
      rows.forEach(function (r, i) {
        const y = 10 + i * 30;
        const v = U.num(r.value);
        const w = Math.abs(v) * scale;
        const x = v >= 0 ? zeroX : zeroX - w;
        ctx.fillStyle = r.color || (v >= 0 ? P.good : P.critical);
        const radius = 4;
        const bh = 14;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, Math.max(2, w), bh, v >= 0 ? [0, radius, radius, 0] : [radius, 0, 0, radius]);
        else ctx.rect(x, y, Math.max(2, w), bh);
        ctx.fill();

        ctx.fillStyle = P.ink;
        ctx.textAlign = 'left';
        ctx.fillText(r.label, 2, y + bh / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = v >= 0 ? P.good : P.critical;
        ctx.fillText(cfg.fmt ? cfg.fmt(v) : U.pct(v), c.w - 2, y + bh / 2);
      });
      if (hasNeg) {
        ctx.strokeStyle = P.axis;
        ctx.beginPath();
        ctx.moveTo(zeroX + 0.5, 4);
        ctx.lineTo(zeroX + 0.5, c.h - 4);
        ctx.stroke();
      }
    },

    /* ---------- allocation donut ---------- */
    donut(host, slices, cfg) {
      cfg = cfg || {};
      if (!host) return;
      const P = palette();
      const c = setupCanvas(host, cfg.height || 200);
      const ctx = c.ctx;
      const total = U.sum(slices.map(function (s) { return s.value; }));
      if (!total) {
        ctx.fillStyle = P.muted;
        ctx.textAlign = 'center';
        ctx.font = '13px system-ui';
        ctx.fillText(AP.t('no_data'), c.w / 2, c.h / 2);
        return;
      }
      const cx = c.w / 2, cy = c.h / 2;
      const r = Math.min(c.w, c.h) / 2 - 12;
      const inner = r * 0.62;
      let ang = -Math.PI / 2;
      slices.forEach(function (s) {
        const frac = s.value / total;
        const a2 = ang + frac * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, ang, a2);
        ctx.arc(cx, cy, inner, a2, ang, true);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();
        // 2px surface gap between segments
        ctx.lineWidth = 2;
        ctx.strokeStyle = P.surface;
        ctx.stroke();
        ang = a2;
      });
      if (cfg.centerLabel) {
        ctx.fillStyle = P.ink;
        ctx.textAlign = 'center';
        ctx.font = '600 15px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillText(cfg.centerLabel, cx, cy - 6);
        if (cfg.centerSub) {
          ctx.font = '11px system-ui';
          ctx.fillStyle = P.muted;
          ctx.fillText(cfg.centerSub, cx, cy + 12);
        }
      }
    },

    /* ---------- score ring (0..100) ---------- */
    ring(host, score, cfg) {
      cfg = cfg || {};
      if (!host) return;
      const P = palette();
      const size = cfg.size || 116;
      const c = setupCanvas(host, size);
      const ctx = c.ctx;
      const cx = c.w / 2, cy = size / 2;
      const r = size / 2 - 10;
      const val = U.clamp(U.num(score), 0, 100);
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.strokeStyle = P.grid;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      const color = cfg.color || (val >= 80 ? P.good : val >= 65 ? P.s3 : val >= 50 ? P.s4 : val >= 35 ? P.s2 : P.critical);
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (val / 100) * Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = P.ink;
      ctx.textAlign = 'center';
      ctx.font = '700 24px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText(String(Math.round(val)), cx, cy - 2);
      ctx.font = '10px system-ui';
      ctx.fillStyle = P.muted;
      ctx.fillText('/100', cx, cy + 16);
    },

    /* ---------- sparkline ---------- */
    spark(host, points, color, height) {
      if (!host || !points || points.length < 2) return;
      const P = palette();
      const c = setupCanvas(host, height || 40);
      const ctx = c.ctx;
      const vals = points.map(function (p) { return U.num(p.v !== undefined ? p.v : p); });
      const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
      const span = (max - min) || 1;
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = color || P.s1;
      vals.forEach(function (v, i) {
        const x = (i / (vals.length - 1)) * (c.w - 4) + 2;
        const y = c.h - 4 - ((v - min) / span) * (c.h - 8);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    },

    /* ---------- component score breakdown ---------- */
    meters(host, rows) {
      if (!host) return;
      const P = palette();
      host.innerHTML = '';
      rows.forEach(function (r) {
        const wrap = U.el('div', { class: 'meter-row' });
        wrap.appendChild(U.el('span', { class: 'meter-label', text: r.label }));
        const track = U.el('div', { class: 'meter-track' });
        const fill = U.el('div', { class: 'meter-fill' });
        fill.style.width = U.clamp(r.value, 0, 100) + '%';
        fill.style.background = r.value >= 65 ? P.s3 : r.value >= 45 ? P.s4 : P.s2;
        track.appendChild(fill);
        wrap.appendChild(track);
        wrap.appendChild(U.el('span', { class: 'meter-val', text: Math.round(r.value) + (r.weight ? ' · ×' + r.weight : '') }));
        host.appendChild(wrap);
      });
    }
  };

  AP.charts = Charts;
})(window);
