<title>كسّارة إكسبرس</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap">
<style>
/* ============================================================
   كسّارة إكسبرس — نظام التصميم
   كحلي داكن + برتقالي + رملي، عربي RTL، خط Tajawal
   ============================================================ */

:root{
  /* الألوان الأساسية */
  --navy-950:#061423; --navy-900:#0b2036; --navy-800:#123049; --navy-700:#1b4363;
  --navy-100:#dde7f0; --navy-50:#eef3f8;
  --orange-600:#d3661a; --orange-500:#ef7c26; --orange-400:#f79a53; --orange-100:#fde9d8;
  --sand-500:#d8bd91; --sand-300:#ecdcc0; --sand-100:#f7efe2;
  --ok-600:#1c7a53; --ok-100:#d8f0e5;
  --warn-600:#b5750a; --warn-100:#fdeecd;
  --danger-600:#c0392b; --danger-100:#fadedb;
  --info-600:#1b6ba8; --info-100:#d9ecf9;

  /* الأسطح والنص */
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#fafbfd;
  --text:#0f1c2b; --text-2:#4a5b6d; --text-3:#7a8a9b;
  --border:#e2e8f0; --border-2:#cbd5e1;

  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --shadow-1:0 1px 2px rgba(11,32,54,.06), 0 1px 3px rgba(11,32,54,.05);
  --shadow-2:0 4px 12px rgba(11,32,54,.08);
  --shadow-3:0 12px 32px rgba(11,32,54,.14);
  --header-h:64px;
  --font:'Tajawal', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081420; --surface:#0e2032; --surface-2:#0b1a29;
    --text:#eaf1f8; --text-2:#a8bacb; --text-3:#7d92a6;
    --border:#1c3450; --border-2:#26466a;
    --navy-50:#0e2032; --navy-100:#16304a;
    --ok-100:#0f3126; --warn-100:#3a2c08; --danger-100:#3a1a16; --info-100:#0d2c44; --orange-100:#3a2312;
  }
}
:root[data-theme="dark"]{
  --bg:#081420; --surface:#0e2032; --surface-2:#0b1a29;
  --text:#eaf1f8; --text-2:#a8bacb; --text-3:#7d92a6;
  --border:#1c3450; --border-2:#26466a;
  --navy-50:#0e2032; --navy-100:#16304a;
  --ok-100:#0f3126; --warn-100:#3a2c08; --danger-100:#3a1a16; --info-100:#0d2c44; --orange-100:#3a2312;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:15px; line-height:var(--line-height,1.65); -webkit-font-smoothing:antialiased;
}
/* النستعليق الأردي يحتاج ارتفاع سطر أكبر ولا يُستبدل بخط ديفاناغاري أو العكس */
:root[data-lang="ur"] body{font-size:16px}
:root[data-lang="ur"] .table td,:root[data-lang="ur"] .table th{padding-block:14px}
:root[data-lang="hi"] body,:root[data-lang="bn"] body{font-size:14.5px}
h1,h2,h3,h4{margin:0 0 .5rem; line-height:1.35; font-weight:800; letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.08rem} h4{font-size:.98rem}
p{margin:0 0 .75rem; color:var(--text-2)}
a{color:var(--navy-700); text-decoration:none}
a:hover{text-decoration:underline}
small{font-size:.82rem}
.muted{color:var(--text-3)}
.center{text-align:center}
.nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- التخطيط ---------- */
.container{max-width:1240px; margin:0 auto; padding:0 20px}
.container--narrow{max-width:760px}
.row{display:flex; gap:14px; flex-wrap:wrap}
.row--between{justify-content:space-between; align-items:center}
.row--end{justify-content:flex-end}
.col{flex:1 1 0; min-width:0}
.grid{display:grid; gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex; flex-direction:column; gap:14px}
.gap-sm{gap:8px} .gap-lg{gap:24px}
.mt{margin-top:16px} .mt-lg{margin-top:28px} .mb{margin-bottom:16px}
@media (max-width:960px){ .grid-4{grid-template-columns:repeat(2,1fr)} .grid-3{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr} .container{padding:0 14px} }

/* ---------- الرأس ---------- */
.appbar{
  position:sticky; top:0; z-index:60; height:var(--header-h);
  background:var(--navy-900); color:#fff; box-shadow:var(--shadow-2);
}
.appbar__inner{max-width:1240px; margin:0 auto; padding:0 20px; height:100%;
  display:flex; align-items:center; gap:18px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.12rem; color:#fff}
.brand:hover{text-decoration:none}
.brand__mark{
  width:36px;height:36px;border-radius:10px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--orange-500),var(--orange-600)); font-size:1.1rem;
}
.appbar__nav{display:flex; gap:4px; margin-inline-start:auto; align-items:center}
.appbar__nav a{
  color:#c8d8e6; padding:8px 12px; border-radius:9px; font-size:.9rem; font-weight:500;
}
.appbar__nav a:hover{background:rgba(255,255,255,.09); color:#fff; text-decoration:none}
.appbar__nav a.is-active{background:rgba(255,255,255,.14); color:#fff;
  box-shadow:inset 0 -2px 0 var(--orange-500)}
.appbar__burger{display:none; background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer;padding:4px 8px}
.lang-pick{
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.22);
  border-radius:9px; padding:7px 10px; font-family:var(--font); font-size:.85rem;
  font-weight:600; cursor:pointer; margin-inline:6px;
}
.lang-pick option{color:var(--text); background:var(--surface)}
.lang-pick:focus{outline:2px solid var(--orange-400); outline-offset:1px}
@media (max-width:900px){
  .appbar__burger{display:block; margin-inline-start:auto}
  .appbar__nav{
    display:none; position:absolute; top:var(--header-h); inset-inline:0; flex-direction:column;
    background:var(--navy-900); padding:10px; gap:2px; box-shadow:var(--shadow-3); align-items:stretch;
  }
  .appbar__nav.is-open{display:flex}
}

/* ---------- شريط تجريبي ---------- */
.demo-bar{
  background:var(--sand-300); color:#4a3a1c; font-size:.82rem; text-align:center;
  padding:6px 14px; font-weight:500; border-bottom:1px solid var(--sand-500);
}

/* ---------- الأسطح ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow-1);
}
.card--flat{box-shadow:none}
.card--pad-lg{padding:26px}
.card__head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
.card__title{font-weight:800; font-size:1.02rem; margin:0}
.panel{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px}
.divider{height:1px; background:var(--border); margin:16px 0; border:0}

/* ---------- الأزرار ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  font-family:var(--font); font-weight:700; font-size:.92rem; line-height:1;
  padding:11px 18px; border-radius:10px; border:1px solid transparent;
  cursor:pointer; transition:.15s ease; background:var(--navy-50); color:var(--navy-900);
  text-decoration:none; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px); text-decoration:none}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.btn--primary{background:var(--orange-500); color:#fff}
.btn--primary:hover{background:var(--orange-600)}
.btn--navy{background:var(--navy-900); color:#fff}
.btn--navy:hover{background:var(--navy-800)}
.btn--ghost{background:transparent; border-color:var(--border-2); color:var(--text-2)}
.btn--ghost:hover{background:var(--surface-2)}
.btn--danger{background:var(--danger-600); color:#fff}
.btn--ok{background:var(--ok-600); color:#fff}
.btn--sm{padding:7px 12px; font-size:.83rem; border-radius:8px}
.btn--lg{padding:14px 26px; font-size:1rem}
.btn--block{width:100%}
.btn-group{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- النماذج ---------- */
.field{display:block; margin-bottom:14px}
.field>span{display:block; font-size:.86rem; font-weight:700; color:var(--text-2); margin-bottom:6px}
.field .req{color:var(--danger-600)}
.field input, .field select, .field textarea, .input{
  width:100%; font-family:var(--font); font-size:.95rem; color:var(--text);
  background:var(--surface); border:1.5px solid var(--border-2); border-radius:10px;
  padding:11px 13px; transition:.15s;
}
.field input:focus, .field select:focus, .field textarea:focus, .input:focus{
  outline:none; border-color:var(--orange-500); box-shadow:0 0 0 3px var(--orange-100);
}
.field--error input, .field--error select{border-color:var(--danger-600)}
.field__err{color:var(--danger-600); font-size:.8rem; margin-top:4px; display:block}
.field__hint{color:var(--text-3); font-size:.8rem; margin-top:4px; display:block}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:560px){ .field-row{grid-template-columns:1fr} }
.checkbox{display:flex; align-items:center; gap:8px; font-size:.9rem; cursor:pointer}
.checkbox input{width:auto}

/* اختيار بطاقي */
.choice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px}
.choice{
  border:1.5px solid var(--border-2); border-radius:var(--radius-sm); padding:14px;
  cursor:pointer; background:var(--surface); transition:.15s; text-align:start;
}
.choice:hover{border-color:var(--orange-400); box-shadow:var(--shadow-1)}
.choice.is-selected{border-color:var(--orange-500); background:var(--orange-100); box-shadow:var(--shadow-1)}
.choice__title{font-weight:700; font-size:.95rem; margin-bottom:3px}
.choice__meta{font-size:.8rem; color:var(--text-3)}
.choice__price{font-weight:800; color:var(--navy-700); font-size:.95rem; margin-top:6px}

/* ---------- الشارات ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:.76rem; font-weight:700;
  padding:4px 10px; border-radius:999px; white-space:nowrap;
  background:var(--navy-50); color:var(--navy-700);
}
.badge--ok{background:var(--ok-100); color:var(--ok-600)}
.badge--warn{background:var(--warn-100); color:var(--warn-600)}
.badge--danger{background:var(--danger-100); color:var(--danger-600)}
.badge--info{background:var(--info-100); color:var(--info-600)}
.badge--muted{background:var(--navy-50); color:var(--text-3)}
.badge--orange{background:var(--orange-100); color:var(--orange-600)}

/* ---------- الجداول ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface)}
table.table{width:100%; border-collapse:collapse; font-size:.89rem; min-width:640px}
.table th{
  text-align:start; font-weight:700; color:var(--text-2); font-size:.8rem;
  padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;
}
.table td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:var(--surface-2)}
.table .num{text-align:end; font-variant-numeric:tabular-nums}
.table--compact td, .table--compact th{padding:8px 10px}

/* ---------- بطاقات المؤشرات ---------- */
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px}
.kpi__label{font-size:.8rem; color:var(--text-3); font-weight:600; margin-bottom:6px}
.kpi__value{font-size:1.6rem; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.kpi__sub{font-size:.78rem; color:var(--text-3); margin-top:4px}
.kpi__delta{font-size:.78rem; font-weight:700}
.kpi__delta--up{color:var(--ok-600)} .kpi__delta--down{color:var(--danger-600)}
.kpi--accent{border-inline-start:3px solid var(--orange-500)}

/* ---------- ملخص السعر ---------- */
.price-box{background:var(--navy-900); color:#fff; border-radius:var(--radius); padding:20px}
.price-box .line{display:flex; justify-content:space-between; padding:7px 0; font-size:.92rem; color:#c8d8e6}
.price-box .line b{color:#fff; font-variant-numeric:tabular-nums}
.price-box .line--discount b{color:var(--orange-400)}
.price-box hr{border:0; border-top:1px solid rgba(255,255,255,.16); margin:10px 0}
.price-box .total{display:flex; justify-content:space-between; align-items:baseline; font-size:1.15rem; font-weight:800}
.price-box .total b{font-size:1.5rem; color:var(--orange-400)}

/* ---------- خط زمني للحالة ---------- */
.timeline{list-style:none; padding:0; margin:0; position:relative}
.timeline li{position:relative; padding-inline-start:26px; padding-bottom:16px}
.timeline li::before{
  content:''; position:absolute; inset-inline-start:4px; top:6px; width:10px; height:10px;
  border-radius:50%; background:var(--border-2); border:2px solid var(--surface);
}
.timeline li::after{
  content:''; position:absolute; inset-inline-start:8px; top:18px; bottom:0; width:2px; background:var(--border);
}
.timeline li:last-child::after{display:none}
.timeline li.is-done::before{background:var(--ok-600)}
.timeline li.is-current::before{background:var(--orange-500); box-shadow:0 0 0 4px var(--orange-100)}
.timeline__title{font-weight:700; font-size:.9rem}
.timeline__meta{font-size:.78rem; color:var(--text-3)}

/* شريط تقدّم الطلب */
.steps{display:flex; gap:4px; margin:12px 0}
.steps__item{flex:1; height:5px; border-radius:3px; background:var(--border)}
.steps__item.is-done{background:var(--ok-600)}
.steps__item.is-current{background:var(--orange-500)}

/* ---------- لوحات التحكم ---------- */
.shell{display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - var(--header-h)); align-items:start}
.sidebar{
  background:var(--surface); border-inline-end:1px solid var(--border);
  padding:16px 12px; position:sticky; top:var(--header-h); align-self:start;
  max-height:calc(100vh - var(--header-h)); overflow-y:auto;
}
.sidebar__group{font-size:.72rem; font-weight:800; color:var(--text-3); padding:12px 12px 6px; letter-spacing:.04em}
.sidebar a{
  display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:9px;
  color:var(--text-2); font-size:.9rem; font-weight:600; margin-bottom:2px;
}
.sidebar a:hover{background:var(--surface-2); color:var(--text); text-decoration:none}
.sidebar a.is-active{background:var(--navy-900); color:#fff}
.sidebar a .count{margin-inline-start:auto; background:var(--orange-500); color:#fff;
  font-size:.7rem; padding:1px 7px; border-radius:999px; font-weight:700}
.content{padding:24px; min-width:0}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:static; max-height:none; border-inline-end:0; border-bottom:1px solid var(--border);
    display:flex; gap:6px; overflow-x:auto; padding:10px}
  .sidebar__group{display:none}
  .sidebar a{white-space:nowrap; margin:0}
  .content{padding:16px}
}

/* ---------- الصفحة الرئيسية ---------- */
.hero{
  background:linear-gradient(150deg,var(--navy-950) 0%,var(--navy-800) 60%,var(--navy-700) 100%);
  color:#fff; padding:64px 0 72px; position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; inset-inline-end:-90px; top:-90px; width:340px; height:340px;
  background:radial-gradient(circle,var(--orange-500) 0%,transparent 68%); opacity:.28;
}
.hero h1{font-size:2.4rem; max-width:640px; color:#fff}
.hero p{color:#bdd0e0; font-size:1.05rem; max-width:600px}
@media (max-width:640px){ .hero h1{font-size:1.7rem} .hero{padding:44px 0 50px} }
.feature{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px}
.feature__icon{width:44px;height:44px;border-radius:12px; background:var(--orange-100);
  display:grid; place-items:center; font-size:1.35rem; margin-bottom:10px}
.step-num{width:34px;height:34px;border-radius:50%; background:var(--navy-900); color:#fff;
  display:grid; place-items:center; font-weight:800; font-size:.9rem; flex:none}

/* ---------- التنبيهات ---------- */
.alert{border-radius:var(--radius-sm); padding:12px 15px; font-size:.89rem; margin-bottom:14px;
  border:1px solid transparent; display:flex; gap:9px; align-items:flex-start}
.alert--info{background:var(--info-100); color:var(--info-600); border-color:currentColor}
.alert--warn{background:var(--warn-100); color:var(--warn-600); border-color:currentColor}
.alert--danger{background:var(--danger-100); color:var(--danger-600); border-color:currentColor}
.alert--ok{background:var(--ok-100); color:var(--ok-600); border-color:currentColor}

/* ---------- Toasts ---------- */
#kx-toasts{position:fixed; bottom:20px; inset-inline-start:20px; z-index:999;
  display:flex; flex-direction:column; gap:8px}
.toast{background:var(--navy-900); color:#fff; padding:12px 18px; border-radius:10px;
  box-shadow:var(--shadow-3); font-size:.9rem; font-weight:600; max-width:380px;
  animation:slideUp .25s ease}
.toast--error{background:var(--danger-600)}
.toast--success{background:var(--ok-600)}
.toast.is-out{opacity:0; transform:translateY(8px); transition:.3s}
@keyframes slideUp{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}

/* ---------- النوافذ ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(6,20,35,.55); z-index:200;
  display:grid; place-items:center; padding:20px; backdrop-filter:blur(2px)}
.modal{background:var(--surface); border-radius:var(--radius-lg); padding:24px;
  max-width:520px; width:100%; box-shadow:var(--shadow-3); max-height:86vh; overflow-y:auto}
.modal__actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px}

/* ---------- متفرقات ---------- */
.empty{text-align:center; padding:44px 20px; color:var(--text-3)}
.empty__icon{font-size:2.4rem; margin-bottom:8px; opacity:.55}
.spinner{width:22px;height:22px;border:2.5px solid var(--border-2); border-top-color:var(--orange-500);
  border-radius:50%; animation:spin .7s linear infinite; display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--surface-2) 50%,var(--border) 75%);
  background-size:200% 100%; animation:shimmer 1.3s infinite; border-radius:6px; height:14px}
@keyframes shimmer{to{background-position:-200% 0}}
.otp-input{letter-spacing:.6em; text-align:center; font-size:1.35rem; font-weight:800}
.map-pick{height:200px; border-radius:var(--radius-sm); background:var(--navy-50);
  border:1.5px dashed var(--border-2); display:grid; place-items:center; text-align:center;
  color:var(--text-3); font-size:.86rem; cursor:pointer; padding:14px}
.map-pick:hover{border-color:var(--orange-400)}
.map-pick.has-value{background:var(--ok-100); border-style:solid; border-color:var(--ok-600); color:var(--ok-600)}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto}
.tabs button{background:none; border:0; padding:10px 16px; font-family:var(--font); font-size:.9rem;
  font-weight:700; color:var(--text-3); cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap}
.tabs button.is-active{color:var(--orange-600); border-bottom-color:var(--orange-500)}
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.filter-bar .input, .filter-bar select{width:auto; min-width:150px; padding:8px 12px; font-size:.88rem}
.footer{background:var(--navy-950); color:#9fb5c8; padding:40px 0 24px; margin-top:48px; font-size:.88rem}
.footer a{color:#c8d8e6} .footer h4{color:#fff; font-size:.92rem; margin-bottom:10px}
.footer__bottom{border-top:1px solid rgba(255,255,255,.1); margin-top:24px; padding-top:16px;
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:.8rem}
@media print{ .appbar,.sidebar,.footer,.btn,.demo-bar{display:none !important}
  .content{padding:0} body{background:#fff} .card{box-shadow:none; border-color:#ddd} }

/* ============================================================
   الرسوم البيانية — لوحة ألوان مُتحقَّق منها (فحص عمى الألوان والتباين)
   الشرائح الثلاث تجتاز كل الفحوص في الوضعين الفاتح والداكن.

<script>
/* أدوات عامة: تنسيق، تحقق، DOM، تصدير */
window.KX = window.KX || {};
KX.util = (function () {
  const cfg = () => KX.config;

  /* ---------- معرفات وتواريخ ---------- */
  function uid(prefix) {
    const t = Date.now().toString(36);
    const r = Math.random().toString(36).slice(2, 8);
    return (prefix ? prefix + '_' : '') + t + r;
  }
  const nowISO = () => new Date().toISOString();

  function orderNo(seq) {              // رقم طلب مقروء: KX-2026-000148
    const y = new Date().getFullYear();
    return 'KX-' + y + '-' + String(seq).padStart(6, '0');
  }

  /* ---------- أرقام وعملة ---------- */
  function round(n, d) {
    const f = Math.pow(10, d === undefined ? 3 : d);
    return Math.round((Number(n) + Number.EPSILON) * f) / f;
  }
  function money(n) {                  // 12.5 -> "12.500"
    const d = cfg().currency.decimals;
    return (Number(n) || 0).toFixed(d);
  }
  function fmtOMR(n) {                 // 12.5 -> "12.500 ر.ع."
    return money(n) + ' ' + cfg().currency.symbol;
  }
  const NUM_LOCALE = 'ar-OM-u-nu-latn';   // أرقام لاتينية لتطابق تنسيق العملة
  function fmtNum(n, d) {
    return new Intl.NumberFormat(NUM_LOCALE, {
      minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 2 : d
    }).format(Number(n) || 0);
  }
  const ceilDiv = (a, b) => (b > 0 ? Math.ceil(a / b) : 0);

  /* الوحدة تأتي من المادة؛ لا تُفترض هنا */
  const unitLabel = (u) => (KX.schema.UNITS[u || 'm3'] || u || '');
  /* الكمية بلا كسر زائد: 18 م³ لا 18.0 م³ */
  const fmtQty = (v, u) => new Intl.NumberFormat(NUM_LOCALE,
    { minimumFractionDigits: 0, maximumFractionDigits: 1 }).format(Number(v) || 0) +
    ' ' + unitLabel(u);
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);

  /* ---------- تواريخ ---------- */
  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString(NUM_LOCALE,
      { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function fmtDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString(NUM_LOCALE, { year: 'numeric', month: 'short', day: 'numeric' }) +
           ' • ' + d.toLocaleTimeString(NUM_LOCALE, { hour: '2-digit', minute: '2-digit' });
  }
  function relTime(iso) {
    const diff = (Date.now() - new Date(iso)) / 1000;
    if (diff < 60) return 'الآن';
    if (diff < 3600) return 'قبل ' + Math.floor(diff / 60) + ' دقيقة';
    if (diff < 86400) return 'قبل ' + Math.floor(diff / 3600) + ' ساعة';
    return 'قبل ' + Math.floor(diff / 86400) + ' يوم';
  }
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const addDays = (iso, n) => new Date(new Date(iso).getTime() + n * 86400000).toISOString();

  /* ---------- تحقق من المدخلات ---------- */
  function normalizePhone(p) {          // يقبل 9xxxxxxx أو 9689xxxxxxx أو +968...
    let s = String(p || '').replace(/[^\d]/g, '');
    if (s.startsWith('00968')) s = s.slice(5);
    if (s.length === 8) s = '968' + s;
    return s;
  }
  function isValidPhone(p) {
    const s = normalizePhone(p);
    return /^968[79][0-9]{7}$/.test(s) || /^968[89][0-9]{7}$/.test(s);
  }
  function fmtPhone(p) {
    const s = normalizePhone(p);
    return s.length === 11 ? '+968 ' + s.slice(3, 7) + ' ' + s.slice(7) : p;
  }
  function isValidCoords(lat, lng) {
    return Number.isFinite(+lat) && Number.isFinite(+lng) &&
           Math.abs(+lat) <= 90 && Math.abs(+lng) <= 180;
  }
  /* التحقق من مجموعة حقول: يعيد كائن أخطاء فارغًا عند النجاح */
  function validate(values, rules) {
    const errors = {};
    Object.keys(rules).forEach(function (k) {
      const r = rules[k], v = values[k];
      if (r.required && (v === undefined || v === null || String(v).trim() === '')) {
        errors[k] = r.message || 'هذا الحقل مطلوب'; return;
      }
      if (v === undefined || v === null || v === '') return;
      if (r.type === 'number') {
        const n = Number(v);
        if (!Number.isFinite(n)) { errors[k] = 'أدخل رقمًا صحيحًا'; return; }
        if (r.min !== undefined && n < r.min) { errors[k] = 'أقل قيمة مسموحة ' + r.min; return; }
        if (r.max !== undefined && n > r.max) { errors[k] = 'أعلى قيمة مسموحة ' + r.max; return; }
      }
      if (r.type === 'phone' && !isValidPhone(v)) { errors[k] = 'رقم هاتف عُماني غير صحيح'; return; }
      if (r.minLength && String(v).length < r.minLength) {
        errors[k] = 'الحد الأدنى ' + r.minLength + ' حروف'; return;
      }
      if (r.pattern && !r.pattern.test(String(v))) { errors[k] = r.message || 'صيغة غير صحيحة'; }
    });
    return errors;
  }

  /* ---------- DOM ---------- */
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  const $  = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  function on(root, evt, sel, handler) {
    (root || document).addEventListener(evt, function (e) {
      const t = e.target.closest(sel);
      if (t && (root || document).contains(t)) handler(e, t);
    });
  }

  /* ---------- إشعارات واجهة ---------- */
  function toast(msg, kind) {
    let host = $('#kx-toasts');
    if (!host) { host = document.createElement('div'); host.id = 'kx-toasts'; document.body.appendChild(host); }
    const n = document.createElement('div');
    n.className = 'toast toast--' + (kind || 'info');
    n.textContent = msg;
    host.appendChild(n);
    setTimeout(function () { n.classList.add('is-out'); setTimeout(() => n.remove(), 300); }, 3200);
  }

  /* حوار تأكيد يعيد Promise<boolean> */
  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true">' +
          '<h3>' + esc(opts.title || 'تأكيد') + '</h3>' +
          '<p>' + esc(opts.message || '') + '</p>' +
          (opts.reasonRequired
            ? '<label class="field"><span>السبب <b class="req">*</b></span><textarea id="kx-reason" rows="3"></textarea></label>'
            : '') +
          '<div class="modal__actions">' +
            '<button class="btn btn--ghost" data-no>إلغاء</button>' +
            '<button class="btn ' + (opts.danger ? 'btn--danger' : 'btn--primary') + '" data-yes>' +
              esc(opts.confirmText || 'تأكيد') + '</button>' +
          '</div></div>';
      document.body.appendChild(wrap);
      const close = (val) => { wrap.remove(); resolve(val); };
      wrap.querySelector('[data-no]').onclick = () => close(false);
      wrap.querySelector('[data-yes]').onclick = function () {
        if (opts.reasonRequired) {
          const r = wrap.querySelector('#kx-reason').value.trim();
          if (!r) { toast('السبب مطلوب', 'error'); return; }
          close(r);
        } else close(true);
      };
      wrap.onclick = (e) => { if (e.target === wrap) close(false); };
    });
  }

  /* ---------- CSV (استيراد/تصدير الأسعار والتقارير) ---------- */
  function toCSV(rows, columns) {
    const cols = columns || Object.keys(rows[0] || {});
    const escCell = (v) => {
      const s = v === undefined || v === null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return '﻿' + [cols.join(',')]
      .concat(rows.map((r) => cols.map((c) => escCell(r[c])).join(',')))
      .join('\n');
  }
  function parseCSV(text) {
    const clean = text.replace(/^﻿/, '').replace(/\r\n/g, '\n').trim();
    const lines = clean.split('\n').filter((l) => l.trim() !== '');
    if (!lines.length) return [];
    const split = (line) => {
      const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (q) {
          if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (ch === '"') q = false;
          else cur += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { out.push(cur); cur = ''; }
        else cur += ch;
      }
      out.push(cur); return out;
    };
    const head = split(lines[0]).map((h) => h.trim());
    return lines.slice(1).map(function (l) {
      const cells = split(l), o = {};
      head.forEach((h, i) => { o[h] = (cells[i] || '').trim(); });
      return o;
    });
  }
  /* حفظ ملف للمستخدم.
     في مضيف يمنع التنزيل المباشر (صفحة منشورة) يُستخدم مسار الحفظ المتاح؛
     وفي الملف المحلي أو الخادم العادي يُستخدم رابط Blob. */
  let _downloads;                       // undefined = لم يُفحص، null = غير متاح
  async function saveHandler() {
    if (_downloads !== undefined) return _downloads;
    _downloads = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { _downloads = await window.claude.use('downloads'); } catch (e) { _downloads = null; }
    }
    return _downloads;
  }
  async function download(filename, content, mime) {
    const cap = await saveHandler();
    if (cap) {
      try { await cap.save({ filename: filename, data: content }); return true; }
      catch (err) {
        if (err && err.code === 'declined') return false;
        if (err && ['rate_limited', 'unavailable', 'not_granted'].indexOf(err.code) !== -1) {
          toast('تعذّر حفظ الملف في هذا العرض', 'error'); return false;
        }
        /* أخطاء أخرى: جرّب المسار المحلي */
      }
    }
    const blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return true;
  }

  /* ---------- متفرقات ---------- */
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function groupBy(arr, key) {
    return arr.reduce(function (acc, x) {
      const k = typeof key === 'function' ? key(x) : x[key];
      (acc[k] = acc[k] || []).push(x); return acc;
    }, {});
  }
  function sortBy(arr, key, dir) {
    const f = typeof key === 'function' ? key : (x) => x[key];
    const s = dir === 'desc' ? -1 : 1;
    return arr.slice().sort((a, b) => (f(a) > f(b) ? s : f(a) < f(b) ? -s : 0));
  }
  /* مسافة تقريبية بين إحداثيتين بالكيلومتر (Haversine) */
  function distanceKm(a, b) {
    if (!a || !b) return null;
    const R = 6371, toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 +
              Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return round(2 * R * Math.asin(Math.sqrt(h)), 1);
  }

  return { uid, nowISO, orderNo, round, money, fmtOMR, fmtNum, unitLabel, fmtQty, ceilDiv, clamp, sum,
           fmtDate, fmtDateTime, relTime, daysBetween, addDays,
           normalizePhone, isValidPhone, fmtPhone, isValidCoords, validate,
           esc, $, $$, on, toast, confirmDialog,
           toCSV, parseCSV, download, clone, groupBy, sortBy, distanceKm };
})();

</script>

  let lang = localStorage.getItem('kx:lang') || KX.config.i18n.default;
  if (!LANGS[lang]) lang = 'ar';

  /* ترجمة مفتاح — بلا ترجمة آلية، ورجوع صريح */
  function t(key, params) {
    let s = (dict[lang] && dict[lang][key]);
    if (s === undefined) s = dict.en && dict.en[key];
    if (s === undefined) s = dict.ar && dict.ar[key];
    if (s === undefined) s = key;
    if (params) Object.keys(params).forEach((k) => { s = s.replace('{' + k + '}', params[k]); });
    return s;
  }

  /* اختيار نص من كائن متعدد اللغات مخزّن في قاعدة البيانات
     (أسماء المواد مثلًا) — بنفس سلسلة الرجوع */
  function pick(obj, fallback) {
    if (!obj) return fallback || '';
    if (typeof obj === 'string') return obj;
    return obj[lang] || obj.en || obj.ar || fallback || '';
  }

  function apply() {
    const L = LANGS[lang];
    const el = document.documentElement;
    el.lang = lang;
    el.dir = L.dir;
    el.style.setProperty('--font', L.font);
    el.style.setProperty('--line-height', L.lineHeight || 1.65);
    el.setAttribute('data-lang', lang);
  }
  function setLang(l) {
    if (!LANGS[l]) return;
    lang = l;
    try { localStorage.setItem('kx:lang', l); } catch (e) {}
    apply();
    KX.store.emit('change:lang', l);
  }
  const getLang = () => lang;
  const dir = () => LANGS[lang].dir;
  const locale = () => LANGS[lang].locale;
  const meta = (l) => LANGS[l || lang];
  const available = () => Object.keys(LANGS);
  /* هل للمفتاح ترجمة معتمدة في هذه اللغة؟ (لكشف النواقص قبل الإطلاق) */
  const has = (key, l) => !!(dict[l || lang] && dict[l || lang][key]);
  function missing(l) {
    const base = Object.keys(dict.ar);
    return base.filter((k) => !dict[l] || dict[l][k] === undefined);
  }

  return { t, pick, setLang, getLang, dir, locale, meta, available, apply, has, missing, LANGS, dict };
})();

<script>
/* حالة التطبيق + ناقل أحداث بسيط */
window.KX = window.KX || {};
KX.store = (function () {
  const listeners = {};
  const state = { session: null, route: null, cart: null };

  function on(evt, fn) {
    (listeners[evt] = listeners[evt] || []).push(fn);
    return () => { listeners[evt] = listeners[evt].filter((f) => f !== fn); };
  }
  function emit(evt, payload) {
    (listeners[evt] || []).forEach((fn) => { try { fn(payload); } catch (e) { console.error(e); } });
    (listeners['*'] || []).forEach((fn) => fn({ evt, payload }));
  }
  function set(key, value) { state[key] = value; emit('change:' + key, value); }
  const get = (key) => state[key];

  /* تخزين محلي آمن (يتحمّل الوضع الخاص وحجب التخزين) */
  function ls(key, value) {
    try {
      if (value === undefined) {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      }
      if (value === null) { localStorage.removeItem(key); return null; }
      localStorage.setItem(key, JSON.stringify(value));
      return value;
    } catch (e) { console.warn('storage unavailable', e); return null; }
  }
  return { on, emit, set, get, state, ls };
})();

</script>

<script>
/* موجّه مسارات بسيط قائم على الـ hash — يعمل من ملف محلي أو خادم */
window.KX = window.KX || {};
KX.router = (function () {
  const routes = [];
  let notFound = null, beforeEach = null;

  function add(pattern, handler, meta) {
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:[A-Za-z_]+/g, function (m) {
      keys.push(m.slice(1)); return '([^/]+)';
    }) + '$');
    routes.push({ rx, keys, handler, meta: meta || {}, pattern });
  }
  const setNotFound = (fn) => { notFound = fn; };
  const setGuard    = (fn) => { beforeEach = fn; };

  function current() {
    const h = location.hash.replace(/^#/, '');
    return h === '' ? '/' : h;
  }
  function go(path, replace) {
    if (replace) location.replace('#' + path); else location.hash = path;
    if (current() === path) resolve();
  }
  function resolve() {
    const path = current().split('?')[0];
    const query = {};
    const qs = current().split('?')[1];
    if (qs) qs.split('&').forEach(function (p) {
      const [k, v] = p.split('=');
      query[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });

    for (const r of routes) {
      const m = path.match(r.rx);
      if (!m) continue;
      const params = {};
      r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
      const ctx = { path, params, query, meta: r.meta };
      if (beforeEach) {
        const redirect = beforeEach(ctx);
        if (redirect) { go(redirect, true); return; }
      }
      KX.store.set('route', ctx);
      window.scrollTo(0, 0);
      Promise.resolve(r.handler(ctx)).catch(function (e) {
        console.error(e);
        KX.util.toast('حدث خطأ غير متوقع: ' + e.message, 'error');
      });
      return;
    }
    if (notFound) notFound({ path });
  }
  function start() {
    window.addEventListener('hashchange', resolve);
    resolve();
  }
  return { add, setNotFound, setGuard, go, start, current, resolve };
})();

</script>

<script>
/* مشغّل بيانات محلي (localStorage) — للنسخة التجريبية والعمل دون اتصال.
   يطابق واجهة مشغّل Supabase تمامًا حتى يمكن التبديل دون تعديل منطق الأعمال. */
window.KX = window.KX || {};
KX.driverLocal = (function () {
  const NS = 'kx:db:';
  const cache = {};

  function read(table) {
    if (cache[table]) return cache[table];
    let rows = [];
    try {
      const raw = localStorage.getItem(NS + table);
      rows = raw ? JSON.parse(raw) : [];
    } catch (e) { rows = []; }
    cache[table] = rows;
    return rows;
  }
  function write(table, rows) {
    cache[table] = rows;
    try { localStorage.setItem(NS + table, JSON.stringify(rows)); }
    catch (e) { KX.util.toast('تعذّر الحفظ: مساحة التخزين ممتلئة', 'error'); throw e; }
  }

  /* مطابقة شروط where: {field: value} أو {field: {op, value}} */
  function match(row, where) {
    if (!where) return true;
    return Object.keys(where).every(function (k) {
      const c = where[k], v = row[k];
      if (c === null || typeof c !== 'object') return v === c;
      if ('in' in c)    return c.in.indexOf(v) !== -1;
      if ('neq' in c)   return v !== c.neq;
      if ('gte' in c)   return v >= c.gte;
      if ('lte' in c)   return v <= c.lte;
      if ('gt'  in c)   return v >  c.gt;
      if ('lt'  in c)   return v <  c.lt;
      if ('like' in c)  return String(v || '').toLowerCase().indexOf(String(c.like).toLowerCase()) !== -1;
      return false;
    });
  }

  async function list(table, opts) {
    opts = opts || {};
    let rows = read(table).filter((r) => match(r, opts.where));
    if (!opts.includeDeleted) rows = rows.filter((r) => r.status_flag !== 'deleted');
    if (opts.order) rows = KX.util.sortBy(rows, opts.order.field, opts.order.dir);
    if (opts.limit) rows = rows.slice(opts.offset || 0, (opts.offset || 0) + opts.limit);
    return KX.util.clone(rows);
  }
  async function get(table, id) {
    const row = read(table).find((r) => r.id === id);
    return row ? KX.util.clone(row) : null;
  }
  async function insert(table, obj) {
    const rows = read(table);
    const rec = Object.assign({
      id: obj.id || KX.util.uid(table.slice(0, 3)),
      created_at: KX.util.nowISO(),
      updated_at: KX.util.nowISO(),
      created_by: (KX.store.get('session') || {}).user_id || 'system',
      status_flag: 'active'
    }, obj);
    rows.push(rec); write(table, rows);
    return KX.util.clone(rec);
  }
  async function insertMany(table, arr) {
    const out = [];
    for (const o of arr) out.push(await insert(table, o));
    return out;
  }
  async function update(table, id, patch) {
    const rows = read(table);
    const i = rows.findIndex((r) => r.id === id);
    if (i === -1) throw new Error('السجل غير موجود: ' + table + '/' + id);
    rows[i] = Object.assign({}, rows[i], patch, { updated_at: KX.util.nowISO() });
    write(table, rows);
    return KX.util.clone(rows[i]);
  }
  /* لا حذف نهائي للسجلات المالية — تعليم فقط */
  async function softDelete(table, id) { return update(table, id, { status_flag: 'deleted' }); }
  async function hardDelete(table, id) {
    const meta = KX.schema.TABLES[table] || {};
    if (meta.immutable) throw new Error('لا يُسمح بحذف سجلات ' + (meta.label || table));
    write(table, read(table).filter((r) => r.id !== id));
    return true;
  }
  async function count(table, where) {
    return read(table).filter((r) => r.status_flag !== 'deleted' && match(r, where)).length;
  }
  /* معاملة مبسّطة: لقطة قبل التنفيذ واسترجاعها عند الفشل */
  async function tx(fn) {
    const snapshot = {};
    Object.keys(KX.schema.TABLES).forEach((t) => { snapshot[t] = KX.util.clone(read(t)); });
    try { return await fn(); }
    catch (e) {
      Object.keys(snapshot).forEach((t) => write(t, snapshot[t]));
      throw e;
    }
  }
  function reset() {
    Object.keys(KX.schema.TABLES).forEach(function (t) {
      delete cache[t];
      try { localStorage.removeItem(NS + t); } catch (e) {}
    });
  }
  const raw = (table) => read(table);

  return { list, get, insert, insertMany, update, softDelete, hardDelete, count, tx, reset, raw, write };
})();

</script>

<script>
/* مشغّل Supabase / PostgreSQL — نفس واجهة المشغّل المحلي.
   للتفعيل: ضع url و anonKey في config، وأضف سكربت supabase-js في index.html،
   ثم غيّر KX.config.data.driver إلى 'supabase'. لا يتغيّر أي منطق أعمال. */
window.KX = window.KX || {};
KX.driverSupabase = (function () {
  let client = null;
  function sb() {
    if (client) return client;
    const c = KX.config.data.supabase;
    if (!window.supabase || !c.url || !c.anonKey) {
      throw new Error('Supabase غير مهيّأ — راجع config/app.config.js');
    }
    client = window.supabase.createClient(c.url, c.anonKey);
    return client;
  }
  function applyWhere(q, where) {
    Object.keys(where || {}).forEach(function (k) {
      const c = where[k];
      if (c === null) { q = q.is(k, null); return; }          // IS NULL في PostgREST
      if (typeof c !== 'object') { q = q.eq(k, c); return; }
      if ('in'   in c) q = q.in(k, c.in);
      if ('neq'  in c) q = q.neq(k, c.neq);
      if ('gte'  in c) q = q.gte(k, c.gte);
      if ('lte'  in c) q = q.lte(k, c.lte);
      if ('gt'   in c) q = q.gt(k, c.gt);
      if ('lt'   in c) q = q.lt(k, c.lt);
      if ('like' in c) q = q.ilike(k, '%' + c.like + '%');
    });
    return q;
  }
  async function list(table, opts) {
    opts = opts || {};
    let q = sb().from(table).select('*');
    q = applyWhere(q, opts.where);
    if (!opts.includeDeleted) q = q.neq('status_flag', 'deleted');
    if (opts.order) q = q.order(opts.order.field, { ascending: opts.order.dir !== 'desc' });
    if (opts.limit) q = q.range(opts.offset || 0, (opts.offset || 0) + opts.limit - 1);
    const { data, error } = await q;
    if (error) throw new Error(error.message);
    return data || [];
  }
  async function get(table, id) {
    const { data, error } = await sb().from(table).select('*').eq('id', id).maybeSingle();
    if (error) throw new Error(error.message);
    return data;
  }
  async function insert(table, obj) {
    const { data, error } = await sb().from(table).insert(obj).select().single();
    if (error) throw new Error(error.message);
    return data;
  }
  async function insertMany(table, arr) {
    const { data, error } = await sb().from(table).insert(arr).select();
    if (error) throw new Error(error.message);
    return data;
  }
  async function update(table, id, patch) {
    const { data, error } = await sb().from(table)
      .update(Object.assign({}, patch, { updated_at: new Date().toISOString() }))
      .eq('id', id).select().single();
    if (error) throw new Error(error.message);
    return data;
  }
  const softDelete = (table, id) => update(table, id, { status_flag: 'deleted' });
  async function hardDelete(table, id) {
    const meta = KX.schema.TABLES[table] || {};
    if (meta.immutable) throw new Error('لا يُسمح بحذف سجلات ' + (meta.label || table));
    const { error } = await sb().from(table).delete().eq('id', id);
    if (error) throw new Error(error.message);
    return true;
  }
  async function count(table, where) {
    let q = sb().from(table).select('id', { count: 'exact', head: true }).neq('status_flag', 'deleted');
    q = applyWhere(q, where);
    const { count: c, error } = await q;
    if (error) throw new Error(error.message);
    return c || 0;
  }
  /* المعاملات المالية تُنفَّذ عبر دوال RPC في قاعدة البيانات (انظر db/004_functions.sql) */
  async function tx(fn) { return fn(); }
  async function rpc(name, args) {
    const { data, error } = await sb().rpc(name, args);
    if (error) throw new Error(error.message);
    return data;
  }
  function reset() { throw new Error('غير مسموح على قاعدة بيانات الإنتاج'); }

  return { list, get, insert, insertMany, update, softDelete, hardDelete, count, tx, rpc, reset };
})();

</script>

<script>
/* واجهة البيانات الموحّدة — كل منطق الأعمال يمرّ من هنا فقط */
window.KX = window.KX || {};
KX.repo = (function () {
  function driver() {
    return KX.config.data.driver === 'supabase' ? KX.driverSupabase : KX.driverLocal;
  }
  const list        = (t, o)    => driver().list(t, o);
  const get         = (t, id)   => driver().get(t, id);
  const insert      = (t, o)    => driver().insert(t, o);
  const insertMany  = (t, a)    => driver().insertMany(t, a);
  const update      = (t, id, p)=> driver().update(t, id, p);
  const softDelete  = (t, id)   => driver().softDelete(t, id);
  const hardDelete  = (t, id)   => driver().hardDelete(t, id);
  const count       = (t, w)    => driver().count(t, w);
  const tx          = (fn)      => driver().tx(fn);
  const reset       = ()        => driver().reset();

  /* أول سجل مطابق */
  async function first(table, where, order) {
    const rows = await list(table, { where, order, limit: 1 });
    return rows[0] || null;
  }
  /* ربط سجلات بمفتاح خارجي: يعيد Map للبحث السريع */
  async function mapBy(table, key) {
    const rows = await list(table, {});
    const m = {};
    rows.forEach((r) => { m[r[key || 'id']] = r; });
    return m;
  }
  /* قراءة إعداد من جدول الإعدادات مع الرجوع لقيمة config الافتراضية */
  async function setting(key, fallback) {
    const row = await first('settings', { key: key });
    return row ? row.value : fallback;
  }
  async function setSetting(key, value) {
    const row = await first('settings', { key: key });
    if (row) return update('settings', row.id, { value: value });
    return insert('settings', { key: key, value: value });
  }
  return { list, get, insert, insertMany, update, softDelete, hardDelete,
           count, tx, reset, first, mapBy, setting, setSetting };
})();

</script>

<script>
/* سجل التدقيق — يُستدعى عند كل عملية حسّاسة ولا يُحذف أبدًا */
window.KX = window.KX || {};
KX.audit = (function () {
  async function log(action, entity, entityId, details) {
    const s = KX.store.get('session') || {};
    try {
      await KX.repo.insert('audit_logs', {
        action: action,                 // مثال: order.transition, price.update, payment.verify
        entity: entity,
        entity_id: entityId || null,
        actor_id: s.user_id || 'system',
        actor_role: s.role || 'system',
        actor_name: s.name || 'النظام',
        details: details || {},
        ip: 'local',
        at: KX.util.nowISO()
      });
    } catch (e) { console.error('audit failed', e); }
  }
  /* لقطة قبل/بعد لتتبّع التغييرات الحقلية */
  function diff(before, after) {
    const out = {};
    const keys = new Set(Object.keys(before || {}).concat(Object.keys(after || {})));
    keys.forEach(function (k) {
      if (['updated_at'].indexOf(k) !== -1) return;
      const b = before ? before[k] : undefined, a = after ? after[k] : undefined;
      if (JSON.stringify(b) !== JSON.stringify(a)) out[k] = { from: b, to: a };
    });
    return out;
  }
  return { log, diff };
})();

</script>

<script>
/* ============================================================
   المصادقة والصلاحيات — دخول برقم الهاتف ورمز OTP
   في النسخة التجريبية يُولَّد الرمز محليًا ويُعرض على الشاشة.
   في الإنتاج: يُستبدل sendOtp بمزوّد SMS، ويُدار الدخول عبر Supabase Auth + RLS.
   ============================================================ */
window.KX = window.KX || {};
KX.auth = (function () {
  const U = () => KX.util;
  const SESSION_KEY = 'kx:session';
  const OTP_TTL_MIN = 10;
  const MAX_ATTEMPTS = 5;

  /* ---------- الجلسة ---------- */
  function restore() {
    const s = KX.store.ls(SESSION_KEY);
    if (s && s.expires_at && s.expires_at > U().nowISO()) {
      KX.store.set('session', s);
      return s;
    }
    KX.store.ls(SESSION_KEY, null);
    return null;
  }
  const session = () => KX.store.get('session');
  const isLoggedIn = () => !!session();
  const role = () => (session() || {}).role || 'guest';

  /* ---------- الصلاحيات (RBAC) ---------- */
  function can(permission) {
    const perms = KX.schema.PERMISSIONS[role()] || [];
    if (perms.indexOf('*') !== -1) return true;
    if (perms.indexOf(permission) !== -1) return true;
    /* دعم النمط العام: orders.read يغطي orders.read.own */
    return perms.some((p) => permission.indexOf(p + '.') === 0);
  }
  function requireRole(roles) {
    const r = role();
    return (Array.isArray(roles) ? roles : [roles]).indexOf(r) !== -1;
  }

  /* ---------- إرسال رمز التحقق ---------- */
  async function sendOtp(phoneRaw) {
    const phone = U().normalizePhone(phoneRaw);
    if (!U().isValidPhone(phone)) throw new Error('رقم هاتف عُماني غير صحيح');

    /* حد المحاولات: 3 رموز خلال 10 دقائق للرقم الواحد */
    const recent = await KX.repo.list('otp_codes', {
      where: { phone: phone, created_at: { gte: new Date(Date.now() - OTP_TTL_MIN * 60000).toISOString() } }
    });
    if (recent.length >= 3) throw new Error('تجاوزت عدد المحاولات المسموح. حاول بعد 10 دقائق.');

    const code = KX.config.demo.enabled
      ? KX.config.demo.otpCode
      : String(Math.floor(100000 + Math.random() * 900000));

    await KX.repo.insert('otp_codes', {
      phone: phone, code: code, attempts: 0, used: false,
      expires_at: new Date(Date.now() + OTP_TTL_MIN * 60000).toISOString()
    });
    /* في الإنتاج: KX.notify.channels.sms.send(...) */
    return { phone: phone, demo_code: KX.config.demo.enabled ? code : null };
  }

  /* ---------- التحقق وتسجيل الدخول ---------- */
  async function verifyOtp(phoneRaw, code) {
    const phone = U().normalizePhone(phoneRaw);
    const rows = await KX.repo.list('otp_codes', { where: { phone: phone, used: false } });
    const active = U().sortBy(rows, 'created_at', 'desc')[0];
    if (!active) throw new Error('لم يُرسل رمز لهذا الرقم');
    if (active.expires_at < U().nowISO()) throw new Error('انتهت صلاحية الرمز، أعد الإرسال');
    if (Number(active.attempts) >= MAX_ATTEMPTS) throw new Error('تجاوزت محاولات الإدخال');
    if (String(active.code) !== String(code).trim()) {
      await KX.repo.update('otp_codes', active.id, { attempts: Number(active.attempts) + 1 });
      throw new Error('رمز التحقق غير صحيح');
    }
    await KX.repo.update('otp_codes', active.id, { used: true });

    let user = await KX.repo.first('users', { phone: phone });
    if (!user) return { needsRegistration: true, phone: phone };
    if (user.account_status === 'suspended') throw new Error('هذا الحساب موقوف. تواصل مع الدعم.');
    if (user.account_status === 'pending') throw new Error('حسابك بانتظار اعتماد الإدارة.');

    return openSession(user);
  }

  async function openSession(user) {
    const s = {
      user_id: user.id, name: user.name, phone: user.phone, role: user.role,
      customer_id: null, supplier_id: null, transporter_id: null, driver_id: null,
      expires_at: U().addDays(U().nowISO(), 30),
      started_at: U().nowISO()
    };
    /* ربط الجلسة بملف الطرف حسب الدور */
    if (user.role === 'customer') {
      const p = await KX.repo.first('customer_profiles', { user_id: user.id });
      s.customer_id = p ? p.id : null; s.customer = p;
    } else if (user.role === 'supplier') {
      const p = await KX.repo.first('suppliers', { user_id: user.id });
      s.supplier_id = p ? p.id : null; s.supplier = p;
    } else if (user.role === 'transporter') {
      const p = await KX.repo.first('transport_companies', { user_id: user.id });
      s.transporter_id = p ? p.id : null; s.transporter = p;
    } else if (user.role === 'driver') {
      const p = await KX.repo.first('drivers', { user_id: user.id });
      s.driver_id = p ? p.id : null; s.driver = p;
    }
    KX.store.ls(SESSION_KEY, s);
    KX.store.set('session', s);
    await KX.repo.update('users', user.id, { last_login_at: U().nowISO() });
    await KX.audit.log('auth.login', 'users', user.id, { role: user.role });
    return { session: s, user: user };
  }

  /* ---------- التسجيل ---------- */
  async function register(data) {
    const phone = U().normalizePhone(data.phone);
    const exists = await KX.repo.first('users', { phone: phone });
    if (exists) throw new Error('هذا الرقم مسجّل مسبقًا');

    const errors = U().validate(data, {
      name:  { required: true, minLength: 3, message: 'الاسم مطلوب (3 أحرف على الأقل)' },
      phone: { required: true, type: 'phone' }
    });
    if (Object.keys(errors).length) throw new Error(Object.values(errors)[0]);

    const user = await KX.repo.insert('users', {
      name: data.name.trim(), phone: phone, email: data.email || null,
      role: 'customer',                      // التسجيل الذاتي للعملاء فقط
      account_status: 'active',
      lang: 'ar'
    });
    await KX.repo.insert('customer_profiles', {
      user_id: user.id, name: user.name, phone: phone,
      customer_type: data.customer_type || 'individual',
      company_name: data.company_name || null,
      cr_number: data.cr_number || null,
      vat_number: data.vat_number || null,
      credit_approved: false, credit_limit: 0, credit_used: 0,
      total_orders: 0, total_spent: 0
    });
    await KX.audit.log('auth.register', 'users', user.id, { type: data.customer_type });
    return openSession(user);
  }

  function logout() {
    const s = session();
    if (s) KX.audit.log('auth.logout', 'users', s.user_id, {});
    KX.store.ls(SESSION_KEY, null);
    KX.store.set('session', null);
  }

  /* تحديث بيانات الجلسة بعد تعديل الملف الشخصي */
  async function refreshSession() {
    const s = session();
    if (!s) return null;
    const user = await KX.repo.get('users', s.user_id);
    return user ? openSession(user) : (logout(), null);
  }

  /* الصفحة الافتراضية لكل دور بعد الدخول */
  function homeFor(r) {
    return ({
      customer: '/customer', supplier: '/supplier', transporter: '/transporter',
      driver: '/driver', admin: '/admin', ops: '/admin'
    })[r || role()] || '/';
  }

  return { restore, session, isLoggedIn, role, can, requireRole,
           sendOtp, verifyOtp, register, logout, refreshSession, openSession, homeFor };
})();

</script>

<script>
/* الإشعارات — داخل التطبيق الآن، وقنوات خارجية جاهزة للربط لاحقًا */
window.KX = window.KX || {};
KX.notify = (function () {
  /* قنوات خارجية: تُفعّل بربط مزوّد فعلي دون تغيير نقاط الاستدعاء */
  const channels = {
    inapp: { enabled: true,  send: async (n) => n },
    sms:      { enabled: false, send: async () => { /* TODO: مزوّد SMS عُماني */ } },
    whatsapp: { enabled: false, send: async () => { /* TODO: WhatsApp Business API */ } },
    email:    { enabled: false, send: async () => { /* TODO: SMTP / مزوّد بريد */ } },
    push:     { enabled: false, send: async () => { /* TODO: Web Push */ } }
  };

  async function push(userId, title, body, link) {
    if (!userId) return null;
    const n = await KX.repo.insert('notifications', {
      user_id: userId, title: title, body: body, link: link || null,
      read: false, sent_at: KX.util.nowISO(), channels_sent: ['inapp']
    });
    Object.keys(channels).forEach(function (c) {
      if (c !== 'inapp' && channels[c].enabled) channels[c].send(n);
    });
    KX.store.emit('notification', n);
    return n;
  }

  /* رسائل حالة الطلب — نقطة واحدة لكل التنبيهات */
  const MESSAGES = {
    under_review:                  ['استلمنا طلبك', 'طلبك {no} قيد المراجعة، وسنبلغك فور تأكيد التوفّر.'],

    paid:                          ['تم استلام الدفع', 'تم تأكيد الدفع للطلب {no}، وسيصدر أمر التحميل.'],
    preparing:                     ['جاري التجهيز', 'صدر أمر التحميل للطلب {no}.'],
    loading:                       ['جاري التحميل', 'بدأ تحميل شاحنة طلبك {no} في الكسارة.'],
    in_transit:                    ['الشاحنة في الطريق', 'انطلقت شاحنة الطلب {no} إلى موقعك.'],
    arrived:                       ['وصلت الشاحنة', 'وصلت شاحنة الطلب {no} إلى الموقع. رمز الاستلام: {otp}'],
    delivered:                     ['تم التسليم', 'اكتمل تسليم الطلب {no}. شكرًا لثقتك.'],
    cancelled:                     ['أُلغي الطلب', 'تم إلغاء الطلب {no}.'],
    disputed:                      ['طلبك تحت المراجعة', 'فُتحت مراجعة للطلب {no} وسنتواصل معك.'],
    refunded_partial:              ['استرداد جزئي', 'تم اعتماد استرداد جزئي للطلب {no}.'],
    refunded_full:                 ['استرداد كامل', 'تم اعتماد استرداد كامل للطلب {no}.']
  };

  async function onOrderStatus(order, fromStatus) {
    const m = MESSAGES[order.status];
    if (!m) return;
    const body = m[1].replace('{no}', order.order_no).replace('{otp}', order.delivery_otp || '');
    await push(order.customer_id, m[0], body, '#/customer/orders/' + order.id);

    /* تنبيه الأطراف المعنية */
    if (order.status === 'awaiting_supplier' && order.supplier_id) {
      const s = await KX.repo.get('suppliers', order.supplier_id);
      if (s) await push(s.user_id, 'طلب جديد بانتظار تأكيدك',
        'الطلب ' + order.order_no + ' — ' + order.tons + ' طن', '#/supplier/orders');
    }
    if (order.status === 'awaiting_carrier' && order.transporter_id) {
      const t = await KX.repo.get('transport_companies', order.transporter_id);
      if (t) await push(t.user_id, 'مهمة نقل بانتظار قبولك',
        'الطلب ' + order.order_no + ' — ' + order.trips_planned + ' رحلة', '#/transporter/orders');
    }
    KX.store.emit('order:status', { order: order, from: fromStatus });
  }

  const forUser  = (userId) => KX.repo.list('notifications', { where: { user_id: userId }, order: { field: 'sent_at', dir: 'desc' } });
  const markRead = (id)     => KX.repo.update('notifications', id, { read: true });
  async function markAllRead(userId) {
    const rows = await forUser(userId);
    for (const n of rows) if (!n.read) await markRead(n.id);
  }
  /* بث جماعي من لوحة الإدارة */
  async function broadcast(role, title, body) {
    const users = await KX.repo.list('users', role ? { where: { role: role } } : {});
    for (const u of users) await push(u.id, title, body, null);
    await KX.audit.log('notification.broadcast', 'notifications', null, { role: role, count: users.length });
    return users.length;
  }

  return { push, onOrderStatus, forUser, markRead, markAllRead, broadcast, channels, MESSAGES };
})();

</script>

<script>
/* ============================================================
   محرّك التسعير
   السعر النهائي = سعر المواد + تكلفة النقل + رسوم المنصة + الضريبة − الخصم

   وحدة البيع تأتي من المادة نفسها (م³ أو طن) ولا تُخلط داخل الطلب الواحد،
   والكميات والحدود وحمولة الشاحنة كلها بنفس تلك الوحدة.
   لا تُثبَّت أي مادة أو سعر أو منطقة داخل الكود.
   ============================================================ */
window.KX = window.KX || {};
KX.pricing = (function () {
  const U = () => KX.util;

  /* الإعدادات المالية الفعّالة: جدول الإعدادات يتقدّم على القيم الافتراضية */
  async function financeSettings() {
    const def = KX.config.finance;
    const s = await KX.repo.setting('finance', null);
    return Object.assign({}, def, s || {});
  }

  /* حمولة الشاحنة بوحدة المادة المطلوبة */
  function truckCapacity(truck, unit) {
    const v = unit === 'ton' ? truck.capacity_tons : truck.capacity_m3;
    return Number(v) || 0;
  }

  /* السعر العام الساري للمادة عند مورد معيّن — أسعار القائمة فقط */
  async function activePrice(supplierId, materialId, atISO) {
    const at = atISO || U().nowISO();
    const rows = await KX.repo.list('supplier_prices', {
      where: { supplier_id: supplierId, material_id: materialId, is_active: true, customer_id: null }
    });
    const valid = rows.filter(function (p) {
      return (!p.valid_from || p.valid_from <= at) && (!p.valid_to || p.valid_to >= at);
    });
    return U().sortBy(valid, 'valid_from', 'desc')[0] || null;
  }

  /* السعر الخاص: لا يُعرض علنًا. يُستحق بأحد سببين —
     اعتماد العميل في ملفه، أو إدخال كود سعر خاص مصرّح به. */
  async function specialPrice(customerId, supplierId, materialId, unlockCode) {
    if (!customerId) return null;
    const rows = await KX.repo.list('supplier_prices', {
      where: { supplier_id: supplierId, material_id: materialId, is_active: true }
    });
    const special = rows.filter((p) => p.is_special);
    if (!special.length) return null;

    const customer = await KX.repo.get('customer_profiles', customerId);
    const approved = !!(customer && customer.special_pricing_approved);

    for (const p of special) {
      if (p.customer_id && p.customer_id === customerId) return p;      // سعر تعاقدي لهذا العميل
      if (p.customer_id) continue;                                       // سعر عميل آخر
      if (approved) return p;                                            // عميل معتمد لدى الإدارة
      if (unlockCode && p.unlock_code &&
          String(unlockCode).trim().toUpperCase() === String(p.unlock_code).toUpperCase()) return p;
    }
    return null;
  }

  /* شريحة الكمية: خصم تدريجي معرّف داخل سجل السعر */
  function tierUnitPrice(priceRow, qty) {
    let unit = Number(priceRow.price_per_unit);
    U().sortBy(priceRow.tiers || [], 'min_qty').forEach(function (t) {
      if (qty >= Number(t.min_qty)) unit = Number(t.price_per_unit);
    });
    return unit;
  }

  /* تعرفة النقل حسب المنطقة ونوع الشاحنة */
  async function transportRate(zoneId, truckTypeId, transporterId) {
    const where = { zone_id: zoneId, truck_type_id: truckTypeId, is_active: true };
    if (transporterId) where.transporter_id = transporterId;
    const rows = await KX.repo.list('transport_rates', { where: where });
    return U().sortBy(rows, 'price_per_trip')[0] || null;
  }

  /* التحقق من الكوبون وحساب الخصم */
  async function applyCoupon(code, base, customerId) {
    if (!code || !KX.config.features.coupons) return { amount: 0, coupon: null };
    const c = await KX.repo.first('coupons', { code: String(code).toUpperCase(), is_active: true });
    const now = U().nowISO();
    if (!c) return { amount: 0, coupon: null, error: 'الكوبون غير موجود' };
    if (c.valid_from && c.valid_from > now) return { amount: 0, coupon: null, error: 'الكوبون لم يبدأ بعد' };
    if (c.valid_to && c.valid_to < now)     return { amount: 0, coupon: null, error: 'انتهت صلاحية الكوبون' };
    if (c.max_uses && (c.used_count || 0) >= c.max_uses) return { amount: 0, coupon: null, error: 'استُنفد الكوبون' };
    if (c.min_order_value && base < c.min_order_value)
      return { amount: 0, coupon: null, error: 'الحد الأدنى للطلب ' + U().fmtOMR(c.min_order_value) };
    if (c.customer_id && c.customer_id !== customerId)
      return { amount: 0, coupon: null, error: 'الكوبون مخصّص لعميل آخر' };

    let amount = c.discount_type === 'percent' ? base * (Number(c.discount_value) / 100)
                                               : Number(c.discount_value);
    if (c.max_discount) amount = Math.min(amount, Number(c.max_discount));
    return { amount: U().round(Math.min(amount, base), 3), coupon: c };
  }

  /* ============ الحساب الرئيسي ============
     input: { supplier_id, material_id, quantity, order_by ('unit'|'truck'),
              truck_type_id, zone_id, site, customer_id, coupon_code,
              unlock_code, scheduled_at, transporter_id } */
  async function quote(input) {
    const errors = [], warnings = [], notices = [];
    const fin = await financeSettings();

    const material = await KX.repo.get('materials', input.material_id);
    const supplier = await KX.repo.get('suppliers', input.supplier_id);
    const truck    = await KX.repo.get('truck_types', input.truck_type_id);
    const zone     = await KX.repo.get('delivery_zones', input.zone_id);

    if (!material) errors.push('المادة غير متاحة');
    if (!supplier) errors.push('المورد غير متاح');
    if (!zone)     errors.push('منطقة التوصيل غير محددة');
    if (!truck)    errors.push('نوع الشاحنة غير محدد');
    if (errors.length) return { ok: false, errors: errors };

    const unit = material.unit || 'm3';
    const unitLabel = KX.schema.UNITS[unit] || unit;
    const capacity = truckCapacity(truck, unit);
    if (capacity <= 0)
      return { ok: false, errors: ['حمولة ' + truck.name + ' غير معرّفة بوحدة ' + unitLabel] };

    /* 1) الكمية والرحلات — الطلب إما بالوحدة أو بعدد الشاحنات */
    const qtyInput = Number(input.quantity) || 0;
    const quantity = input.order_by === 'truck'
      ? U().round(qtyInput * capacity, 3)
      : U().round(qtyInput, 3);
    const trips = U().ceilDiv(quantity, capacity);
    if (quantity <= 0) return { ok: false, errors: ['أدخل كمية صحيحة'] };

    /* 2) سعر المادة */
    const special = await specialPrice(input.customer_id, input.supplier_id,
                                       input.material_id, input.unlock_code);
    const listRow = await activePrice(input.supplier_id, input.material_id, input.scheduled_at);
    const priceRow = special || listRow;
    if (!priceRow) return { ok: false, errors: ['لا يوجد سعر ساري لهذه المادة عند هذا المورد'] };

    /* الحد الأدنى للتوصيل — شاحنة كاملة عادةً */
    const minQty = Number(priceRow.min_qty || listRow && listRow.min_qty || 0);
    if (minQty && quantity < minQty)
      errors.push('الحد الأدنى للتوصيل ' + U().fmtNum(minQty, 0) + ' ' + unitLabel +
                  ' (شاحنة واحدة)، والمطلوب ' + U().fmtNum(quantity, 1) + ' ' + unitLabel);
    if (priceRow.max_qty && quantity > Number(priceRow.max_qty))
      errors.push('الحد الأقصى للطلب ' + priceRow.max_qty + ' ' + unitLabel);

    const availableToday = Number(priceRow.available_per_day || 0);
    if (availableToday && quantity > availableToday)
      warnings.push('الكمية تتجاوز المتاح يوميًا (' + availableToday + ' ' + unitLabel +
                    ') — قد يُقسَّم التوريد على أكثر من يوم');

    const unitPrice = special ? Number(special.price_per_unit) : tierUnitPrice(priceRow, quantity);
    const materialCost = U().round(quantity * unitPrice, 3);
    if (special) notices.push('طُبّق سعر خاص معتمد لهذه المادة');

    /* 3) تكلفة النقل — بند منفصل دائمًا، لا يُدمج في سعر المادة */
    const rate = await transportRate(input.zone_id, truck.id, input.transporter_id);
    if (!rate) return { ok: false, errors: ['لا توجد تعرفة نقل لهذه المنطقة ونوع الشاحنة'] };

    let distanceKm = null;
    if (input.site && supplier.location) distanceKm = U().distanceKm(supplier.location, input.site);
    const perTrip = U().round(
      Number(rate.price_per_trip) +
      (rate.price_per_km && distanceKm ? Number(rate.price_per_km) * distanceKm : 0), 3);
    const transportCost = U().round(perTrip * trips, 3);

    /* 4) رسوم المنصة */
    const goodsAndFreight = U().round(materialCost + transportCost, 3);
    const platformFee = U().round(
      Number(fin.platformFeeFixed) + goodsAndFreight * Number(fin.platformFeePercent), 3);

    /* 5) الخصم */
    const subtotal = U().round(goodsAndFreight + platformFee, 3);
    const cp = await applyCoupon(input.coupon_code, subtotal, input.customer_id);
    if (cp.error) warnings.push(cp.error);
    const discount = cp.amount;

    /* 6) الضريبة — بند مستقل يُحسب عند انطباقه */
    const taxable = U().round(subtotal - discount, 3);
    const vatRate = fin.vatEnabled ? Number(fin.vatRate) : 0;
    const vat = U().round(taxable * vatRate, 3);

    /* 7) الإجمالي */
    const total = U().round(taxable + vat, 3);

    /* 8) توزيع المستحقات والعمولة — لا يُعرض للعميل */
    const supplierCommission    = U().round(materialCost  * Number(fin.supplierCommissionPercent), 3);
    const transporterCommission = U().round(transportCost * Number(fin.transporterCommissionPercent), 3);
    const platformRevenue       = U().round(platformFee + supplierCommission + transporterCommission, 3);

    return {
      ok: errors.length === 0,
      errors: errors, warnings: warnings, notices: notices,
      inputs: {
        material_id: material.id, material_sku: material.sku,
        material_name: KX.i18n.pick(material.name_i18n, material.name),
        material_name_ar: (material.name_i18n || {}).ar || material.name,
        material_size: material.size || '',
        supplier_id: supplier.id, supplier_name: supplier.name,
        zone_id: zone.id, zone_name: zone.name,
        truck_id: truck.id, truck_name: truck.name, truck_capacity: capacity,
        unit: unit, unit_label: unitLabel,
        order_by: input.order_by || 'unit', quantity_entered: qtyInput,
        distance_km: distanceKm,
        price_row_id: priceRow.id, is_special_price: !!special
      },
      quantities: { quantity: quantity, unit: unit, trips: trips, capacity: capacity, min_qty: minQty },
      lines: {
        unit_price: unitPrice,
        material_cost: materialCost,
        transport_per_trip: perTrip,
        transport_cost: transportCost,
        platform_fee: platformFee,
        discount: discount,
        coupon_code: cp.coupon ? cp.coupon.code : null,
        vat_rate: vatRate,
        vat: vat
      },
      totals: { subtotal: subtotal, taxable: taxable, total: total },
      internal: {
        supplier_commission: supplierCommission,
        transporter_commission: transporterCommission,
        platform_fee: platformFee,
        platform_revenue: platformRevenue,
        supplier_payable: U().round(materialCost - supplierCommission, 3),
        transporter_payable: U().round(transportCost - transporterCommission, 3),
        margin_per_unit: U().round(platformRevenue / quantity, 3)
      },
      priced_at: U().nowISO()
    };
  }

  /* رسوم الانتظار — تُضاف بعد اعتمادها من الإدارة فقط */
  async function waitingCharge(minutes) {
    const fin = await financeSettings();
    const billable = Math.max(0, Number(minutes) - Number(fin.waitingFreeMinutes));
    return KX.util.round((billable / 60) * Number(fin.waitingRatePerHour), 3);
  }

  return { quote, activePrice, specialPrice, transportRate, applyCoupon,
           waitingCharge, financeSettings, tierUnitPrice, truckCapacity };
})();

</script>
