<script>
/* ============================================================
   دورة حياة الطلب — آلة حالات مع تحكّم بالصلاحيات وسجل تدقيق كامل
   ============================================================ */
window.KX = window.KX || {};
KX.orders = (function () {
  const U = () => KX.util;

  /* الحالات وترتيبها الزمني */
  const STATUS = {
    draft:                        { label: 'مسودة',                    tone: 'muted',  step: 0 },
    under_review:                 { label: 'قيد المراجعة',              tone: 'info',   step: 1 },
    awaiting_supplier:            { label: 'بانتظار تأكيد المورد',      tone: 'info',   step: 2 },
    awaiting_carrier:             { label: 'بانتظار تعيين ناقل',        tone: 'info',   step: 3 },
    ready_for_payment:            { label: 'جاهز للدفع',                tone: 'warn',   step: 4 },
    awaiting_transfer_verification:{ label: 'بانتظار التحقق من التحويل', tone: 'warn',  step: 5 },
    paid:                         { label: 'مدفوع',                     tone: 'ok',     step: 6 },
    preparing:                    { label: 'قيد التجهيز',               tone: 'info',   step: 7 },
    loading:                      { label: 'قيد التحميل',               tone: 'info',   step: 8 },
    in_transit:                   { label: 'في الطريق',                 tone: 'info',   step: 9 },
    arrived:                      { label: 'وصل إلى الموقع',            tone: 'info',   step: 10 },
    delivered:                    { label: 'تم التسليم',                tone: 'ok',     step: 11 },
    cancelled:                    { label: 'ملغي',                      tone: 'danger', step: 12 },
    disputed:                     { label: 'تحت المراجعة',              tone: 'danger', step: 12 },
    refunded_partial:             { label: 'مسترد جزئيًا',              tone: 'warn',   step: 13 },
    refunded_full:                { label: 'مسترد بالكامل',             tone: 'warn',   step: 13 }
  };

  /* الانتقالات المسموحة: من -> [{to, roles, label}] */
  const TRANSITIONS = {
    draft: [
      { to: 'under_review', roles: ['customer', 'admin', 'ops'], label: 'إرسال الطلب للمراجعة' },
      { to: 'cancelled',    roles: ['customer', 'admin'],        label: 'إلغاء المسودة' }
    ],
    under_review: [
      { to: 'awaiting_supplier', roles: ['admin', 'ops'], label: 'إحالة للمورد' },
      { to: 'cancelled',         roles: ['admin', 'ops', 'customer'], label: 'إلغاء' }
    ],
    awaiting_supplier: [
      { to: 'awaiting_carrier', roles: ['supplier', 'admin', 'ops'], label: 'تأكيد توفّر المادة' },
      { to: 'under_review',     roles: ['supplier', 'admin', 'ops'], label: 'طلب تعديل الطلب' },
      { to: 'cancelled',        roles: ['admin', 'ops', 'customer'], label: 'إلغاء' }
    ],
    awaiting_carrier: [
      { to: 'ready_for_payment', roles: ['admin', 'ops', 'transporter'], label: 'تأكيد الناقل وإتاحة الدفع' },
      { to: 'cancelled',         roles: ['admin', 'ops', 'customer'],    label: 'إلغاء' }
    ],
    ready_for_payment: [
      { to: 'paid',                           roles: ['customer', 'admin'], label: 'تم الدفع الإلكتروني' },
      { to: 'awaiting_transfer_verification', roles: ['customer', 'admin'], label: 'رفع إيصال تحويل بنكي' },
      { to: 'cancelled',                      roles: ['customer', 'admin', 'ops'], label: 'إلغاء' }
    ],
    awaiting_transfer_verification: [
      { to: 'paid',              roles: ['admin', 'ops'], label: 'اعتماد التحويل' },
      { to: 'ready_for_payment', roles: ['admin', 'ops'], label: 'رفض الإيصال' },
      { to: 'cancelled',         roles: ['admin', 'ops'], label: 'إلغاء' }
    ],
    paid: [
      { to: 'preparing', roles: ['admin', 'ops', 'supplier'], label: 'إصدار أمر التحميل' },
      { to: 'cancelled', roles: ['admin', 'ops', 'customer'], label: 'إلغاء مع استرداد' }
    ],
    preparing: [
      { to: 'loading',   roles: ['supplier', 'admin', 'ops'], label: 'بدء التحميل' },
      { to: 'cancelled', roles: ['admin', 'ops'],             label: 'إلغاء مع استرداد جزئي' }
    ],
    loading: [
      { to: 'in_transit', roles: ['driver', 'transporter', 'supplier', 'admin', 'ops'], label: 'انطلاق الشاحنة' },
      { to: 'disputed',   roles: ['admin', 'ops'], label: 'إحالة للمراجعة' }
    ],
    in_transit: [
      { to: 'arrived',  roles: ['driver', 'transporter', 'admin', 'ops'], label: 'الوصول إلى الموقع' },
      { to: 'disputed', roles: ['admin', 'ops', 'customer'], label: 'إحالة للمراجعة' }
    ],
    arrived: [
      { to: 'delivered', roles: ['customer', 'driver', 'admin', 'ops'], label: 'تأكيد الاستلام' },
      { to: 'disputed',  roles: ['admin', 'ops', 'customer'], label: 'إحالة للمراجعة' }
    ],
    delivered: [
      { to: 'disputed', roles: ['admin', 'ops', 'customer'], label: 'فتح شكوى' }
    ],
    disputed: [
      { to: 'delivered',        roles: ['admin'], label: 'إغلاق المراجعة — تم التسليم' },
      { to: 'refunded_partial', roles: ['admin'], label: 'اعتماد استرداد جزئي' },
      { to: 'refunded_full',    roles: ['admin'], label: 'اعتماد استرداد كامل' }
    ],
    cancelled: [
      { to: 'refunded_partial', roles: ['admin'], label: 'استرداد جزئي' },
      { to: 'refunded_full',    roles: ['admin'], label: 'استرداد كامل' }
    ],
    refunded_partial: [], refunded_full: []
  };

  const label = (s) => (STATUS[s] || { label: s }).label;
  const tone  = (s) => (STATUS[s] || { tone: 'muted' }).tone;

  function allowedTransitions(status, role) {
    return (TRANSITIONS[status] || []).filter((t) => t.roles.indexOf(role) !== -1);
  }
  /* الحالات التي لم يعد فيها الطلب قابلًا للإلغاء الذاتي من العميل */
  const isLocked = (s) => ['loading', 'in_transit', 'arrived', 'delivered',
                           'refunded_full', 'refunded_partial'].indexOf(s) !== -1;
  const isFinal  = (s) => ['delivered', 'cancelled', 'refunded_full', 'refunded_partial'].indexOf(s) !== -1;
  const isPaid   = (s) => STATUS[s] && STATUS[s].step >= STATUS.paid.step && s !== 'cancelled';

  /* ---------- إنشاء طلب من عرض السعر ---------- */
  async function createFromQuote(quote, ctx) {
    return KX.repo.tx(async function () {
      const seq = (await KX.repo.count('orders')) + 1;
      const order = await KX.repo.insert('orders', {
        order_no: U().orderNo(seq),
        customer_id: ctx.customer_id,
        site_id: ctx.site_id,
        supplier_id: quote.inputs.supplier_id,
        transporter_id: ctx.transporter_id || null,
        zone_id: quote.inputs.zone_id,
        truck_id: quote.inputs.truck_id,
        status: 'draft',
        scheduled_at: ctx.scheduled_at,
        notes: ctx.notes || '',
        quantity: quote.quantities.quantity,
        unit: quote.quantities.unit,
        trips_planned: quote.quantities.trips,
        trips_done: 0,
        /* لقطة السعر — لا تتغيّر بتغيّر قائمة الأسعار لاحقًا */
        price_snapshot: quote,
        material_cost: quote.lines.material_cost,
        transport_cost: quote.lines.transport_cost,
        platform_fee: quote.lines.platform_fee,
        discount: quote.lines.discount,
        coupon_code: quote.lines.coupon_code,
        vat: quote.lines.vat,
        total: quote.totals.total,
        amount_paid: 0,
        amount_refunded: 0,
        waiting_fees: 0,
        delivery_otp: String(Math.floor(1000 + Math.random() * 9000)),
        history: [{ at: U().nowISO(), status: 'draft', by: ctx.customer_id, note: 'إنشاء الطلب' }]
      });
      await KX.repo.insert('order_items', {
        order_id: order.id,
        material_id: quote.inputs.material_id,
        material_sku: quote.inputs.material_sku,
        material_name: quote.inputs.material_name_ar,
        material_name_i18n: quote.inputs.material_name_i18n || null,
        unit: quote.quantities.unit,
        order_by: quote.inputs.order_by,
        quantity: quote.quantities.quantity,
        unit_price: quote.lines.unit_price,
        line_total: quote.lines.material_cost
      });
      await KX.repo.insert('quotations', {
        order_id: order.id, customer_id: ctx.customer_id,
        payload: quote, total: quote.totals.total,
        valid_until: U().addDays(U().nowISO(), 2), accepted: false
      });
      await KX.audit.log('order.create', 'orders', order.id, { total: order.total });
      return order;
    });
  }

  /* ---------- تنفيذ انتقال حالة ---------- */
  async function transition(orderId, toStatus, opts) {
    opts = opts || {};
    const session = KX.store.get('session') || {};
    const role = opts.role || session.role;
    const order = await KX.repo.get('orders', orderId);
    if (!order) throw new Error('الطلب غير موجود');

    const allowed = allowedTransitions(order.status, role).map((t) => t.to);
    if (allowed.indexOf(toStatus) === -1) {
      throw new Error('انتقال غير مسموح: ' + label(order.status) + ' ← ' + label(toStatus) +
                      ' لدور ' + (KX.schema.ROLES[role] || role));
    }
    /* حماية: لا تحميل قبل اكتمال الدفع */
    if (['preparing', 'loading'].indexOf(toStatus) !== -1) {
      const due = U().round(order.total - (order.amount_paid || 0), 3);
      if (due > 0.001) throw new Error('لا يمكن التجهيز قبل سداد كامل المبلغ (المتبقي ' + U().fmtOMR(due) + ')');
    }
    const history = (order.history || []).concat([{
      at: U().nowISO(), status: toStatus,
      by: session.user_id || role, by_name: session.name || role,
      note: opts.note || ''
    }]);
    const patch = Object.assign({ status: toStatus, history: history }, opts.patch || {});
    if (toStatus === 'delivered') patch.delivered_at = U().nowISO();
    if (toStatus === 'cancelled') {
      patch.cancelled_at = U().nowISO();
      patch.cancel_reason = opts.note || '';
    }
    const updated = await KX.repo.update('orders', orderId, patch);
    await KX.audit.log('order.transition', 'orders', orderId,
      { from: order.status, to: toStatus, note: opts.note || '' });
    await KX.notify.onOrderStatus(updated, order.status);
    return updated;
  }

  /* ---------- حساب الاسترداد حسب مرحلة الطلب ---------- */
  function refundPercentFor(status) {
    const policy = KX.config.refundPolicy;
    const step = (STATUS[status] || {}).step || 0;
    let pct = 0;
    for (const p of policy) {
      if (step <= (STATUS[p.upToStatus] || {}).step) { pct = p.refundPercent; break; }
    }
    return pct;
  }
  function refundNoteFor(status) {
    const policy = KX.config.refundPolicy;
    const step = (STATUS[status] || {}).step || 0;
    for (const p of policy) if (step <= (STATUS[p.upToStatus] || {}).step) return p.note;
    return 'يُدرس عبر الشكاوى';
  }

  /* ---------- تأكيد الاستلام برمز OTP ---------- */
  async function confirmReceipt(orderId, code, signature) {
    const order = await KX.repo.get('orders', orderId);
    if (!order) throw new Error('الطلب غير موجود');
    if (order.status !== 'arrived') throw new Error('لم تصل الشاحنة إلى الموقع بعد');
    if (!signature && String(code) !== String(order.delivery_otp))
      throw new Error('رمز الاستلام غير صحيح');
    const updated = await transition(orderId, 'delivered', {
      note: signature ? 'تأكيد بتوقيع إلكتروني' : 'تأكيد برمز OTP',
      patch: { receipt_method: signature ? 'signature' : 'otp', receipt_signature: signature || null }
    });
    await KX.payments.issueInvoice(updated);
    await KX.settlements.buildForOrder(updated);
    return updated;
  }

  /* ---------- استعلامات مساعدة ---------- */
  async function forCustomer(customerId) {
    return KX.repo.list('orders', { where: { customer_id: customerId }, order: { field: 'created_at', dir: 'desc' } });
  }
  async function forSupplier(supplierId) {
    return KX.repo.list('orders', { where: { supplier_id: supplierId }, order: { field: 'created_at', dir: 'desc' } });
  }
  async function forTransporter(transporterId) {
    return KX.repo.list('orders', { where: { transporter_id: transporterId }, order: { field: 'created_at', dir: 'desc' } });
  }
  async function all(where) {
    return KX.repo.list('orders', { where: where, order: { field: 'created_at', dir: 'desc' } });
  }

  return { STATUS, TRANSITIONS, label, tone, allowedTransitions, isLocked, isFinal, isPaid,
           createFromQuote, transition, confirmReceipt, refundPercentFor, refundNoteFor,
           forCustomer, forSupplier, forTransporter, all };
})();

</script>

<script>
/* ============================================================
   المدفوعات والفواتير والاستردادات
   لا يوجد دفع عند الاستلام. لا تُخزَّن بيانات البطاقات إطلاقًا.
   طبقة المزوّد مجرّدة (gateway) ليُربط مزوّد عُماني مرخّص لاحقًا.
   ============================================================ */
window.KX = window.KX || {};
KX.payments = (function () {
  const U = () => KX.util;

  const METHODS = {
    card:          'دفع إلكتروني (بطاقة)',
    bank_transfer: 'تحويل بنكي مسبق',
    deposit:       'عربون مقدّم',
    credit_terms:  'شراء آجل (عميل معتمد)'
  };

  /* ---------- طبقة بوابة الدفع ---------- */
  const gateways = {
    /* مزوّد تجريبي: لا يتصل بأي شبكة ولا يخزّن أي بيانات بطاقة */
    demo: {
      async charge(order, amount, meta) {
        await new Promise((r) => setTimeout(r, 500));
        return {
          success: true,
          provider: 'demo',
          provider_ref: 'DEMO-' + U().uid().toUpperCase().slice(-10),
          amount: amount,
          card_last4: meta && meta.last4 ? String(meta.last4).slice(-4) : null
        };
      }
    }
    /* thawani: { charge(order, amount, meta) { ... } }  ← يُضاف عند التعاقد */
  };
  const gateway = () => gateways[KX.config.payments.provider] || gateways.demo;

  /* منع تكرار الدفع: مفتاح تفرّد لكل محاولة */
  async function alreadyPaid(orderId, idempotencyKey) {
    const rows = await KX.repo.list('payments', {
      where: { order_id: orderId, idempotency_key: idempotencyKey }
    });
    return rows[0] || null;
  }

  /* ---------- تنفيذ دفعة ---------- */
  async function pay(orderId, opts) {
    const order = await KX.repo.get('orders', orderId);
    if (!order) throw new Error('الطلب غير موجود');
    if (order.status !== 'ready_for_payment' && order.status !== 'awaiting_transfer_verification')
      throw new Error('الطلب غير جاهز للدفع في حالته الحالية: ' + KX.orders.label(order.status));

    const method = opts.method;
    if (KX.config.payments.methods.indexOf(method) === -1) throw new Error('طريقة دفع غير مدعومة');
    if (method === 'cod' || KX.config.payments.codEnabled) throw new Error('الدفع عند الاستلام غير متاح');

    const due = U().round(order.total - (order.amount_paid || 0), 3);
    let amount = opts.amount !== undefined ? U().round(opts.amount, 3) : due;
    if (method === 'deposit') {
      const pct = Number(opts.depositPercent || KX.config.payments.depositPercent) / 100;
      amount = U().round(order.total * pct, 3);
    }
    if (amount <= 0) throw new Error('لا يوجد مبلغ مستحق');
    if (amount > due + 0.001) throw new Error('المبلغ يتجاوز المستحق (' + U().fmtOMR(due) + ')');

    const key = opts.idempotency_key || (orderId + ':' + method + ':' + amount);
    const dup = await alreadyPaid(orderId, key);
    if (dup) return { payment: dup, order: order, duplicate: true };

    return KX.repo.tx(async function () {
      let result = { success: true, provider: 'manual', provider_ref: null };
      let payStatus = 'captured';

      if (method === 'card') {
        result = await gateway().charge(order, amount, opts.meta);
        if (!result.success) throw new Error('فشل الدفع الإلكتروني');
      } else if (method === 'bank_transfer') {
        payStatus = 'pending_verification';       // بانتظار تحقق الإدارة من الإيصال
      } else if (method === 'credit_terms') {
        const cust = await KX.repo.get('customer_profiles', order.customer_id);
        if (!cust || !cust.credit_approved) throw new Error('الشراء الآجل غير معتمد لهذا الحساب');
        const used = Number(cust.credit_used || 0);
        if (used + amount > Number(cust.credit_limit || 0))
          throw new Error('تجاوز الحد الائتماني المعتمد');
        await KX.repo.update('customer_profiles', cust.id, { credit_used: U().round(used + amount, 3) });
      }

      const payment = await KX.repo.insert('payments', {
        order_id: orderId,
        customer_id: order.customer_id,
        method: method,
        amount: amount,
        currency: KX.config.currency.code,
        status: payStatus,
        provider: result.provider,
        provider_ref: result.provider_ref,
        card_last4: result.card_last4 || null,     // آخر 4 أرقام فقط — لا تُخزَّن البطاقة
        transfer_receipt: opts.receipt_url || null,
        transfer_bank: opts.bank || null,
        transfer_ref: opts.transfer_ref || null,
        idempotency_key: key,
        paid_at: payStatus === 'captured' ? U().nowISO() : null
      });

      let updatedOrder = order;
      if (payStatus === 'captured') {
        const paidTotal = U().round((order.amount_paid || 0) + amount, 3);
        updatedOrder = await KX.repo.update('orders', orderId, { amount_paid: paidTotal });
        if (paidTotal >= U().round(order.total, 3) - 0.001) {
          updatedOrder = await KX.orders.transition(orderId, 'paid',
            { role: 'admin', note: 'اكتمل السداد عبر ' + METHODS[method] });
        }
      } else {
        updatedOrder = await KX.orders.transition(orderId, 'awaiting_transfer_verification',
          { role: 'customer', note: 'تم رفع إيصال التحويل' });
      }
      await KX.audit.log('payment.create', 'payments', payment.id,
        { order_id: orderId, method: method, amount: amount, status: payStatus });
      return { payment: payment, order: updatedOrder };
    });
  }

  /* ---------- اعتماد أو رفض التحويل البنكي ---------- */
  async function verifyTransfer(paymentId, approve, note) {
    const p = await KX.repo.get('payments', paymentId);
    if (!p) throw new Error('الدفعة غير موجودة');
    if (p.status !== 'pending_verification') throw new Error('هذه الدفعة لا تحتاج تحققًا');
    const order = await KX.repo.get('orders', p.order_id);

    if (!approve) {
      await KX.repo.update('payments', paymentId, { status: 'rejected', verify_note: note || '' });
      await KX.orders.transition(p.order_id, 'ready_for_payment', { role: 'admin', note: 'رُفض إيصال التحويل: ' + (note || '') });
      await KX.audit.log('payment.reject', 'payments', paymentId, { note: note });
      return { approved: false };
    }
    return KX.repo.tx(async function () {
      await KX.repo.update('payments', paymentId,
        { status: 'captured', paid_at: U().nowISO(), verify_note: note || '' });
      const paidTotal = U().round((order.amount_paid || 0) + Number(p.amount), 3);
      await KX.repo.update('orders', order.id, { amount_paid: paidTotal });
      if (paidTotal >= U().round(order.total, 3) - 0.001) {
        await KX.orders.transition(order.id, 'paid', { role: 'admin', note: 'اعتُمد التحويل البنكي' });
      }
      await KX.audit.log('payment.verify', 'payments', paymentId, { amount: p.amount });
      return { approved: true };
    });
  }

  /* ---------- الاسترداد ---------- */
  async function refund(orderId, opts) {
    const order = await KX.repo.get('orders', orderId);
    if (!order) throw new Error('الطلب غير موجود');
    const paid = Number(order.amount_paid || 0);
    const already = Number(order.amount_refunded || 0);
    if (paid <= 0) throw new Error('لا توجد مبالغ مدفوعة لاستردادها');

    const pct = opts.percent !== undefined ? Number(opts.percent)
                                           : KX.orders.refundPercentFor(order.status);
    let amount = opts.amount !== undefined ? U().round(opts.amount, 3)
                                           : U().round(paid * pct, 3);
    amount = Math.min(amount, U().round(paid - already, 3));
    if (amount <= 0) throw new Error('المبلغ القابل للاسترداد صفر حسب سياسة المرحلة الحالية');

    return KX.repo.tx(async function () {
      const r = await KX.repo.insert('refunds', {
        order_id: orderId, customer_id: order.customer_id,
        amount: amount, reason: opts.reason || '',
        percent_applied: pct,
        approved_by: (KX.store.get('session') || {}).user_id,
        approved_by_name: (KX.store.get('session') || {}).name,
        status: 'processed', processed_at: U().nowISO()
      });
      const totalRefunded = U().round(already + amount, 3);
      await KX.repo.update('orders', orderId, { amount_refunded: totalRefunded });
      const full = totalRefunded >= paid - 0.001;
      await KX.orders.transition(orderId, full ? 'refunded_full' : 'refunded_partial',
        { role: 'admin', note: 'استرداد ' + U().fmtOMR(amount) + ' — ' + (opts.reason || '') });
      await KX.audit.log('refund.create', 'refunds', r.id, { order_id: orderId, amount: amount, reason: opts.reason });
      return r;
    });
  }

  /* ---------- الفواتير ---------- */
  async function issueInvoice(order) {
    const existing = await KX.repo.first('invoices', { order_id: order.id });
    if (existing) return existing;
    const seq = (await KX.repo.count('invoices')) + 1;
    const inv = await KX.repo.insert('invoices', {
      invoice_no: 'INV-' + new Date().getFullYear() + '-' + String(seq).padStart(6, '0'),
      order_id: order.id, order_no: order.order_no,
      customer_id: order.customer_id,
      issue_date: U().nowISO(),
      material_cost: order.material_cost,
      transport_cost: order.transport_cost,
      platform_fee: order.platform_fee,
      waiting_fees: order.waiting_fees || 0,
      discount: order.discount,
      vat: order.vat,
      total: U().round(Number(order.total) + Number(order.waiting_fees || 0), 3),
      amount_paid: order.amount_paid,
      currency: KX.config.currency.code,
      status: 'issued'
    });
    await KX.audit.log('invoice.issue', 'invoices', inv.id, { order_id: order.id });
    await KX.notify.push(order.customer_id, 'صدرت فاتورتك',
      'فاتورة ' + inv.invoice_no + ' للطلب ' + order.order_no, '#/customer/invoices');
    return inv;
  }

  return { METHODS, pay, verifyTransfer, refund, issueInvoice, gateways };
})();

</script>

<script>
/* رحلات النقل — تعيين الناقل والسائق والشاحنة وتتبّع الحالة */
window.KX = window.KX || {};
KX.trips = (function () {
  const U = () => KX.util;

  const TRIP_STATUS = {
    assigned:      { label: 'تم التعيين',        tone: 'muted' },
    heading_plant: { label: 'متوجّه للكسارة',    tone: 'info' },
    at_plant:      { label: 'وصل الكسارة',       tone: 'info' },
    loading:       { label: 'جاري التحميل',      tone: 'info' },
    loaded:        { label: 'اكتمل التحميل',     tone: 'ok' },
    en_route:      { label: 'في الطريق للعميل',  tone: 'info' },
    at_site:       { label: 'وصل موقع العميل',   tone: 'info' },
    delivered:     { label: 'تم التفريغ والتسليم', tone: 'ok' },
    cancelled:     { label: 'ملغاة',             tone: 'danger' }
  };
  const FLOW = ['assigned', 'heading_plant', 'at_plant', 'loading', 'loaded',
                'en_route', 'at_site', 'delivered'];

  function nextStatus(s) {
    const i = FLOW.indexOf(s);
    return i >= 0 && i < FLOW.length - 1 ? FLOW[i + 1] : null;
  }

  /* إنشاء رحلات الطلب حسب عدد الشاحنات المطلوبة */
  async function createForOrder(order, opts) {
    const out = [];
    for (let i = 0; i < order.trips_planned; i++) {
      out.push(await KX.repo.insert('trips', {
        order_id: order.id, order_no: order.order_no,
        seq: i + 1,
        transporter_id: opts.transporter_id || order.transporter_id || null,
        driver_id: null, truck_id: opts.truck_id || order.truck_id || null,
        supplier_id: order.supplier_id, site_id: order.site_id,
        status: 'assigned',
        unit: order.unit,
        planned_qty: U().round(order.quantity / order.trips_planned, 3),
        actual_qty: null,
        waiting_minutes: 0, waiting_fee: 0, waiting_approved: false,
        photos: [], timeline: [{ at: U().nowISO(), status: 'assigned' }]
      }));
    }
    await KX.audit.log('trips.create', 'orders', order.id, { count: out.length });
    return out;
  }

  async function assignDriver(tripId, driverId, truckId) {
    const t = await KX.repo.update('trips', tripId, { driver_id: driverId, truck_id: truckId });
    await KX.audit.log('trip.assign_driver', 'trips', tripId, { driver_id: driverId, truck_id: truckId });
    const d = await KX.repo.get('drivers', driverId);
    if (d) await KX.notify.push(d.user_id, 'مهمة نقل جديدة',
      'رحلة رقم ' + t.seq + ' للطلب ' + t.order_no, '#/driver');
    return t;
  }

  async function updateStatus(tripId, status, extra) {
    const t = await KX.repo.get('trips', tripId);
    if (!t) throw new Error('الرحلة غير موجودة');
    const timeline = (t.timeline || []).concat([{ at: U().nowISO(), status: status }]);
    const patch = Object.assign({ status: status, timeline: timeline }, extra || {});
    const updated = await KX.repo.update('trips', tripId, patch);
    await KX.audit.log('trip.status', 'trips', tripId, { from: t.status, to: status });

    /* مزامنة حالة الطلب مع تقدّم الرحلات */
    const order = await KX.repo.get('orders', t.order_id);
    if (order) {
      const all = await KX.repo.list('trips', { where: { order_id: order.id } });
      const anyLoading = all.some((x) => x.status === 'loading' || x.status === 'at_plant');
      const anyMoving  = all.some((x) => x.status === 'en_route' || x.status === 'loaded');
      const anyAtSite  = all.some((x) => x.status === 'at_site');
      const allDone    = all.every((x) => x.status === 'delivered' || x.status === 'cancelled');
      const role = 'admin';
      try {
        if (order.status === 'preparing' && anyLoading)
          await KX.orders.transition(order.id, 'loading', { role: role, note: 'بدأ تحميل الشاحنات' });
        else if (order.status === 'loading' && anyMoving)
          await KX.orders.transition(order.id, 'in_transit', { role: role, note: 'انطلقت الشاحنة' });
        else if (order.status === 'in_transit' && anyAtSite)
          await KX.orders.transition(order.id, 'arrived', { role: role, note: 'وصلت الشاحنة للموقع' });
      } catch (e) { /* انتقال غير منطبق — يُتجاهل بأمان */ }
      if (allDone && order.status === 'arrived') { /* ينتظر تأكيد العميل بـ OTP */ }
    }
    return updated;
  }

  /* تسجيل تذكرة الميزان والكمية الفعلية */
  async function recordWeightTicket(tripId, data) {
    const t = await KX.repo.get('trips', tripId);
    if (!t) throw new Error('الرحلة غير موجودة');
    /* الكمية الفعلية المحمّلة بوحدة الطلب (م³ أو طن).
       الوزن القائم والفارغ اختياريان — يُملآن حين يوجد ميزان جسري. */
    const net = data.net_qty !== undefined && data.net_qty !== ''
      ? U().round(Number(data.net_qty), 3)
      : U().round(Number(data.gross_tons) - Number(data.tare_tons), 3);
    if (!(net > 0)) throw new Error('الكمية الفعلية غير صحيحة');
    const wt = await KX.repo.insert('weight_tickets', {
      trip_id: tripId, order_id: t.order_id, supplier_id: t.supplier_id,
      ticket_no: data.ticket_no, unit: t.unit || 'm3',
      gross_tons: data.gross_tons ? Number(data.gross_tons) : null,
      tare_tons: data.tare_tons ? Number(data.tare_tons) : null,
      net_qty: net,
      image_url: data.image_url || null, recorded_at: U().nowISO()
    });
    await KX.repo.update('trips', tripId, { actual_qty: wt.net_qty, weight_ticket_id: wt.id });
    await KX.audit.log('weight_ticket.create', 'weight_tickets', wt.id, { trip_id: tripId, net: wt.net_qty });
    return wt;
  }

  /* طلب رسوم انتظار — لا تُحتسب إلا بعد اعتماد الإدارة */
  async function requestWaiting(tripId, minutes, note) {
    const fee = await KX.pricing.waitingCharge(minutes);
    await KX.repo.update('trips', tripId,
      { waiting_minutes: minutes, waiting_fee: fee, waiting_approved: false, waiting_note: note || '' });
    await KX.audit.log('trip.waiting_request', 'trips', tripId, { minutes: minutes, fee: fee });
    return fee;
  }
  async function approveWaiting(tripId, approve) {
    const t = await KX.repo.get('trips', tripId);
    await KX.repo.update('trips', tripId, { waiting_approved: !!approve });
    if (approve) {
      const order = await KX.repo.get('orders', t.order_id);
      await KX.repo.update('orders', order.id,
        { waiting_fees: U().round(Number(order.waiting_fees || 0) + Number(t.waiting_fee), 3) });
    }
    await KX.audit.log('trip.waiting_' + (approve ? 'approve' : 'reject'), 'trips', tripId, { fee: t.waiting_fee });
  }

  const forDriver      = (id) => KX.repo.list('trips', { where: { driver_id: id }, order: { field: 'created_at', dir: 'desc' } });
  const forTransporter = (id) => KX.repo.list('trips', { where: { transporter_id: id }, order: { field: 'created_at', dir: 'desc' } });
  const forOrder       = (id) => KX.repo.list('trips', { where: { order_id: id }, order: { field: 'seq' } });

  return { TRIP_STATUS, FLOW, nextStatus, createForOrder, assignDriver, updateStatus,
           recordWeightTicket, requestWaiting, approveWaiting, forDriver, forTransporter, forOrder };
})();

</script>

<script>
/* التسويات والعمولات — مستحقات المورد والناقل وإيراد المنصة */
window.KX = window.KX || {};
KX.settlements = (function () {
  const U = () => KX.util;

  /* تُبنى عند تأكيد التسليم، من لقطة السعر المحفوظة في الطلب */
  async function buildForOrder(order) {
    const exists = await KX.repo.list('settlements', { where: { order_id: order.id } });
    if (exists.length) return exists;

    const snap = order.price_snapshot || {};
    const internal = snap.internal || {};
    const waiting = Number(order.waiting_fees || 0);

    return KX.repo.tx(async function () {
      const rows = [];
      rows.push(await KX.repo.insert('settlements', {
        order_id: order.id, order_no: order.order_no,
        party_type: 'supplier', party_id: order.supplier_id,
        gross_amount: order.material_cost,
        commission: internal.supplier_commission || 0,
        net_payable: internal.supplier_payable || U().round(order.material_cost, 3),
        status: 'pending', due_date: U().addDays(U().nowISO(), 14)
      }));
      rows.push(await KX.repo.insert('settlements', {
        order_id: order.id, order_no: order.order_no,
        party_type: 'transporter', party_id: order.transporter_id,
        gross_amount: U().round(Number(order.transport_cost) + waiting, 3),
        commission: internal.transporter_commission || 0,
        net_payable: U().round(Number(internal.transporter_payable || order.transport_cost) + waiting, 3),
        status: 'pending', due_date: U().addDays(U().nowISO(), 14)
      }));
      await KX.repo.insert('commissions', {
        order_id: order.id, order_no: order.order_no,
        platform_fee: order.platform_fee,
        supplier_commission: internal.supplier_commission || 0,
        transporter_commission: internal.transporter_commission || 0,
        total_revenue: internal.platform_revenue || order.platform_fee,
        quantity: order.quantity,
        unit: order.unit,
        margin_per_unit: internal.margin_per_unit || 0,
        recognized_at: U().nowISO()
      });
      await KX.audit.log('settlement.build', 'orders', order.id, { count: rows.length });
      return rows;
    });
  }

  async function markPaid(settlementId, ref) {
    const s = await KX.repo.update('settlements', settlementId,
      { status: 'paid', paid_at: U().nowISO(), payment_ref: ref || null });
    await KX.audit.log('settlement.pay', 'settlements', settlementId, { amount: s.net_payable, ref: ref });
    return s;
  }

  async function forParty(type, id) {
    return KX.repo.list('settlements', { where: { party_type: type, party_id: id },
                                         order: { field: 'created_at', dir: 'desc' } });
  }
  async function summary() {
    const rows = await KX.repo.list('settlements', {});
    const pending = rows.filter((r) => r.status === 'pending');
    return {
      pending_supplier:    U().round(U().sum(pending.filter((r) => r.party_type === 'supplier'),    (r) => +r.net_payable), 3),
      pending_transporter: U().round(U().sum(pending.filter((r) => r.party_type === 'transporter'), (r) => +r.net_payable), 3),
      paid_total:          U().round(U().sum(rows.filter((r) => r.status === 'paid'), (r) => +r.net_payable), 3)
    };
  }
  return { buildForOrder, markPaid, forParty, summary };
})();

</script>

<script>
/* حساب مؤشرات الأداء والتقارير — مصدر واحد للأرقام في كل اللوحات */
window.KX = window.KX || {};
KX.analytics = (function () {
  const U = () => KX.util;
  const DELIVERED = 'delivered';
  const inRange = (iso, from, to) => iso >= from && iso <= to;

  /* لقطة كاملة للفترة المحددة مع مقارنة بالفترة السابقة المماثلة */
  async function overview(days) {
    days = days || 30;
    const now = new Date();
    const from = U().addDays(now.toISOString(), -days);
    const prevFrom = U().addDays(now.toISOString(), -days * 2);
    const [orders, invoices, commissions, customers, suppliers, carriers, trips, complaints] =
      await Promise.all([
        KX.repo.list('orders', {}), KX.repo.list('invoices', {}),
        KX.repo.list('commissions', {}), KX.repo.list('customer_profiles', {}),
        KX.repo.list('suppliers', {}), KX.repo.list('transport_companies', {}),
        KX.repo.list('trips', {}), KX.repo.list('complaints', {})
      ]);

    const cur  = orders.filter((o) => inRange(o.created_at, from, now.toISOString()));
    const prev = orders.filter((o) => inRange(o.created_at, prevFrom, from));
    const done = (arr) => arr.filter((o) => o.status === DELIVERED);

    const val = (arr) => U().round(U().sum(arr, (o) => Number(o.total)), 3);
    /* الكميات تُجمَع بوحدة الطلب؛ المنصة تبيع بالمتر المكعب */
    const qty = (arr) => U().round(U().sum(arr, (o) => Number(o.quantity || 0)), 1);
    const revenue = (arr) => U().round(U().sum(arr, function (o) {
      const i = (o.price_snapshot || {}).internal || {};
      return Number(i.platform_revenue || o.platform_fee || 0);
    }), 3);
    const transport = (arr) => U().round(U().sum(arr, (o) => Number(o.transport_cost || 0)), 3);

    /* null تعني «لا أساس للمقارنة» — تُعرض كـ«فترة أولى» بدل نسبة مضللة */
    const pct = (a, b) => (b > 0 ? ((a - b) / b) * 100 : null);

    /* متوسط زمن التوصيل (ساعات) من الإنشاء حتى التسليم */
    const deliveredCur = done(cur).filter((o) => o.delivered_at);
    const avgHours = deliveredCur.length
      ? U().round(U().sum(deliveredCur, (o) =>
          (new Date(o.delivered_at) - new Date(o.created_at)) / 3600000) / deliveredCur.length, 1)
      : 0;

    const newCustomers = customers.filter((c) => inRange(c.created_at, from, now.toISOString())).length;
    const repeat = customers.filter((c) => Number(c.total_orders || 0) > 1).length;

    return {
      period_days: days,
      orders_count: cur.length,
      orders_delta: pct(cur.length, prev.length),
      orders_today: orders.filter((o) => o.created_at >= U().addDays(now.toISOString(), -1)).length,
      qty_sold: qty(done(cur)),
      qty_delta: pct(qty(done(cur)), qty(done(prev))),
      gross_value: val(cur),
      gross_delta: pct(val(cur), val(prev)),
      platform_revenue: revenue(done(cur)),
      revenue_delta: pct(revenue(done(cur)), revenue(done(prev))),
      transport_cost: transport(done(cur)),
      avg_order_value: cur.length ? U().round(val(cur) / cur.length, 3) : 0,
      avg_delivery_hours: avgHours,
      cancelled: cur.filter((o) => o.status === 'cancelled').length,
      late: cur.filter((o) => !KX.orders.isFinal(o.status) &&
                              o.scheduled_at && o.scheduled_at < now.toISOString()).length,
      new_customers: newCustomers,
      repeat_customers: repeat,
      active_orders: orders.filter((o) => !KX.orders.isFinal(o.status)).length,
      pending_payment: orders.filter((o) => o.status === 'ready_for_payment').length,
      pending_verification: orders.filter((o) => o.status === 'awaiting_transfer_verification').length,
      open_complaints: complaints.filter((c) => c.status === 'open').length,
      suppliers_count: suppliers.filter((s) => s.is_active).length,
      carriers_count: carriers.filter((c) => c.is_active).length,
      trips_count: trips.length,
      margin_per_unit: qty(done(cur)) > 0
        ? U().round(revenue(done(cur)) / qty(done(cur)), 3) : 0,
      from: from, to: now.toISOString(), orders: orders
    };
  }

  /* سلسلة زمنية يومية لعدد الطلبات أو قيمتها */
  function daily(orders, days, metric) {
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      const key = d.toISOString().slice(0, 10);
      const rows = orders.filter((o) => String(o.created_at).slice(0, 10) === key);
      const v = metric === 'value' ? U().round(U().sum(rows, (o) => Number(o.total)), 3)
              : metric === 'qty'   ? U().round(U().sum(rows, (o) => Number(o.quantity || 0)), 1)
              : rows.length;
      out.push({
        label: d.toLocaleDateString('ar-OM-u-nu-latn', { day: 'numeric', month: 'short' }),
        value: v,
        display: metric === 'value' ? U().fmtOMR(v)
               : metric === 'qty'   ? U().fmtNum(v, 1) + ' ' + KX.schema.UNITS.m3 : v + ' طلب'
      });
    }
    return out;
  }

  /* الكميات المسلّمة حسب المادة */
  async function byMaterial(orders) {
    const items = await KX.repo.list('order_items', {});
    const ids = orders.filter((o) => o.status === DELIVERED).map((o) => o.id);
    const rows = items.filter((it) => ids.indexOf(it.order_id) !== -1);
    const g = U().groupBy(rows, 'material_name');
    return U().sortBy(Object.keys(g).map((k) => ({
      label: k, value: U().round(U().sum(g[k], (x) => Number(x.quantity || 0)), 1)
    })), 'value', 'desc')
      .map((r) => Object.assign(r, { display: U().fmtNum(r.value, 1) + ' ' + KX.schema.UNITS.m3 }));
  }

  /* الطلبات حسب المنطقة */
  async function byZone(orders) {
    const zones = await KX.repo.mapBy('delivery_zones');
    const g = U().groupBy(orders, 'zone_id');
    return U().sortBy(Object.keys(g).map((k) => ({
      label: (zones[k] || {}).name || '—', value: g[k].length
    })), 'value', 'desc').map((r) => Object.assign(r, { display: r.value + ' طلب' }));
  }

  /* أداء الموردين */
  async function supplierPerformance(orders) {
    const [suppliers, reviews] = await Promise.all([
      KX.repo.list('suppliers', {}), KX.repo.list('reviews', {})
    ]);
    return U().sortBy(suppliers.map(function (s) {
      const os = orders.filter((o) => o.supplier_id === s.id);
      const dl = os.filter((o) => o.status === DELIVERED);
      const rv = reviews.filter((r) => r.supplier_id === s.id);
      return {
        id: s.id, name: s.name,
        orders: os.length, delivered: dl.length,
        quantity: U().round(U().sum(dl, (o) => Number(o.quantity || 0)), 1),
        value: U().round(U().sum(dl, (o) => Number(o.material_cost)), 3),
        cancelled: os.filter((o) => o.status === 'cancelled').length,
        rating: rv.length ? U().round(U().sum(rv, (r) => Number(r.supplier_rating)) / rv.length, 1) : s.rating,
        fulfillment: os.length ? U().round((dl.length / os.length) * 100, 0) : 0
      };
    }), 'quantity', 'desc');
  }

  /* أداء الناقلين */
  async function carrierPerformance(orders) {
    const [carriers, trips, reviews] = await Promise.all([
      KX.repo.list('transport_companies', {}), KX.repo.list('trips', {}), KX.repo.list('reviews', {})
    ]);
    return U().sortBy(carriers.map(function (c) {
      const os = orders.filter((o) => o.transporter_id === c.id);
      const tp = trips.filter((t) => t.transporter_id === c.id);
      const rv = reviews.filter((r) => r.transporter_id === c.id);
      return {
        id: c.id, name: c.name, orders: os.length,
        trips: tp.length, delivered_trips: tp.filter((t) => t.status === 'delivered').length,
        value: U().round(U().sum(os.filter((o) => o.status === DELIVERED), (o) => Number(o.transport_cost)), 3),
        rating: rv.length ? U().round(U().sum(rv, (r) => Number(r.transporter_rating)) / rv.length, 1) : c.rating
      };
    }), 'trips', 'desc');
  }

  /* توزيع قيمة الطلبات: مواد / نقل / إيراد المنصة (الضريبة محصّلة للدولة وتُستثنى) */
  function valueSplit(orders) {
    const dl = orders.filter((o) => o.status === DELIVERED);
    const materials = U().round(U().sum(dl, (o) => Number(o.material_cost)), 3);
    const transport = U().round(U().sum(dl, (o) => Number(o.transport_cost)), 3);
    const revenue = U().round(U().sum(dl, function (o) {
      const i = (o.price_snapshot || {}).internal || {};
      return Number(i.platform_revenue || o.platform_fee || 0);
    }), 3);
    /* إيراد المنصة يأتي من العمولات المخصومة من المورد والناقل + رسوم المنصة */
    return [
      { label: 'قيمة المواد (صافي للمورد)', value: U().round(materials - revenue * 0.35, 3) },
      { label: 'تكلفة النقل (صافي للناقل)', value: U().round(transport - revenue * 0.35, 3) },
      { label: 'إيراد المنصة', value: revenue }
    ].map((s) => Object.assign(s, { display: U().fmtOMR(s.value) }));
  }

  /* توزيع الطلبات على الحالات */
  function statusSplit(orders) {
    const g = U().groupBy(orders, 'status');
    return U().sortBy(Object.keys(g).map((k) => ({
      label: KX.orders.label(k), value: g[k].length, status: k
    })), 'value', 'desc');
  }

  return { overview, daily, byMaterial, byZone, supplierPerformance,
           carrierPerformance, valueSplit, statusSplit };
})();

</script>

  /* طلبات اختبار سابقة لتغذية لوحة المؤشرات — كميات بالمتر المكعب */
  async function seedHistoricalOrders(ref) {
    const plan = [
      { cust: '96890000002', site: 1, sku: 'BASE-ABC-0020',  qty: 72, truck: 'TRL24', zone: 'IBR-O', status: 'delivered',  age: 21 },
      { cust: '96890000002', site: 1, sku: 'AGG-CRUSH-034',  qty: 36, truck: 'TIP18', zone: 'IBR-O', status: 'delivered',  age: 17 },
      { cust: '96890000001', site: 0, sku: 'FILL-WADI',      qty: 54, truck: 'TIP18', zone: 'IBR-C', status: 'delivered',  age: 14 },
      { cust: '96890000003', site: 3, sku: 'AGG-NAT-2040',   qty: 96, truck: 'TRL24', zone: 'DHK',   status: 'delivered',  age: 11 },
      { cust: '96890000004', site: 4, sku: 'SAND-NORMAL-05', qty: 18, truck: 'TIP18', zone: 'IBR-C', status: 'delivered',  age: 8 },
      { cust: '96890000003', site: 3, sku: 'BASE-ABC-0020',  qty: 60, truck: 'TRL30', zone: 'DHK',   status: 'in_transit', age: 2 },
      { cust: '96890000001', site: 0, sku: 'SAND-PLASTER-02', qty: 18, truck: 'TIP18', zone: 'IBR-C', status: 'paid',      age: 1 },
      { cust: '96890000002', site: 1, sku: 'SAND-BLOCK-316', qty: 24, truck: 'TRL24', zone: 'IBR-O', status: 'ready_for_payment', age: 1 },
      { cust: '96890000003', site: 3, sku: 'FILL-WADI-SCR',  qty: 36, truck: 'TIP18', zone: 'DHK',   status: 'cancelled',  age: 5 }
    ];
    let seq = 100;
    for (const p of plan) {
      const cust = ref.CU[p.cust];
      const site = ref.locations[p.site];
      const q = await KX.pricing.quote({
        supplier_id: ref.supplier.id, material_id: ref.M[p.sku],
        quantity: p.qty, order_by: 'unit', truck_type_id: ref.T[p.truck],
        zone_id: ref.Z[p.zone], site: site.coords, customer_id: cust.id
      });
      if (!q.quantities) continue;
      seq++;
      const createdAt = daysAgo(p.age);
      const paid = ['paid', 'preparing', 'loading', 'in_transit', 'arrived', 'delivered'].indexOf(p.status) !== -1;
      const order = await KX.repo.insert('orders', {
        order_no: 'KX-' + new Date(createdAt).getFullYear() + '-' + String(seq).padStart(6, '0'),
        customer_id: cust.id, site_id: site.id,
        supplier_id: ref.supplier.id, transporter_id: ref.TR['TRP-DHR'].id,
        zone_id: ref.Z[p.zone], truck_id: ref.T[p.truck],
        status: p.status, scheduled_at: U().addDays(createdAt, 1),
        quantity: q.quantities.quantity, unit: q.quantities.unit,
        trips_planned: q.quantities.trips,
        trips_done: p.status === 'delivered' ? q.quantities.trips : 0,
        price_snapshot: q,
        material_cost: q.lines.material_cost, transport_cost: q.lines.transport_cost,
        platform_fee: q.lines.platform_fee, discount: q.lines.discount,
        vat: q.lines.vat, total: q.totals.total,
        amount_paid: paid ? q.totals.total : 0, amount_refunded: 0, waiting_fees: 0,
        delivery_otp: String(Math.floor(1000 + Math.random() * 9000)),
        created_at: createdAt, updated_at: createdAt,
        delivered_at: p.status === 'delivered' ? U().addDays(createdAt, 1) : null,
        history: [{ at: createdAt, status: 'draft', note: 'بيانات اختبار' },
                  { at: U().addDays(createdAt, 0.5), status: p.status, note: 'بيانات اختبار' }]
      });
      await KX.repo.insert('order_items', {
        order_id: order.id, material_id: ref.M[p.sku], material_sku: p.sku,
        material_name: q.inputs.material_name_ar, unit: q.quantities.unit,
        order_by: 'unit', quantity: q.quantities.quantity,
        unit_price: q.lines.unit_price, line_total: q.lines.material_cost
      });
      if (paid) {
        await KX.repo.insert('payments', {
          order_id: order.id, customer_id: cust.id, method: 'card',
          amount: q.totals.total, currency: 'OMR', status: 'captured',
          provider: 'demo', provider_ref: 'DEMO-SEED-' + seq,
          idempotency_key: order.id + ':seed', paid_at: createdAt, created_at: createdAt
        });
      }
      if (p.status === 'delivered') {
        await KX.payments.issueInvoice(order);
        await KX.settlements.buildForOrder(order);
        await KX.repo.insert('reviews', {
          order_id: order.id, customer_id: cust.id,
          supplier_id: order.supplier_id, transporter_id: order.transporter_id,
          supplier_rating: 4 + (seq % 2), transporter_rating: 4 + ((seq + 1) % 2),
          comment: 'الكمية مطابقة والتوصيل في الموعد.', created_at: order.delivered_at
        });
        await KX.repo.update('customer_profiles', cust.id, {
          total_orders: Number(cust.total_orders || 0) + 1,
          total_spent: U().round(Number(cust.total_spent || 0) + Number(order.total), 3)
        });
        cust.total_orders = Number(cust.total_orders || 0) + 1;
        cust.total_spent = U().round(Number(cust.total_spent || 0) + Number(order.total), 3);
      }
      if (p.status === 'in_transit') {
        const trips = await KX.trips.createForOrder(order,
          { transporter_id: ref.TR['TRP-DHR'].id, truck_id: ref.trucks[2].id });
        for (const t of trips) {
          await KX.repo.update('trips', t.id, {
            driver_id: ref.drivers[1].id, truck_id: ref.trucks[2].id, status: 'en_route',
            timeline: [{ at: daysAgo(2), status: 'assigned' }, { at: daysAgo(1), status: 'loaded' },
                       { at: U().nowISO(), status: 'en_route' }]
          });
        }
      }
    }
  }
  return { run, needsSeed, SEED_VERSION };
})();

<script>
/* مكوّنات واجهة قابلة لإعادة الاستخدام — كلها ترجع HTML نصيًا */
window.KX = window.KX || {};
KX.ui = (function () {
  const U = () => KX.util;
  const e = (s) => KX.util.esc(s);

  const badge = (text, tone) => '<span class="badge badge--' + (tone || 'muted') + '">' + e(text) + '</span>';
  const statusBadge = (s) => badge(KX.orders.label(s), KX.orders.tone(s));
  const money = (n) => '<span class="mono">' + e(U().fmtOMR(n)) + '</span>';

  function kpi(o) {
    const d = o.delta;
    return '<div class="kpi ' + (o.accent ? 'kpi--accent' : '') + '">' +
      '<div class="kpi__label">' + e(o.label) + '</div>' +
      '<div class="kpi__value">' + e(o.value) + '</div>' +
      (o.sub ? '<div class="kpi__sub">' + e(o.sub) + '</div>' : '') +
      (d === null
        ? '<div class="kpi__sub">لا توجد فترة سابقة للمقارنة</div>'
        : d !== undefined
          ? '<div class="kpi__delta kpi__delta--' + (d >= 0 ? 'up' : 'down') + '">' +
            (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1) + '% مقارنة بالفترة السابقة</div>'
          : '') +
      '</div>';
  }

  function table(cols, rows, opts) {
    opts = opts || {};
    if (!rows.length) return empty(opts.emptyText || 'لا توجد بيانات لعرضها', opts.emptyIcon);
    const head = cols.map((c) => '<th class="' + (c.num ? 'num' : '') + '">' + e(c.label) + '</th>').join('');
    const body = rows.map(function (r, i) {
      const tds = cols.map(function (c) {
        const v = typeof c.render === 'function' ? c.render(r, i) : e(r[c.key]);
        return '<td class="' + (c.num ? 'num' : '') + '">' + v + '</td>';
      }).join('');
      return '<tr' + (opts.rowAttrs ? ' ' + opts.rowAttrs(r) : '') + '>' + tds + '</tr>';
    }).join('');
    return '<div class="table-wrap"><table class="table ' + (opts.compact ? 'table--compact' : '') + '">' +
           '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  const empty = (text, icon) =>
    '<div class="empty"><div class="empty__icon">' + (icon || '📭') + '</div><div>' + e(text) + '</div></div>';

  const card = (title, body, actions) =>
    '<div class="card">' +
      (title ? '<div class="card__head"><h3 class="card__title">' + e(title) + '</h3>' +
               (actions ? '<div class="btn-group">' + actions + '</div>' : '') + '</div>' : '') +
      body + '</div>';

  const alert = (text, kind, icon) =>
    '<div class="alert alert--' + (kind || 'info') + '"><span>' + (icon || 'ℹ️') + '</span><div>' + text + '</div></div>';

  function field(o) {
    const id = o.id || o.name;
    const err = o.error ? '<span class="field__err">' + e(o.error) + '</span>' : '';
    const hint = o.hint ? '<span class="field__hint">' + e(o.hint) + '</span>' : '';
    let input;
    if (o.type === 'select') {
      input = '<select id="' + e(id) + '" name="' + e(o.name) + '"' + (o.disabled ? ' disabled' : '') + '>' +
        (o.placeholder ? '<option value="">' + e(o.placeholder) + '</option>' : '') +
        (o.options || []).map((op) =>
          '<option value="' + e(op.value) + '"' + (String(op.value) === String(o.value) ? ' selected' : '') + '>' +
          e(op.label) + '</option>').join('') + '</select>';
    } else if (o.type === 'textarea') {
      input = '<textarea id="' + e(id) + '" name="' + e(o.name) + '" rows="' + (o.rows || 3) + '" placeholder="' +
        e(o.placeholder || '') + '">' + e(o.value || '') + '</textarea>';
    } else {
      input = '<input id="' + e(id) + '" name="' + e(o.name) + '" type="' + (o.type || 'text') + '" ' +
        'value="' + e(o.value === undefined || o.value === null ? '' : o.value) + '" ' +
        'placeholder="' + e(o.placeholder || '') + '"' +
        (o.step ? ' step="' + e(o.step) + '"' : '') + (o.min !== undefined ? ' min="' + e(o.min) + '"' : '') +
        (o.max !== undefined ? ' max="' + e(o.max) + '"' : '') +
        (o.disabled ? ' disabled' : '') + (o.inputmode ? ' inputmode="' + e(o.inputmode) + '"' : '') +
        (o.cls ? ' class="' + e(o.cls) + '"' : '') + '>';
    }
    return '<label class="field ' + (o.error ? 'field--error' : '') + '">' +
      '<span>' + e(o.label) + (o.required ? ' <b class="req">*</b>' : '') + '</span>' +
      input + err + hint + '</label>';
  }

  const choice = (o) =>
    '<button type="button" class="choice ' + (o.selected ? 'is-selected' : '') + '" ' +
      'data-choice="' + e(o.group) + '" data-value="' + e(o.value) + '">' +
      '<div class="choice__title">' + e(o.title) + '</div>' +
      (o.meta ? '<div class="choice__meta">' + e(o.meta) + '</div>' : '') +
      (o.price ? '<div class="choice__price">' + e(o.price) + '</div>' : '') + '</button>';

  /* ملخّص السعر التفصيلي — يُعرض للعميل قبل الاعتماد.
     القاعدة: يرى العميل سعر المادة + النقل + الرسوم + الضريبة + الخصم والإجمالي. */
  function priceBox(q, opts) {
    opts = opts || {};
    const L = q.lines, Q = q.quantities;
    const T = (k) => KX.i18n.t(k);
    const u = U().unitLabel(Q.unit);
    let h = '<div class="price-box">';
    h += '<div class="line"><span>' + e(T('material_price')) + ' (' +
         U().fmtNum(Q.quantity, 1) + ' ' + e(u) + ' × ' + U().money(L.unit_price) +
         ')</span><b>' + U().money(L.material_cost) + '</b></div>';
    h += '<div class="line"><span>' + e(T('transport_cost')) + ' (' + Q.trips + ' × ' +
         U().money(L.transport_per_trip) + ')</span><b>' + U().money(L.transport_cost) + '</b></div>';
    h += '<div class="line"><span>' + e(T('platform_fee')) + '</span><b>' +
         U().money(L.platform_fee) + '</b></div>';
    if (L.discount > 0)
      h += '<div class="line line--discount"><span>' + e(T('discount')) +
           (L.coupon_code ? ' (' + e(L.coupon_code) + ')' : '') +
           '</span><b>− ' + U().money(L.discount) + '</b></div>';
    if (L.vat > 0)
      h += '<div class="line"><span>' + e(T('vat')) + ' (' + (L.vat_rate * 100).toFixed(0) +
           '%)</span><b>' + U().money(L.vat) + '</b></div>';
    h += '<hr><div class="total"><span>' + e(T('total')) + '</span><b>' +
         U().fmtOMR(q.totals.total) + '</b></div>';
    if (!opts.hideNote)
      h += '<div style="margin-top:10px;font-size:.78rem;color:#9fb5c8">' +
           e(T('price_excludes_transport')) + ' — ' +
           'وهو مضاف هنا بندًا مستقلًا. لا يتغيّر السعر بعد الدفع إلا بموافقتك.</div>';
    h += '</div>';
    return h;
  }

  /* شريط تقدّم مراحل الطلب */
  function steps(status) {
    const flow = ['under_review', 'awaiting_supplier', 'awaiting_carrier', 'ready_for_payment',
                  'paid', 'preparing', 'loading', 'in_transit', 'arrived', 'delivered'];
    const cur = flow.indexOf(status);
    return '<div class="steps">' + flow.map(function (s, i) {
      const cls = cur === -1 ? '' : (i < cur ? 'is-done' : i === cur ? 'is-current' : '');
      return '<div class="steps__item ' + cls + '" title="' + e(KX.orders.label(s)) + '"></div>';
    }).join('') + '</div>';
  }

  function timeline(items) {
    return '<ul class="timeline">' + items.map(function (it, i) {
      const cls = it.current ? 'is-current' : (it.done !== false ? 'is-done' : '');
      return '<li class="' + cls + '"><div class="timeline__title">' + e(it.title) + '</div>' +
             '<div class="timeline__meta">' + e(it.meta || '') + '</div></li>';
    }).join('') + '</ul>';
  }

  const loading = (text) =>
    '<div class="empty"><span class="spinner"></span><div style="margin-top:10px">' + e(text || 'جارٍ التحميل…') + '</div></div>';

  /* قراءة قيم نموذج إلى كائن */
  function formValues(formEl) {
    const out = {};
    U().$$('input,select,textarea', formEl).forEach(function (el) {
      if (!el.name) return;
      out[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }
  /* ربط أزرار الاختيار البطاقي */
  function bindChoices(root, group, onPick) {
    U().on(root, 'click', '[data-choice="' + group + '"]', function (ev, el) {
      U().$$('[data-choice="' + group + '"]', root).forEach((x) => x.classList.remove('is-selected'));
      el.classList.add('is-selected');
      onPick(el.dataset.value, el);
    });
  }

  return { badge, statusBadge, money, kpi, table, empty, card, alert, field, choice,
           priceBox, steps, timeline, loading, formValues, bindChoices };
})();

</script>

<script>
/* ============================================================
   رسوم بيانية بصيغة SVG مضمّنة — بلا أي مكتبة خارجية.
   القواعد المطبّقة: محور واحد لكل رسم، ألوان مُتحقَّق منها،
   عناوين مباشرة على القيم المهمّة، وجدول بديل لكل رسم.
   ============================================================ */
window.KX = window.KX || {};
KX.charts = (function () {
  const U = () => KX.util;
  const e = (s) => KX.util.esc(s);
  let seq = 0;
  const nid = () => 'viz' + (++seq);

  function niceMax(v) {
    if (v <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  }

  /* ---------- خط زمني: سلسلة واحدة، بلا مفتاح ألوان (العنوان يسمّيها) ---------- */
  function line(data, opts) {
    opts = opts || {};
    const id = nid(), W = 640, H = opts.height || 200;
    const pad = { t: 14, r: 14, b: 26, l: 44 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    if (!data.length) return KX.ui.empty('لا توجد بيانات كافية للرسم', '📉');

    const max = niceMax(Math.max.apply(null, data.map((d) => d.value)) || 1);
    const x = (i) => pad.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
    const y = (v) => pad.t + ih - (v / max) * ih;

    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => max * f);
    const grid = ticks.map((t) =>
      '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>').join('');
    const yLabels = ticks.map((t) =>
      '<text x="' + (pad.l - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' +
      U().fmtNum(t, t < 10 ? 1 : 0) + '</text>').join('');

    const pts = data.map((d, i) => x(i) + ',' + y(d.value));
    const path = 'M' + pts.join(' L');
    const area = path + ' L' + x(data.length - 1) + ',' + (pad.t + ih) + ' L' + x(0) + ',' + (pad.t + ih) + ' Z';

    /* عناوين محور السين: أول وآخر ونقطة وسطى فقط لتفادي التزاحم */
    const showIdx = data.length <= 7 ? data.map((_, i) => i)
      : [0, Math.floor(data.length / 2), data.length - 1];
    const xLabels = showIdx.map((i) =>
      '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + e(data[i].label) + '</text>').join('');

    const dots = data.map((d, i) =>
      '<circle class="viz__dot" cx="' + x(i) + '" cy="' + y(d.value) + '" r="4" ' +
      'data-i="' + i + '" data-label="' + e(d.label) + '" data-value="' + e(d.display || U().fmtNum(d.value, 1)) + '"/>').join('');

    /* مناطق التقاط عريضة للمؤشّر */
    const hit = data.map((d, i) =>
      '<rect x="' + (x(i) - iw / (data.length * 2 || 1)) + '" y="' + pad.t + '" ' +
      'width="' + Math.max(12, iw / (data.length || 1)) + '" height="' + ih + '" fill="transparent" ' +
      'data-hit="' + i + '" data-x="' + x(i) + '" data-y="' + y(d.value) + '" ' +
      'data-label="' + e(d.label) + '" data-value="' + e(d.display || U().fmtNum(d.value, 1)) + '"/>').join('');

    return '<div class="viz" id="' + id + '" data-chart="line">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + e(opts.aria || 'رسم بياني خطي') + '">' +
      '<g class="viz__grid">' + grid + '</g>' +
      '<g class="viz__axis">' + yLabels + xLabels + '</g>' +
      '<path class="viz__area" d="' + area + '"/>' +
      '<path class="viz__line" d="' + path + '"/>' +
      '<line class="viz__cross" x1="0" x2="0" y1="' + pad.t + '" y2="' + (pad.t + ih) + '" style="opacity:0"/>' +
      dots + hit + '</svg>' +
      '<div class="viz-tip"></div>' +
      (opts.note ? '<div class="viz-note">' + e(opts.note) + '</div>' : '') +
      '</div>';
  }

  /* ---------- أعمدة أفقية: سلسلة واحدة، عناوين قيم مباشرة ---------- */
  function barsH(data, opts) {
    opts = opts || {};
    if (!data.length) return KX.ui.empty('لا توجد بيانات كافية للرسم', '📊');
    const id = nid(), W = 640, rowH = 30, W_LABEL = 150;
    const H = data.length * rowH + 8;
    const max = Math.max.apply(null, data.map((d) => d.value)) || 1;
    const barW = W - W_LABEL - 78;

    const rows = data.map(function (d, i) {
      const w = Math.max(3, (d.value / max) * barW);
      const yy = i * rowH + 6;
      /* الأعمدة في اتجاه RTL تبدأ من اليمين */
      return '<text class="viz__label--dim viz__label" x="' + (W - 4) + '" y="' + (yy + 13) + '" ' +
             'text-anchor="end">' + e(d.label) + '</text>' +
             '<rect class="viz__bar" x="' + (W - W_LABEL - w) + '" y="' + yy + '" width="' + w + '" height="17" rx="4"/>' +
             '<text class="viz__label" x="' + (W - W_LABEL - w - 8) + '" y="' + (yy + 13) + '" text-anchor="end">' +
             e(d.display || U().fmtNum(d.value, 1)) + '</text>';
    }).join('');

    return '<div class="viz" id="' + id + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + e(opts.aria || 'أعمدة') + '">' +
      rows + '</svg>' +
      (opts.note ? '<div class="viz-note">' + e(opts.note) + '</div>' : '') + '</div>';
  }

  /* ---------- شريط مكدّس: ثلاث فئات كحد أقصى + مفتاح ألوان + عناوين مباشرة ---------- */
  function stacked(segments, opts) {
    opts = opts || {};
    const total = U().sum(segments, (s) => Number(s.value)) || 1;
    const id = nid(), W = 640, H = 46, GAP = 2;      /* فاصل 2px بلون السطح بين الشرائح */
    let x = W;
    const bars = segments.map(function (s, i) {
      const w = Math.max(2, (Number(s.value) / total) * (W - GAP * (segments.length - 1)));
      x -= w;
      const rect = '<rect x="' + x + '" y="0" width="' + w + '" height="22" rx="4" ' +
                   'fill="var(--series-' + (i + 1) + ')"/>';
      const pct = ((Number(s.value) / total) * 100).toFixed(0);
      const label = w > 44
        ? '<text class="viz__label" x="' + (x + w / 2) + '" y="38" text-anchor="middle">' + pct + '%</text>'
        : '';
      x -= GAP;
      return rect + label;
    }).join('');

    const legend = '<div class="viz-legend">' + segments.map((s, i) =>
      '<span><i style="background:var(--series-' + (i + 1) + ')"></i>' + e(s.label) + ' — <b>' +
      e(s.display || U().fmtOMR(s.value)) + '</b></span>').join('') + '</div>';

    return '<div class="viz" id="' + id + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + e(opts.aria || 'توزيع') + '">' +
      bars + '</svg>' + legend +
      (opts.note ? '<div class="viz-note">' + e(opts.note) + '</div>' : '') + '</div>';
  }

  /* شريط مصغّر داخل الجداول */
  function mini(value, max) {
    const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
    return '<div class="minibar viz"><i style="width:' + pct.toFixed(1) + '%"></i></div>';
  }

  /* تفعيل التلميحات على الرسوم الخطية بعد إدراجها في الصفحة */
  function bindTooltips(root) {
    U().$$('[data-chart="line"]', root || document).forEach(function (box) {
      const tip = box.querySelector('.viz-tip');
      const cross = box.querySelector('.viz__cross');
      const svg = box.querySelector('svg');
      const vb = svg.viewBox.baseVal;
      U().$$('[data-hit]', box).forEach(function (r) {
        r.addEventListener('mouseenter', function () {
          const px = Number(r.dataset.x), py = Number(r.dataset.y);
          const rect = svg.getBoundingClientRect();
          const sx = rect.width / vb.width, sy = rect.height / vb.height;
          tip.innerHTML = '<span>' + r.dataset.label + '</span> — <b>' + r.dataset.value + '</b>';
          tip.style.insetInlineStart = '';
          tip.style.left = (px * sx) + 'px';
          tip.style.top = (py * sy) + 'px';
          tip.classList.add('is-on');
          cross.setAttribute('x1', px); cross.setAttribute('x2', px);
          cross.style.opacity = '1';
        });
        r.addEventListener('mouseleave', function () {
          tip.classList.remove('is-on'); cross.style.opacity = '0';
        });
      });
    });
  }
  return { line, barsH, stacked, mini, bindTooltips, niceMax };
})();

</script>

    const nav = PUBLIC_NAV.map((n) =>
      '<a href="#' + n.path + '" class="' + (cur === n.path ? 'is-active' : '') + '">' + e(n.label) + '</a>').join('');
    const right = s
      ? '<a href="#' + KX.auth.homeFor(s.role) + '" class="' + (cur.indexOf(KX.auth.homeFor(s.role)) === 0 ? 'is-active' : '') + '">' +
        '👤 ' + e(s.name) + '</a><a href="#/logout">خروج</a>'
      : '<a href="#/login" class="btn btn--primary btn--sm" style="color:#fff">تسجيل الدخول</a>';
    /* مبدّل اللغة — الأسماء بلغتها الأصلية حتى يعرفها من لا يقرأ العربية */
    const langSel = '<select class="lang-pick" id="kx-lang" aria-label="' +
      e(KX.i18n.t('change_language')) + '">' +
      KX.i18n.available().map(function (l) {
        const m = KX.i18n.meta(l);
        return '<option value="' + l + '"' + (l === KX.i18n.getLang() ? ' selected' : '') + '>' +
               e(m.native) + '</option>';
      }).join('') + '</select>';

    return '<header class="appbar"><div class="appbar__inner">' +
      '<a href="#/" class="brand"><span class="brand__mark">🪨</span><span>' + e(KX.config.brand.name) + '</span></a>' +
      '<button class="appbar__burger" id="kx-burger" aria-label="القائمة">☰</button>' +
      '<nav class="appbar__nav" id="kx-nav">' + nav + langSel + right + '</nav>' +
      '</div></header>' +
      (KX.config.demo.enabled ? '<div class="demo-bar">⚠️ ' + e(KX.config.demo.banner) + '</div>' : '');
  }

  function footer() {
    const b = KX.config.brand;
    return '<footer class="footer"><div class="container">' +
      '<div class="grid grid-4">' +
        '<div><h4>' + e(b.name) + '</h4><p style="color:#9fb5c8">' + e(b.tagline) + '</p>' +
        '<p style="color:#9fb5c8">منطقة التشغيل الحالية: ' + e(b.launchArea) + '</p></div>' +
        '<div><h4>الخدمة</h4>' +
          '<div><a href="#/how">كيف تعمل الخدمة؟</a></div>' +
          '<div><a href="#/suppliers">الموردون</a></div>' +
          '<div><a href="#/faq">الأسئلة الشائعة</a></div></div>' +
        '<div><h4>السياسات</h4>' +
          '<div><a href="#/terms">الشروط والأحكام</a></div>' +
          '<div><a href="#/privacy">سياسة الخصوصية</a></div>' +
          '<div><a href="#/refund-policy">سياسة الإلغاء والاسترداد</a></div></div>' +
        '<div><h4>تواصل معنا</h4>' +
          '<div>' + e(b.supportPhone) + '</div><div>' + e(b.supportEmail) + '</div>' +
          '<div style="margin-top:8px"><a href="#/contact">نموذج التواصل</a></div></div>' +
      '</div>' +
      '<div class="footer__bottom"><span>© ' + new Date().getFullYear() + ' ' + e(b.name) +
      ' — نسخة تجريبية ' + e(KX.config.version) + '</span>' +
      '<span>جميع البيانات المعروضة افتراضية وغير حقيقية</span></div>' +
      '</div></footer>';
  }

  function sidebar(role, counts) {
    const items = SIDEBARS[role] || [];
    const cur = KX.router.current().split('?')[0];
    /* المسار النشط هو أطول مسار مطابق حتى لا يُضاء القسم وابنه معًا */
    const matches = items.filter((it) => it.path && (cur === it.path || cur.indexOf(it.path + '/') === 0));
    const best = matches.sort((a, b) => b.path.length - a.path.length)[0];
    /* label المكتوب صراحةً يفوز؛ وإلا يُترجم key بسلسلة الرجوع المعتمدة */
    const text = (it) => it.label || (it.key ? KX.i18n.t(it.key) : '');
    return '<aside class="sidebar">' + items.map(function (it) {
      if (it.group) return '<div class="sidebar__group">' + e(text(it) || it.group) + '</div>';
      const active = best && it.path === best.path;
      const c = counts && counts[it.path];
      return '<a href="#' + it.path + '" class="' + (active ? 'is-active' : '') + '">' +
        '<span>' + it.icon + '</span><span>' + e(text(it)) + '</span>' +
        (c ? '<span class="count">' + c + '</span>' : '') + '</a>';
    }).join('') + '</aside>';
  }

  /* صفحة عامة (بدون قائمة جانبية) */
  function renderPublic(html, opts) {
    opts = opts || {};
    root().innerHTML = appbar() +
      (opts.raw ? html : '<main class="container" style="padding-top:28px;padding-bottom:32px">' + html + '</main>') +
      footer();
    bindChrome();
  }
  /* صفحة داخل لوحة تحكم */
  function renderApp(html, opts) {
    opts = opts || {};
    const s = KX.auth.session() || {};
    root().innerHTML = appbar() +
      '<div class="shell">' + sidebar(s.role, opts.counts) +
      '<main class="content">' +
        (opts.title
          ? '<div class="row row--between mb"><div><h1>' + e(opts.title) + '</h1>' +
            (opts.subtitle ? '<p class="muted" style="margin:0">' + e(opts.subtitle) + '</p>' : '') + '</div>' +
            (opts.actions ? '<div class="btn-group">' + opts.actions + '</div>' : '') + '</div>'
          : '') +
        html +
      '</main></div>';
    bindChrome();
  }

  function bindChrome() {
    const burger = document.getElementById('kx-burger');
    if (burger) burger.onclick = () => document.getElementById('kx-nav').classList.toggle('is-open');
    const lang = document.getElementById('kx-lang');
    if (lang) lang.onchange = function () { KX.i18n.setLang(this.value); KX.router.resolve(); };
  }

  return { renderPublic, renderApp, appbar, footer, sidebar, PUBLIC_NAV, SIDEBARS };
})();

</script>

<script>

  async function suppliers() {
    const rows = await KX.repo.list('suppliers', { where: { is_approved: true, is_active: true } });

        '<span>' + e((byMat[p.material_id] || {}).name || '—') + '</span>' +

    }).join('');

  function privacy() {
    L().renderPublic('<div class="container--narrow"><h1>سياسة الخصوصية</h1>' +
      section('البيانات التي نجمعها', [
        'رقم الهاتف والاسم ونوع الحساب وبيانات السجل التجاري للشركات.',
        'مواقع المشاريع والإحداثيات التي تحفظها بنفسك.',
        'بيانات الطلبات والمدفوعات والفواتير.']) +
      section('ما لا نخزّنه', [
        'لا نخزّن أرقام البطاقات البنكية أو رموزها داخل قاعدة بيانات التطبيق إطلاقًا.',
        'تُعالج المدفوعات لدى مزوّد دفع مرخّص، ونحتفظ بمرجع العملية وآخر أربعة أرقام فقط.']) +
      section('الاستخدام والمشاركة', [
        'تُشارك بيانات الطلب مع المورد والناقل المعنيين بالقدر اللازم لتنفيذ التوصيل فقط.',
        'لا تُباع البيانات لأي طرف ثالث.',
        'تُستخدم البيانات المجمّعة لتحسين الخدمة وإعداد تقارير الأداء.']) +
      section('حقوقك', [
        'الاطلاع على بياناتك وتصحيحها من الملف الشخصي.',
        'طلب حذف الحساب — مع الاحتفاظ بالسجلات المالية للمدة النظامية.',
        'إيقاف الإشعارات التسويقية دون التأثير على إشعارات الطلبات.']) +
      '</div>');
  }

  function refundPolicy() {
    const rows = KX.config.refundPolicy.map((p) => ({
      stage: KX.orders.label(p.upToStatus),
      pct: (p.refundPercent * 100).toFixed(0) + '%',
      note: p.note
    }));
    L().renderPublic('<div class="container--narrow"><h1>سياسة الإلغاء والاسترداد</h1>' +
      '<p>تُحدَّد نسبة الاسترداد حسب المرحلة التي وصل إليها الطلب وقت الإلغاء.</p>' +
      KX.ui.table([
        { key: 'stage', label: 'حتى مرحلة' },
        { key: 'pct', label: 'نسبة الاسترداد', num: true },
        { key: 'note', label: 'الملاحظة' }
      ], rows) +
      section('قواعد عامة', [
        'الإلغاء متاح ذاتيًا قبل اعتماد التحميل.',
        'بعد بدء التحميل ينتقل الطلب إلى «تحت المراجعة» ولا يُلغى تلقائيًا.',
        'يُسجَّل لكل استرداد: السبب والمبلغ والمرحلة ومن اعتمده.',
        'يصل العميل إشعار عند كل تحديث على طلب الاسترداد.',
        'تُحفظ جميع العمليات المالية في سجل تدقيق دائم لا يُحذف.']) +
      '</div>');
  }

  function contact() {
    L().renderPublic('<div class="container--narrow"><h1>تواصل معنا</h1>' +
      '<div class="grid grid-2 mb">' +
        '<div class="card"><h4>الدعم</h4><p style="margin:0">' + e(b().supportPhone) + '<br>' + e(b().supportEmail) + '</p></div>' +
        '<div class="card"><h4>المقر</h4><p style="margin:0">عبري — محافظة الظاهرة<br>سلطنة عُمان</p></div>' +
      '</div>' +
      '<div class="card" id="contact-card">' +
        '<h3>أرسل رسالة أو اطلب الانضمام كمورد/ناقل</h3>' +
        '<form id="contact-form">' +
        '<div class="field-row">' +
          KX.ui.field({ name: 'name', label: 'الاسم', required: true }) +
          KX.ui.field({ name: 'phone', label: 'رقم الهاتف', required: true, placeholder: '9xxxxxxx', inputmode: 'tel' }) +
        '</div>' +
        KX.ui.field({ name: 'subject', label: 'الموضوع', type: 'select', required: true, options: [
          { value: 'inquiry', label: 'استفسار عام' },
          { value: 'supplier', label: 'انضمام كمورد / كسارة' },
          { value: 'transporter', label: 'انضمام كشركة نقل' },
          { value: 'complaint', label: 'شكوى' }
        ]}) +
        KX.ui.field({ name: 'message', label: 'الرسالة', type: 'textarea', rows: 4, required: true }) +
        '<button class="btn btn--primary" type="submit">إرسال</button></form></div></div>');

    document.getElementById('contact-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const v = KX.ui.formValues(ev.target);
      const errs = KX.util.validate(v, {
        name: { required: true, minLength: 3 },
        phone: { required: true, type: 'phone' },
        message: { required: true, minLength: 10 }
      });
      if (Object.keys(errs).length) { KX.util.toast(Object.values(errs)[0], 'error'); return; }
      await KX.repo.insert('complaints', {
        source: 'contact_form', subject: v.subject, name: v.name,
        phone: KX.util.normalizePhone(v.phone), message: v.message,
        status: 'open', order_id: null, customer_id: null
      });
      KX.util.toast('وصلتنا رسالتك وسنتواصل معك قريبًا', 'success');
      ev.target.reset();
    };
  }

  function section(title, points) {
    return '<div class="card mb"><h3>' + e(title) + '</h3><ul style="margin:0;padding-inline-start:20px;color:var(--text-2)">' +
      points.map((p) => '<li style="margin-bottom:6px">' + e(p) + '</li>').join('') + '</ul></div>';
  }

  function notFound() {
    L().renderPublic('<div class="empty"><div class="empty__icon">🔍</div>' +
      '<h2>الصفحة غير موجودة</h2><p>تحقق من الرابط أو عد إلى الصفحة الرئيسية.</p>' +
      '<a href="#/" class="btn btn--primary">الرئيسية</a></div>');
  }

  return { home, how, suppliers, faq, terms, privacy, refundPolicy, contact, notFound };
})();

</script>

<script>
/* صفحات الدخول والتسجيل */
window.KX = window.KX || {};
KX.viewsAuth = (function () {
  const e = (s) => KX.util.esc(s);
  const L = () => KX.layout;
  let pendingPhone = null;

  async function login() {
    const demoUsers = KX.config.demo.enabled
      ? await KX.repo.list('users', { where: { account_status: 'active' } }) : [];
    const grouped = KX.util.groupBy(demoUsers, 'role');
    const demoBox = KX.config.demo.enabled
      ? '<div class="card mt"><h4>حسابات العرض التجريبية</h4>' +
        '<p class="muted" style="font-size:.84rem">اضغط أي حساب للدخول مباشرة — رمز التحقق دائمًا <b>' +
        e(KX.config.demo.otpCode) + '</b></p>' +
        Object.keys(grouped).map(function (r) {
          return '<div style="margin-bottom:10px"><div class="sidebar__group" style="padding:4px 0">' +
            e(KX.schema.ROLES[r] || r) + '</div><div class="row gap-sm">' +
            grouped[r].map((u) => '<button class="btn btn--ghost btn--sm" data-demo="' + e(u.phone) + '">' +
              e(u.name) + '</button>').join('') + '</div></div>';
        }).join('') + '</div>'
      : '';

    L().renderPublic('<div class="container--narrow">' +
      '<div class="card card--pad-lg">' +
        '<h1>تسجيل الدخول</h1>' +
        '<p>أدخل رقم هاتفك العُماني ويصلك رمز تحقق.</p>' +
        '<form id="phone-form">' +
          KX.ui.field({ name: 'phone', label: 'رقم الهاتف', required: true,
                        placeholder: '9xxxxxxx', inputmode: 'tel', hint: 'مثال: 90000001 أو 96890000001' }) +
          '<button class="btn btn--primary btn--block btn--lg" type="submit">إرسال رمز التحقق</button>' +
        '</form>' +
        '<div id="otp-area"></div>' +
      '</div>' + demoBox + '</div>');

    document.getElementById('phone-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const phone = KX.ui.formValues(ev.target).phone;
      try { await requestOtp(phone); }
      catch (err) { KX.util.toast(err.message, 'error'); }
    };
    KX.util.on(document, 'click', '[data-demo]', function (ev, el) {
      requestOtp(el.dataset.demo).catch((err) => KX.util.toast(err.message, 'error'));
    });
  }

  async function requestOtp(phone) {
    const r = await KX.auth.sendOtp(phone);
    pendingPhone = r.phone;
    const area = document.getElementById('otp-area');
    area.innerHTML = '<hr class="divider">' +
      (r.demo_code ? KX.ui.alert('رمز التحقق التجريبي: <b style="font-size:1.1rem">' + e(r.demo_code) + '</b>', 'info', '🔐') : '') +
      '<p>أُرسل الرمز إلى <b>' + e(KX.util.fmtPhone(r.phone)) + '</b></p>' +
      '<form id="otp-form">' +
      KX.ui.field({ name: 'code', label: 'رمز التحقق', required: true,
                    cls: 'otp-input', inputmode: 'numeric', placeholder: '••••',
                    value: r.demo_code || '' }) +
      '<button class="btn btn--primary btn--block btn--lg" type="submit">دخول</button>' +
      '<button class="btn btn--ghost btn--block" type="button" id="resend" style="margin-top:8px">تغيير الرقم</button>' +
      '</form>';
    area.querySelector('#resend').onclick = () => login();
    area.querySelector('#otp-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const code = KX.ui.formValues(ev.target).code;
      try {
        const res = await KX.auth.verifyOtp(pendingPhone, code);
        if (res.needsRegistration) { KX.router.go('/register'); return; }
        KX.util.toast('أهلًا ' + res.session.name, 'success');
        KX.router.go(KX.auth.homeFor(res.session.role));
      } catch (err) { KX.util.toast(err.message, 'error'); }
    };
    area.querySelector('input[name=code]').focus();
  }

  function register() {
    const phone = pendingPhone || '';
    L().renderPublic('<div class="container--narrow"><div class="card card--pad-lg">' +
      '<h1>إنشاء حساب جديد</h1>' +
      '<p>أكمل بياناتك لبدء الطلب. الحقول المعلّمة بـ <b class="req">*</b> مطلوبة.</p>' +
      '<form id="reg-form">' +
        KX.ui.field({ name: 'name', label: 'الاسم الكامل', required: true }) +
        KX.ui.field({ name: 'phone', label: 'رقم الهاتف', required: true, value: phone,
                      inputmode: 'tel', disabled: !!phone }) +
        KX.ui.field({ name: 'customer_type', label: 'نوع الحساب', type: 'select', required: true,
          options: Object.keys(KX.schema.CUSTOMER_TYPES).map((k) =>
            ({ value: k, label: KX.schema.CUSTOMER_TYPES[k] })) }) +
        '<div id="company-fields" style="display:none">' +
          KX.ui.field({ name: 'company_name', label: 'اسم الشركة / المؤسسة' }) +
          '<div class="field-row">' +
            KX.ui.field({ name: 'cr_number', label: 'رقم السجل التجاري' }) +
            KX.ui.field({ name: 'vat_number', label: 'الرقم الضريبي' }) +
          '</div></div>' +
        KX.ui.field({ name: 'email', label: 'البريد الإلكتروني (اختياري)', type: 'email' }) +
        '<label class="checkbox mb"><input type="checkbox" name="agree"> ' +
        'أوافق على <a href="#/terms">الشروط والأحكام</a> و<a href="#/privacy">سياسة الخصوصية</a></label>' +
        '<button class="btn btn--primary btn--block btn--lg" type="submit">إنشاء الحساب</button>' +
      '</form></div></div>');

    const typeSel = document.querySelector('select[name=customer_type]');
    const toggle = () => {
      document.getElementById('company-fields').style.display =
        typeSel.value === 'individual' ? 'none' : 'block';
    };
    typeSel.onchange = toggle; toggle();

    document.getElementById('reg-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const v = KX.ui.formValues(ev.target);
      if (phone) v.phone = phone;
      if (!v.agree) { KX.util.toast('يجب الموافقة على الشروط والأحكام', 'error'); return; }
      try {
        const res = await KX.auth.register(v);
        KX.util.toast('تم إنشاء حسابك بنجاح', 'success');
        KX.router.go(KX.auth.homeFor(res.session.role));
      } catch (err) { KX.util.toast(err.message, 'error'); }
    };
  }

  function logout() {
    KX.auth.logout();
    KX.util.toast('تم تسجيل الخروج');
    KX.router.go('/');
  }
  return { login, register, logout };
})();

</script>
