  /* ---------------- التسويات ---------------- */
  async function settlements() {
    const [rows, suppliers, carriers] = await Promise.all([
      KX.repo.list('settlements', { order: { field: 'created_at', dir: 'desc' } }),
      KX.repo.mapBy('suppliers'), KX.repo.mapBy('transport_companies')
    ]);
    const commissions = await KX.repo.list('commissions', {});
    const name = (r) => r.party_type === 'supplier'
      ? (suppliers[r.party_id] || {}).name : (carriers[r.party_id] || {}).name;
    const s = await KX.settlements.summary();
    const revenue = U().round(U().sum(commissions, (c) => +c.total_revenue), 3);

    L().renderApp(
      '<div class="grid grid-3 mb">' +
        KX.ui.kpi({ label: 'إيراد المنصة المعترف به', value: U().fmtOMR(revenue), accent: true }) +
        KX.ui.kpi({ label: 'مستحقات الموردين', value: U().fmtOMR(s.pending_supplier) }) +
        KX.ui.kpi({ label: 'مستحقات الناقلين', value: U().fmtOMR(s.pending_transporter) }) +
      '</div>' +
      KX.ui.card('التسويات', KX.ui.table([
        { key: 'order_no', label: 'الطلب' },
        { key: 'party_type', label: 'الطرف', render: (r) => KX.ui.badge(
            r.party_type === 'supplier' ? 'مورد' : 'ناقل', r.party_type === 'supplier' ? 'info' : 'orange') },
        { key: 'n', label: 'الاسم', render: (r) => e(name(r) || '—') },
        { key: 'gross_amount', label: 'الإجمالي', num: true, render: (r) => U().fmtOMR(r.gross_amount) },
        { key: 'commission', label: 'عمولة المنصة', num: true, render: (r) => U().fmtOMR(r.commission) },
        { key: 'net_payable', label: 'الصافي المستحق', num: true, render: (r) => '<b>' + U().fmtOMR(r.net_payable) + '</b>' },
        { key: 'due_date', label: 'تاريخ الاستحقاق', render: (r) => U().fmtDate(r.due_date) },
        { key: 'status', label: 'الحالة', render: (r) => KX.ui.badge(r.status === 'paid' ? 'مسددة' : 'معلّقة',
            r.status === 'paid' ? 'ok' : 'warn') },
        { key: 'a', label: '', render: (r) => r.status === 'pending'
            ? '<button class="btn btn--sm btn--ok" data-pay="' + r.id + '">تسديد</button>' : '' }
      ], rows, { compact: true, emptyText: 'لا توجد تسويات بعد' }),
        '<button class="btn btn--ghost btn--sm" id="csv">⬇️ تصدير</button>'),
      { title: 'العمولات والتسويات', counts: await counts() });

    U().on(document, 'click', '[data-pay]', async function (ev, el) {
      const ok = await U().confirmDialog({ title: 'تسديد المستحق', message: 'تأكيد صرف المستحق لهذا الطرف؟' });
      if (!ok) return;
      await KX.settlements.markPaid(el.dataset.pay, 'MANUAL-' + Date.now());
      U().toast('سُجّل التسديد', 'success'); KX.router.resolve();
    });
    document.getElementById('csv').onclick = function () {
      U().download('settlements.csv', U().toCSV(rows.map((r) => ({
        الطلب: r.order_no, الطرف: r.party_type, الاسم: name(r), الإجمالي: r.gross_amount,
        العمولة: r.commission, الصافي: r.net_payable, الحالة: r.status
      }))), 'text/csv');
    };
  }

  /* ---------------- الشكاوى ---------------- */
  async function complaints() {
    const rows = await KX.repo.list('complaints', { order: { field: 'created_at', dir: 'desc' } });
    L().renderApp(KX.ui.table([
      { key: 'created_at', label: 'التاريخ', render: (r) => U().fmtDateTime(r.created_at) },
      { key: 'name', label: 'المُبلِّغ', render: (r) => e(r.name || '—') + '<br><small class="mono">' +
          e(U().fmtPhone(r.phone || '')) + '</small>' },
      { key: 'subject', label: 'النوع' },
      { key: 'message', label: 'التفاصيل' },
      { key: 'status', label: 'الحالة', render: (r) => KX.ui.badge(
          r.status === 'open' ? 'مفتوحة' : 'مغلقة', r.status === 'open' ? 'warn' : 'ok') },
      { key: 'a', label: '', render: (r) => r.status === 'open'
          ? '<button class="btn btn--sm btn--ok" data-resolve="' + r.id + '">معالجة وإغلاق</button>' : e(r.resolution || '') }
    ], rows, { emptyText: 'لا توجد شكاوى' }), { title: 'الشكاوى', counts: await counts() });

    U().on(document, 'click', '[data-resolve]', async function (ev, el) {
      const r = await U().confirmDialog({ title: 'إغلاق الشكوى', reasonRequired: true,
        message: 'اكتب الإجراء المتخذ — سيظهر للعميل.' });
      if (!r) return;
      await KX.repo.update('complaints', el.dataset.resolve, { status: 'resolved', resolution: r, resolved_at: U().nowISO() });
      await KX.audit.log('complaint.resolve', 'complaints', el.dataset.resolve, { resolution: r });
      U().toast('أُغلقت الشكوى', 'success'); KX.router.resolve();
    });
  }

  /* ---------------- الإشعارات ---------------- */
  async function notifications() {
    const sent = await KX.repo.list('notifications', { order: { field: 'sent_at', dir: 'desc' }, limit: 50 });
    L().renderApp(
      KX.ui.card('إرسال إشعار جماعي',
        '<form id="n-form">' +
        KX.ui.field({ name: 'role', label: 'الفئة المستهدفة', type: 'select', placeholder: 'كل المستخدمين',
          options: Object.keys(KX.schema.ROLES).map((k) => ({ value: k, label: KX.schema.ROLES[k] })) }) +
        KX.ui.field({ name: 'title', label: 'العنوان', required: true }) +
        KX.ui.field({ name: 'body', label: 'النص', type: 'textarea', rows: 3, required: true }) +
        KX.ui.alert('القنوات الخارجية (SMS، واتساب، البريد، Push) مهيّأة في الكود ومعطّلة حتى ربط مزوّد فعلي.', 'info', '📡') +
        '<button class="btn btn--primary" type="submit">إرسال</button></form>') +
      '<div class="mt">' + KX.ui.card('آخر الإشعارات المرسلة', KX.ui.table([
        { key: 'sent_at', label: 'التاريخ', render: (n) => U().fmtDateTime(n.sent_at) },
        { key: 'title', label: 'العنوان' },
        { key: 'body', label: 'النص' },
        { key: 'read', label: 'مقروء', render: (n) => n.read ? '✅' : '—' }
      ], sent, { compact: true })) + '</div>',
      { title: 'الإشعارات', counts: await counts() });

    document.getElementById('n-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const v = KX.ui.formValues(ev.target);
      if (!v.title || !v.body) { U().toast('أكمل العنوان والنص', 'error'); return; }
      const n = await KX.notify.broadcast(v.role || null, v.title, v.body);
      U().toast('أُرسل الإشعار إلى ' + n + ' مستخدم', 'success'); KX.router.resolve();
    };
  }

  /* ---------------- سجل التدقيق ---------------- */
  async function audit(ctx) {
    const q = ((ctx.query || {}).q || '').trim();
    let rows = await KX.repo.list('audit_logs', { order: { field: 'at', dir: 'desc' }, limit: 400 });
    if (q) rows = rows.filter((r) => (r.action + ' ' + r.entity + ' ' + (r.actor_name || ''))
      .toLowerCase().indexOf(q.toLowerCase()) !== -1);
    L().renderApp(
      '<div class="filter-bar"><input class="input" id="q" placeholder="بحث في السجل" value="' + e(q) + '">' +
      '<button class="btn btn--ghost btn--sm" id="csv">⬇️ تصدير</button>' +
      '<span class="muted">' + rows.length + ' عملية</span></div>' +
      KX.ui.alert('سجل التدقيق للقراءة فقط ولا يُحذف — يوثّق كل عملية حسّاسة ومن نفّذها.', 'info', '🛡️') +
      KX.ui.table([
        { key: 'at', label: 'الوقت', render: (r) => U().fmtDateTime(r.at) },
        { key: 'actor_name', label: 'المنفّذ', render: (r) => e(r.actor_name) + '<br><small class="muted">' +
            e(KX.schema.ROLES[r.actor_role] || r.actor_role) + '</small>' },
        { key: 'action', label: 'العملية', render: (r) => '<code>' + e(r.action) + '</code>' },
        { key: 'entity', label: 'الجدول' },
        { key: 'details', label: 'التفاصيل', render: (r) => '<small class="mono">' +
            e(JSON.stringify(r.details || {}).slice(0, 120)) + '</small>' }
      ], rows, { compact: true, emptyText: 'لا توجد عمليات مسجّلة' }),
      { title: 'سجل التدقيق', counts: await counts() });

    document.getElementById('q').onkeydown = function (ev) {
      if (ev.key === 'Enter') location.hash = '/admin/audit?q=' + encodeURIComponent(this.value);
    };
    document.getElementById('csv').onclick = function () {
      U().download('audit-log.csv', U().toCSV(rows.map((r) => ({
        الوقت: r.at, المنفذ: r.actor_name, الدور: r.actor_role, العملية: r.action,
        الجدول: r.entity, المعرف: r.entity_id, التفاصيل: JSON.stringify(r.details)
      }))), 'text/csv');
    };
  }

  /* ---------------- التقارير ---------------- */
  async function reports(ctx) {
    const days = Number((ctx.query || {}).days) || 90;
    const m = await KX.analytics.overview(days);
    const inPeriod = m.orders.filter((o) => o.created_at >= m.from);
    const [mats, zones, sup, car] = await Promise.all([
      KX.analytics.byMaterial(inPeriod), KX.analytics.byZone(inPeriod),
      KX.analytics.supplierPerformance(inPeriod), KX.analytics.carrierPerformance(inPeriod)
    ]);
    const statuses = KX.analytics.statusSplit(inPeriod);

    L().renderApp(
      '<div class="filter-bar">' + [30, 90, 180, 365].map((d) =>
        '<a href="#/admin/reports?days=' + d + '" class="btn btn--sm ' +
        (days === d ? 'btn--navy' : 'btn--ghost') + '">' + d + ' يوم</a>').join('') +
      '<button class="btn btn--ghost btn--sm" id="print">🖨️ طباعة التقرير</button></div>' +
      '<div class="grid grid-2">' +
        KX.ui.card('المبيعات حسب المادة', KX.ui.table([
          { key: 'label', label: 'المادة' },
          { key: 'value', label: 'الكمية (م³)', num: true, render: (r) => U().fmtNum(r.value, 1) }
        ], mats, { compact: true })) +
        KX.ui.card('الطلبات حسب المنطقة', KX.ui.table([
          { key: 'label', label: 'المنطقة' },
          { key: 'value', label: 'عدد الطلبات', num: true }
        ], zones, { compact: true })) +
      '</div>' +
      '<div class="mt">' + KX.ui.card('توزيع الطلبات على الحالات', KX.ui.table([
        { key: 'label', label: 'الحالة' },
        { key: 'value', label: 'العدد', num: true },
        { key: 'p', label: 'النسبة', num: true, render: (r) =>
            ((r.value / (inPeriod.length || 1)) * 100).toFixed(1) + '%' }
      ], statuses, { compact: true })) + '</div>' +
      '<div class="grid grid-2 mt">' +
        KX.ui.card('تقرير الموردين', KX.ui.table([
          { key: 'name', label: 'المورد' }, { key: 'orders', label: 'طلبات', num: true },
          { key: 'quantity', label: 'الكمية (م³)', num: true, render: (r) => U().fmtNum(r.quantity, 1) },
          { key: 'value', label: 'قيمة المواد', num: true, render: (r) => U().fmtOMR(r.value) },
          { key: 'cancelled', label: 'ملغاة', num: true }
        ], sup, { compact: true }), '<button class="btn btn--ghost btn--sm" id="csv-sup">⬇️</button>') +
        KX.ui.card('تقرير الناقلين', KX.ui.table([
          { key: 'name', label: 'الناقل' }, { key: 'trips', label: 'رحلات', num: true },
          { key: 'delivered_trips', label: 'منجزة', num: true },
          { key: 'value', label: 'قيمة النقل', num: true, render: (r) => U().fmtOMR(r.value) }
        ], car, { compact: true }), '<button class="btn btn--ghost btn--sm" id="csv-car">⬇️</button>') +
      '</div>',
      { title: 'التقارير', subtitle: 'آخر ' + days + ' يومًا', counts: await counts() });

    document.getElementById('print').onclick = () => window.print();
    document.getElementById('csv-sup').onclick = () =>
      U().download('suppliers-report.csv', U().toCSV(sup), 'text/csv');
    document.getElementById('csv-car').onclick = () =>
      U().download('carriers-report.csv', U().toCSV(car), 'text/csv');
  }

  return { dashboard, orders, orderDetail, payments, settlements,
           complaints, notifications, audit, reports, counts, row };
})();

</script>
<!-- src/ui/views/admin-config.js -->
<script>
/* لوحة الإدارة — إعداد المواد والأسعار والمناطق والمستخدمين والإعدادات المالية */
window.KX = window.KX || {};
KX.viewsAdminConfig = (function () {
  const e = (s) => KX.util.esc(s);
  const U = () => KX.util;
  const L = () => KX.layout;
  const counts = () => KX.viewsAdmin.counts();

  /* ---------------- المواد والأسعار ---------------- */
  async function materials() {
    const [mats, cats, sups, prices] = await Promise.all([
      KX.repo.list('materials', {}), KX.repo.list('material_categories', {}),
      KX.repo.list('suppliers', {}), KX.repo.list('supplier_prices', {})
    ]);
    const catName = {}; cats.forEach((c) => { catName[c.id] = c.name; });
    const supName = {}; sups.forEach((s) => { supName[s.id] = s.name; });
    const matName = {}; mats.forEach((m) => { matName[m.id] = m.name; });

    L().renderApp(
      KX.ui.alert('لا تُحذف الأسعار المرتبطة بطلبات سابقة — يُوقَف السعر فقط ويبقى في سجل الأسعار. ' +
        'كل طلب يحتفظ بلقطة سعره وقت الإنشاء.', 'info', '🔒') +
      '<div class="grid grid-2">' +
        KX.ui.card('إضافة مادة', '<form id="m-form">' +
          KX.ui.field({ name: 'name', label: 'اسم المادة', required: true }) +
          '<div class="field-row">' +
            KX.ui.field({ name: 'code', label: 'الرمز', required: true, placeholder: 'AGG20' }) +
            KX.ui.field({ name: 'category_id', label: 'الفئة', type: 'select', required: true,
              placeholder: 'اختر', options: cats.map((c) => ({ value: c.id, label: c.name })) }) +
          '</div>' +
          KX.ui.field({ name: 'description', label: 'الوصف' }) +
          '<div class="field-row">' +
            KX.ui.field({ name: 'unit', label: 'وحدة القياس', type: 'select',
              options: Object.keys(KX.schema.UNITS).map((k) => ({ value: k, label: KX.schema.UNITS[k] })) }) +
            KX.ui.field({ name: 'density', label: 'الكثافة (طن/م³)', type: 'number', step: '0.01', value: '1.6',
              hint: 'للتحويل التقريبي بين المتر المكعب والطن في التقارير' }) +
          '</div>' +
          '<button class="btn btn--primary" type="submit">إضافة المادة</button></form>') +
        KX.ui.card('إضافة سعر لمورد', '<form id="p-form">' +
          '<div class="field-row">' +
            KX.ui.field({ name: 'supplier_id', label: 'المورد', type: 'select', required: true,
              placeholder: 'اختر', options: sups.map((s) => ({ value: s.id, label: s.name })) }) +
            KX.ui.field({ name: 'material_id', label: 'المادة', type: 'select', required: true,
              placeholder: 'اختر', options: mats.map((m) => ({ value: m.id, label: m.name })) }) +
          '</div>' +
          '<div class="field-row">' +
            KX.ui.field({ name: 'price_per_unit', label: 'سعر الوحدة (ر.ع. / م³)', type: 'number', step: '0.001', required: true }) +
            KX.ui.field({ name: 'available_per_day', label: 'المتاح يوميًا (م³)', type: 'number', value: '300' }) +
          '</div>' +
          '<div class="field-row">' +
            KX.ui.field({ name: 'min_qty', label: 'الحد الأدنى (م³)', type: 'number', value: '12' }) +
            KX.ui.field({ name: 'max_qty', label: 'الحد الأقصى (م³)', type: 'number', value: '600' }) +
          '</div>' +
          '<div class="field-row">' +
            KX.ui.field({ name: 'valid_from', label: 'ساري من', type: 'date' }) +
            KX.ui.field({ name: 'valid_to', label: 'ساري حتى (اختياري)', type: 'date' }) +
          '</div>' +
          '<button class="btn btn--primary" type="submit">حفظ السعر</button></form>') +
      '</div>' +
      '<div class="mt">' + KX.ui.card('قائمة الأسعار السارية', KX.ui.table([
        { key: 's', label: 'المورد', render: (p) => e(supName[p.supplier_id] || '—') },
        { key: 'm', label: 'المادة', render: (p) => e(matName[p.material_id] || '—') },
        { key: 'price_per_unit', label: 'سعر الم³', num: true, render: (p) => '<b>' + U().money(p.price_per_unit) + '</b>' },
        { key: 'tiers', label: 'شرائح الكمية', render: (p) => (p.tiers || []).length
            ? (p.tiers || []).map((t) => '≥' + t.min_qty + ' م³: ' + U().money(t.price_per_unit)).join('<br>')
            : '<span class="muted">—</span>' },
        { key: 'min_qty', label: 'أدنى/أقصى', num: true, render: (p) => p.min_qty + ' / ' + p.max_qty },
        { key: 'available_per_day', label: 'متاح يوميًا', num: true },
        { key: 'c', label: 'عميل خاص', render: (p) => p.customer_id ? KX.ui.badge('سعر تعاقدي', 'orange') : '—' },
        { key: 'valid_from', label: 'من', render: (p) => U().fmtDate(p.valid_from) },
        { key: 'is_active', label: 'الحالة', render: (p) => KX.ui.badge(p.is_active ? 'ساري' : 'موقوف', p.is_active ? 'ok' : 'muted') },
        { key: 'a', label: '', render: (p) => '<button class="btn btn--sm btn--ghost" data-edit-price="' + p.id + '">تعديل</button> ' +
            '<button class="btn btn--sm btn--ghost" data-toggle-price="' + p.id + '">' + (p.is_active ? 'إيقاف' : 'تفعيل') + '</button>' }
      ], prices, { compact: true }),
        '<button class="btn btn--ghost btn--sm" id="exp">⬇️ تصدير CSV</button>' +
        '<button class="btn btn--ghost btn--sm" id="imp">⬆️ استيراد CSV</button>' +
        '<a href="#/admin/price-history" class="btn btn--ghost btn--sm">سجل التغييرات</a>') + '</div>' +
      '<div class="mt">' + KX.ui.card('المواد', KX.ui.table([
        { key: 'code', label: 'الرمز' }, { key: 'name', label: 'المادة' },
        { key: 'c', label: 'الفئة', render: (m) => e(catName[m.category_id] || '—') },
        { key: 'description', label: 'الوصف' },
        { key: 'unit', label: 'الوحدة', render: (m) => KX.schema.UNITS[m.unit] || m.unit },
        { key: 'is_active', label: 'الحالة', render: (m) => KX.ui.badge(m.is_active ? 'مفعّلة' : 'موقوفة', m.is_active ? 'ok' : 'muted') },
        { key: 'a', label: '', render: (m) => '<button class="btn btn--sm btn--ghost" data-toggle-mat="' + m.id + '">' +
            (m.is_active ? 'إيقاف' : 'تفعيل') + '</button>' }
      ], mats, { compact: true })) + '</div>' +
      '<input type="file" id="file" accept=".csv" style="display:none">',
      { title: 'المواد والأسعار', counts: await counts() });

    document.getElementById('m-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const v = KX.ui.formValues(ev.target);
      if (!v.name || !v.code || !v.category_id) { U().toast('أكمل الحقول المطلوبة', 'error'); return; }
      await KX.repo.insert('materials', Object.assign(v, { density: Number(v.density), is_active: true }));
      await KX.audit.log('material.create', 'materials', null, { code: v.code });
      U().toast('أُضيفت المادة', 'success'); KX.router.resolve();
    };

    document.getElementById('p-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const v = KX.ui.formValues(ev.target);
      const errs = U().validate(v, {
        supplier_id: { required: true }, material_id: { required: true },
        price_per_unit: { required: true, type: 'number', min: 0.001 }
      });
      if (Object.keys(errs).length) { U().toast(Object.values(errs)[0], 'error'); return; }
      await savePrice(null, v);
      U().toast('حُفظ السعر', 'success'); KX.router.resolve();
    };

    U().on(document, 'click', '[data-toggle-price]', async function (ev, el) {
      const p = prices.find((x) => x.id === el.dataset.togglePrice);
      await KX.repo.update('supplier_prices', p.id, { is_active: !p.is_active });
      await logPriceChange(p, { is_active: !p.is_active }, 'toggle');
      U().toast('حُدّثت الحالة'); KX.router.resolve();
    });
    U().on(document, 'click', '[data-toggle-mat]', async function (ev, el) {
      const m = mats.find((x) => x.id === el.dataset.toggleMat);
      await KX.repo.update('materials', m.id, { is_active: !m.is_active });
      await KX.audit.log('material.toggle', 'materials', m.id, { is_active: !m.is_active });
      KX.router.resolve();
    });
    U().on(document, 'click', '[data-edit-price]', function (ev, el) {
      editPriceDialog(prices.find((x) => x.id === el.dataset.editPrice), matName, supName);
    });

    document.getElementById('exp').onclick = function () {
      U().download('prices.csv', U().toCSV(prices.map((p) => ({
        supplier: supName[p.supplier_id], material: matName[p.material_id],
        price_per_unit: p.price_per_unit, min_qty: p.min_qty, max_qty: p.max_qty,
        available_per_day: p.available_per_day, valid_from: p.valid_from, is_active: p.is_active
      }))), 'text/csv');
    };
    document.getElementById('imp').onclick = () => document.getElementById('file').click();
    document.getElementById('file').onchange = async function (ev) {
      const f = ev.target.files[0]; if (!f) return;
      const text = await f.text();
      const rows = U().parseCSV(text);
      let ok = 0, fail = 0;
      for (const r of rows) {
        const sup = sups.find((s) => s.name === r.supplier);
        const mat = mats.find((m) => m.name === r.material || m.code === r.material);
        if (!sup || !mat || !Number(r.price_per_unit)) { fail++; continue; }
        await savePrice(null, {
          supplier_id: sup.id, material_id: mat.id, price_per_unit: r.price_per_unit,
          min_qty: r.min_qty, max_qty: r.max_qty,
          available_per_day: r.available_per_day, valid_from: r.valid_from
        });
        ok++;
      }
      U().toast('استُورد ' + ok + ' سعر' + (fail ? ' — تعذّر ' + fail + ' صف' : ''), fail ? 'error' : 'success');
      KX.router.resolve();
    };
  }

  /* حفظ سعر جديد + تسجيله في سجل الأسعار */
  async function savePrice(id, v) {
    const payload = {
      supplier_id: v.supplier_id, material_id: v.material_id,
      price_per_unit: Number(v.price_per_unit), currency: 'OMR',
      min_qty: Number(v.min_qty || 0), max_qty: Number(v.max_qty || 0),
      available_per_day: Number(v.available_per_day || 0),
      tiers: v.tiers || [],
      valid_from: v.valid_from ? new Date(v.valid_from).toISOString() : U().nowISO(),
      valid_to: v.valid_to ? new Date(v.valid_to).toISOString() : null,
      customer_id: v.customer_id || null, is_active: true
    };
    const before = id ? await KX.repo.get('supplier_prices', id) : null;
    const row = id ? await KX.repo.update('supplier_prices', id, payload)
                   : await KX.repo.insert('supplier_prices', payload);
    await logPriceChange(before, row, id ? 'update' : 'create');
    return row;
  }
  async function logPriceChange(before, after, action) {
    await KX.repo.insert('price_history', {
      price_id: (after && after.id) || (before && before.id),
      supplier_id: (after || before).supplier_id, material_id: (after || before).material_id,
      old_price: before ? before.price_per_unit : null,
      new_price: after ? after.price_per_unit : null,
      action: action, changed_by: (KX.store.get('session') || {}).user_id,
      changed_by_name: (KX.store.get('session') || {}).name, at: U().nowISO()
    });
    await KX.audit.log('price.' + action, 'supplier_prices', (after || before).id,
      { from: before ? before.price_per_unit : null, to: after ? after.price_per_unit : null });
  }

      await KX.repo.setSetting('finance', Object.assign({}, fin, next));
      await KX.audit.log('settings.finance', 'settings', null, KX.audit.diff(fin, next));
      U().toast('حُفظت الإعدادات — تُطبَّق على الطلبات الجديدة فقط', 'success');
    };
    document.getElementById('co-form').onsubmit = async function (ev) {
      ev.preventDefault();
      await KX.repo.setSetting('company', KX.ui.formValues(ev.target));
      await KX.audit.log('settings.company', 'settings', null, {});
      U().toast('حُفظت بيانات المنشأة', 'success');
    };
    document.getElementById('backup').onclick = async function () {
      const dump = {};
      for (const t of Object.keys(KX.schema.TABLES)) dump[t] = await KX.repo.list(t, { includeDeleted: true });
      U().download('kassara-backup-' + new Date().toISOString().slice(0, 10) + '.json',
        JSON.stringify(dump, null, 2), 'application/json');
      await KX.audit.log('backup.export', 'settings', null, {});
    };
    document.getElementById('restore').onclick = () => document.getElementById('rfile').click();
    document.getElementById('rfile').onchange = async function (ev) {
      const f = ev.target.files[0]; if (!f) return;
      const ok = await U().confirmDialog({ title: 'استعادة نسخة', danger: true,
        message: 'ستُستبدل كل البيانات الحالية بمحتوى الملف.' });
      if (!ok) return;
      const data = JSON.parse(await f.text());
      KX.repo.reset();
      for (const t of Object.keys(data)) if (KX.schema.TABLES[t]) KX.driverLocal.write(t, data[t]);
      U().toast('استُعيدت النسخة', 'success'); location.reload();
    };
    document.getElementById('reset').onclick = async function () {
      const ok = await U().confirmDialog({ title: 'إعادة التهيئة', danger: true,
        confirmText: 'نعم، أعد التهيئة', message: 'ستُحذف كل البيانات المحلية وتُستبدل بالبيانات التجريبية.' });
      if (!ok) return;
      await KX.seed.run(true);
      KX.auth.logout(); U().toast('أُعيدت التهيئة'); location.hash = '/'; location.reload();
    };
  }

  /* ---------------- إدارة المستخدمين ---------------- */
  async function customers() {
    const [rows, orders] = await Promise.all([
      KX.repo.list('customer_profiles', {}), KX.repo.list('orders', {})
    ]);
    const users = await KX.repo.mapBy('users');
    L().renderApp(KX.ui.table([
      { key: 'name', label: 'العميل', render: (c) => '<b>' + e(c.name) + '</b>' +
          (c.company_name ? '<br><small class="muted">' + e(c.company_name) + '</small>' : '') },
      { key: 'phone', label: 'الهاتف', render: (c) => '<span class="mono">' + e(U().fmtPhone(c.phone)) + '</span>' },
      { key: 'customer_type', label: 'النوع', render: (c) => KX.ui.badge(KX.schema.CUSTOMER_TYPES[c.customer_type]) },
      { key: 'o', label: 'الطلبات', num: true, render: (c) => orders.filter((o) => o.customer_id === c.id).length },
      { key: 'total_spent', label: 'إجمالي المصروف', num: true, render: (c) => U().fmtOMR(c.total_spent || 0) },
      { key: 'credit', label: 'الشراء الآجل', render: (c) => c.credit_approved
          ? KX.ui.badge(U().fmtOMR(c.credit_used) + ' / ' + U().fmtOMR(c.credit_limit), 'ok')
          : '<span class="muted">غير معتمد</span>' },
      { key: 'st', label: 'الحساب', render: (c) => KX.ui.badge(
          (users[c.user_id] || {}).account_status === 'active' ? 'مفعّل' : 'موقوف',
          (users[c.user_id] || {}).account_status === 'active' ? 'ok' : 'danger') },
      { key: 'a', label: '', render: (c) => '<button class="btn btn--sm btn--ghost" data-credit="' + c.id + '">حد ائتماني</button> ' +
          '<button class="btn btn--sm btn--ghost" data-suspend="' + c.user_id + '">إيقاف/تفعيل</button>' }
    ], rows, { compact: true }), { title: 'العملاء', counts: await counts() });

    U().on(document, 'click', '[data-credit]', function (ev, el) {
      const c = rows.find((x) => x.id === el.dataset.credit);
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = '<div class="modal"><h3>الحد الائتماني — ' + e(c.name) + '</h3>' +
        KX.ui.field({ name: 'credit_approved', label: 'الشراء الآجل', type: 'select', value: String(!!c.credit_approved),
          options: [{ value: 'false', label: 'غير معتمد' }, { value: 'true', label: 'معتمد' }] }) +
        KX.ui.field({ name: 'credit_limit', label: 'الحد الائتماني (ر.ع.)', type: 'number', step: '0.001', value: c.credit_limit || 0 }) +
        '<div class="modal__actions"><button class="btn btn--ghost" data-no>إلغاء</button>' +
        '<button class="btn btn--primary" data-yes>حفظ</button></div></div>';
      document.body.appendChild(wrap);
      wrap.querySelector('[data-no]').onclick = () => wrap.remove();
      wrap.querySelector('[data-yes]').onclick = async function () {
        const v = KX.ui.formValues(wrap);
        await KX.repo.update('customer_profiles', c.id, {
          credit_approved: v.credit_approved === 'true', credit_limit: Number(v.credit_limit)
        });
        await KX.audit.log('customer.credit', 'customer_profiles', c.id, v);
        wrap.remove(); U().toast('حُدّث الحد الائتماني', 'success'); KX.router.resolve();
      };
    });
    U().on(document, 'click', '[data-suspend]', async function (ev, el) {
      const u = users[el.dataset.suspend];
      const next = u.account_status === 'active' ? 'suspended' : 'active';
      const ok = await U().confirmDialog({ title: next === 'suspended' ? 'إيقاف الحساب' : 'تفعيل الحساب',
        danger: next === 'suspended', message: 'المستخدم: ' + u.name });
      if (!ok) return;
      await KX.repo.update('users', u.id, { account_status: next });
      await KX.audit.log('user.status', 'users', u.id, { to: next });
      U().toast('حُدّث الحساب'); KX.router.resolve();
    });
  }

  async function suppliersAdmin() {
    const [rows, prices, orders] = await Promise.all([
      KX.repo.list('suppliers', {}), KX.repo.list('supplier_prices', {}), KX.repo.list('orders', {})
    ]);
    L().renderApp(KX.ui.table([
      { key: 'name', label: 'المورد', render: (s) => '<b>' + e(s.name) + '</b><br><small class="muted">' + e(s.address || '') + '</small>' },
      { key: 'wilayat', label: 'الولاية' },
      { key: 'phone', label: 'الهاتف', render: (s) => '<span class="mono">' + e(U().fmtPhone(s.phone)) + '</span>' },
      { key: 'p', label: 'أسعار مسجّلة', num: true, render: (s) => prices.filter((p) => p.supplier_id === s.id).length },
      { key: 'o', label: 'الطلبات', num: true, render: (s) => orders.filter((o) => o.supplier_id === s.id).length },
      { key: 'loading_capacity_per_day', label: 'طاقة التحميل/يوم', num: true },
      { key: 'rating', label: 'التقييم', num: true, render: (s) => '⭐ ' + s.rating },
      { key: 'is_approved', label: 'الاعتماد', render: (s) => KX.ui.badge(s.is_approved ? 'معتمد' : 'بانتظار الاعتماد', s.is_approved ? 'ok' : 'warn') },
      { key: 'a', label: '', render: (s) => '<button class="btn btn--sm btn--ghost" data-approve-sup="' + s.id + '">' +
          (s.is_approved ? 'سحب الاعتماد' : 'اعتماد') + '</button>' }
    ], rows, { compact: true }), { title: 'الموردون', counts: await counts() });

    U().on(document, 'click', '[data-approve-sup]', async function (ev, el) {
      const s = rows.find((x) => x.id === el.dataset.approveSup);
      await KX.repo.update('suppliers', s.id, { is_approved: !s.is_approved });
      await KX.audit.log('supplier.approve', 'suppliers', s.id, { to: !s.is_approved });
      U().toast('حُدّث الاعتماد'); KX.router.resolve();
    });
  }

  async function transportersAdmin() {
    const [rows, trucks, drivers, trips] = await Promise.all([
      KX.repo.list('transport_companies', {}), KX.repo.list('trucks', {}),
      KX.repo.list('drivers', {}), KX.repo.list('trips', {})
    ]);
    L().renderApp(
      KX.ui.card('شركات النقل', KX.ui.table([
        { key: 'name', label: 'الشركة', render: (c) => '<b>' + e(c.name) + '</b>' },
        { key: 'phone', label: 'الهاتف', render: (c) => '<span class="mono">' + e(U().fmtPhone(c.phone)) + '</span>' },
        { key: 't', label: 'الشاحنات', num: true, render: (c) => trucks.filter((t) => t.transporter_id === c.id).length },
        { key: 'd', label: 'السائقون', num: true, render: (c) => drivers.filter((d) => d.transporter_id === c.id).length },
        { key: 'tr', label: 'الرحلات', num: true, render: (c) => trips.filter((t) => t.transporter_id === c.id).length },
        { key: 'rating', label: 'التقييم', num: true, render: (c) => '⭐ ' + c.rating },
        { key: 'is_approved', label: 'الاعتماد', render: (c) => KX.ui.badge(c.is_approved ? 'معتمد' : 'بانتظار', c.is_approved ? 'ok' : 'warn') },
        { key: 'a', label: '', render: (c) => '<button class="btn btn--sm btn--ghost" data-approve-car="' + c.id + '">' +
            (c.is_approved ? 'سحب الاعتماد' : 'اعتماد') + '</button>' }
      ], rows, { compact: true })) +
      '<div class="mt">' + KX.ui.card('الشاحنات', KX.ui.table([
        { key: 'plate_no', label: 'اللوحة', render: (t) => '<b class="mono">' + e(t.plate_no) + '</b>' },
        { key: 'c', label: 'الشركة', render: (t) => e((rows.find((r) => r.id === t.transporter_id) || {}).name || '—') },
        { key: 'make', label: 'الطراز' }, { key: 'year', label: 'السنة', num: true },
        { key: 'capacity_m3', label: 'الحمولة', num: true,
          render: (t) => t.capacity_m3 + ' م³ (' + t.capacity_tons + ' طن)' },
        { key: 'is_available', label: 'التوفّر', render: (t) => KX.ui.badge(t.is_available ? 'متاحة' : 'غير متاحة', t.is_available ? 'ok' : 'muted') }
      ], trucks, { compact: true })) + '</div>' +
      '<div class="mt">' + KX.ui.card('السائقون', KX.ui.table([
        { key: 'name', label: 'السائق' },
        { key: 'phone', label: 'الهاتف', render: (d) => '<span class="mono">' + e(U().fmtPhone(d.phone)) + '</span>' },
        { key: 'c', label: 'الشركة', render: (d) => e((rows.find((r) => r.id === d.transporter_id) || {}).name || '—') },
        { key: 'license_no', label: 'رقم الرخصة' },
        { key: 'license_expiry', label: 'انتهاء الرخصة', render: (d) => {
            const exp = new Date(d.license_expiry) < new Date();
            return (exp ? '<b style="color:var(--danger-600)">' : '') + U().fmtDate(d.license_expiry) + (exp ? ' ⚠️</b>' : ''); } },
        { key: 'tr', label: 'الرحلات', num: true, render: (d) => trips.filter((t) => t.driver_id === d.id).length }
      ], drivers, { compact: true })) + '</div>',
      { title: 'الناقلون والأسطول', counts: await counts() });

    U().on(document, 'click', '[data-approve-car]', async function (ev, el) {
      const c = rows.find((x) => x.id === el.dataset.approveCar);
      await KX.repo.update('transport_companies', c.id, { is_approved: !c.is_approved });
      await KX.audit.log('transporter.approve', 'transport_companies', c.id, { to: !c.is_approved });
      U().toast('حُدّث الاعتماد'); KX.router.resolve();
    });
  }

  return { materials, priceHistory, zones, coupons, settings,
           customers, suppliersAdmin, transportersAdmin };
})();

</script>
<!-- src/ui/views/partners.js -->
<script>
/* شاشات المورد وشركة النقل والسائق + صفحة الإشعارات المشتركة */
window.KX = window.KX || {};
KX.viewsPartners = (function () {
  const e = (s) => KX.util.esc(s);
  const U = () => KX.util;
  const L = () => KX.layout;
  const S = () => KX.auth.session();
  const row = (k, v) => '<div class="row row--between" style="padding:6px 0;border-bottom:1px solid var(--border)">' +
    '<span class="muted">' + e(k) + '</span><b style="text-align:end">' + e(v) + '</b></div>';

  /* ==================== المورد ==================== */
  async function supplierDashboard() {
    const sid = S().supplier_id;
    const orders = await KX.orders.forSupplier(sid);
    const settles = await KX.settlements.forParty('supplier', sid);
    const pending = orders.filter((o) => o.status === 'awaiting_supplier');
    const loading = orders.filter((o) => ['paid', 'preparing', 'loading'].indexOf(o.status) !== -1);
    const delivered = orders.filter((o) => o.status === 'delivered');
    const due = U().round(U().sum(settles.filter((s) => s.status === 'pending'), (s) => +s.net_payable), 3);

    L().renderApp(
      (pending.length ? KX.ui.alert('لديك ' + pending.length + ' طلب بانتظار تأكيد توفّر المادة. ' +
        '<a href="#/supplier/orders"><b>راجعها الآن</b></a>', 'warn', '⏳') : '') +
      '<div class="grid grid-4">' +
        KX.ui.kpi({ label: 'بانتظار تأكيدك', value: pending.length, accent: true }) +
        KX.ui.kpi({ label: 'أوامر تحميل نشطة', value: loading.length }) +
        KX.ui.kpi({ label: 'الكمية المباعة', value: U().fmtNum(U().sum(delivered, (o) => +o.quantity), 1) + ' ' + U().unitLabel(KX.config.defaultUnit) }) +
        KX.ui.kpi({ label: 'مستحقاتي', value: U().fmtOMR(due), sub: 'غير مسددة' }) +
      '</div>' +
      '<div class="mt">' + KX.ui.card('أحدث الطلبات', ordersTable(orders.slice(0, 8), 'supplier')) + '</div>',
      { title: 'لوحة المورد', subtitle: (S().supplier || {}).name });
  }

  function ordersTable(rows, kind) {
    return KX.ui.table([
      { key: 'order_no', label: 'الطلب', render: (o) => '<a href="#/' + kind + '/orders/' + o.id + '"><b>' + e(o.order_no) + '</b></a>' },
      { key: 'm', label: 'المادة', render: (o) => e(((o.price_snapshot || {}).inputs || {}).material_name || '—') },
      { key: 'quantity', label: 'الكمية', num: true, render: (o) => U().fmtQty(o.quantity, o.unit) },
      { key: 'trips_planned', label: 'الرحلات', num: true },
      { key: 'scheduled_at', label: 'الموعد', render: (o) => U().fmtDateTime(o.scheduled_at) },
      { key: 'status', label: 'الحالة', render: (o) => KX.ui.statusBadge(o.status) }
    ], rows, { compact: true, emptyText: 'لا توجد طلبات' });
  }

  async function supplierOrders() {
    const orders = await KX.orders.forSupplier(S().supplier_id);
    L().renderApp(ordersTable(orders, 'supplier'), { title: 'طلبات التوريد' });
  }

  async function supplierOrderDetail(ctx) {
    const order = await KX.repo.get('orders', ctx.params.id);
    if (!order || order.supplier_id !== S().supplier_id) {
      L().renderApp(KX.ui.alert('الطلب غير متاح لك', 'danger'), { title: 'الطلب' }); return;
    }
    const [site, customer, trips, tickets] = await Promise.all([
      KX.repo.get('locations', order.site_id),
      KX.repo.get('customer_profiles', order.customer_id),
      KX.trips.forOrder(order.id),
      KX.repo.list('weight_tickets', { where: { order_id: order.id } })
    ]);
    const q = order.price_snapshot;
    const next = KX.orders.allowedTransitions(order.status, 'supplier');

    L().renderApp(
      KX.ui.steps(order.status) +
      '<div class="card mb"><div class="btn-group">' +
        next.map((t) => '<button class="btn btn--sm btn--navy" data-to="' + t.to + '">' + e(t.label) + '</button>').join('') +
        (['preparing', 'loading'].indexOf(order.status) !== -1
          ? '<button class="btn btn--sm btn--primary" id="ticket">⚖️ تسجيل تذكرة ميزان</button>' : '') +
      '</div></div>' +
      '<div class="grid grid-2"><div class="stack">' +
        KX.ui.card('أمر التوريد',
          row('رقم الطلب', order.order_no) +
          row('المادة', q ? q.inputs.material_name : '—') +
          row('الكمية المطلوبة', U().fmtQty(order.quantity, order.unit)) +
          row('عدد الرحلات', order.trips_planned + ' × ' + (q ? q.inputs.truck_name : '')) +
          row('موعد التحميل', U().fmtDateTime(order.scheduled_at)) +
          row('وجهة التوصيل', site ? site.label + ' — ' + (q ? q.inputs.zone_name : '') : '—') +
          row('العميل', (customer || {}).name || '—') +
          (order.notes ? row('ملاحظات', order.notes) : '')) +
        KX.ui.card('قيمتي من هذا الطلب',
          row('قيمة المواد', U().fmtOMR(order.material_cost)) +
          row('عمولة المنصة', U().fmtOMR(((q || {}).internal || {}).supplier_commission || 0)) +
          '<hr class="divider">' +
          row('صافي المستحق', U().fmtOMR(((q || {}).internal || {}).supplier_payable || 0))) +
      '</div><div class="stack">' +
        KX.ui.card('الرحلات', KX.ui.table([
          { key: 'seq', label: '#' },
          { key: 'status', label: 'الحالة', render: (t) => KX.ui.badge(KX.trips.TRIP_STATUS[t.status].label, KX.trips.TRIP_STATUS[t.status].tone) },
          { key: 'planned_qty', label: 'مخطط', num: true, render: (t) => U().fmtNum(t.planned_qty, 1) },
          { key: 'actual_qty', label: 'فعلي', num: true, render: (t) => t.actual_qty ? U().fmtNum(t.actual_qty, 1) : '—' }
        ], trips, { compact: true, emptyText: 'لم تُنشأ رحلات بعد' })) +
        KX.ui.card('تذاكر الميزان', KX.ui.table([
          { key: 'ticket_no', label: 'رقم التذكرة' },
          { key: 'gross_tons', label: 'القائم (طن)', num: true, render: (t) => t.gross_tons || '—' },
          { key: 'tare_tons', label: 'الفارغ (طن)', num: true, render: (t) => t.tare_tons || '—' },
          { key: 'net_qty', label: 'الكمية الفعلية', num: true,
            render: (t) => '<b>' + U().fmtQty(t.net_qty, t.unit) + '</b>' },
          { key: 'recorded_at', label: 'الوقت', render: (t) => U().fmtDateTime(t.recorded_at) }
        ], tickets, { compact: true, emptyText: 'لا توجد تذاكر' })) +
      '</div></div>',
      { title: order.order_no, subtitle: KX.orders.label(order.status) });

    U().on(document, 'click', '[data-to]', async function (ev, el) {
      const to = el.dataset.to;
      const res = await U().confirmDialog({ title: 'تحديث الطلب',
        reasonRequired: to === 'under_review',
        message: to === 'under_review' ? 'اذكر سبب طلب التعديل (نقص كمية، عدم توفّر، اختلاف مواصفة…)'
                                       : 'نقل الطلب إلى: ' + KX.orders.label(to) });
      if (!res) return;
      try {
        await KX.orders.transition(order.id, to, { role: 'supplier', note: typeof res === 'string' ? res : '' });
        U().toast('تم التحديث', 'success'); KX.router.resolve();
      } catch (err) { U().toast(err.message, 'error'); }
    });
    const tb = document.getElementById('ticket');
    if (tb) tb.onclick = function () {
      if (!trips.length) { U().toast('لا توجد رحلات لتسجيل تذكرة عليها', 'error'); return; }
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = '<div class="modal"><h3>تسجيل تذكرة ميزان</h3>' +
        KX.ui.field({ name: 'trip_id', label: 'الرحلة', type: 'select',
          options: trips.map((t) => ({ value: t.id, label: 'رحلة #' + t.seq + ' — ' + KX.trips.TRIP_STATUS[t.status].label })) }) +
        KX.ui.field({ name: 'ticket_no', label: 'رقم التذكرة / أمر التحميل', required: true }) +
        KX.ui.field({ name: 'net_qty', required: true, type: 'number', step: '0.5',
          label: 'الكمية الفعلية المحمّلة (' + U().unitLabel(order.unit) + ')' }) +
        '<p class="muted" style="font-size:.82rem">الوزن القائم والفارغ اختياريان — يُملآن عند وجود ميزان جسري.</p>' +
        '<div class="field-row">' +
          KX.ui.field({ name: 'gross_tons', label: 'الوزن القائم (طن)', type: 'number', step: '0.01' }) +
          KX.ui.field({ name: 'tare_tons', label: 'وزن الشاحنة الفارغة (طن)', type: 'number', step: '0.01' }) +
        '</div>' +
        '<div class="modal__actions"><button class="btn btn--ghost" data-no>إلغاء</button>' +
        '<button class="btn btn--primary" data-yes>حفظ التذكرة</button></div></div>';
      document.body.appendChild(wrap);
      wrap.querySelector('[data-no]').onclick = () => wrap.remove();
      wrap.querySelector('[data-yes]').onclick = async function () {
        const v = KX.ui.formValues(wrap);
        if (!v.ticket_no || !(Number(v.net_qty) > 0)) {
          U().toast('أدخل رقم التذكرة والكمية الفعلية', 'error'); return;
        }
        if (v.gross_tons && Number(v.gross_tons) <= Number(v.tare_tons || 0)) {
          U().toast('الوزن القائم يجب أن يتجاوز وزن الشاحنة الفارغة', 'error'); return;
        }
        await KX.trips.recordWeightTicket(v.trip_id, v);
        wrap.remove(); U().toast('سُجّلت التذكرة', 'success'); KX.router.resolve();

  async function supplierReports() {
    const orders = await KX.orders.forSupplier(S().supplier_id);
    const delivered = orders.filter((o) => o.status === 'delivered');
    const items = await KX.repo.list('order_items', {});
    const mine = items.filter((it) => delivered.some((o) => o.id === it.order_id));
    const g = U().groupBy(mine, 'material_name');
    const rows = Object.keys(g).map((k) => ({
      material: k, quantity: U().round(U().sum(g[k], (x) => +x.quantity), 1),
      value: U().round(U().sum(g[k], (x) => +x.line_total), 3), orders: g[k].length
    }));
    L().renderApp(
      '<div class="grid grid-3 mb">' +
        KX.ui.kpi({ label: 'طلبات منجزة', value: delivered.length }) +
        KX.ui.kpi({ label: 'إجمالي الكمية', value: U().fmtNum(U().sum(rows, (r) => r.quantity), 1) + ' ' + U().unitLabel(KX.config.defaultUnit) }) +
        KX.ui.kpi({ label: 'قيمة المبيعات', value: U().fmtOMR(U().sum(rows, (r) => r.value)) }) +
      '</div>' +
      KX.ui.card('المبيعات حسب المادة',

  function bindTripActions(trips, driversPre, trucksPre) {
    U().on(document, 'click', '[data-assign]', async function (ev, el) {
      const t = trips.find((x) => x.id === el.dataset.assign);
      const drivers = driversPre || await KX.repo.list('drivers', { where: { transporter_id: S().transporter_id } });
      const trucks  = trucksPre  || await KX.repo.list('trucks',  { where: { transporter_id: S().transporter_id } });
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = '<div class="modal"><h3>تعيين سائق وشاحنة — رحلة #' + t.seq + '</h3>' +
        KX.ui.field({ name: 'driver_id', label: 'السائق', type: 'select', value: t.driver_id || '',
          placeholder: 'اختر', options: drivers.map((d) => ({ value: d.id, label: d.name })) }) +
        KX.ui.field({ name: 'truck_id', label: 'الشاحنة', type: 'select', value: t.truck_id || '',
          placeholder: 'اختر', options: trucks.map((x) => ({ value: x.id, label: x.plate_no + ' — ' + x.capacity_m3 + ' م³' })) }) +
        '<div class="modal__actions"><button class="btn btn--ghost" data-no>إلغاء</button>' +
        '<button class="btn btn--primary" data-yes>تعيين</button></div></div>';
      document.body.appendChild(wrap);
      wrap.querySelector('[data-no]').onclick = () => wrap.remove();
      wrap.querySelector('[data-yes]').onclick = async function () {
        const v = KX.ui.formValues(wrap);
        if (!v.driver_id || !v.truck_id) { U().toast('اختر السائق والشاحنة', 'error'); return; }
        await KX.trips.assignDriver(t.id, v.driver_id, v.truck_id);
        wrap.remove(); U().toast('عُيّن السائق', 'success'); KX.router.resolve();
      };
    });
    U().on(document, 'click', '[data-wait]', async function (ev, el) {
      const r = await U().confirmDialog({ title: 'تسجيل رسوم انتظار', reasonRequired: true,
        message: 'اذكر مدة الانتظار بالدقائق وسببها — لا تُحتسب إلا بعد اعتماد الإدارة.' });
      if (!r) return;
      const mins = parseInt(String(r).match(/\d+/) ? String(r).match(/\d+/)[0] : '0', 10);
      if (!mins) { U().toast('اكتب المدة بالدقائق داخل السبب', 'error'); return; }
      const fee = await KX.trips.requestWaiting(el.dataset.wait, mins, r);
      U().toast('سُجّل طلب انتظار بقيمة ' + U().fmtOMR(fee) + ' بانتظار الاعتماد', 'success');
      KX.router.resolve();
    });
  }

    document.getElementById('t-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const v = KX.ui.formValues(ev.target);
      if (!v.plate_no || !v.truck_type_id) { U().toast('أكمل اللوحة والنوع', 'error'); return; }
      const ty = types.find((t) => t.id === v.truck_type_id);
      await KX.repo.insert('trucks', {
        transporter_id: tid, truck_type_id: v.truck_type_id, plate_no: v.plate_no,
        make: v.make, year: Number(v.year),
        capacity_m3: ty.capacity_m3, capacity_tons: ty.capacity_tons, is_available: true
      });
      await KX.audit.log('truck.create', 'trucks', null, { plate: v.plate_no });
      U().toast('أُضيفت الشاحنة', 'success'); KX.router.resolve();
    };
    document.getElementById('d-form').onsubmit = async function (ev) {
      ev.preventDefault();
      const v = KX.ui.formValues(ev.target);
      if (!v.name || !U().isValidPhone(v.phone)) { U().toast('تحقّق من الاسم ورقم الهاتف', 'error'); return; }
      const phone = U().normalizePhone(v.phone);
      let user = await KX.repo.first('users', { phone: phone });
      if (!user) user = await KX.repo.insert('users', { name: v.name, phone: phone, role: 'driver', account_status: 'active' });
      await KX.repo.insert('drivers', {
        user_id: user.id, transporter_id: tid, name: v.name, phone: phone,
        license_no: v.license_no, license_expiry: v.license_expiry ? new Date(v.license_expiry).toISOString() : null,
        is_active: true
      });
      await KX.audit.log('driver.create', 'drivers', null, { name: v.name });
      U().toast('أُضيف السائق — يدخل بهذا الرقم ورمز التحقق', 'success'); KX.router.resolve();
    };
    U().on(document, 'click', '[data-tg-truck]', async function (ev, el) {
      const t = trucks.find((x) => x.id === el.dataset.tgTruck);
      await KX.repo.update('trucks', t.id, { is_available: !t.is_available });
      KX.router.resolve();
    });
  }

  async function transporterRates() {
    const [rates, zones, types] = await Promise.all([
      KX.repo.list('transport_rates', {}), KX.repo.list('delivery_zones', {}),
      KX.repo.list('truck_types', {})
    ]);
    const zName = {}; zones.forEach((z) => { zName[z.id] = z.name; });
    const tName = {}; types.forEach((t) => { tName[t.id] = t.name; });
    const mine = (S().transporter || {}).service_zones || [];
    L().renderApp(
      KX.ui.alert('التعرفة المعروضة هي تعرفة المنصة المعتمدة. لتعديلها لمناطقك تواصل مع إدارة المنصة.', 'info', 'ℹ️') +
      KX.ui.card('مناطق خدمتي', mine.length
        ? '<div class="row gap-sm">' + mine.map((z) => KX.ui.badge(zName[z] || z, 'info')).join('') + '</div>'
        : '<p class="muted">لم تُحدَّد مناطق خدمة.</p>') +
      '<div class="mt">' + KX.ui.card('تعرفة النقل المعتمدة', KX.ui.table([
        { key: 'z', label: 'المنطقة', render: (r) => e(zName[r.zone_id] || '—') },
        { key: 't', label: 'نوع الشاحنة', render: (r) => e(tName[r.truck_type_id] || '—') },
        { key: 'price_per_trip', label: 'سعر الرحلة', num: true, render: (r) => U().money(r.price_per_trip) },
        { key: 'price_per_km', label: 'لكل كم', num: true, render: (r) => U().money(r.price_per_km) }
      ], rates.filter((r) => r.is_active), { compact: true })) + '</div>',
      { title: 'أسعاري ومناطقي' });
  }

  async function transporterSettlements() {
    const rows = await KX.settlements.forParty('transporter', S().transporter_id);
    L().renderApp(settlementsTable(rows), { title: 'مستحقاتي' });
  }

  /* ==================== السائق ==================== */
  async function driverToday() {
    const did = S().driver_id;
    const trips = await KX.trips.forDriver(did);
    const active = trips.filter((t) => t.status !== 'delivered' && t.status !== 'cancelled');
    const [orders, sups, sites] = await Promise.all([
      KX.repo.mapBy('orders'), KX.repo.mapBy('suppliers'), KX.repo.mapBy('locations')
    ]);

    const cards = active.map(function (t) {
      const o = orders[t.order_id] || {};
      const sup = sups[o.supplier_id] || {};
      const site = sites[o.site_id] || {};
      const nxt = KX.trips.nextStatus(t.status);
      const mapLink = (c) => c ? 'https://maps.google.com/?q=' + c.lat + ',' + c.lng : '#';
      return '<div class="card mb">' +
        '<div class="row row--between mb"><div><b style="font-size:1.05rem">' + e(o.order_no || '') + '</b>' +
        ' <span class="muted">— رحلة #' + t.seq + '</span></div>' +
        KX.ui.badge(KX.trips.TRIP_STATUS[t.status].label, KX.trips.TRIP_STATUS[t.status].tone) + '</div>' +
        '<div class="panel mb">' +
          row('المادة', ((o.price_snapshot || {}).inputs || {}).material_name || '—') +
          row('الكمية', U().fmtQty(t.planned_qty, t.unit)) +
          row('التحميل من', sup.name || '—') +
          row('التسليم في', site.label || '—') +
          row('الموعد', U().fmtDateTime(o.scheduled_at)) +
        '</div>' +
        '<div class="btn-group mb">' +
          '<a class="btn btn--ghost btn--sm" target="_blank" href="' + mapLink(sup.location) + '">🗺️ موقع الكسارة</a>' +
          '<a class="btn btn--ghost btn--sm" target="_blank" href="' + mapLink(site.coords) + '">📍 موقع العميل</a>' +
          (site.contact_phone ? '<a class="btn btn--ghost btn--sm" href="tel:+' + e(site.contact_phone) + '">📞 اتصال بالعميل</a>' : '') +
        '</div>' +
        '<div class="btn-group">' +
          (nxt ? '<button class="btn btn--primary" data-next="' + t.id + '" data-status="' + nxt + '">' +
                 '➡️ ' + e(KX.trips.TRIP_STATUS[nxt].label) + '</button>' : '') +
          (t.status === 'at_site'
            ? '<button class="btn btn--ok" data-deliver="' + t.id + '" data-order="' + t.order_id + '">✅ إتمام التسليم برمز العميل</button>' : '') +
          '<button class="btn btn--ghost" data-photo="' + t.id + '">📷 رفع صورة</button>' +
        '</div></div>';
    }).join('');

    L().renderApp(
      (active.length ? cards : KX.ui.empty('لا توجد مهام نشطة اليوم', '☕')),
      { title: 'مهامي اليوم', subtitle: S().name + ' — ' + active.length + ' مهمة نشطة' });

    U().on(document, 'click', '[data-next]', async function (ev, el) {
      await KX.trips.updateStatus(el.dataset.next, el.dataset.status);
      U().toast('حُدّثت حالة الرحلة', 'success'); KX.router.resolve();
    });
    U().on(document, 'click', '[data-photo]', function (ev, el) {
      const t = active.find((x) => x.id === el.dataset.photo);
      U().confirmDialog({ title: 'رفع صورة', confirmText: 'تسجيل',
        message: 'في النسخة التجريبية يُسجَّل مرجع الصورة فقط دون رفع ملف فعلي.' })
        .then(async function (ok) {
          if (!ok) return;
          await KX.repo.update('trips', t.id, {
            photos: (t.photos || []).concat([{ at: U().nowISO(), ref: 'photo-' + U().uid(), by: S().name }])
          });
          U().toast('سُجّلت الصورة', 'success');
        });
    });
    U().on(document, 'click', '[data-deliver]', function (ev, el) {
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = '<div class="modal"><h3>إتمام التسليم</h3>' +
        '<p>اطلب من العميل رمز الاستلام المكوّن من أربعة أرقام.</p>' +
        KX.ui.field({ name: 'code', label: 'رمز العميل', cls: 'otp-input', inputmode: 'numeric', placeholder: '••••' }) +
        '<div class="modal__actions"><button class="btn btn--ghost" data-no>إلغاء</button>' +
        '<button class="btn btn--ok" data-yes>تأكيد التسليم</button></div></div>';
      document.body.appendChild(wrap);
      wrap.querySelector('[data-no]').onclick = () => wrap.remove();
      wrap.querySelector('[data-yes]').onclick = async function () {
        const v = KX.ui.formValues(wrap);
        try {
          await KX.trips.updateStatus(el.dataset.deliver, 'delivered');
          await KX.orders.confirmReceipt(el.dataset.order, v.code, null);
          wrap.remove(); U().toast('اكتمل التسليم', 'success'); KX.router.resolve();
        } catch (err) { U().toast(err.message, 'error'); }
      };
    });
  }

  async function driverHistory() {
    const trips = await KX.trips.forDriver(S().driver_id);
    const done = trips.filter((t) => t.status === 'delivered' || t.status === 'cancelled');
    L().renderApp(KX.ui.table([
      { key: 'order_no', label: 'الطلب' },
      { key: 'seq', label: 'الرحلة', render: (t) => '#' + t.seq },
      { key: 'planned_qty', label: 'الكمية', num: true, render: (t) => U().fmtQty(t.actual_qty || t.planned_qty, t.unit) },
      { key: 'status', label: 'الحالة', render: (t) => KX.ui.badge(KX.trips.TRIP_STATUS[t.status].label, KX.trips.TRIP_STATUS[t.status].tone) },
      { key: 'u', label: 'التاريخ', render: (t) => U().fmtDate((t.timeline || []).slice(-1)[0].at) }
    ], done, { compact: true, emptyText: 'لا توجد رحلات سابقة' }), { title: 'رحلاتي السابقة' });
  }

  /* ==================== الإشعارات (مشتركة) ==================== */
  async function notifications() {
    const rows = await KX.notify.forUser(S().user_id);
    L().renderApp(
      (rows.some((n) => !n.read)
        ? '<div class="mb"><button class="btn btn--ghost btn--sm" id="all">تعليم الكل كمقروء</button></div>' : '') +
      (rows.length ? '<div class="stack">' + rows.map((n) =>
        '<div class="card" style="' + (n.read ? '' : 'border-inline-start:3px solid var(--orange-500)') + '">' +
        '<div class="row row--between"><b>' + e(n.title) + '</b>' +
        '<small class="muted">' + U().relTime(n.sent_at) + '</small></div>' +
        '<p style="margin:6px 0 0">' + e(n.body) + '</p>' +
        (n.link ? '<div class="mt"><a href="' + e(n.link) + '" class="btn btn--ghost btn--sm">فتح</a></div>' : '') +
        '</div>').join('') + '</div>'
        : KX.ui.empty('لا توجد إشعارات', '🔔')),
      { title: 'الإشعارات' });
    const all = document.getElementById('all');
    if (all) all.onclick = async function () {
      await KX.notify.markAllRead(S().user_id); KX.router.resolve();
    };
  }

  return { supplierDashboard, supplierOrders, supplierOrderDetail, supplierMaterials,
           supplierSettlements, supplierReports,
           transporterDashboard, transporterOrders, transporterOrderDetail, transporterTrips,
           transporterFleet, transporterRates, transporterSettlements,
           driverToday, driverHistory, notifications };
})();

</script>
<!-- src/selftest.js -->
<script>
/* ============================================================
   اختبار ذاتي للسيناريوهات والأخطاء والصلاحيات (المرحلة السادسة)
   التشغيل: أضف ?selftest=1 إلى الرابط، أو نفّذ KX.selftest.run() في الطرفية.
   تنبيه: يعيد تهيئة البيانات المحلية قبل الاختبار وبعده.
   ============================================================ */
window.KX = window.KX || {};
KX.selftest = (function () {
  const results = [];
  let currentGroup = '';

  function group(name) { currentGroup = name; }
  async function t(name, fn) {
    try { await fn(); results.push({ group: currentGroup, name: name, ok: true }); }
    catch (err) { results.push({ group: currentGroup, name: name, ok: false, error: err.message }); }
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'فشل التحقق'); }
  function near(a, b, tol) { assert(Math.abs(Number(a) - Number(b)) <= (tol || 0.002),
    'القيمة ' + a + ' لا تساوي ' + b); }
  async function throws(fn, expect) {
    let threw = false, msg = '';
    try { await fn(); } catch (e) { threw = true; msg = e.message; }
    assert(threw, 'كان يجب أن ترفض العملية: ' + (expect || ''));
    if (expect) assert(msg.indexOf(expect) !== -1, 'رسالة الخطأ غير متوقعة: ' + msg);
  }
  const asRole = (role, extra) =>
    KX.store.set('session', Object.assign({ user_id: 'test', name: 'اختبار', role: role }, extra || {}));

  async function run() {
    results.length = 0;
    const savedSession = KX.store.get('session');
    await KX.seed.run(true);

    const [sup, mat, sand, truck, truckBig, zone, cust] = await Promise.all([
      KX.repo.first('suppliers', { code: 'WAEDA' }),
      KX.repo.first('materials', { sku: 'BASE-ABC-0020' }),   // طبقة أساس ABC — 2.200 ر.ع/م³
      KX.repo.first('materials', { sku: 'SAND-NORMAL-05' }),  // رمل عادي — عام 1.900 وخاص 1.600
      KX.repo.first('truck_types', { code: 'TIP18' }),        // 18 م³ = الحد الأدنى
      KX.repo.first('truck_types', { code: 'TRL24' }),
      KX.repo.first('delivery_zones', { code: 'IBR-C' }),
      KX.repo.first('customer_profiles', { phone: '96890000001' })
    ]);
    const sites = await KX.repo.list('locations', { where: { customer_id: cust.id } });
    const theSite = sites[0];

    /* ---------- 1) التسعير ---------- */
    group('التسعير');
    let quote;
    await t('حساب عرض سعر صحيح', async function () {
      quote = await KX.pricing.quote({
        supplier_id: sup.id, material_id: mat.id, quantity: 36, order_by: 'unit',
        truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords, customer_id: cust.id
      });
      assert(quote.ok, 'العرض غير صالح: ' + (quote.errors || []).join(', '));
    });
    await t('وحدة البيع متر مكعب لا طن', function () {
      assert(quote.quantities.unit === 'm3', 'الوحدة: ' + quote.quantities.unit);
      assert(quote.inputs.unit_label === 'م³', 'التسمية: ' + quote.inputs.unit_label);
    });
    await t('سعر الوحدة يطابق القائمة الرسمية (طبقة أساس ABC = 2.200)', function () {
      near(quote.lines.unit_price, 2.200);
      near(quote.lines.material_cost, 36 * 2.200);
    });
    await t('عدد الرحلات = تقريب لأعلى للكمية ÷ حمولة الشاحنة', function () {
      assert(quote.quantities.capacity === 18, 'الحمولة: ' + quote.quantities.capacity);
      assert(quote.quantities.trips === Math.ceil(36 / 18), 'عدد الرحلات خاطئ');
    });
    await t('معادلة السعر: مواد + نقل + رسوم − خصم + ضريبة', function () {
      const L = quote.lines;
      const sub = L.material_cost + L.transport_cost + L.platform_fee;
      near(quote.totals.subtotal, sub);
      near(quote.totals.taxable, sub - L.discount);
      near(L.vat, (sub - L.discount) * L.vat_rate);
      near(quote.totals.total, (sub - L.discount) + L.vat);
    });
    await t('الطلب بعدد الشاحنات يساوي العدد × حمولة الشاحنة', async function () {
      const q2 = await KX.pricing.quote({
        supplier_id: sup.id, material_id: mat.id, quantity: 2, order_by: 'truck',
        truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords, customer_id: cust.id
      });
      assert(q2.quantities.quantity === 36 && q2.quantities.trips === 2, 'تحويل الشاحنات إلى م³ خاطئ');
    });
    await t('حمولة كل نوع شاحنة تُقرأ بالمتر المكعب', async function () {
      const q3 = await KX.pricing.quote({
        supplier_id: sup.id, material_id: mat.id, quantity: 48, order_by: 'unit',
        truck_type_id: truckBig.id, zone_id: zone.id, site: theSite.coords, customer_id: cust.id
      });
      assert(q3.quantities.capacity === 24 && q3.quantities.trips === 2, 'حمولة التريلة خاطئة');
    });
    await t('رفض الكمية دون الحد الأدنى للتوصيل (18 م³)', async function () {
      const q = await KX.pricing.quote({ supplier_id: sup.id, material_id: mat.id, quantity: 6,
        order_by: 'unit', truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords, customer_id: cust.id });
      assert(!q.ok, 'كان يجب رفض الكمية دون الحد الأدنى');
      assert(q.errors.join(' ').indexOf('الحد الأدنى') !== -1, q.errors.join(' '));
    });
    await t('شاحنة واحدة (18 م³) مقبولة كحد أدنى', async function () {
      const q = await KX.pricing.quote({ supplier_id: sup.id, material_id: mat.id, quantity: 18,
        order_by: 'unit', truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords, customer_id: cust.id });
      assert(q.ok, q.errors.join(' '));
      assert(q.quantities.trips === 1, 'الرحلات: ' + q.quantities.trips);
    });
    await t('الكوبون يخصم ضمن حده الأقصى', async function () {
      const q = await KX.pricing.quote({ supplier_id: sup.id, material_id: mat.id, quantity: 72,
        order_by: 'unit', truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords,
        customer_id: cust.id, coupon_code: 'WELCOME10' });
      assert(q.lines.discount > 0 && q.lines.discount <= 15, 'الخصم خارج الحدود');
    });
    await t('السعر الخاص لا يُعرض لعميل غير معتمد', async function () {
      const q = await KX.pricing.quote({ supplier_id: sup.id, material_id: sand.id, quantity: 18,
        order_by: 'unit', truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords,
        customer_id: cust.id });
      assert(!q.inputs.is_special_price, 'سُرّب السعر الخاص');
      near(q.lines.unit_price, 1.900);
    });
    await t('العميل المعتمد يحصل على السعر الخاص تلقائيًا', async function () {
      const company = await KX.repo.first('customer_profiles', { phone: '96890000002' });
      assert(company.special_pricing_approved, 'الحساب غير معتمد في البيانات');
      const q = await KX.pricing.quote({ supplier_id: sup.id, material_id: sand.id, quantity: 18,
        order_by: 'unit', truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords,
        customer_id: company.id });
      assert(q.inputs.is_special_price, 'لم يُطبَّق السعر الخاص');
      near(q.lines.unit_price, 1.600);
    });
    await t('كود السعر الخاص يفتحه لعميل غير معتمد', async function () {
      const q = await KX.pricing.quote({ supplier_id: sup.id, material_id: sand.id, quantity: 18,
        order_by: 'unit', truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords,
        customer_id: cust.id, unlock_code: 'WAEDA-SP' });
      assert(q.inputs.is_special_price, 'الكود لم يفتح السعر الخاص');
      near(q.lines.unit_price, 1.600);
    });
    await t('كود خاطئ لا يفتح السعر الخاص', async function () {
      const q = await KX.pricing.quote({ supplier_id: sup.id, material_id: sand.id, quantity: 18,
        order_by: 'unit', truck_type_id: truck.id, zone_id: zone.id, site: theSite.coords,
        customer_id: cust.id, unlock_code: 'WRONG' });
      assert(!q.inputs.is_special_price, 'كود خاطئ فتح السعر الخاص');
      near(q.lines.unit_price, 1.900);
    });
    await t('النقل والضريبة بندان مستقلان لا يُدمجان في سعر المادة', function () {
      const L = quote.lines;
      near(L.material_cost, quote.quantities.quantity * L.unit_price);
      assert(L.transport_cost > 0, 'لم تُحتسب تكلفة النقل');
      assert(L.vat > 0, 'لم تُحتسب الضريبة');
    });
    await t('توزيع المستحقات يساوي قيمة المواد والنقل', function () {
      const i = quote.internal, L = quote.lines;
      near(i.supplier_payable + i.supplier_commission, L.material_cost);
      near(i.transporter_payable + i.transporter_commission, L.transport_cost);
    });

    /* ---------- 2) دورة حياة الطلب ---------- */
    group('دورة حياة الطلب');
    let order;
    await t('إنشاء طلب من عرض السعر', async function () {
      asRole('customer', { customer_id: cust.id });
      order = await KX.orders.createFromQuote(quote, {
        customer_id: cust.id, site_id: theSite.id,
        scheduled_at: KX.util.addDays(KX.util.nowISO(), 2), notes: 'اختبار آلي'
      });
      assert(order.status === 'draft' && order.order_no, 'لم يُنشأ الطلب');
      near(order.total, quote.totals.total);
    });
    await t('لقطة السعر محفوظة داخل الطلب', function () {
      assert(order.price_snapshot && order.price_snapshot.totals, 'لقطة السعر مفقودة');
    });
    await t('انتقال غير مسموح يُرفض', async function () {
      await throws(() => KX.orders.transition(order.id, 'delivered', { role: 'customer' }), 'انتقال غير مسموح');
    });
    await t('العميل يرسل الطلب للمراجعة', async function () {
      order = await KX.orders.transition(order.id, 'under_review', { role: 'customer' });
      assert(order.status === 'under_review');

  function report() {
    const pass = results.filter((r) => r.ok).length;
    const fail = results.filter((r) => !r.ok);
    const summary = { total: results.length, passed: pass, failed: fail.length, results: results };
    console.log('%c اختبار كسّارة إكسبرس: ' + pass + '/' + results.length + ' ناجح ',
      'background:' + (fail.length ? '#c0392b' : '#1c7a53') + ';color:#fff;padding:3px 8px;border-radius:4px');
    console.table(results.map((r) => ({ المجموعة: r.group, الاختبار: r.name,
      النتيجة: r.ok ? '✅' : '❌', الخطأ: r.error || '' })));
    window.__KX_TEST__ = summary;
    return summary;
  }

  /* عرض النتائج على الصفحة */
  function renderPage(summary) {
    const g = KX.util.groupBy(summary.results, 'group');
    const html = '<div class="container" style="padding:28px 20px">' +
      '<h1>نتائج الاختبار الذاتي</h1>' +
      KX.ui.alert('<b>' + summary.passed + ' / ' + summary.total + '</b> اختبارًا ناجحًا' +
        (summary.failed ? ' — <b>' + summary.failed + ' فشل</b>' : ' — كل الاختبارات ناجحة'),
        summary.failed ? 'danger' : 'ok', summary.failed ? '❌' : '✅') +
      Object.keys(g).map((k) => '<div class="mt">' + KX.ui.card(k, KX.ui.table([
        { key: 'ok', label: '', render: (r) => r.ok ? '✅' : '❌' },
        { key: 'name', label: 'الاختبار' },
        { key: 'error', label: 'الخطأ', render: (r) => KX.util.esc(r.error || '') }
      ], g[k], { compact: true })) + '</div>').join('') +
      '<div class="mt"><a href="#/" class="btn btn--primary">العودة للتطبيق</a></div></div>';
    document.getElementById('app').innerHTML = KX.layout.appbar() + html;
  }

  /* تشغيل تلقائي عند ?selftest=1 */
  if (location.search.indexOf('selftest=1') !== -1) {
    window.addEventListener('load', function () {
      setTimeout(async function () {
        document.getElementById('app').innerHTML =
          '<div style="padding:60px;text-align:center;font-family:system-ui">جارٍ تنفيذ الاختبارات…</div>';
        const s = await run();
        renderPage(s);
      }, 300);
    });
  }
  return { run, report, renderPage };
})();

</script>

<script>
/* ============================================================
   نقطة الانطلاق: تسجيل المسارات، حراسة الصلاحيات، تشغيل التطبيق
   ============================================================ */
window.KX = window.KX || {};
KX.app = (function () {
  const R = () => KX.router;

  /* المسارات: {path, view, roles} — roles فارغة تعني صفحة عامة */
  const ROUTES = [
    /* عامة */
    ['/',               () => KX.viewsPublic.home()],
    ['/how',            () => KX.viewsPublic.how()],
    ['/suppliers',      () => KX.viewsPublic.suppliers()],
    ['/faq',            () => KX.viewsPublic.faq()],
    ['/terms',          () => KX.viewsPublic.terms()],
    ['/privacy',        () => KX.viewsPublic.privacy()],
    ['/refund-policy',  () => KX.viewsPublic.refundPolicy()],
    ['/contact',        () => KX.viewsPublic.contact()],
    ['/login',          () => KX.viewsAuth.login()],
    ['/register',       () => KX.viewsAuth.register()],
    ['/logout',         () => KX.viewsAuth.logout()],

    /* مشتركة بين جميع المسجّلين */
    ['/notifications',  () => KX.viewsPartners.notifications(), ['customer', 'supplier', 'transporter', 'driver', 'admin', 'ops']],

    /* العميل */
    ['/customer',                 () => KX.viewsCustomer.dashboard(),   ['customer']],
    ['/customer/new',             () => KX.viewsCustomer.newOrder(),    ['customer']],
    ['/customer/orders',          (c) => KX.viewsCustomer.ordersList(c), ['customer']],
    ['/customer/orders/:id',      (c) => KX.viewsCustomer.orderDetail(c), ['customer']],
    ['/customer/sites',           () => KX.viewsCustomer.sites(),       ['customer']],
    ['/customer/invoices',        () => KX.viewsCustomer.invoices(),    ['customer']],
    ['/customer/invoices/:id',    (c) => KX.viewsCustomer.invoiceDetail(c), ['customer']],
    ['/customer/profile',         () => KX.viewsCustomer.profile(),     ['customer']],
    ['/customer/complaints',      () => KX.viewsCustomer.complaints(),  ['customer']],

    /* المورد */
    ['/supplier',                 () => KX.viewsPartners.supplierDashboard(),  ['supplier']],
    ['/supplier/orders',          () => KX.viewsPartners.supplierOrders(),     ['supplier']],
    ['/supplier/orders/:id',      (c) => KX.viewsPartners.supplierOrderDetail(c), ['supplier']],
    ['/supplier/loading',         () => KX.viewsPartners.supplierOrders(),     ['supplier']],
    ['/supplier/materials',       () => KX.viewsPartners.supplierMaterials(),  ['supplier']],
    ['/supplier/settlements',     () => KX.viewsPartners.supplierSettlements(),['supplier']],
    ['/supplier/reports',         () => KX.viewsPartners.supplierReports(),    ['supplier']],

    /* الناقل */
    ['/transporter',              () => KX.viewsPartners.transporterDashboard(), ['transporter']],
    ['/transporter/orders',       () => KX.viewsPartners.transporterOrders(),    ['transporter']],
    ['/transporter/orders/:id',   (c) => KX.viewsPartners.transporterOrderDetail(c), ['transporter']],
    ['/transporter/trips',        () => KX.viewsPartners.transporterTrips(),     ['transporter']],
    ['/transporter/fleet',        () => KX.viewsPartners.transporterFleet(),     ['transporter']],
    ['/transporter/rates',        () => KX.viewsPartners.transporterRates(),     ['transporter']],
    ['/transporter/settlements',  () => KX.viewsPartners.transporterSettlements(), ['transporter']],

    /* السائق */
    ['/driver',                   () => KX.viewsPartners.driverToday(),   ['driver']],
    ['/driver/history',           () => KX.viewsPartners.driverHistory(), ['driver']],

    /* الإدارة */
    ['/admin',                    (c) => KX.viewsAdmin.dashboard(c),   ['admin', 'ops']],
    ['/admin/orders',             (c) => KX.viewsAdmin.orders(c),      ['admin', 'ops']],
    ['/admin/orders/:id',         (c) => KX.viewsAdmin.orderDetail(c), ['admin', 'ops']],
    ['/admin/payments',           () => KX.viewsAdmin.payments(),      ['admin', 'ops']],
    ['/admin/settlements',        () => KX.viewsAdmin.settlements(),   ['admin']],
    ['/admin/complaints',         () => KX.viewsAdmin.complaints(),    ['admin', 'ops']],
    ['/admin/notifications',      () => KX.viewsAdmin.notifications(), ['admin', 'ops']],
    ['/admin/audit',              (c) => KX.viewsAdmin.audit(c),       ['admin']],
    ['/admin/reports',            (c) => KX.viewsAdmin.reports(c),     ['admin', 'ops']],
    ['/admin/materials',          () => KX.viewsAdminConfig.materials(),    ['admin']],
    ['/admin/price-history',      () => KX.viewsAdminConfig.priceHistory(), ['admin']],
    ['/admin/zones',              () => KX.viewsAdminConfig.zones(),        ['admin']],
    ['/admin/coupons',            () => KX.viewsAdminConfig.coupons(),      ['admin']],
    ['/admin/settings',           () => KX.viewsAdminConfig.settings(),     ['admin']],
    ['/admin/customers',          () => KX.viewsAdminConfig.customers(),    ['admin', 'ops']],
    ['/admin/suppliers',          () => KX.viewsAdminConfig.suppliersAdmin(),    ['admin', 'ops']],
    ['/admin/transporters',       () => KX.viewsAdminConfig.transportersAdmin(), ['admin', 'ops']]
  ];

  function registerRoutes() {
    ROUTES.forEach(([path, handler, roles]) => R().add(path, handler, { roles: roles || null }));
    R().setNotFound(() => KX.viewsPublic.notFound());

    /* حارس الصلاحيات: يمنع الوصول لأي مسار خارج دور المستخدم */
    R().setGuard(function (ctx) {
      const roles = ctx.meta.roles;
      if (!roles) return null;
      const s = KX.auth.session();
      if (!s) { KX.util.toast('سجّل الدخول للمتابعة'); return '/login'; }
      if (roles.indexOf(s.role) === -1) {
        KX.util.toast('لا تملك صلاحية الوصول لهذه الصفحة', 'error');
        return KX.auth.homeFor(s.role);
      }
      return null;
    });
  }

  async function boot() {
    KX.i18n.apply();          /* يضبط lang و dir والخط حسب اللغة المحفوظة */

    try {
      await KX.seed.run(false);
    } catch (err) {
      console.error('seed failed', err);
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;text-align:center;font-family:system-ui">' +
        '<h2>تعذّر تهيئة البيانات المحلية</h2><p>' + KX.util.esc(err.message) + '</p>' +
        '<p>تأكّد أن المتصفح يسمح بالتخزين المحلي (localStorage).</p></div>';
      return;
    }

    KX.auth.restore();
    registerRoutes();
    R().start();

    /* تحديث الشريط عند تغيّر الجلسة */
    KX.store.on('change:session', () => R().resolve());

    /* تسجيل عامل الخدمة للعمل دون اتصال (يعمل عبر خادم فقط) */
    if (KX.config.features.pwa && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  return { boot, ROUTES, registerRoutes };
})();

document.addEventListener('DOMContentLoaded', KX.app.boot);

</script>
<script>KX.config.features.pwa = false;</script>
